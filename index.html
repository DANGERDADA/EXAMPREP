,"CT"],"dia":true,"type":"Explain","ease":2,"q":"Explain Von Neumann architecture with block diagram.","ans":"<p><b>Von Neumann architecture<\/b> is a computer design in which <b>program instructions and data are stored in the same memory<\/b> and travel over the <b>same bus<\/b>. It is based on the <b>stored program concept<\/b>.<\/p><ol><li><b>Single memory:<\/b> One main memory holds both instructions and data.<\/li><li><b>CPU:<\/b> Has registers, ALU and control unit. CPU registers like <b>PC<\/b> (program counter) and <b>IR<\/b> (instruction register) help in fetching instructions.<\/li><li><b>Shared bus:<\/b> The same bus is used to fetch instructions and to read/write data, so both cannot happen at the same time.<\/li><li><b>Sequential execution:<\/b> Instructions are executed one after another, in a sequence.<\/li><li><b>Independent addressing:<\/b> Every memory location can be addressed separately.<\/li><li><b>Example:<\/b> 80x86 (8086) architecture.<\/li><\/ol><p><b>Drawback - Von Neumann bottleneck:<\/b> since one bus is shared, the CPU often waits for memory, which limits speed.<\/p>","diag":"        +------------------------------+\n        |   MAIN MEMORY (one memory)   |\n        |   Instructions  +  Data      |\n        +--------------+---------------+\n                       |  Address / Data & Instructions\n                       |  (single shared bus)\n        +--------------+---------------+\n        |  CENTRAL PROCESSING UNIT     |\n        |  +--------+  +------------+  |\n        |  |Register|  | Arithmetic |  |\n        |  |  Unit  |  | Logic Unit |  |\n        |  +--------+  +------------+  |\n        |       +----------------+     |\n        |       |  Control Unit  |     |\n        |       +----------------+     |\n        +--------------+---------------+\n                       |  Data & Control info\n        +--------------+---------------+\n        |      INPUT / OUTPUT SYSTEM   |\n        +------------------------------+"},{"id":"P1-03","unit":"P1","src":["A1"],"dia":false,"type":"Compare","ease":1,"q":"Compare the Von Neumann and Harvard architectures with respect to their memory organization and bus structure, and state one advantage of each.","ans":"<table><tr><th>Sr.<\/th><th>Point<\/th><th>Von Neumann<\/th><th>Harvard<\/th><\/tr><tr><td>1<\/td><td>Memory organization<\/td><td>Single memory for both program and data<\/td><td>Separate program memory and data memory<\/td><\/tr><tr><td>2<\/td><td>Bus structure<\/td><td>One common bus for instructions and data<\/td><td>Separate buses for instructions and data<\/td><\/tr><tr><td>3<\/td><td>Simultaneous access<\/td><td>Cannot fetch instruction and data at the same time<\/td><td>Can fetch instruction and access data at the same time<\/td><\/tr><tr><td>4<\/td><td>Speed<\/td><td>Slower (Von Neumann bottleneck)<\/td><td>Faster for the same complexity<\/td><\/tr><tr><td>5<\/td><td>Hardware<\/td><td>Simple and cheaper<\/td><td>More complex and costlier<\/td><\/tr><tr><td>6<\/td><td>Example<\/td><td>8086 / general-purpose PCs<\/td><td>Microcontrollers (AVR ATmega328, 8051), DSPs<\/td><\/tr><\/table><p><b>Advantage of Von Neumann:<\/b> simple design and memory can be shared flexibly between program and data.<br><b>Advantage of Harvard:<\/b> higher speed, because instruction fetch and data access happen in parallel.<\/p>"},{"id":"P1-04","unit":"P1","src":["A1"],"dia":false,"type":"Compare","ease":1,"q":"Differentiate between CISC and RISC architectures on the basis of instruction set, instruction execution time, hardware complexity, giving one example of each type.","ans":"<table><tr><th>Sr.<\/th><th>Point<\/th><th>CISC<\/th><th>RISC<\/th><\/tr><tr><td>1<\/td><td>Full form<\/td><td>Complex Instruction Set Computer<\/td><td>Reduced Instruction Set Computer<\/td><\/tr><tr><td>2<\/td><td>Instruction set<\/td><td>Large (about 200-300), complex instructions<\/td><td>Small (about 50), simple basic instructions<\/td><\/tr><tr><td>3<\/td><td>Execution time<\/td><td>Different instructions take different (many) clock cycles<\/td><td>Most instructions finish in one clock cycle<\/td><\/tr><tr><td>4<\/td><td>Instruction format<\/td><td>Variable length<\/td><td>Fixed length<\/td><\/tr><tr><td>5<\/td><td>Addressing modes<\/td><td>Many addressing modes<\/td><td>Few addressing modes<\/td><\/tr><tr><td>6<\/td><td>Hardware complexity<\/td><td>Complex, micro-programmed control unit<\/td><td>Simple, hard-wired control unit, many registers<\/td><\/tr><tr><td>7<\/td><td>Memory access<\/td><td>Memory-to-memory instructions allowed<\/td><td>Only LOAD/STORE instructions access memory<\/td><\/tr><tr><td>8<\/td><td>Example<\/td><td>Intel 80x86 (8086), Motorola 68000<\/td><td>ARM, MIPS, SPARC<\/td><\/tr><\/table>"},{"id":"P1-05","unit":"P1","src":["A1"],"dia":false,"type":"Explain","ease":1,"q":"Explain the concept of program memory and data memory in a microcomputer system.","ans":"<p>In a microcomputer, memory is used for two purposes: storing the <b>program<\/b> (instructions) and storing the <b>data<\/b> on which the program works.<\/p><ol><li><b>Program memory:<\/b> Stores the instruction codes of the program that the CPU fetches and executes. It is usually <b>non-volatile<\/b> - ROM/EPROM/Flash - so the program is not lost when power goes off.<\/li><li><b>Data memory:<\/b> Stores variables, results, stack and temporary values used while the program runs. It is usually <b>RAM<\/b> (read/write, volatile).<\/li><li><b>In Von Neumann systems<\/b> (like 8086) both are in the same memory; the slides note program memory = EPROM and data memory = RAM.<\/li><li><b>In Harvard systems<\/b> (like microcontrollers) program memory and data memory are physically separate with separate buses, and can even have different word widths.<\/li><li><b>In 8086 programs<\/b> the idea appears as separate segments: the <b>code segment<\/b> (program) and the <b>data / stack segments<\/b> (data); in NASM as <b>section .text<\/b> and <b>section .data / .bss<\/b>.<\/li><\/ol><p>Keeping them separate protects the program and makes the system faster and more reliable.<\/p>"},{"id":"P1-06","unit":"P1","src":["A1","CT"],"dia":false,"type":"Explain","ease":1,"q":"Explain Assembly Language Programming tools - assembler, linker, loader, debugger and emulator - and the role each plays in converting a source program into a running application.","ans":"<p>ALP tools are the programs that convert our assembly source code (.asm) into a program that actually runs and help us test it.<\/p><ol><li><b>Assembler:<\/b> Translates the source file into <b>object code<\/b> (binary). It works in <b>two passes<\/b> - pass 1 builds the <b>symbol table<\/b> and assigns addresses, pass 2 replaces symbols with addresses. It produces the <b>object file<\/b> and a <b>list file<\/b>. E.g. NASM, MASM, TASM.<\/li><li><b>Linker:<\/b> Joins several object files (and library files) into one <b>executable file<\/b>. It also creates a <b>link map<\/b> and makes the program <b>relocatable<\/b>. E.g. <i>ld<\/i> in Linux.<\/li><li><b>Loader:<\/b> Part of the operating system that <b>loads the executable from disk into memory<\/b> and handles relocation, then passes control to the program. Types: absolute loader and relocating loader.<\/li><li><b>Debugger:<\/b> Lets us run the program <b>step by step<\/b>, set <b>breakpoints<\/b>, and check or change register and memory contents to find errors. E.g. GDB.<\/li><li><b>Emulator:<\/b> A hardware + software tool that imitates the target system; used to download, run and debug code on the system being developed and to store trace data.<\/li><\/ol><p><b>Flow:<\/b> source .asm &rarr; assembler &rarr; .o &rarr; linker &rarr; executable &rarr; loader &rarr; runs in memory (debugger/emulator used for testing).<\/p>"},{"id":"P1-07","unit":"P1","src":["A1"],"dia":false,"type":"List","ease":1,"q":"Explain any five commonly used NASM assembler directives, giving the correct syntax and one example of each.","ans":"<p><b>Assembler directives<\/b> are instructions to the assembler (not to the CPU). They do not produce machine code; they tell NASM how to arrange data and code.<\/p><ol><li><b>SECTION<\/b> - starts a section. Syntax: <code>section .data<\/code> / <code>section .bss<\/code> / <code>section .text<\/code>. Example: <code>section .data<\/code> (initialised data starts here).<\/li><li><b>DB / DW / DD<\/b> - define initialised data of 1, 2, 4 bytes. Syntax: <code>name DB value<\/code>. Example: <code>num DB 05h<\/code>, <code>msg DB 'Hello',10<\/code>.<\/li><li><b>RESB / RESW / RESD<\/b> - reserve uninitialised space in .bss. Syntax: <code>name RESB count<\/code>. Example: <code>result RESB 1<\/code>.<\/li><li><b>EQU<\/b> - gives a name to a constant value. Syntax: <code>name EQU value<\/code>. Example: <code>len EQU $ - msg<\/code>.<\/li><li><b>GLOBAL<\/b> - makes a label visible to the linker / other modules. Syntax: <code>global label<\/code>. Example: <code>global _start<\/code>.<\/li><li><b>%macro ... %endmacro<\/b> (extra) - defines a macro. Example: <code>%macro print 2 ... %endmacro<\/code>.<\/li><\/ol>"},{"id":"P1-08","unit":"P1","src":["A1","CT"],"dia":false,"type":"Compare","ease":1,"q":"Differentiate between a macro and a procedure in assembly language programming, and further differentiate between a near procedure and a far procedure. (Class test: Compare and contrast between Procedure and Macros.)","ans":"<p><b>Macro vs Procedure<\/b><\/p><table><tr><th>Sr.<\/th><th>Procedure<\/th><th>Macro<\/th><\/tr><tr><td>1<\/td><td>Group of instructions stored <b>once<\/b> in memory<\/td><td>Code is <b>copied (expanded)<\/b> every time the macro is used<\/td><\/tr><tr><td>2<\/td><td>Called using <b>CALL<\/b> and returns using <b>RET<\/b><\/td><td>Used just by writing its <b>name<\/b>; no CALL/RET<\/td><\/tr><tr><td>3<\/td><td>Needs <b>less memory<\/b><\/td><td>Needs <b>more memory<\/b> (repeated code)<\/td><\/tr><tr><td>4<\/td><td>Slower - extra time for CALL, RET and stack<\/td><td>Faster - no call overhead<\/td><\/tr><tr><td>5<\/td><td>Parameters passed via registers, memory, stack<\/td><td>Parameters passed as part of the macro statement<\/td><\/tr><tr><td>6<\/td><td>Defined with PROC ... ENDP<\/td><td>Defined with %macro ... %endmacro (NASM)<\/td><\/tr><\/table><p><b>Near vs Far procedure<\/b><\/p><table><tr><th>Sr.<\/th><th>Near procedure<\/th><th>Far procedure<\/th><\/tr><tr><td>1<\/td><td>In the <b>same code segment<\/b> as the main program<\/td><td>In a <b>different code segment<\/b><\/td><\/tr><tr><td>2<\/td><td>Only <b>IP<\/b> is pushed on the stack<\/td><td>Both <b>CS and IP<\/b> are pushed<\/td><\/tr><tr><td>3<\/td><td>Intra-segment call, less stack memory<\/td><td>Inter-segment call, more stack memory<\/td><\/tr><tr><td>4<\/td><td>e.g. <code>ADD1 PROC NEAR<\/code><\/td><td>e.g. <code>DISP PROC FAR<\/code><\/td><\/tr><\/table>"},{"id":"P1-09","unit":"P1","src":["A1","CT"],"dia":false,"type":"Compare","ease":1,"q":"Compare Machine, Assembly and High Level language.","ans":"<table><tr><th>Sr.<\/th><th>Point<\/th><th>Machine language<\/th><th>Assembly language<\/th><th>High-level language<\/th><\/tr><tr><td>1<\/td><td>Form<\/td><td>Binary codes (0s and 1s)<\/td><td>Mnemonics (MOV, ADD)<\/td><td>English-like statements<\/td><\/tr><tr><td>2<\/td><td>Processor dependence<\/td><td>Processor dependent<\/td><td>Processor dependent<\/td><td>Processor independent<\/td><\/tr><tr><td>3<\/td><td>Translator<\/td><td>Not needed<\/td><td>Assembler<\/td><td>Compiler / interpreter<\/td><\/tr><tr><td>4<\/td><td>Memory needed<\/td><td>Less<\/td><td>Less<\/td><td>More<\/td><\/tr><tr><td>5<\/td><td>Execution time<\/td><td>Less (fastest)<\/td><td>Less<\/td><td>More<\/td><\/tr><tr><td>6<\/td><td>Program development<\/td><td>Very difficult<\/td><td>Simpler than machine language<\/td><td>Easy<\/td><\/tr><tr><td>7<\/td><td>User friendly<\/td><td>Not user friendly<\/td><td>Less user friendly<\/td><td>User friendly<\/td><\/tr><tr><td>8<\/td><td>Example<\/td><td>E4 05 (binary 11100100 00000101)<\/td><td><code>MOV AX, BX<\/code><\/td><td>C, Python, Pascal<\/td><\/tr><\/table>"},{"id":"P1-10","unit":"P1","src":["A1"],"dia":false,"type":"Explain","ease":1,"q":"What do you mean by assembler directives? Explain the directives for allocating storage space for initialized data and uninitialized data.","ans":"<p><b>Assembler directives<\/b> (pseudo-ops) are statements that guide the assembler during assembly. They are <b>not executed by the CPU<\/b> and do not generate machine code. E.g. <code>section<\/code>, <code>global<\/code>, <code>EQU<\/code>.<\/p><p><b>1. Initialized data (section .data) - define directives<\/b><\/p><table><tr><th>Directive<\/th><th>Meaning<\/th><th>Space<\/th><th>Example<\/th><\/tr><tr><td>DB<\/td><td>Define Byte<\/td><td>1 byte<\/td><td><code>a DB 25h<\/code><\/td><\/tr><tr><td>DW<\/td><td>Define Word<\/td><td>2 bytes<\/td><td><code>b DW 1234h<\/code><\/td><\/tr><tr><td>DD<\/td><td>Define Doubleword<\/td><td>4 bytes<\/td><td><code>c DD 12345678h<\/code><\/td><\/tr><tr><td>DQ<\/td><td>Define Quadword<\/td><td>8 bytes<\/td><td><code>d DQ 0<\/code><\/td><\/tr><tr><td>DT<\/td><td>Define Ten bytes<\/td><td>10 bytes<\/td><td><code>e DT 0<\/code><\/td><\/tr><\/table><p><b>2. Uninitialized data (section .bss) - reserve directives<\/b>: <b>RESB<\/b> (bytes), <b>RESW<\/b> (words), <b>RESD<\/b> (doublewords), <b>RESQ<\/b> (quadwords), <b>REST<\/b> (ten bytes). They take the <b>number of units<\/b> to reserve, e.g. <code>buffer RESB 64<\/code> reserves 64 bytes. The .bss area is zero-filled.<\/p><p>Note: data is stored in <b>little-endian<\/b> order and negative numbers in 2's complement.<\/p>"},{"id":"P1-11","unit":"P1","src":["A1"],"dia":true,"type":"Explain","ease":2,"q":"Describe Reentrant and Recursive Procedure with suitable diagram.","ans":"<ol><li><b>Reentrant procedure:<\/b> A procedure that can be <b>interrupted or called again before its first call has finished<\/b>, and still works correctly. Example: Procedure1 calls Procedure2, and Procedure2 calls Procedure1 again.<\/li><li><b>Condition for reentrancy:<\/b> It must keep its data in <b>registers or on the stack<\/b>, not in fixed memory locations, so each call has its own copy of local data.<\/li><li><b>Use:<\/b> Interrupt service routines and shared library code.<\/li><li><b>Recursive procedure:<\/b> A procedure that <b>calls itself<\/b> directly until a base (stop) condition is reached. Example: factorial, n! = n &times; (n-1)!.<\/li><li><b>Stack use:<\/b> Every recursive call pushes a return address and parameters on the stack, and RET pops them back in reverse order.<\/li><li><b>Care:<\/b> Without a proper end condition, recursion fills the stack (stack overflow).<\/li><\/ol>","diag":"REENTRANT PROCEDURE\n Main program        Procedure 1             Procedure 2\n ------------        -----------             -----------\n CALL Proc1  ----->  ...                     ...\n                     CALL Proc2  -------->   CALL Proc1 (re-enters\n                     ...                     Proc1 before it ended)\n Next instr. <-----  RET (back to main)  <-- RET\n\nRECURSIVE PROCEDURE\n Main program        Procedure               Procedure (same)\n ------------        ---------               ----------------\n CALL Rec    ----->  CALL Rec  ---------->   CALL Rec  --> ...\n Next instr. <-----  RET       <----------   RET (base case)"},{"id":"P1-12","unit":"P1","src":["SL"],"dia":false,"type":"Compare","ease":1,"q":"Differentiate between microprocessor, microcomputer and microcontroller.","ans":"<table><tr><th>Sr.<\/th><th>Microprocessor<\/th><th>Microcomputer<\/th><th>Microcontroller<\/th><\/tr><tr><td>1<\/td><td>Only the <b>CPU on a single chip<\/b> (ALU, registers, control unit)<\/td><td>A complete computer built using a microprocessor + memory + I/O<\/td><td>CPU + memory + I/O ports + timers on <b>one chip<\/b><\/td><\/tr><tr><td>2<\/td><td>Needs external memory and I/O<\/td><td>Memory and I/O are on separate chips on the board<\/td><td>Memory and peripherals are built in<\/td><\/tr><tr><td>3<\/td><td>General purpose<\/td><td>General purpose (PC, laptop)<\/td><td>Specific task / embedded use<\/td><\/tr><tr><td>4<\/td><td>High processing power<\/td><td>High<\/td><td>Lower power, low cost<\/td><\/tr><tr><td>5<\/td><td>e.g. 8086, 80386<\/td><td>e.g. IBM PC<\/td><td>e.g. 8051, ATmega328<\/td><\/tr><\/table><p>A microprocessor alone is not a computer because it cannot store programs or talk to the user without external memory and I/O.<\/p>"},{"id":"P1-13","unit":"P1","src":["SL"],"dia":false,"type":"Explain","ease":1,"q":"Explain the structure (sections) of a NASM assembly program with an example.","ans":"<p>A NASM program for Linux is divided into three sections:<\/p><ol><li><b>section .data<\/b> - declares <b>initialized data or constants<\/b> (values do not change at run time), e.g. messages, numbers.<\/li><li><b>section .bss<\/b> - declares <b>uninitialized variables<\/b> (buffers) using RESB/RESW; this memory is zero-filled.<\/li><li><b>section .text<\/b> - holds the <b>actual code<\/b>. It must start with <code>global _start<\/code>, which tells the kernel where execution begins.<\/li><li><b>Statement format:<\/b> <code>[label] mnemonic [operands] [;comment]<\/code>. Comments start with a semicolon.<\/li><li><b>Three kinds of statements:<\/b> executable instructions, assembler directives and macros.<\/li><\/ol><pre>section .data\n    msg db 'Hello', 10      ; string + newline\n    len equ $ - msg\nsection .bss\n    buf resb 10            ; 10 bytes reserved\nsection .text\n    global _start\n_start:\n    mov rax, 1             ; sys_write\n    mov rdi, 1             ; stdout\n    mov rsi, msg\n    mov rdx, len\n    syscall\n    mov rax, 60            ; sys_exit\n    mov rdi, 0\n    syscall<\/pre><p>Build: <code>nasm -f elf64 p.asm<\/code> &rarr; <code>ld p.o -o p<\/code> &rarr; <code>./p<\/code><\/p>"},{"id":"P1-14","unit":"P1","src":["SL"],"dia":false,"type":"Explain","ease":2,"q":"Explain debugging of an assembly program using the GNU debugger (GDB).","ans":"<p><b>GDB<\/b> (GNU Debugger) is a Linux debugger used to run a program step by step and inspect registers and memory to find errors.<\/p><ol><li><b>Assemble with debug info:<\/b> <code>nasm -f elf64 -g -F dwarf p.asm<\/code>, then <code>ld p.o -o p<\/code>.<\/li><li><b>Start GDB:<\/b> <code>gdb ./p<\/code>.<\/li><li><b>Breakpoint:<\/b> <code>break _start<\/code> stops execution at that label.<\/li><li><b>Run and step:<\/b> <code>run<\/code> starts the program; <code>stepi<\/code> (si) executes one instruction; <code>nexti<\/code> steps over calls; <code>continue<\/code> runs to the next breakpoint.<\/li><li><b>Inspect:<\/b> <code>info registers<\/code> shows register contents; <code>x/4xb &amp;num<\/code> shows memory bytes; <code>print $rax<\/code> shows one register.<\/li><li><b>Layout:<\/b> <code>layout asm<\/code> / <code>layout regs<\/code> shows code and registers together. <code>quit<\/code> exits.<\/li><\/ol><p>So GDB helps us check that each instruction gives the expected value.<\/p>"},{"id":"P2-01","unit":"P2","src":["A2"],"dia":true,"type":"Explain","ease":2,"q":"Explain with diagram how the CPU acts as a microprocessor.","ans":"<p>A <b>microprocessor<\/b> is the <b>CPU fabricated on a single chip<\/b>. It reads instructions from memory, decodes them and executes them, and controls all other parts through buses.<\/p><ol><li><b>ALU:<\/b> Performs arithmetic (add, subtract) and logical (AND, OR, compare) operations.<\/li><li><b>Register array:<\/b> Small fast storage inside the chip for data and addresses (e.g. AX, BX, SP, IP in 8086).<\/li><li><b>Timing and control unit:<\/b> Generates timing and control signals (RD, WR, ALE) and decodes instructions.<\/li><li><b>Fetch-decode-execute:<\/b> The CPU places an address on the <b>address bus<\/b>, reads the instruction on the <b>data bus<\/b>, decodes it and executes it, then moves to the next instruction.<\/li><li><b>Buses:<\/b> Address bus (unidirectional), data bus (bidirectional), control bus.<\/li><li><b>Programmable:<\/b> The same chip does different jobs depending on the program in memory - so the CPU acts as a general-purpose microprocessor.<\/li><\/ol>","diag":"                 +---------------------------------+\n                 |        MICROPROCESSOR (CPU)     |\n                 |  +-----------+   +-----------+  |\n                 |  | Register  |<->|    ALU    |  |\n                 |  |  Array    |   +-----------+  |\n                 |  +-----------+                  |\n                 |  +---------------------------+  |\n                 |  |  Timing & Control Unit    |  |\n                 |  +---------------------------+  |\n                 +---+-----------+-----------+-----+\n                     |           |           |\n              Address Bus    Data Bus    Control Bus\n                     |           |           |\n              +------+-----------+-----------+------+\n              |      MEMORY              I/O devices |\n              +-------------------------------------+"},{"id":"P2-02","unit":"P2","src":["A2","CT"],"dia":false,"type":"Program","ease":1,"q":"Write ALP to add two numbers.","ans":"<p><b>Aim:<\/b> Add two 16-bit numbers stored in memory and store the result (8086 assembly).<\/p><pre>DATA SEGMENT\n    NUM1   DW 1234H        ; first number\n    NUM2   DW 0ABCDH       ; second number\n    RESULT DW ?            ; to store sum\n    CARRY  DB 00H          ; to store carry\nDATA ENDS\n\nCODE SEGMENT\n    ASSUME CS:CODE, DS:DATA\nSTART:\n    MOV AX, DATA           ; initialise data segment\n    MOV DS, AX\n    MOV AX, NUM1           ; AX = 1234H\n    ADD AX, NUM2           ; AX = AX + NUM2\n    MOV RESULT, AX         ; store sum\n    JNC SKIP               ; if no carry, skip\n    MOV CARRY, 01H         ; else carry = 1\nSKIP:\n    MOV AH, 4CH            ; terminate program\n    INT 21H\nCODE ENDS\nEND START<\/pre><p><b>Result:<\/b> 1234H + ABCDH = <b>BE01H<\/b>, carry = 0.<\/p><p><b>NASM (Linux) version of the core part:<\/b> <code>mov ax,[num1]<\/code> &rarr; <code>add ax,[num2]<\/code> &rarr; <code>mov [result],ax<\/code>, then exit with <code>mov rax,60 / mov rdi,0 / syscall<\/code>.<\/p>"},{"id":"P2-03","unit":"P2","src":["A2","CT"],"dia":false,"type":"Numerical","ease":1,"q":"Calculate EA and PA produced for the following addressing modes, if [BX] = 0158H, Displacement = 1B57H, [DI] = 10A5H, [DS] = 2100H and DS is used as the segment register: direct, register, immediate, register indirect, register indirect assuming DI, register relative (BX), register relative (DI), based indexed (BX and DI), relative based indexed (BX and DI).","ans":"<p><b>Formula:<\/b> PA = DS &times; 10H + EA. Here DS &times; 10H = 2100H &times; 10H = <b>21000H<\/b>.<\/p><table><tr><th>Sr.<\/th><th>Addressing mode<\/th><th>Example<\/th><th>EA<\/th><th>PA = 21000H + EA<\/th><\/tr><tr><td>1<\/td><td>Direct<\/td><td>MOV AX,[1B57H]<\/td><td>1B57H<\/td><td><b>22B57H<\/b><\/td><\/tr><tr><td>2<\/td><td>Register<\/td><td>MOV AX,BX<\/td><td colspan='2'>No memory access - operand is in the register (no EA/PA)<\/td><\/tr><tr><td>3<\/td><td>Immediate<\/td><td>MOV AX,1B57H<\/td><td colspan='2'>No memory access - data is in the instruction (no EA/PA)<\/td><\/tr><tr><td>4<\/td><td>Register indirect (BX)<\/td><td>MOV AX,[BX]<\/td><td>0158H<\/td><td><b>21158H<\/b><\/td><\/tr><tr><td>5<\/td><td>Register indirect (DI)<\/td><td>MOV AX,[DI]<\/td><td>10A5H<\/td><td><b>220A5H<\/b><\/td><\/tr><tr><td>6<\/td><td>Register relative (BX)<\/td><td>MOV AX,[BX+1B57H]<\/td><td>0158H+1B57H = 1CAFH<\/td><td><b>22CAFH<\/b><\/td><\/tr><tr><td>7<\/td><td>Register relative (DI)<\/td><td>MOV AX,[DI+1B57H]<\/td><td>10A5H+1B57H = 2BFCH<\/td><td><b>23BFCH<\/b><\/td><\/tr><tr><td>8<\/td><td>Based indexed (BX, DI)<\/td><td>MOV AX,[BX+DI]<\/td><td>0158H+10A5H = 11FDH<\/td><td><b>221FDH<\/b><\/td><\/tr><tr><td>9<\/td><td>Relative based indexed<\/td><td>MOV AX,[BX+DI+1B57H]<\/td><td>11FDH+1B57H = 2D54H<\/td><td><b>23D54H<\/b><\/td><\/tr><\/table><p>The class test asks only rows 1-5 (5 marks).<\/p>"},{"id":"P2-04","unit":"P2","src":["A2"],"dia":false,"type":"Explain","ease":1,"q":"Explain the various registers of 8086 processor with their function.","ans":"<p>8086 has fourteen 16-bit registers, grouped as below.<\/p><table><tr><th>Group<\/th><th>Registers<\/th><th>Function<\/th><\/tr><tr><td>General purpose<\/td><td><b>AX<\/b> (AH, AL)<\/td><td>Accumulator: arithmetic/logic results, I/O, MUL/DIV<\/td><\/tr><tr><td><\/td><td><b>BX<\/b> (BH, BL)<\/td><td>Base register: holds base address to access memory (default DS)<\/td><\/tr><tr><td><\/td><td><b>CX<\/b> (CH, CL)<\/td><td>Count register: counter for LOOP, shift/rotate, string repeat<\/td><\/tr><tr><td><\/td><td><b>DX<\/b> (DH, DL)<\/td><td>Data register: high word in MUL/DIV, I/O port address<\/td><\/tr><tr><td>Pointer<\/td><td><b>SP, BP<\/b><\/td><td>SP = offset of top of stack; BP = base pointer to access stack data<\/td><\/tr><tr><td>Index<\/td><td><b>SI, DI<\/b><\/td><td>Source and destination index for string and indexed addressing<\/td><\/tr><tr><td>Segment<\/td><td><b>CS, DS, SS, ES<\/b><\/td><td>Hold starting address of code, data, stack and extra segments<\/td><\/tr><tr><td>Instruction pointer<\/td><td><b>IP<\/b><\/td><td>Offset of the next instruction in the code segment<\/td><\/tr><tr><td>Flag<\/td><td><b>Flag register<\/b><\/td><td>9 flags showing result status and controlling the CPU<\/td><\/tr><\/table><p>AX, BX, CX and DX can be used as 16-bit or as two 8-bit registers.<\/p>"},{"id":"P2-05","unit":"P2","src":["A2","CT"],"dia":false,"type":"List","ease":1,"q":"What are the different addressing modes used in 8086? List them with an example for each.","ans":"<p><b>Addressing mode<\/b> = the way the operand (data) is specified in an instruction.<\/p><ol><li><b>Register:<\/b> operand in a register - <code>MOV CL, DH<\/code><\/li><li><b>Immediate:<\/b> data is part of the instruction - <code>MOV AX, 0A9FH<\/code><\/li><li><b>Direct:<\/b> 16-bit address given in the instruction - <code>MOV BX, [1354H]<\/code><\/li><li><b>Register indirect:<\/b> address is in BX/BP/SI/DI - <code>MOV CX, [BX]<\/code><\/li><li><b>Based:<\/b> BX or BP + displacement - <code>MOV AX, [BX+08H]<\/code><\/li><li><b>Indexed:<\/b> SI or DI + displacement - <code>MOV CX, [SI+0A2H]<\/code><\/li><li><b>Based indexed:<\/b> base + index + displacement - <code>MOV DX, [BX+SI+0AH]<\/code><\/li><li><b>String:<\/b> SI (source, DS) and DI (destination, ES) - <code>MOVSB<\/code><\/li><li><b>Direct I/O port:<\/b> 8-bit port address - <code>IN AL, 09H<\/code><\/li><li><b>Indirect I/O port:<\/b> port address in DX - <code>OUT DX, AX<\/code><\/li><li><b>Relative:<\/b> jump relative to IP - <code>JZ label<\/code><\/li><li><b>Implied:<\/b> no operand - <code>CLC<\/code><\/li><\/ol>"},{"id":"P2-06","unit":"P2","src":["A2"],"dia":false,"type":"Program","ease":2,"q":"Write ALP to add an 8-bit array.","ans":"<p><b>Aim:<\/b> Add five 8-bit numbers of an array; the sum may exceed 8 bits, so store a 16-bit result.<\/p><pre>DATA SEGMENT\n    ARR  DB 12H, 34H, 05H, 0F0H, 21H   ; array of 5 bytes\n    SUM  DW ?                          ; 16-bit sum\nDATA ENDS\n\nCODE SEGMENT\n    ASSUME CS:CODE, DS:DATA\nSTART:\n    MOV AX, DATA        ; initialise DS\n    MOV DS, AX\n    MOV CX, 05H         ; count = 5 elements\n    LEA SI, ARR         ; SI points to array\n    XOR AX, AX          ; AX = 0 (sum)\nBACK:\n    ADD AL, [SI]        ; add element to AL\n    ADC AH, 00H         ; add carry into AH\n    INC SI              ; next element\n    LOOP BACK           ; CX = CX-1, repeat till 0\n    MOV SUM, AX         ; store result\n    MOV AH, 4CH         ; exit\n    INT 21H\nCODE ENDS\nEND START<\/pre><p><b>Result:<\/b> 12H+34H+05H+F0H+21H = <b>015CH<\/b>.<\/p>"},{"id":"P2-07","unit":"P2","src":["A2"],"dia":false,"type":"Explain","ease":1,"q":"Write any 5 instructions of 8086 in detail.","ans":"<ol><li><b>MOV dest, src<\/b> (data transfer) - copies a byte/word from source to destination. Flags not affected. Memory-to-memory move is not allowed. e.g. <code>MOV AX, BX<\/code>, <code>MOV AL, [SI]<\/code>.<\/li><li><b>ADD dest, src<\/b> (arithmetic) - dest = dest + src. Affects CF, ZF, SF, OF, PF, AF. e.g. <code>ADD AX, 0025H<\/code>.<\/li><li><b>MUL src<\/b> (arithmetic) - unsigned multiply. 8-bit: AX = AL &times; src; 16-bit: DX:AX = AX &times; src. e.g. <code>MUL BL<\/code>.<\/li><li><b>PUSH src / POP dest<\/b> (stack) - PUSH decrements SP by 2 and stores the word on the stack; POP copies the top word and increments SP by 2. e.g. <code>PUSH AX<\/code>, <code>POP BX<\/code>.<\/li><li><b>LOOP label<\/b> (iteration) - decrements CX by 1 and jumps to the label if CX &ne; 0, without affecting flags. e.g. <code>LOOP BACK<\/code>.<\/li><\/ol><p>(Other good choices: SUB, INC/DEC, CMP, JMP, JZ, CALL/RET.)<\/p>"},{"id":"P2-08","unit":"P2","src":["A2"],"dia":true,"type":"Diagram","ease":3,"q":"Draw the pin layout diagram of 8086 microprocessor.","ans":"<p>8086 is a <b>40-pin DIP<\/b> IC working on <b>+5 V<\/b>. Some pins have two functions depending on <b>minimum mode<\/b> (MN/MX&#773; = 1) or <b>maximum mode<\/b> (MN/MX&#773; = 0).<\/p><ol><li><b>AD0-AD15:<\/b> multiplexed address/data bus (address in T1, data later).<\/li><li><b>A16/S3-A19/S6:<\/b> higher address bits multiplexed with status signals.<\/li><li><b>BHE&#773;/S7:<\/b> bus high enable - enables data on D8-D15.<\/li><li><b>RD&#773;, READY, RESET, CLK, INTR, NMI, TEST&#773;:<\/b> common control signals.<\/li><li><b>Minimum mode pins (24-31):<\/b> INTA&#773;, ALE, DEN&#773;, DT/R&#773;, M/IO&#773;, WR&#773;, HLDA, HOLD.<\/li><li><b>Maximum mode pins:<\/b> QS1, QS0, S0&#773;, S1&#773;, S2&#773;, LOCK&#773;, RQ&#773;/GT&#773;1, RQ&#773;/GT&#773;0.<\/li><li><b>Power:<\/b> VCC pin 40, GND pins 1 and 20.<\/li><\/ol>","diag":"           +-----\\/-----+\n     GND  1|            |40 VCC\n    AD14  2|            |39 AD15\n    AD13  3|            |38 A16/S3\n    AD12  4|            |37 A17/S4\n    AD11  5|            |36 A18/S5\n    AD10  6|            |35 A19/S6\n     AD9  7|            |34 BHE'/S7\n     AD8  8|   8086     |33 MN/MX'\n     AD7  9|            |32 RD'\n     AD6 10|            |31 HOLD   (RQ'/GT0')\n     AD5 11|            |30 HLDA   (RQ'/GT1')\n     AD4 12|            |29 WR'    (LOCK')\n     AD3 13|            |28 M/IO'  (S2')\n     AD2 14|            |27 DT/R'  (S1')\n     AD1 15|            |26 DEN'   (S0')\n     AD0 16|            |25 ALE    (QS0)\n     NMI 17|            |24 INTA'  (QS1)\n    INTR 18|            |23 TEST'\n     CLK 19|            |22 READY\n     GND 20|            |21 RESET\n           +------------+\n   ' = active low.  Pins 24-31: minimum mode (maximum mode in brackets)"},{"id":"P2-09","unit":"P2","src":["A2","CT"],"dia":true,"type":"Diagram","ease":2,"q":"Draw 8086 microprocessor architecture.","ans":"<p>The 8086 architecture is divided into two independent units that work in parallel (pipelining).<\/p><ol><li><b>Bus Interface Unit (BIU):<\/b> handles all bus activity - fetches instructions, reads/writes data from memory and I/O.<\/li><li><b>Segment registers:<\/b> CS, DS, SS, ES (16-bit each) hold segment base addresses.<\/li><li><b>IP:<\/b> holds the offset of the next instruction.<\/li><li><b>Address adder (&Sigma;):<\/b> forms the 20-bit physical address = segment &times; 10H + offset.<\/li><li><b>6-byte instruction queue:<\/b> BIU pre-fetches up to 6 bytes of instructions (FIFO) while EU executes - this overlap is <b>pipelining<\/b>.<\/li><li><b>Execution Unit (EU):<\/b> decodes and executes instructions using the <b>16-bit ALU<\/b>, general registers AX, BX, CX, DX, pointer/index registers SP, BP, SI, DI, the <b>flag register<\/b> and the control system (decoder).<\/li><\/ol>","diag":"  BUS INTERFACE UNIT (BIU)                    EXECUTION UNIT (EU)\n +-------------------------------+         +--------------------------------+\n |  CS | DS | SS | ES  (segment) |         |  AH | AL  = AX   General       |\n |  IP (instruction pointer)     |         |  BH | BL  = BX   purpose       |\n |                               |         |  CH | CL  = CX   registers     |\n |  ( SIGMA ) address adder      |         |  DH | DL  = DX                 |\n |     -> 20-bit physical addr   |         |  SP | BP | SI | DI             |\n |                               |  16-bit |                                |\n |  6-byte INSTRUCTION QUEUE     | ------> |  Control system / decoder      |\n |  [1][2][3][4][5][6]  (FIFO)   |  bus    |                                |\n |                               |         |  ALU (16-bit)  <-> operands    |\n |  Bus control logic            |         |  FLAG register                 |\n +---------------+---------------+         +--------------------------------+\n                 |\n      20-bit address bus / 16-bit data bus / control bus  --> Memory & I/O"},{"id":"P2-10","unit":"P2","src":["A2"],"dia":false,"type":"Explain","ease":1,"q":"Explain the flags of 8086 in detail.","ans":"<p>The 8086 <b>flag register<\/b> is 16-bit, of which <b>9 bits are used<\/b>: 6 status flags and 3 control flags.<\/p><table><tr><th>Bit<\/th><td>15-12<\/td><td>11<\/td><td>10<\/td><td>9<\/td><td>8<\/td><td>7<\/td><td>6<\/td><td>5<\/td><td>4<\/td><td>3<\/td><td>2<\/td><td>1<\/td><td>0<\/td><\/tr><tr><th>Flag<\/th><td>-<\/td><td>OF<\/td><td>DF<\/td><td>IF<\/td><td>TF<\/td><td>SF<\/td><td>ZF<\/td><td>-<\/td><td>AF<\/td><td>-<\/td><td>PF<\/td><td>-<\/td><td>CF<\/td><\/tr><\/table><p><b>Status flags<\/b><\/p><ol><li><b>CF (Carry):<\/b> set when there is a carry out of / borrow into the MSB.<\/li><li><b>PF (Parity):<\/b> set when the lower byte of the result has an even number of 1s.<\/li><li><b>AF (Auxiliary carry):<\/b> set on carry/borrow from bit 3 to bit 4 (used in BCD).<\/li><li><b>ZF (Zero):<\/b> set when the result is zero.<\/li><li><b>SF (Sign):<\/b> set when the result is negative (MSB = 1).<\/li><li><b>OF (Overflow):<\/b> set when a signed result is too large for the destination.<\/li><\/ol><p><b>Control flags<\/b><\/p><ol><li><b>TF (Trap):<\/b> when set, the CPU runs in single-step mode (for debugging).<\/li><li><b>IF (Interrupt):<\/b> when set, maskable interrupts on INTR are accepted; cleared = disabled.<\/li><li><b>DF (Direction):<\/b> 0 = strings processed from low to high address (auto-increment), 1 = high to low (auto-decrement).<\/li><\/ol>"},{"id":"P2-11","unit":"P2","src":["SL"],"dia":false,"type":"List","ease":1,"q":"State the features of 8086 microprocessor.","ans":"<ol><li>First <b>16-bit<\/b> microprocessor from Intel, released in <b>1978<\/b>.<\/li><li><b>16-bit data bus<\/b> and <b>16-bit ALU<\/b>; 16-bit registers.<\/li><li><b>20-bit address bus<\/b> &rarr; can address 2<sup>20<\/sup> = <b>1 MB<\/b> memory.<\/li><li>About <b>29,000 transistors<\/b>, <b>40-pin DIP<\/b>, single <b>+5 V<\/b> supply, made in HMOS.<\/li><li>Clock speed 5 MHz (8086), 8 MHz (8086-2), 10 MHz (8086-1); needs external clock (8284) with 33% duty cycle.<\/li><li><b>Memory segmentation<\/b>: four segments (CS, DS, SS, ES) of up to 64 KB each.<\/li><li><b>Pipelining<\/b> using a <b>6-byte instruction queue<\/b> (BIU and EU work in parallel).<\/li><li>Works in <b>minimum mode<\/b> (single processor) and <b>maximum mode<\/b> (multiprocessor/coprocessor).<\/li><li>Can address <b>64 K I/O ports<\/b> (16-bit port address).<\/li><li>Rich instruction set with <b>12 addressing modes<\/b>; supports 256 interrupts.<\/li><\/ol>"},{"id":"P2-12","unit":"P2","src":["SL"],"dia":false,"type":"Explain","ease":1,"q":"Explain memory segmentation and physical address calculation in 8086.","ans":"<ol><li>8086 has a <b>20-bit address bus<\/b> (1 MB memory) but only <b>16-bit registers<\/b>, so memory is divided into <b>segments<\/b>.<\/li><li>Each segment is up to <b>64 KB<\/b> long and starts at an address that is a multiple of 16 (a paragraph boundary).<\/li><li>Four segments are active at a time: <b>Code (CS)<\/b>, <b>Data (DS)<\/b>, <b>Stack (SS)<\/b> and <b>Extra (ES)<\/b> &rarr; 256 KB at a time.<\/li><li>A memory address is written as <b>Segment : Offset<\/b> (logical address).<\/li><li><b>Physical address = Segment &times; 10H + Offset<\/b> - the BIU shifts the segment left by 4 bits and adds the offset.<\/li><li><b>Default pairs:<\/b> CS:IP (code), DS:SI/DI/BX (data), SS:SP/BP (stack), ES:DI (string destination).<\/li><\/ol><p><b>Example:<\/b> 89ABH : F012H &rarr; 89AB0H + F012H = <b>98AC2H<\/b>.<\/p><p><b>Advantages:<\/b> 1 MB addressed with 16-bit registers, relocatable programs, separate code/data/stack areas.<\/p>"},{"id":"P2-13","unit":"P2","src":["SL"],"dia":false,"type":"Compare","ease":1,"q":"Differentiate between minimum mode and maximum mode of 8086.","ans":"<table><tr><th>Sr.<\/th><th>Minimum mode<\/th><th>Maximum mode<\/th><\/tr><tr><td>1<\/td><td>MN/MX&#773; pin connected to <b>+5 V (high)<\/b><\/td><td>MN/MX&#773; pin connected to <b>ground (low)<\/b><\/td><\/tr><tr><td>2<\/td><td>Single processor system<\/td><td>Multiprocessor / coprocessor system (e.g. with 8087)<\/td><\/tr><tr><td>3<\/td><td>8086 itself generates control signals<\/td><td>Bus controller <b>8288<\/b> generates control signals<\/td><\/tr><tr><td>4<\/td><td>Pins 24-31: INTA&#773;, ALE, DEN&#773;, DT/R&#773;, M/IO&#773;, WR&#773;, HLDA, HOLD<\/td><td>Pins 24-31: QS1, QS0, S0&#773;, S1&#773;, S2&#773;, LOCK&#773;, RQ&#773;/GT&#773;1, RQ&#773;/GT&#773;0<\/td><\/tr><tr><td>5<\/td><td>HOLD/HLDA used for DMA<\/td><td>RQ&#773;/GT&#773; used for bus request/grant<\/td><\/tr><tr><td>6<\/td><td>Simple and low cost<\/td><td>More complex, more powerful<\/td><\/tr><\/table>"},{"id":"P2-14","unit":"P2","src":["SL"],"dia":false,"type":"Compare","ease":1,"q":"Differentiate between 8-bit and 16-bit microprocessors.","ans":"<table><tr><th>Sr.<\/th><th>Point<\/th><th>8-bit (e.g. 8085)<\/th><th>16-bit (e.g. 8086)<\/th><\/tr><tr><td>1<\/td><td>Data bus / ALU<\/td><td>8-bit<\/td><td>16-bit<\/td><\/tr><tr><td>2<\/td><td>Address bus<\/td><td>16-bit &rarr; 64 KB memory<\/td><td>20-bit &rarr; 1 MB memory<\/td><\/tr><tr><td>3<\/td><td>Registers<\/td><td>8-bit (A, B, C, D, E, H, L)<\/td><td>16-bit (AX, BX, CX, DX ...)<\/td><\/tr><tr><td>4<\/td><td>Pipelining<\/td><td>No<\/td><td>Yes, 6-byte instruction queue<\/td><\/tr><tr><td>5<\/td><td>Memory segmentation<\/td><td>No<\/td><td>Yes (CS, DS, SS, ES)<\/td><\/tr><tr><td>6<\/td><td>Multiply / divide instructions<\/td><td>Not available<\/td><td>Available (MUL, DIV)<\/td><\/tr><tr><td>7<\/td><td>Speed<\/td><td>Lower (3-5 MHz)<\/td><td>Higher (5-10 MHz)<\/td><\/tr><\/table>"},{"id":"P3-01","unit":"P3","src":["A3"],"dia":false,"type":"Compare","ease":1,"q":"Compare and contrast the 8086 and 80386 microprocessors by explaining any five differences.","ans":"<table><tr><th>Sr.<\/th><th>Point<\/th><th>8086<\/th><th>80386<\/th><\/tr><tr><td>1<\/td><td>Word size / data bus<\/td><td>16-bit<\/td><td>32-bit<\/td><\/tr><tr><td>2<\/td><td>Address bus &amp; physical memory<\/td><td>20-bit &rarr; 1 MB<\/td><td>32-bit &rarr; 4 GB<\/td><\/tr><tr><td>3<\/td><td>Virtual memory<\/td><td>Not supported<\/td><td>Up to 64 TB<\/td><\/tr><tr><td>4<\/td><td>Operating modes<\/td><td>Real mode only<\/td><td>Real, Protected and Virtual-8086 modes<\/td><\/tr><tr><td>5<\/td><td>Paging / memory management<\/td><td>No paging, no protection<\/td><td>On-chip MMU: segmentation + paging, 4 protection levels<\/td><\/tr><tr><td>6<\/td><td>Registers<\/td><td>16-bit AX, BX ...; 4 segment registers<\/td><td>32-bit EAX, EBX ...; 6 segment registers (+FS, GS)<\/td><\/tr><tr><td>7<\/td><td>Segment size<\/td><td>Fixed maximum 64 KB<\/td><td>Up to 4 GB<\/td><\/tr><\/table><p><b>In short:<\/b> 80386 is a 32-bit, multitasking processor with memory management, while 8086 is a simple 16-bit processor; 80386 can still run 8086 programs.<\/p>"},{"id":"P3-02","unit":"P3","src":["A3"],"dia":false,"type":"Explain","ease":2,"q":"Illustrate with a real-world scenario the contribution of 80386 over 8086 in the evolution of microprocessors from 16-bit to 32-bit.","ans":"<p><b>Scenario:<\/b> Think of an office PC around 1990. With an 8086 it runs <b>one DOS program at a time<\/b>, limited to <b>1 MB<\/b> of memory - if a program crashes, the whole machine hangs.<\/p><ol><li><b>32-bit processing:<\/b> 80386 works on 32-bit data in one step, so tasks like spreadsheets, CAD and image editing became much faster.<\/li><li><b>4 GB address space:<\/b> large programs and data could be kept in memory instead of being swapped in pieces.<\/li><li><b>Multitasking with protection:<\/b> in protected mode, the same PC could run a word processor, a printer job and a calculator together; each task has its own memory, so one crash doesn't spoil the others.<\/li><li><b>Virtual memory and paging:<\/b> programs could be bigger than the RAM, using the hard disk as extra memory (4 KB pages).<\/li><li><b>Virtual-8086 mode:<\/b> old 8086 DOS programs kept running inside a window - users did not lose their old software.<\/li><li><b>Base for modern OS:<\/b> 32-bit Windows (e.g. Windows 95) and Linux were built for the 386 family - <b>Linux itself was first written for the 80386<\/b> in 1991.<\/li><\/ol><p>So 80386 turned the PC from a single-user, single-task machine into a true multitasking 32-bit computer, and the x86 processors we use today grew from it.<\/p>"},{"id":"P3-03","unit":"P3","src":["A3"],"dia":false,"type":"List","ease":1,"q":"Explain features of 80386 in detail.","ans":"<ol><li><b>32-bit microprocessor<\/b> - 32-bit ALU, 32-bit registers, works on 8, 16 and 32-bit data.<\/li><li><b>32-bit data bus and 32-bit address bus<\/b> &rarr; <b>4 GB physical memory<\/b>; data bus is split into 4 memory banks.<\/li><li><b>Virtual memory<\/b> of up to <b>64 TB<\/b>; maximum segment size 4 GB.<\/li><li><b>Three operating modes<\/b> - Real, Protected and Virtual-8086.<\/li><li><b>On-chip Memory Management Unit<\/b> - supports <b>segmentation and paging<\/b> (4 KB pages).<\/li><li><b>Protection<\/b> - 4 privilege levels (0 to 3) to protect the OS from user programs.<\/li><li><b>Multitasking<\/b> support in hardware (task switching using the TR register).<\/li><li><b>Pipelined architecture<\/b> - its units work in parallel for higher speed.<\/li><li><b>Hardware debugging support<\/b> - debug registers DR0-DR7.<\/li><li>Clock speeds of <b>16, 20, 25 and 33 MHz<\/b>; 132-pin PGA package; <b>80386SX<\/b> version has a 16-bit data bus, <b>80386DX<\/b> has 32-bit.<\/li><li>Fully <b>compatible<\/b> with 8086 and 80286 software.<\/li><\/ol>"},{"id":"P3-04","unit":"P3","src":["A3"],"dia":false,"type":"Compare","ease":1,"q":"Compare Intel 8086 and Intel 80386 with respect to: (i) word length (ii) address bus (iii) data bus (iv) memory addressing (v) registers (vi) operating modes.","ans":"<table><tr><th>Sr.<\/th><th>Parameter<\/th><th>Intel 8086<\/th><th>Intel 80386<\/th><\/tr><tr><td>i<\/td><td>Word length<\/td><td>16-bit<\/td><td>32-bit<\/td><\/tr><tr><td>ii<\/td><td>Address bus<\/td><td>20-bit (A0-A19)<\/td><td>32-bit (A2-A31 + BE0&#773;-BE3&#773;)<\/td><\/tr><tr><td>iii<\/td><td>Data bus<\/td><td>16-bit (D0-D15), multiplexed with address<\/td><td>32-bit (D0-D31), separate (non-multiplexed)<\/td><\/tr><tr><td>iv<\/td><td>Memory addressing<\/td><td>1 MB physical; segments of 64 KB; no virtual memory<\/td><td>4 GB physical, 64 TB virtual; segmentation + paging<\/td><\/tr><tr><td>v<\/td><td>Registers<\/td><td>16-bit: AX, BX, CX, DX, SP, BP, SI, DI, IP, FLAGS; segment CS, DS, SS, ES<\/td><td>32-bit: EAX, EBX, ECX, EDX, ESP, EBP, ESI, EDI, EIP, EFLAGS; segment CS, DS, SS, ES, FS, GS; plus control, debug, test and system registers<\/td><\/tr><tr><td>vi<\/td><td>Operating modes<\/td><td>Only real mode<\/td><td>Real, Protected and Virtual-8086 mode<\/td><\/tr><\/table>"},{"id":"P3-05","unit":"P3","src":["A3"],"dia":false,"type":"Explain","ease":1,"q":"Describe the features of Intel 80386 that make it suitable for multitasking and high-performance computing.","ans":"<p><b>For multitasking<\/b><\/p><ol><li><b>Protected mode:<\/b> each task gets its own memory area; one program cannot overwrite another.<\/li><li><b>Four privilege levels (0-3):<\/b> the OS kernel runs at level 0 and user programs at level 3, so user tasks cannot damage the OS.<\/li><li><b>Hardware task switching:<\/b> the Task Register (TR) and task state segments let the CPU save one task and start another quickly.<\/li><li><b>Paging and virtual memory:<\/b> many programs can run even if RAM is small (64 TB virtual, 4 KB pages).<\/li><li><b>Virtual-8086 mode:<\/b> several old 8086 programs can run as separate tasks.<\/li><\/ol><p><b>For high performance<\/b><\/p><ol start='6'><li><b>32-bit data bus, registers and ALU<\/b> - processes 32 bits in one go.<\/li><li><b>Pipelining<\/b> - prefetch, decode, execute, segmentation and paging units work in parallel.<\/li><li><b>64-bit barrel shifter<\/b> and fast multiply/divide hardware.<\/li><li>Clock up to <b>33 MHz<\/b> and 4 GB directly addressable memory.<\/li><\/ol>"},{"id":"P3-06","unit":"P3","src":["A3"],"dia":true,"type":"Diagram","ease":3,"q":"Illustrate the architecture of Intel 80386 with a neat labelled diagram and explain the function of each block.","ans":"<p>As per the slides, 80386DX has three main parts: <b>Central Processing Unit<\/b>, <b>Memory Management Unit<\/b> and <b>Bus Interface Unit<\/b>.<\/p><ol><li><b>Instruction unit:<\/b> the prefetch part brings code bytes into a 16-byte queue; the decoder decodes opcodes and keeps them in the <b>decoded instruction queue<\/b> for the execution unit.<\/li><li><b>Execution unit:<\/b> has <b>eight 32-bit general registers<\/b>, 32-bit ALU, a <b>64-bit barrel shifter<\/b> for fast shift/rotate/multiply/divide, and a protection test unit. It also calculates the effective address: EA = Base + Index &times; Scale + Displacement.<\/li><li><b>Segmentation unit:<\/b> converts the logical address into a <b>linear address<\/b> using segment descriptors, and checks limits and access rights. Gives easy relocation and sharing of code/data.<\/li><li><b>Paging unit:<\/b> converts the linear address into a <b>physical address<\/b> using 4 KB pages; it is transparent to segmentation and gives virtual memory.<\/li><li><b>Bus interface unit:<\/b> connects the chip to memory and I/O - drives the address (A2-A31, BE0&#773;-BE3&#773;) and data (D0-D31) buses and generates bus control signals; supports address pipelining and dynamic bus sizing.<\/li><\/ol>","diag":"+------------------------------------------------------------------+\n|                        CENTRAL PROCESSING UNIT                   |\n|  +--------------------------+     +----------------------------+ |\n|  | INSTRUCTION UNIT         |     | EXECUTION UNIT             | |\n|  | Code prefetch (16-byte   |---->| 8 x 32-bit registers       | |\n|  | queue) + Instruction     |     | 32-bit ALU, 64-bit barrel  | |\n|  | decoder + decoded instr. |     | shifter, multiply/divide   | |\n|  | queue                    |     | Protection test unit       | |\n|  +--------------------------+     +-------------+--------------+ |\n+------------------------------------------------ | ---------------+\n                                                  | effective address\n+------------------------------------------------ v ---------------+\n|                   MEMORY MANAGEMENT UNIT (MMU)                   |\n|   SEGMENTATION UNIT  ---- linear address ---->  PAGING UNIT      |\n|   (descriptor regs,                             (4 KB pages,     |\n|    limit & attribute check)                      page cache/TLB) |\n+------------------------------------+-----------------------------+\n                                     | physical address\n+------------------------------------v-----------------------------+\n|  BUS INTERFACE UNIT: address driver, pipeline/bus control,       |\n|  request prioritizer, data transceivers  ->  A2-A31, BE0'-BE3',  |\n|  D0-D31, control signals                                         |\n+------------------------------------------------------------------+"},{"id":"P3-07","unit":"P3","src":["A3"],"dia":true,"type":"Diagram","ease":2,"q":"Describe the register organization of Intel 80386 with suitable diagram.","ans":"<ol><li><b>General purpose registers (32-bit):<\/b> EAX, EBX, ECX, EDX - their low 16 bits are AX, BX, CX, DX, which further split into 8-bit AH/AL etc. Used for data and address calculation.<\/li><li><b>Pointer and index registers (32-bit):<\/b> ESP (stack pointer), EBP (base pointer), ESI (source index), EDI (destination index); low halves SP, BP, SI, DI.<\/li><li><b>Segment registers (16-bit):<\/b> CS, SS, DS, ES and two extra data segments <b>FS and GS<\/b>.<\/li><li><b>EIP and EFLAGS (32-bit):<\/b> EIP holds the next instruction address; EFLAGS has 8086 flags (CF, PF, AF, ZF, SF, TF, IF, DF, OF) plus <b>IOPL, NT, RF, VM<\/b>.<\/li><li><b>Memory management registers:<\/b> GDTR, LDTR, IDTR, TR - point to descriptor tables and the current task.<\/li><li><b>Control registers:<\/b> CR0-CR3 (CR0 has PE bit for protected mode and PG bit for paging; CR3 holds the page directory base).<\/li><li><b>Debug registers:<\/b> DR0-DR7; <b>Test registers:<\/b> TR6, TR7.<\/li><\/ol>","diag":"GENERAL PURPOSE (32-bit)         31          16 15     8 7      0\n  EAX  (AX = AH:AL)               [   upper 16  |   AH   |   AL   ]\n  EBX  (BX = BH:BL)               [   upper 16  |   BH   |   BL   ]\n  ECX  (CX = CH:CL)               [   upper 16  |   CH   |   CL   ]\n  EDX  (DX = DH:DL)               [   upper 16  |   DH   |   DL   ]\n  ESP (SP)  EBP (BP)  ESI (SI)  EDI (DI)   - 32-bit, low 16 bits usable alone\nSEGMENT (16-bit selectors) : CS  SS  DS  ES  FS  GS\nINSTRUCTION POINTER        : EIP (low 16 = IP)\nFLAGS                      : EFLAGS (low 16 = FLAGS)\nSYSTEM REGISTERS           : GDTR, IDTR, LDTR, TR (memory management)\n                             CR0, CR1, CR2, CR3 (control)\n                             DR0-DR7 (debug), TR6, TR7 (test)"},{"id":"P3-08","unit":"P3","src":["A3"],"dia":true,"type":"Diagram","ease":2,"q":"Explain Real Mode segmentation in Intel 80386 using a suitable diagram.","ans":"<ol><li>After <b>power-on or RESET<\/b>, 80386 starts in <b>real address mode<\/b>.<\/li><li>In real mode, protection and paging are <b>switched off<\/b>, and the 80386 works like a <b>very fast 8086<\/b> (with 32-bit registers available).<\/li><li>The physical address is <b>20-bit<\/b>, so only <b>1 MB<\/b> (00000H-FFFFFH) can be addressed.<\/li><li>Memory is divided into <b>segments of maximum 64 KB<\/b>; a segment can start at any 16-byte boundary.<\/li><li>A logical address is <b>Segment (16-bit) : Offset (16-bit)<\/b>; the segment value is shifted left by 4 bits (&times; 10H) and the offset is added.<\/li><li>Segment registers CS, DS, SS, ES, FS, GS hold segment base values (not selectors, as in protected mode).<\/li><\/ol><p><b>Example:<\/b> 2500H : 4500H &rarr; 25000H + 4500H = <b>29500H<\/b>.<\/p>","diag":"   Logical address  =  Segment (16-bit) : Offset (16-bit)\n\n   Segment  2500H  --shift left 4 bits (x 10H)-->  25000H  (segment base)\n                                                     +\n   Offset   4500H  ----------------------------->   4500H\n                                                  --------\n                                  Physical address  29500H  (20-bit)\n\n        Memory (1 MB: 00000H - FFFFFH)\n        +-------------------+ FFFFFH\n        |        ...        |\n        +-------------------+ 34FFFH  <- base + FFFFH (end of 64 KB segment)\n        |   64 KB segment   |\n        |   29500H <- data  |\n        +-------------------+ 25000H  <- segment base\n        |        ...        |\n        +-------------------+ 00000H"},{"id":"P3-09","unit":"P3","src":["A3"],"dia":false,"type":"Explain","ease":1,"q":"Explain the address translation mechanism in Intel 80386 during Real Mode operation.","ans":"<ol><li><b>Logical address:<\/b> In real mode every memory address is given as <b>Segment : Offset<\/b>, both 16-bit.<\/li><li><b>Step 1 - segment base:<\/b> The 16-bit segment value is shifted <b>left by 4 bits<\/b> (same as multiplying by 10H or adding a 0 at the end in hex) to get a 20-bit base address.<\/li><li><b>Step 2 - add offset:<\/b> The 16-bit offset (from IP, SP, BX, SI, DI etc. or a displacement) is added to the base.<\/li><li><b>Result:<\/b> a <b>20-bit physical address<\/b>, so the range is 00000H to FFFFFH (1 MB).<\/li><li><b>No paging and no descriptor tables<\/b> are used; the paging unit is disabled (PG = 0, PE = 0 in CR0).<\/li><\/ol><p><b>Formula:<\/b> Physical address = Segment &times; 10H + Offset<\/p><p><b>Example:<\/b> CS = 2500H, IP = 4500H &rarr; 25000H + 4500H = <b>29500H<\/b>.<br>Another: DS = 1000H, BX = 0234H &rarr; 10000H + 0234H = <b>10234H<\/b>.<\/p>"},{"id":"P3-10","unit":"P3","src":["A3"],"dia":false,"type":"Explain","ease":1,"q":"Using suitable examples, demonstrate the use of immediate and register addressing modes of Intel 80386.","ans":"<p><b>1. Immediate addressing mode<\/b><\/p><ol><li>The data (8, 16 or 32-bit) is <b>given directly in the instruction<\/b> itself.<\/li><li>No memory read is needed for the operand, so it is fast; used to load constants.<\/li><li>Examples: <code>MOV AX, 0020H<\/code> (AX = 0020H), <code>MOV EAX, 12345678H<\/code>, <code>ADD ECX, 10<\/code>, <code>MOV BL, 0FH<\/code>.<\/li><\/ol><p><b>2. Register addressing mode<\/b><\/p><ol start='4'><li>The operand is <b>in a register<\/b>; the instruction names the register(s).<\/li><li>Any 8/16/32-bit general register can be used (EAX, AX, AL ...); fastest mode, as no memory access is needed.<\/li><li>Examples: <code>ADD EAX, EBX<\/code> (EAX = EAX + EBX), <code>MOV ECX, EDX<\/code>, <code>MOV AL, BH<\/code>, <code>INC ESI<\/code>.<\/li><\/ol><p>Note: in <code>MOV EAX, 25<\/code>, the destination uses register mode and the source uses immediate mode.<\/p>"},{"id":"P3-11","unit":"P3","src":["SL"],"dia":false,"type":"Explain","ease":1,"q":"Explain the operating modes of 80386.","ans":"<ol><li><b>Real address mode:<\/b> power-on default (after RESET). Works like a fast 8086 with 32-bit extensions; only 1 MB memory, 64 KB segments, no protection or paging. Used to set up the system before entering protected mode.<\/li><li><b>Protected virtual address mode:<\/b> the natural 32-bit mode. All features are available - <b>4 GB physical / 64 TB virtual memory<\/b>, segmentation with descriptors, paging, 4 privilege levels and multitasking. Entered by setting the <b>PE bit in CR0<\/b>.<\/li><li><b>Virtual-8086 mode:<\/b> a mode inside protected mode in which the CPU runs <b>8086 programs as separate tasks<\/b> with protection and paging. The CPU can switch quickly between V86 and protected mode (VM flag in EFLAGS).<\/li><\/ol><p>So the same 80386 can run old 8086 software and modern 32-bit multitasking operating systems.<\/p>"},{"id":"P3-12","unit":"P3","src":["SL"],"dia":false,"type":"List","ease":2,"q":"List the addressing modes of 80386 with examples.","ans":"<p>80386 provides <b>11 addressing modes<\/b>. Memory modes use <b>EA = Base + Index &times; Scale + Displacement<\/b> (scale = 1, 2, 4 or 8).<\/p><ol><li><b>Register:<\/b> <code>ADD EAX, EBX<\/code><\/li><li><b>Immediate:<\/b> <code>MOV AX, 0020H<\/code><\/li><li><b>Direct:<\/b> <code>MOV AX, [5000H]<\/code><\/li><li><b>Register indirect:<\/b> <code>MOV EAX, [EBX]<\/code><\/li><li><b>Based:<\/b> <code>MOV ECX, [EAX+24]<\/code><\/li><li><b>Index:<\/b> <code>ADD EAX, TABLE[ESI]<\/code><\/li><li><b>Scaled index:<\/b> <code>IMUL EBX, TABLE[ESI*4], 7<\/code><\/li><li><b>Based index:<\/b> <code>MOV EAX, [ESI][EBX]<\/code><\/li><li><b>Based scaled index:<\/b> <code>MOV ECX, [EDX*8][EAX]<\/code><\/li><li><b>Based index with displacement:<\/b> <code>ADD EDX, [ESI][EBP+00FFFFF0H]<\/code><\/li><li><b>Based scaled index with displacement:<\/b> <code>MOV EAX, LOCALTABLE[EDI*4][EBP+80]<\/code><\/li><\/ol>"},{"id":"P3-13","unit":"P3","src":["SL"],"dia":false,"type":"Explain","ease":2,"q":"Give the pin description of 80386.","ans":"<p>80386DX comes in a <b>132-pin PGA<\/b> package. Main signal groups (# = active low):<\/p><ol><li><b>CLK2:<\/b> clock input at twice the processor frequency.<\/li><li><b>D0-D31:<\/b> 32-bit bidirectional data bus.<\/li><li><b>A2-A31:<\/b> address bus; with <b>BE0#-BE3#<\/b> (byte enables) it selects any byte in the 4 GB space (BE# replace A0, A1).<\/li><li><b>Bus cycle definition:<\/b> <b>W/R#<\/b> (write/read), <b>D/C#<\/b> (data/control), <b>M/IO#<\/b> (memory/IO), <b>LOCK#<\/b> (bus lock).<\/li><li><b>Bus control:<\/b> <b>ADS#<\/b> (address status - valid address on bus), <b>READY#<\/b> (bus cycle complete), <b>NA#<\/b> (next address request - address pipelining), <b>BS16#<\/b> (16-bit bus size).<\/li><li><b>Bus arbitration:<\/b> <b>HOLD<\/b> (bus request) and <b>HLDA<\/b> (hold acknowledge).<\/li><li><b>Interrupts:<\/b> <b>INTR<\/b> (maskable), <b>NMI<\/b> (non-maskable), <b>RESET<\/b>.<\/li><li><b>Coprocessor interface:<\/b> <b>PEREQ<\/b>, <b>BUSY#<\/b>, <b>ERROR#<\/b> (for 80387).<\/li><li><b>Power:<\/b> VCC and VSS (several pins).<\/li><\/ol>"},{"id":"P3-14","unit":"P3","src":["SL"],"dia":false,"type":"List","ease":2,"q":"Explain the real mode instruction set of 80386 (types of instructions with examples).","ans":"<ol><li><b>Data movement:<\/b> MOV, XCHG, PUSH/POP, PUSHA/POPA; type conversion CBW, CWD, CDQ, CWDE, MOVSX, MOVZX - e.g. <code>MOV EAX, EBX<\/code>.<\/li><li><b>Binary arithmetic:<\/b> ADD, ADC, INC, SUB, SBB, DEC, CMP, NEG, MUL, IMUL, DIV, IDIV - e.g. <code>ADD EAX, ECX<\/code>.<\/li><li><b>Decimal arithmetic:<\/b> DAA, DAS, AAA, AAS, AAM, AAD.<\/li><li><b>Logical:<\/b> AND, OR, XOR, NOT, TEST; bit test BT, BTS, BTR, BTC; bit scan BSF, BSR; shifts SHL, SHR, SAR, SHLD, SHRD; rotates ROL, ROR, RCL, RCR; SETcc.<\/li><li><b>Control transfer:<\/b> JMP, CALL, RET, IRET, conditional jumps (JZ, JNC ...), LOOP/LOOPE/LOOPNE, JECXZ, INT n, INTO, BOUND.<\/li><li><b>String:<\/b> MOVS, CMPS, SCAS, LODS, STOS with REP prefixes, using ESI/EDI and DF.<\/li><li><b>High-level language support:<\/b> ENTER and LEAVE (stack frames).<\/li><li><b>Flag control:<\/b> STC, CLC, CMC, STD, CLD, LAHF, SAHF, PUSHF, POPF.<\/li><li><b>Segment register &amp; pointer:<\/b> LDS, LES, LFS, LGS, LSS; <b>Miscellaneous:<\/b> LEA, NOP, XLAT.<\/li><\/ol>"}],"FACTS":[{"h":"8086 at a glance","items":["16-bit CPU, Intel 1978, ~29,000 transistors, HMOS, 40-pin DIP, +5 V","Data bus 16-bit (AD0-AD15 multiplexed); address bus 20-bit -> 1 MB (00000H-FFFFFH)","BIU: CS, DS, SS, ES, IP, address adder (Sigma), 6-byte instruction queue","EU: 16-bit ALU, AX BX CX DX, SP BP SI DI, flag register, control/decoder","Physical address = Segment x 10H + Offset; segment max 64 KB","Flags: CF b0, PF b2, AF b4, ZF b6, SF b7, TF b8, IF b9, DF b10, OF b11","MN/MX' = 1 -> minimum mode; 0 -> maximum mode (8288 bus controller)","12 addressing modes; 64K I/O ports; 256 interrupts"]},{"h":"80386 at a glance","items":["32-bit CPU, Intel 1985, ~275,000 transistors, 132-pin PGA, 16/20/25/33 MHz","Data bus 32-bit (D0-D31), address bus 32-bit (A2-A31 + BE0'-BE3') -> 4 GB physical","Virtual memory 64 TB; segment up to 4 GB; page size 4 KB","Modes: Real (power-on default), Protected (PE bit of CR0), Virtual-8086 (VM flag)","Registers: EAX EBX ECX EDX ESP EBP ESI EDI, EIP, EFLAGS; CS SS DS ES FS GS","System: GDTR LDTR IDTR TR; CR0-CR3; DR0-DR7; TR6 TR7","Extra EFLAGS bits: IOPL (12-13), NT (14), RF (16), VM (17)","Blocks (slides): CPU [instruction unit + execution unit], MMU [segmentation + paging], bus interface unit","EA = Base + Index x Scale + Displacement (scale 1, 2, 4, 8); 11 addressing modes","80386SX = 16-bit external data bus; 80386DX = 32-bit"]},{"h":"Unit I quick facts","items":["Von Neumann = one memory + one bus for code and data (e.g. 8086); Harvard = separate memories and buses (e.g. AVR, 8051)","CISC ~200-300 variable-length instructions, micro-programmed (x86); RISC ~50 fixed-length, hard-wired, load/store (ARM, MIPS)","Assembler 2 passes: pass 1 symbol table + addresses, pass 2 replace symbols -> .o + list file","Linker joins .o files -> executable + link map; Loader brings it into memory; Debugger: step, breakpoint; Emulator: hardware + software test","NASM sections: .data (initialised), .bss (uninitialised, zero-filled), .text (code, global _start)","DB 1, DW 2, DD 4, DQ 8, DT 10 bytes; RESB/RESW/RESD/RESQ/REST reserve space","Near procedure: same segment, push IP; Far: other segment, push CS and IP","Macro = expanded every time (fast, more memory); Procedure = stored once, CALL/RET (slow, less memory)"]},{"h":"Linux / NASM commands","items":["nasm -f elf64 prog.asm   (assemble)   ->   ld prog.o -o prog   (link)   ->   ./prog   (run)","Debug build: nasm -f elf64 -g -F dwarf prog.asm ; gdb ./prog ; break _start ; run ; stepi ; info registers","64-bit syscalls: rax = 1 write (rdi = fd, rsi = buffer, rdx = length), rax = 60 exit (rdi = status), then syscall","Useful Linux: ls, cd, pwd, mkdir, cat, gedit/nano, chmod, sudo apt install nasm"]}],"STRATEGY":["Paper: 30 marks = 3 units x 10 marks. In each unit choose ONE question (A + B, 5 marks each) from the OR pair.","Choose the easier question: prefer comparison tables, lists, definitions and 'explain' questions that are in your assignments / class test.","Prefer questions WITHOUT a diagram if the other option needs 'draw' / 'block diagram' / 'pin diagram' - they cost more time. Choose a diagram question only if the other is clearly harder.","Every assignment question is in the bank below with a 5-mark answer; questions marked 'Asked in Class Test' have already appeared once.","5-mark answer = 1-2 line definition + 5-6 points or a 5-6 row table + 1 example. About half to one page. Don't write extra history.","For EA/PA numericals always write PA = Segment x 10H + EA first, then a table of mode | EA | PA.","Programs: write DATA/CODE segments, a comment on each line and the expected result - examiners give marks for comments and result.","Write the answers in the order of the paper (Q1 A, Q1 B, ...) and keep 5 minutes at the end to check numbers (bus widths, memory size, flag bits)."],"VIDEOS":[{"unit":"P1","topic":"ALP tools: assembler, linker, loader","vids":[{"id":"l5zqGWvJgXk","title":"Compiler, Assembler, Interpreter, Linker & Loader - Complete Explanation","ch":"Hobby Kit"}],"search":"https://www.youtube.com/results?search_query=assembler+linker+loader+debugger+emulator+assembly+language"},{"unit":"P1","topic":"Macro vs procedure (near/far)","vids":[{"id":"6JlV3Eq9IDc","title":"MACRO vs Procedure in Microprocessor 8086: Key Differences Explained","ch":"Engineering Funda"}],"search":"https://www.youtube.com/results?search_query=macro+vs+procedure+8086+near+far+procedure"},{"unit":"P1","topic":"NASM + GDB debugging","vids":[{"id":"ZZTUgIFm9u0","title":"NASM Assembler and GDB with example","ch":"ionbits"}],"search":"https://www.youtube.com/results?search_query=NASM+GDB+debugging+tutorial"},{"unit":"P1","topic":"Von Neumann vs Harvard, CISC vs RISC","vids":[],"search":"https://www.youtube.com/results?search_query=Von+Neumann+vs+Harvard+architecture+CISC+vs+RISC+microprocessor"},{"unit":"P1","topic":"NASM sections & directives (.data .bss .text, DB, RESB)","vids":[],"search":"https://www.youtube.com/results?search_query=NASM+data+bss+text+section+DB+RESB+directives"},{"unit":"P2","topic":"8086 architecture (BIU & EU)","vids":[{"id":"qjF0bOY63p0","title":"Architecture of 8086 Microprocessor with Block Diagram - Microprocessor","ch":"Ekeeda"}],"search":"https://www.youtube.com/results?search_query=8086+microprocessor+architecture+BIU+EU"},{"unit":"P2","topic":"8086 flag register","vids":[],"search":"https://www.youtube.com/results?search_query=8086+flag+register+explained"},{"unit":"P2","topic":"8086 addressing modes + EA/PA numericals","vids":[{"id":"GVjwui-OQhU","title":"Addressing Modes in 8086 Microprocessor: Basics and Examples Explained","ch":"Engineering Funda"}],"search":"https://www.youtube.com/results?search_query=8086+addressing+modes+effective+address+physical+address+numerical"},{"unit":"P2","topic":"8086 memory segmentation","vids":[{"id":"Do30VvR2TqA","title":"Memory Segmentation in 8086 Microprocessor: Basics and Overview","ch":"Engineering Funda","dur":"17:15"}],"search":"https://www.youtube.com/results?search_query=8086+memory+segmentation+physical+address"},{"unit":"P2","topic":"8086 pin diagram, min/max mode","vids":[{"id":"yZCW1KyxLJE","title":"8086 Microprocessor Part-1: Architecture, Pin Diagram, Minimum & Maximum Mode, Memory Segmentation","ch":"conceptech2018"}],"search":"https://www.youtube.com/results?search_query=8086+pin+diagram+minimum+maximum+mode"},{"unit":"P3","topic":"8086 vs 80386 comparison","vids":[],"search":"https://www.youtube.com/results?search_query=8086+vs+80386+difference"},{"unit":"P3","topic":"80386 register set / programming model","vids":[{"id":"9O7PNOiw9Es","title":"Programming Model of Microprocessor 80386","ch":"Engineering Funda"}],"search":"https://www.youtube.com/results?search_query=80386+register+set+programming+model"},{"unit":"P3","topic":"80386 architecture & features","vids":[],"search":"https://www.youtube.com/results?search_query=80386+microprocessor+architecture+features"},{"unit":"P3","topic":"80386 real mode & address translation","vids":[],"search":"https://www.youtube.com/results?search_query=80386+real+mode+address+translation+segmentation"},{"unit":"P3","topic":"80386 operating modes","vids":[],"search":"https://www.youtube.com/results?search_query=80386+operating+modes+real+protected+virtual+8086"},{"unit":"P3","topic":"80386 pin diagram","vids":[],"search":"https://www.youtube.com/results?search_query=80386+pin+diagram+description"}]},"TUTS":[{"t":1,"n":1,"topic":"eig","sub":"2x2 eigenvalues and eigenvectors","text":"Find the Eigen values and Eigen vectors of the matrix $A=\\begin{bmatrix}-4&-6\\\\3&5\\end{bmatrix}$","slide":"Unit I Eigen Exercise 2 (same matrix also asked as PYQ TA-I Set B Q2A for diagonalization)","pyq":"B2A","steps":["$S_1=1,\\;|A|=-20+18=-2\\Rightarrow\\lambda^2-\\lambda-2=0\\Rightarrow\\lambda=-1,2$","$\\lambda=-1$: $-3x_1-6x_2=0\\Rightarrow X_1=(-2,1)^T$","$\\lambda=2$: $-6x_1-6x_2=0\\Rightarrow X_2=(-1,1)^T$"],"ans":"$\\lambda=-1,(-2,1)^T;\\;\\lambda=2,(-1,1)^T$","id":"T1Q1","label":"T1 Q1","rel":"similar","pri":"P1","why":"Same matrix/result as a PYQ with a small change."},{"t":1,"n":2,"topic":"eig","sub":"Triangular matrix","text":"Find the Eigen values and Eigen vectors of the matrix $A=\\begin{bmatrix}-1&1&2\\\\0&-2&1\\\\0&0&-3\\end{bmatrix}$.","steps":["Upper triangular $\\Rightarrow\\lambda=-1,-2,-3$ (diagonal entries)","$\\lambda=-1$: $(A+I)X=0$: $x_2+2x_3=0,\\;-x_2+x_3=0,\\;-2x_3=0\\Rightarrow x_2=x_3=0\\Rightarrow X_1=(1,0,0)^T$","$\\lambda=-2$: $x_1+x_2+2x_3=0,\\;x_3=0\\Rightarrow X_2=(1,-1,0)^T$","$\\lambda=-3$: $2x_1+x_2+2x_3=0,\\;x_2+x_3=0\\Rightarrow x_3=-x_2,\\;x_1=\\tfrac{x_2}{2}\\Rightarrow X_3=(1,2,-2)^T$","Check: $A(1,2,-2)^T=(-3,-6,6)^T=-3(1,2,-2)^T$ ✓"],"ans":"$-1:(1,0,0)^T,\\;-2:(1,-1,0)^T,\\;-3:(1,2,-2)^T$","id":"T1Q2","label":"T1 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":1,"n":3,"topic":"eig","sub":"Checking a given vector","text":"Let $A=\\begin{bmatrix}2&1&0\\\\0&3&0\\\\0&0&4\\end{bmatrix},\\;u=\\begin{bmatrix}1\\\\0\\\\0\\end{bmatrix}$ and $v=\\begin{bmatrix}0\\\\1\\\\1\\end{bmatrix}$. Are <b>u<\/b> and <b>v<\/b> eigen vectors of A?","steps":["$Au=(2,0,0)^T=2u\\Rightarrow u$ is an eigenvector with $\\lambda=2$","$Av=(1,3,4)^T$, which is not a scalar multiple of $(0,1,1)^T$","So $v$ is not an eigenvector"],"ans":"u: yes (λ = 2); v: no","id":"T1Q3","label":"T1 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":1,"n":4,"topic":"eig","sub":"Repeated eigenvalue","text":"Find the Eigen values and corresponding Eigen vectors of the matrix $A=\\begin{bmatrix}2&1&0\\\\0&2&0\\\\0&0&2\\end{bmatrix}$.","steps":["Triangular $\\Rightarrow\\lambda=2,2,2$","$A-2I=\\begin{bmatrix}0&1&0\\\\0&0&0\\\\0&0&0\\end{bmatrix}\\Rightarrow x_2=0$; $x_1,x_3$ free","Eigenvectors: $X=x_1(1,0,0)^T+x_3(0,0,1)^T$ - only 2 independent ones for a triple root"],"ans":"$\\lambda=2$ (3 times); eigenvectors $(1,0,0)^T,(0,0,1)^T$","id":"T1Q4","label":"T1 Q4","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":1,"n":5,"topic":"eig","sub":"3x3, eigenvector of largest eigenvalue","text":"Determine the eigen values of the matrix $A=\\begin{bmatrix}8&-8&-2\\\\4&-3&-2\\\\3&-4&1\\end{bmatrix}$ and also obtain the Eigen vector corresponding to the largest eigen value of of $A$","pyq":"B1A","slide":"Unit I Eigen Example 2","id":"T1Q5","label":"T1 Q5","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":1,"n":6,"topic":"eig","sub":"3x3, eigenvector of smallest eigenvalue","text":"Determine the eigen values of the matrix $A=\\begin{bmatrix}4&2&-2\\\\-5&3&2\\\\-2&4&1\\end{bmatrix}$. and also obtain the Eigen vector corresponding to the smallest eigen value of of $A$","steps":["$S_1=8$, $S_2=\\begin{vmatrix}3&2\\\\4&1\\end{vmatrix}+\\begin{vmatrix}4&-2\\\\-2&1\\end{vmatrix}+\\begin{vmatrix}4&2\\\\-5&3\\end{vmatrix}=-5+0+22=17$","$|A|=4(3-8)-2(-5+4)-2(-20+6)=-20+2+28=10$","$\\lambda^3-8\\lambda^2+17\\lambda-10=0\\Rightarrow(\\lambda-1)(\\lambda-2)(\\lambda-5)=0$","Smallest $\\lambda=1$: rows $3x_1+2x_2-2x_3=0,\\;-5x_1+2x_2+2x_3=0$","Cramer: $\\frac{x_1}{4+4}=\\frac{-x_2}{6-10}=\\frac{x_3}{6+10}\\Rightarrow\\frac{x_1}{8}=\\frac{x_2}{4}=\\frac{x_3}{16}$","$X=(2,1,4)^T$; check $A(2,1,4)^T=(2,1,4)^T$ ✓"],"ans":"$\\lambda=1,2,5$; for $\\lambda=1$: $(2,1,4)^T$","id":"T1Q6","label":"T1 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":1,"topic":"diag","sub":"Symmetric 2x2","text":"Diagonalize the matrix $A=\\begin{bmatrix}2&3\\\\3&-6\\end{bmatrix}$.","steps":["$\\lambda^2+4\\lambda-21=0\\Rightarrow\\lambda=3,-7$ (distinct)","$\\lambda=3$: $-x_1+3x_2=0\\Rightarrow(3,1)^T$; $\\lambda=-7$: $9x_1+3x_2=0\\Rightarrow(1,-3)^T$","$P=\\begin{bmatrix}3&1\\\\1&-3\\end{bmatrix},\\;P^{-1}=\\frac{1}{10}\\begin{bmatrix}3&1\\\\1&-3\\end{bmatrix}$","$P^{-1}AP=\\text{diag}(3,-7)$. (Eigenvectors are orthogonal since A is symmetric.)"],"ans":"$D=\\text{diag}(3,-7)$","id":"T2Q1","label":"T2 Q1","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":2,"topic":"diag","sub":"Not diagonalizable","text":"Show that the matrix $A=\\begin{bmatrix}1&2\\\\0&1\\end{bmatrix}$ is not diagonalizable","steps":["Triangular $\\Rightarrow\\lambda=1,1$","$A-I=\\begin{bmatrix}0&2\\\\0&0\\end{bmatrix}\\Rightarrow x_2=0$: only $X=(1,0)^T$ (one independent eigenvector)","A 2x2 matrix needs 2 independent eigenvectors $\\Rightarrow$ not diagonalizable"],"ans":"Only one independent eigenvector","id":"T2Q2","label":"T2 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":3,"topic":"diag","sub":"2x2 with P","text":"Show that the matrix A is diagonalizable. $A=\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$ Then find matrix $P$ such that $P^{-1}AP$ is diagonal","slide":"Unit I Diagonalization Example 1 (worked in the Important Topics tab)","steps":["$\\lambda=3,-1$ (distinct)","$v_1=(1,1)^T,\\;v_2=(-1,1)^T$","$P=\\begin{bmatrix}1&-1\\\\1&1\\end{bmatrix}$, $P^{-1}AP=\\text{diag}(3,-1)$"],"ans":"$D=\\text{diag}(3,-1)$","id":"T2Q3","label":"T2 Q3","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":2,"n":4,"topic":"diag","sub":"3x3 test","text":"Determine if the following matrix is diagonalizable. $A=\\begin{bmatrix}4&2&-2\\\\-5&3&2\\\\-2&4&1\\end{bmatrix}$","steps":["Same matrix as Tutorial 1 Q6: $\\lambda=1,2,5$ (distinct)","Distinct eigenvalues $\\Rightarrow$ 3 independent eigenvectors $\\Rightarrow$ diagonalizable","$P=\\begin{bmatrix}2&1&0\\\\1&1&1\\\\4&2&1\\end{bmatrix}$ (columns for $\\lambda=1,2,5$), $D=\\text{diag}(1,2,5)$"],"ans":"Yes, diagonalizable","id":"T2Q4","label":"T2 Q4","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":5,"topic":"diag","sub":"Not diagonalizable (3x3)","text":"Show that the matrix A is not diagonalizable $A=\\begin{bmatrix}2&1&0\\\\0&2&0\\\\0&0&2\\end{bmatrix}$.","steps":["$\\lambda=2$ (three times)","From Tutorial 1 Q4 only 2 independent eigenvectors $(1,0,0)^T,(0,0,1)^T$","Need 3 for a 3x3 $\\Rightarrow$ not diagonalizable"],"ans":"Only 2 independent eigenvectors","id":"T2Q5","label":"T2 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":6,"topic":"diag","sub":"2x2 with P","text":"Show that the matrix A is diagonalizable. $A=\\begin{bmatrix}14&-10\\\\5&-1\\end{bmatrix}$ Then find matrix $P$ such that $P^{-1}AP$ is diagonal","slide":"Unit I Eigen Example 1 (eigenvalues 4, 9)","steps":["$\\lambda=4,9$ (distinct) $\\Rightarrow$ diagonalizable","$X_1=(1,1)^T,\\;X_2=(2,1)^T$","$P=\\begin{bmatrix}1&2\\\\1&1\\end{bmatrix},\\;|P|=-1,\\;P^{-1}=\\begin{bmatrix}-1&2\\\\1&-1\\end{bmatrix}$","$P^{-1}AP=\\text{diag}(4,9)$"],"ans":"$P=\\begin{bmatrix}1&2\\\\1&1\\end{bmatrix},\\;D=\\text{diag}(4,9)$","id":"T2Q6","label":"T2 Q6","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":3,"n":1,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $2x_1+3x_2+x_3=9,\\;x_1+2x_2+3x_3=6,\\;3x_1+x_2+2x_3=8$","slide":"Matrix = Unit I LU Example 1","steps":["$L=\\begin{bmatrix}1&0&0\\\\\\frac12&1&0\\\\\\frac32&-7&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&3&1\\\\0&\\frac12&\\frac52\\\\0&0&18\\end{bmatrix}$","$LZ=B$: $z_1=9,\\;z_2=6-\\frac92=\\frac32,\\;z_3=8-\\frac{27}{2}+7\\cdot\\frac32=5$","$UX=Z$: $18x_3=5\\Rightarrow x_3=\\frac5{18}$","$\\frac12x_2+\\frac52\\cdot\\frac5{18}=\\frac32\\Rightarrow x_2=\\frac{29}{18}$","$2x_1+3\\cdot\\frac{29}{18}+\\frac5{18}=9\\Rightarrow x_1=\\frac{35}{18}$"],"ans":"$x_1=\\frac{35}{18},\\;x_2=\\frac{29}{18},\\;x_3=\\frac{5}{18}$","id":"T3Q1","label":"T3 Q1","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":3,"n":2,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $10x_1+x_2+x_3=12,\\;2x_1+10x_2+x_3=13,\\;2x_1+2x_2+10x_3=14$","steps":["$u_{11}=10,u_{12}=1,u_{13}=1$; $l_{21}=\\frac15,\\;l_{31}=\\frac15$","$u_{22}=10-\\frac15=\\frac{49}{5},\\;u_{23}=1-\\frac15=\\frac45$","$l_{32}=\\dfrac{2-\\frac15}{49/5}=\\frac{9}{49},\\;u_{33}=10-\\frac15-\\frac{9}{49}\\cdot\\frac45=\\frac{473}{49}$","$LZ=B$: $z_1=12,\\;z_2=13-\\frac{12}{5}=\\frac{53}{5},\\;z_3=\\frac{473}{49}$","$UX=Z$: $x_3=1,\\;x_2=1,\\;x_1=1$"],"ans":"$x_1=x_2=x_3=1$","id":"T3Q2","label":"T3 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":3,"n":3,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $2x_1+2x_2+3x_3=4,\\;4x_1-2x_2+x_3=9,\\;x_1+5x_2+4x_3=3$","pyq":"B1B","slide":"Unit I LU Example 2","steps":["$L=\\begin{bmatrix}1&0&0\\\\2&1&0\\\\\\frac12&-\\frac23&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&2&3\\\\0&-6&-5\\\\0&0&-\\frac56\\end{bmatrix}$ (see PYQ B1B)","$LZ=B$: $z_1=4,\\;z_2=1,\\;z_3=\\frac53$","$UX=Z$: $x_3=-2,\\;x_2=\\frac32,\\;x_1=\\frac72$"],"ans":"$x_1=\\frac72,\\;x_2=\\frac32,\\;x_3=-2$","id":"T3Q3","label":"T3 Q3","rel":"similar","pri":"P2","why":"Same matrix/result as a PYQ with a small change."},{"t":3,"n":4,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $3x+2y+7z=4,\\;2x+3y+z=5,\\;3x+4y+z=7$","pyq":"A1B","note":"Coefficient matrix is the PYQ TA-I Set A Q1B matrix; here the system is also solved.","steps":["$L=\\begin{bmatrix}1&0&0\\\\\\frac23&1&0\\\\1&\\frac65&1\\end{bmatrix},\\;U=\\begin{bmatrix}3&2&7\\\\0&\\frac53&-\\frac{11}{3}\\\\0&0&-\\frac85\\end{bmatrix}$","$LZ=B$: $z_1=4,\\;z_2=5-\\frac83=\\frac73,\\;z_3=7-4-\\frac65\\cdot\\frac73=\\frac15$","$-\\frac85z=\\frac15\\Rightarrow z=-\\frac18$","$\\frac53y-\\frac{11}{3}\\left(-\\frac18\\right)=\\frac73\\Rightarrow y=\\frac98$","$3x+2\\cdot\\frac98+7\\left(-\\frac18\\right)=4\\Rightarrow x=\\frac78$"],"ans":"$x=\\frac78,\\;y=\\frac98,\\;z=-\\frac18$","id":"T3Q4","label":"T3 Q4","rel":"similar","pri":"P2","why":"Same matrix/result as a PYQ with a small change."},{"t":3,"n":5,"topic":"chol","sub":"Solve by Cholesky","text":"Solve the system of equations by Cholesky method $4x_1+6+8x_3=0,\\;6x_1+34x_2+52x_3=-160,\\;8x_1+52x_2+129x_3=-452.$","note":"The PDF prints the first equation as '$4x_1+6+8x_3=0$'. A symmetric matrix (needed for Cholesky) implies $4x_1+6x_2+8x_3=0$; the solution below uses that reading.","steps":["$A=\\begin{bmatrix}4&6&8\\\\6&34&52\\\\8&52&129\\end{bmatrix}$; $l_{11}=2,\\;l_{21}=3,\\;l_{31}=4$","$l_{22}=\\sqrt{34-9}=5,\\;l_{32}=\\frac{52-12}{5}=8,\\;l_{33}=\\sqrt{129-16-64}=7$","$LZ=B$: $z_1=0,\\;z_2=-32,\\;z_3=\\frac{-452+256}{7}=-28$","$L^TX=Z$: $7x_3=-28\\Rightarrow x_3=-4$; $5x_2+8(-4)=-32\\Rightarrow x_2=0$; $2x_1+0+4(-4)=0\\Rightarrow x_1=8$"],"ans":"$x_1=8,\\;x_2=0,\\;x_3=-4$ (with the $x_2$ reading)","id":"T3Q5","label":"T3 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":3,"n":6,"topic":"chol","sub":"Solve by Cholesky","text":"Solve the system of equations by Cholesky method $9x_1+6x_2+12x_3=17.4,\\;6x_1+13x_2+11x_3=23.6,\\;12x_1+11x_2+26x_3=30.8$","pyq":"A2B","slide":"Unit I Cholesky Example 2","id":"T3Q6","label":"T3 Q6","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":3,"n":7,"topic":"chol","sub":"Solve by Cholesky","text":"Solve the system of equations by Cholesky method $4x_1+2x_2+14x_3=14,\\;2x_1+17x_2-5x_3=-101,\\;14x_1-5x_2+83x_3=155$","pyq":"B2B","id":"T3Q7","label":"T3 Q7","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":3,"n":8,"topic":"chol","sub":"Decompose only","text":"Decompose the matrix A using Cholesky's method $A=\\begin{bmatrix}2&-1&0\\\\-1&3&1\\\\0&1&2\\end{bmatrix}$","slide":"Unit I Cholesky Example 1 (worked in the Important Topics tab)","steps":["$l_{11}=\\sqrt2,\\;l_{21}=-\\frac1{\\sqrt2},\\;l_{31}=0$","$l_{22}=\\sqrt{3-\\frac12}=\\sqrt{\\frac52},\\;l_{32}=\\frac{1}{\\sqrt{5/2}}=\\sqrt{\\frac25}$","$l_{33}=\\sqrt{2-\\frac25}=\\sqrt{\\frac85}$"],"ans":"$L=\\begin{bmatrix}\\sqrt2&0&0\\\\-\\frac1{\\sqrt2}&\\sqrt{\\frac52}&0\\\\0&\\sqrt{\\frac25}&\\sqrt{\\frac85}\\end{bmatrix}$","id":"T3Q8","label":"T3 Q8","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":1,"topic":"form","sub":"Two constants, log x","text":"Form the differential equations by eliminating the arbitrary constants from $y=A\\sin(\\log x)+B\\cos(\\log x)$. where A and B are arbitrary constants.","pyq":"A4A","slide":"Unit II Formation Example 02","id":"T4Q1","label":"T4 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":4,"n":2,"topic":"form","sub":"Two constants","text":"Obtain the differential equations whose general solution is $xy=ae^x+be^{-x}+x^2$ where $a$ and $b$ are arbitrary constants.","slide":"Unit II Formation Exercise 4","steps":["Differentiate: $xy_1+y=ae^x-be^{-x}+2x$","Again: $xy_2+2y_1=ae^x+be^{-x}+2=(xy-x^2)+2$","$x\\dfrac{d^2y}{dx^2}+2\\dfrac{dy}{dx}-xy+x^2-2=0$"],"ans":"$xy''+2y'-xy+x^2-2=0$","id":"T4Q2","label":"T4 Q2","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":3,"topic":"form","sub":"Two constants","text":"Obtain the differential equations whose general solution is $y=Ae^{-9t}\\cos(3t+B)$ where A and B are arbitrary constants.","slide":"Unit II Formation Example 03","steps":["$ye^{9t}=A\\cos(3t+B)$","Differentiate: $e^{9t}(y_1+9y)=-3A\\sin(3t+B)$","Again: $e^{9t}(y_2+18y_1+81y)=-9A\\cos(3t+B)=-9ye^{9t}$","$\\dfrac{d^2y}{dt^2}+18\\dfrac{dy}{dt}+90y=0$"],"ans":"$y''+18y'+90y=0$","id":"T4Q3","label":"T4 Q3","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":4,"topic":"form","sub":"Family of curves","text":"Form the differential equation of all circles to
