:root{
  --bg:#FBF8EF; --surface:#FFFEF8; --surface2:#F5F0E2; --border:#E0D6BF; --text:#20232A; --muted:#5F5B4E;
  --primary:#1B2F6B; --primary-2:#2F55B5; --accent:#1F6FB2; --accent-soft:#E3EDF8;
  --p1:#A3201A; --p1bg:#FDDCD8; --p2:#7A5200; --p2bg:#FFF0A6; --p3:#4A4F57; --p3bg:#ECEAE3;
  --u1:#2563EB; --u2:#0E8F8A; --pd:#7C3AED; --ic:#C2410C; --mi:#C0267A;
  --ok:#11683F; --okbg:#D9F3E1; --bad:#A3201A; --badbg:#FDDCD8;
  --rule:#D3E2F1; --margin:#EDA5A5; --hl:#FFF08A;
  --shadow:1px 2px 0 rgba(60,50,20,.07),0 1px 4px rgba(60,50,20,.06);
  --radius:6px; --side:262px;
  --hand:Kalam,"Comic Neue","Segoe Print","Bradley Hand",cursive;
  --read:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191B1F; --surface:#22252A; --surface2:#2A2D33; --border:#3B3F46; --text:#ECE8DE; --muted:#A9A498;
    --primary:#AFC6F6; --primary-2:#8FB0EE; --accent:#7FB4EA; --accent-soft:#1E2C3D;
    --p1:#FFA69E; --p1bg:#4A1E1B; --p2:#FFD86B; --p2bg:#433612; --p3:#C9CCD2; --p3bg:#30343B;
    --u1:#7AA7FF; --u2:#3CC7BF; --pd:#B79CFF; --ic:#FF9C66; --mi:#F38BC4;
    --ok:#7FDDAA; --okbg:#143826; --bad:#FFA69E; --badbg:#4A1E1B;
    --rule:rgba(127,180,234,.09); --margin:rgba(237,120,120,.35); --hl:rgba(255,226,90,.22);
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
    --bg:#191B1F; --surface:#22252A; --surface2:#2A2D33; --border:#3B3F46; --text:#ECE8DE; --muted:#A9A498;
    --primary:#AFC6F6; --primary-2:#8FB0EE; --accent:#7FB4EA; --accent-soft:#1E2C3D;
    --p1:#FFA69E; --p1bg:#4A1E1B; --p2:#FFD86B; --p2bg:#433612; --p3:#C9CCD2; --p3bg:#30343B;
    --u1:#7AA7FF; --u2:#3CC7BF; --pd:#B79CFF; --ic:#FF9C66; --mi:#F38BC4;
    --ok:#7FDDAA; --okbg:#143826; --bad:#FFA69E; --badbg:#4A1E1B;
    --rule:rgba(127,180,234,.09); --margin:rgba(237,120,120,.35); --hl:rgba(255,226,90,.22);
    --shadow:0 1px 3px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;color:var(--primary);line-height:1.25;margin:0}
h2{font-size:1.55rem;margin-bottom:.35rem}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary);white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--surface);display:grid;place-items:center;font-family:"Source Serif 4",serif;font-size:18px}
:root[data-theme="dark"] .brand .logo{color:#0C131D}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;margin-top:-3px}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);padding:0 12px 0 36px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.results{position:absolute;top:46px;left:0;right:0;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:none;padding:6px}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface2)}
.results .rt{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.results .rs{font-size:.82rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--accent)}
#menuBtn{display:none}
.sidebar{position:fixed;top:60px;left:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:14px 10px;z-index:30}
.sidebar a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;font-size:.93rem}
.sidebar a:hover{background:var(--surface2)}
.sidebar a.active{background:var(--accent-soft);color:var(--accent)}
.sidebar a .k{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.sidebar a.active .k{background:var(--accent);color:var(--surface)}
.side-prog{margin:16px 8px 6px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);font-size:.82rem}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary-2));border-radius:99px;transition:width .3s}
main{margin-left:var(--side);padding:24px 28px 80px;max-width:1240px;overflow-x:clip}
.tab[hidden]{display:none}
.scrim{display:none}
@media (max-width:1023px){
  #menuBtn{display:grid}
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
  main{margin-left:0;padding:18px 16px 80px}
  .brand small{display:none}
}
@media (max-width:560px){ .brand span.t{display:none} h2{font-size:1.3rem} }
/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.sec{margin-top:26px}
.sec>h3{margin-bottom:10px}

/* ================= NOTEBOOK THEME ================= */
body{font:16.5px/1.65 var(--read);font-variant-numeric:lining-nums;background-color:var(--bg);
  background-image:linear-gradient(90deg,transparent calc(var(--side) + 26px),var(--margin) calc(var(--side) + 26px),var(--margin) calc(var(--side) + 28px),transparent calc(var(--side) + 28px)),
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-attachment:fixed}
h1,h2,h3{font-family:var(--hand);font-weight:700;letter-spacing:.01em}
h2{font-size:1.9rem;display:inline-block;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 6px;margin-left:-6px}
h3{font-size:1.32rem}
main{padding:26px 34px 90px 52px}
.topbar{background:var(--surface);border-bottom:2px solid var(--border);box-shadow:0 2px 0 var(--rule)}
.brand{font-family:var(--hand);font-size:1.2rem}
.brand .logo{border-radius:5px 9px 9px 5px;background:var(--primary);box-shadow:inset 4px 0 0 rgba(255,255,255,.25)}

.subj-sel{height:40px;border:2px solid var(--primary);border-radius:8px;background:var(--surface);color:var(--primary);font-family:var(--hand);font-weight:700;font-size:1.02rem;padding:0 8px;cursor:pointer;max-width:170px;flex:none}
.search input{border-radius:8px;border-width:1.5px}

#fontBtn{font-family:var(--hand);font-weight:700;font-size:1.05rem;width:auto;padding:0 10px}
#fontBtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* sidebar = notebook with spiral + subject index tabs */
.sidebar{background-color:var(--surface2);border-right:2px solid var(--border);padding:12px 18px 18px 10px;
  background-image:radial-gradient(circle at calc(100% - 7px) 14px,var(--bg) 3.5px,var(--border) 4.5px,transparent 5.5px);background-size:100% 26px;background-attachment:local}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) details.subj.maths{--sc:#8DB0F5} :root:not([data-theme="light"]) details.subj.pai{--sc:#D2A4F2} :root:not([data-theme="light"]) details.subj.dsa{--sc:#6FD6CB} }
.sidebar a{border-radius:5px;font-size:.95rem;padding:8px 10px}
.sidebar a.active{background:var(--accent-soft);color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--sc,var(--accent))}

.side-prog{border-radius:6px;background:var(--surface);margin:6px 2px 4px}

.tname{font-size:1.06rem}

.badge{border-radius:4px;font-size:.74rem}

.btn.pri{background:var(--primary);border-color:var(--primary)}
.note{border-left-width:4px;border-radius:4px}

.hero.pai{--hc:#7A2E9E} .hero.dsa{--hc:#0C7A72}
.hero h1{color:var(--primary);font-size:clamp(1.7rem,3.6vw,2.5rem)}
.hero p,.hero p[style]{color:var(--text)!important}
.hero [style*="color:#"]{color:var(--hc,var(--muted))!important}

<script>
const D = {"DSA":{"UNITS":[{"id":"D1","name":"Unit I - Trees","short":"Trees (Unit I)"},{"id":"D2","name":"Unit II - Graphs","short":"Graphs (Unit II)"},{"id":"D3","name":"Unit III - Hashing","short":"Hashing (Unit III)"}],"SRC":{"P23D":"PYQ Dec 2023","P23M":"PYQ May 2023","P23S":"PYQ Sep 2023","SL":"Slides","NT":"Notes"},"Q":[{"id":"D1-01","unit":"D1","src":["P23D","P23M"],"dia":true,"type":"Explain","ease":2,"q":"List out the types (classifications) of threaded binary tree. Explain each with the help of an example.","ans":"<p>In a normal binary tree about half the link fields are NULL. A <b>threaded binary tree (TBT)<\/b> replaces these NULL links by <b>threads<\/b> - pointers to the <b>inorder predecessor or successor<\/b> - so inorder traversal can be done without a stack or recursion.<\/p><ol><li><b>One-way (single) threaded tree:<\/b> threads appear in only one link field.<ul><li><b>Right threaded:<\/b> the NULL right link points to the node's <b>inorder successor<\/b> (most common).<\/li><li><b>Left threaded:<\/b> the NULL left link points to the <b>inorder predecessor<\/b>.<\/li><\/ul><\/li><li><b>Two-way (double) threaded tree:<\/b> both NULL left and right links are used - left thread &rarr; inorder predecessor, right thread &rarr; inorder successor.<\/li><li><b>Two-way threaded tree with header node:<\/b> the leftmost node's left thread and the rightmost node's right thread point to a <b>header (dummy) node<\/b> instead of being NULL, so no dangling threads remain.<\/li><\/ol><p><b>Example:<\/b> tree A(B(D, E), C), inorder <b>D B E A C<\/b>. In a right-threaded tree, D &rarr; B, E &rarr; A (threads to successors). In a two-way tree, also E's left thread &rarr; B, C's left thread &rarr; A, and D's left / C's right point to the header.<\/p><p>A flag bit (lthread / rthread) in each node tells whether a link is a child or a thread.<\/p>","diag":"Tree: A(B(D, E), C)      Inorder: D B E A C\n\nRIGHT-THREADED (one-way)        TWO-WAY THREADED\n        A                               A\n      /   \\                           /   \\\n     B     C                          B     C\n    / \\                              / \\\n   D   E                            D   E\n threads (right link -> successor): threads:\n   D -> B                           D: left -> HEAD, right -> B\n   E -> A                           E: left -> B,    right -> A\n   C -> NULL (or HEAD)              C: left -> A,    right -> HEAD\nDraw threads as dotted arrows; flag bit = 1 marks a thread."},{"id":"D1-02","unit":"D1","src":["P23D","P23S"],"dia":false,"type":"Explain","ease":1,"q":"What is the use (purpose) of a Threaded Binary Tree (TBT)? Give the node structure required for a TBT. List the advantages and disadvantages of TBT.","ans":"<p><b>Purpose:<\/b> In a binary tree with n nodes there are <b>n+1 NULL links<\/b>. TBT uses them as threads to the inorder predecessor/successor, so we can do <b>inorder traversal without recursion or a stack<\/b> and move to the next node quickly.<\/p><p><b>Node structure (C++):<\/b><\/p><pre>struct TBTNode {\n    int data;\n    TBTNode *left, *right;\n    bool lthread;   // 1 = left is a thread (to predecessor)\n    bool rthread;   // 1 = right is a thread (to successor)\n};<\/pre><table><tr><th>Advantages<\/th><th>Disadvantages<\/th><\/tr><tr><td>Inorder traversal is faster - no stack/recursion needed<\/td><td>Extra bit (lthread/rthread) needed in every node - more memory<\/td><\/tr><tr><td>NULL links are not wasted<\/td><td>Insertion and deletion are more complex (threads must be updated)<\/td><\/tr><tr><td>Easy to find inorder successor and predecessor<\/td><td>Program logic is harder to understand and debug<\/td><\/tr><tr><td>Forward and backward inorder traversal possible<\/td><td>Both threads and normal links have to be maintained<\/td><\/tr><\/table>","diag":"+-----------+-----------+------+-----------+------------+\n| lthread   | left link | data | right link| rthread    |\n| (0 = child|           |      |           | (0 = child |\n|  1 = thread)          |      |           |  1 = thread)|\n+-----------+-----------+------+-----------+------------+"},{"id":"D1-03","unit":"D1","src":["P23D","P23M"],"dia":true,"type":"Numerical","ease":1,"q":"From the given data build a Binary Search Tree (BST) and write the output of in-order, pre-order and post-order traversal: 45, 15, 79, 90, 10, 55, 12, 20, 50.","ans":"<p><b>Rule:<\/b> smaller key goes to the left, larger key to the right.<\/p><ol><li>45 &rarr; root.<\/li><li>15 &lt; 45 &rarr; left of 45. 79 &gt; 45 &rarr; right of 45.<\/li><li>90 &gt; 45, &gt; 79 &rarr; right of 79.<\/li><li>10 &lt; 45, &lt; 15 &rarr; left of 15.<\/li><li>55 &gt; 45, &lt; 79 &rarr; left of 79.<\/li><li>12 &lt; 45, &lt; 15, &gt; 10 &rarr; right of 10.<\/li><li>20 &lt; 45, &gt; 15 &rarr; right of 15.<\/li><li>50 &gt; 45, &lt; 79, &lt; 55 &rarr; left of 55.<\/li><\/ol><p><b>Inorder (LNR):<\/b> 10, 12, 15, 20, 45, 50, 55, 79, 90 (sorted - this is a check)<br><b>Preorder (NLR):<\/b> 45, 15, 10, 12, 20, 79, 55, 50, 90<br><b>Postorder (LRN):<\/b> 12, 10, 20, 15, 50, 55, 90, 79, 45<\/p>","diag":"                 45\n               /    \\\n             15      79\n            /  \\    /  \\\n          10   20  55   90\n            \\      /\n            12    50"},{"id":"D1-04","unit":"D1","src":["P23D","P23M"],"dia":false,"type":"Explain","ease":1,"q":"What is a Binary Search Tree (BST)? Explain the procedure to delete a node from an existing BST (consider all possible cases).","ans":"<p>A <b>BST<\/b> is a binary tree in which, for every node, all keys in the <b>left subtree are smaller<\/b> and all keys in the <b>right subtree are larger<\/b> than the node's key. Inorder traversal gives sorted order.<\/p><p><b>Deletion procedure:<\/b> first search the key (go left if smaller, right if larger). Then:<\/p><ol><li><b>Case 1 - Leaf node (0 children):<\/b> just remove it and set the parent's link to NULL. e.g. delete 12 in the tree 45,15,10,12,... &rarr; 10's right = NULL.<\/li><li><b>Case 2 - One child:<\/b> connect the parent directly to the node's only child, then free the node. e.g. delete 10 (child 12) &rarr; 15's left = 12.<\/li><li><b>Case 3 - Two children:<\/b> find the <b>inorder successor<\/b> (smallest node in the right subtree) - or the inorder predecessor (largest in the left subtree). Copy its key into the node, then delete the successor (which has at most one child, so it falls under case 1 or 2). e.g. delete 45 &rarr; successor 50 replaces 45, and 50 is removed from under 55.<\/li><\/ol><pre>Node* del(Node* r, int k) {\n  if (!r) return r;\n  if (k &lt; r-&gt;data) r-&gt;left = del(r-&gt;left, k);\n  else if (k &gt; r-&gt;data) r-&gt;right = del(r-&gt;right, k);\n  else {\n    if (!r-&gt;left)  { Node* t = r-&gt;right; delete r; return t; }\n    if (!r-&gt;right) { Node* t = r-&gt;left;  delete r; return t; }\n    Node* s = r-&gt;right; while (s-&gt;left) s = s-&gt;left;   // successor\n    r-&gt;data = s-&gt;data;\n    r-&gt;right = del(r-&gt;right, s-&gt;data);\n  }\n  return r;\n}<\/pre><p>Time: O(h) - O(log n) for a balanced tree, O(n) for a skewed tree.<\/p>"},{"id":"D1-05","unit":"D1","src":["P23M","P23S"],"dia":false,"type":"Explain","ease":1,"q":"What is a Binary Tree? List out and explain the properties of a binary tree.","ans":"<p>A <b>binary tree<\/b> is a tree in which every node has <b>at most two children<\/b>, called the left child and the right child. It is either empty or has a root with a left subtree and a right subtree, which are also binary trees.<\/p><p><b>Properties<\/b> (root at level 0, height h = levels counted from 0):<\/p><ol><li>Maximum number of nodes at level <i>l<\/i> = <b>2<sup>l<\/sup><\/b>.<\/li><li>Maximum number of nodes in a binary tree of height h = <b>2<sup>h+1<\/sup> &minus; 1<\/b>.<\/li><li>Minimum number of nodes in a binary tree of height h = <b>h + 1<\/b> (skewed tree).<\/li><li>For n nodes, minimum possible height = <b>&lceil;log<sub>2<\/sub>(n+1)&rceil; &minus; 1<\/b>; maximum height = n &minus; 1.<\/li><li>In any non-empty binary tree, <b>leaf nodes n<sub>0<\/sub> = n<sub>2<\/sub> + 1<\/b>, where n<sub>2<\/sub> = nodes with two children.<\/li><li>A binary tree with n nodes has exactly <b>n &minus; 1 edges<\/b> and <b>n + 1 NULL links<\/b>.<\/li><li>In array representation (root at index 0): children of i are at <b>2i+1 and 2i+2<\/b>, parent at <b>&lfloor;(i&minus;1)/2&rfloor;<\/b>.<\/li><\/ol><p>(If your teacher counts the root at level 1, these become 2<sup>l&minus;1<\/sup> and 2<sup>h<\/sup> &minus; 1.)<\/p>"},{"id":"D1-06","unit":"D1","src":["P23S"],"dia":true,"type":"Numerical","ease":2,"q":"Construct a binary tree from the given traversals. Preorder: G B Q A C K F P D E R H; Inorder: Q B K C F A G P E D H R.","ans":"<p><b>Rule:<\/b> the first node of the preorder is the root; find it in the inorder - nodes to its left form the left subtree, nodes to its right form the right subtree. Repeat for each subtree.<\/p><ol><li>Preorder starts with <b>G<\/b> &rarr; root. Inorder: [Q B K C F A] <b>G<\/b> [P E D H R].<\/li><li>Left subtree: preorder B Q A C K F &rarr; root <b>B<\/b>; inorder [Q] B [K C F A] &rarr; left child Q.<\/li><li>Right of B: preorder A C K F &rarr; root <b>A<\/b>; inorder [K C F] A &rarr; A has only a left subtree.<\/li><li>Under A: preorder C K F &rarr; root <b>C<\/b>; inorder [K] C [F] &rarr; left K, right F.<\/li><li>Right subtree of G: preorder P D E R H &rarr; root <b>P<\/b>; inorder P [E D H R] &rarr; P has only a right subtree.<\/li><li>Under P: preorder D E R H &rarr; root <b>D<\/b>; inorder [E] D [H R] &rarr; left E; right part: preorder R H, inorder H R &rarr; root <b>R<\/b> with left child H.<\/li><\/ol><p><b>Check - postorder:<\/b> Q K F C A B E H R D P G.<\/p>","diag":"                  G\n               /     \\\n              B       P\n             / \\       \\\n            Q   A       D\n               /       / \\\n              C       E   R\n             / \\         /\n            K   F       H"},{"id":"D1-07","unit":"D1","src":["P23S"],"dia":false,"type":"Code","ease":2,"q":"Write a pseudo code to implement BST for: i) display mirror image ii) display minimum value iii) display leaf nodes.","ans":"<pre>struct Node { int data; Node *left, *right; };\n\n// i) Mirror image: swap left and right of every node\nvoid mirror(Node* r) {\n    if (r == NULL) return;\n    swap(r-&gt;left, r-&gt;right);      // swap children\n    mirror(r-&gt;left);\n    mirror(r-&gt;right);\n}   // then print inorder -&gt; keys appear in descending order\n\n// ii) Minimum value: leftmost node\nint findMin(Node* r) {\n    if (r == NULL) return -1;     // empty tree\n    while (r-&gt;left != NULL)\n        r = r-&gt;left;\n    return r-&gt;data;\n}\n\n// iii) Leaf nodes: nodes with no children\nvoid printLeaves(Node* r) {\n    if (r == NULL) return;\n    if (r-&gt;left == NULL &amp;&amp; r-&gt;right == NULL)\n        cout &lt;&lt; r-&gt;data &lt;&lt; \" \";\n    printLeaves(r-&gt;left);\n    printLeaves(r-&gt;right);\n}<\/pre><p>For the BST 45, 15, 79, 90, 10, 55, 12, 20, 50: minimum = <b>10<\/b>, leaf nodes = <b>12, 20, 50, 90<\/b>, mirror inorder = 90 79 55 50 45 20 15 12 10. Each function visits a node at most once: mirror and leaves O(n), minimum O(h).<\/p>"},{"id":"D1-08","unit":"D1","src":["SL","NT"],"dia":false,"type":"Explain","ease":1,"q":"Explain the basic terminology of trees.","ans":"<p>A <b>tree<\/b> is a non-linear, hierarchical data structure of nodes connected by edges, with one root and no cycles.<\/p><ol><li><b>Root:<\/b> topmost node, no parent (level 0).<\/li><li><b>Parent / child / siblings:<\/b> a node directly above is the parent; nodes directly below are children; children of the same parent are siblings.<\/li><li><b>Leaf (terminal) node:<\/b> node with no children. <b>Internal node:<\/b> has at least one child.<\/li><li><b>Degree of a node:<\/b> number of its children; <b>degree of a tree:<\/b> maximum degree of any node.<\/li><li><b>Level:<\/b> position from the root (root = 0). <b>Depth<\/b> of a node: edges from the root to it.<\/li><li><b>Height of a node:<\/b> edges on the longest path down to a leaf; <b>height of the tree<\/b> = height of the root.<\/li><li><b>Path:<\/b> sequence of nodes joined by edges; <b>path length<\/b> - number of nodes (as per notes) or edges.<\/li><li><b>Subtree:<\/b> a node with all its descendants. <b>Ancestor / descendant:<\/b> nodes above / below a node on its path.<\/li><\/ol>"},{"id":"D1-09","unit":"D1","src":["SL","NT"],"dia":false,"type":"Compare","ease":1,"q":"Explain sequential (array) and linked representation of a binary tree.","ans":"<table><tr><th>Sr.<\/th><th>Sequential (array) representation<\/th><th>Linked representation<\/th><\/tr><tr><td>1<\/td><td>Nodes stored in a 1-D array in level order<\/td><td>Each node has data + left pointer + right pointer<\/td><\/tr><tr><td>2<\/td><td>Root at index 0; children of i at 2i+1, 2i+2; parent at (i&minus;1)/2<\/td><td>Children reached through pointers<\/td><\/tr><tr><td>3<\/td><td>Wastes space for incomplete/skewed trees (2<sup>h+1<\/sup>&minus;1 slots needed)<\/td><td>Uses memory only for existing nodes<\/td><\/tr><tr><td>4<\/td><td>Size is fixed in advance<\/td><td>Grows and shrinks dynamically<\/td><\/tr><tr><td>5<\/td><td>Insertion/deletion needs shifting<\/td><td>Insertion/deletion easy by changing links<\/td><\/tr><tr><td>6<\/td><td>Best for complete trees (e.g. heaps)<\/td><td>Best for general binary trees<\/td><\/tr><\/table><p><b>Example:<\/b> tree A(B(D,E),C) &rarr; array: [A, B, C, D, E]. Linked node: <code>struct Node { char data; Node *left, *right; };<\/code><\/p>"},{"id":"D1-10","unit":"D1","src":["SL","NT"],"dia":false,"type":"Explain","ease":1,"q":"Explain binary tree traversals (inorder, preorder, postorder and level order) with algorithm and example.","ans":"<p><b>Traversal<\/b> = visiting every node exactly once in a fixed order. Time O(n).<\/p><ol><li><b>Inorder (LNR):<\/b> left subtree &rarr; node &rarr; right subtree. For a BST it gives sorted order.<\/li><li><b>Preorder (NLR):<\/b> node &rarr; left &rarr; right. Used to copy a tree / get prefix expression.<\/li><li><b>Postorder (LRN):<\/b> left &rarr; right &rarr; node. Used to delete a tree / get postfix expression.<\/li><li><b>Level order (BFS):<\/b> level by level from left to right using a <b>queue<\/b>.<\/li><\/ol><pre>void inorder(Node* r)  { if (r) { inorder(r-&gt;left); visit(r); inorder(r-&gt;right); } }\nvoid preorder(Node* r) { if (r) { visit(r); preorder(r-&gt;left); preorder(r-&gt;right); } }\nvoid postorder(Node* r){ if (r) { postorder(r-&gt;left); postorder(r-&gt;right); visit(r); } }\nvoid levelorder(Node* r) {\n  queue&lt;Node*&gt; q; if (r) q.push(r);\n  while (!q.empty()) { Node* t = q.front(); q.pop(); visit(t);\n    if (t-&gt;left) q.push(t-&gt;left); if (t-&gt;right) q.push(t-&gt;right); }\n}<\/pre><p><b>Example<\/b> tree A(B(D,E),C): Inorder D B E A C; Preorder A B D E C; Postorder D E B C A; Level order A B C D E.<\/p>"},{"id":"D1-11","unit":"D1","src":["SL","NT"],"dia":false,"type":"Numerical","ease":2,"q":"Construct an expression tree from a postfix expression and evaluate it (e.g. a b + c d - *).","ans":"<p>An <b>expression tree<\/b> is a binary tree whose <b>leaves are operands<\/b> and <b>internal nodes are operators<\/b>. Inorder gives infix, preorder gives prefix, postorder gives postfix.<\/p><p><b>Algorithm (from postfix):<\/b> scan left to right; if operand &rarr; make a node and <b>push<\/b>; if operator &rarr; pop two nodes (first popped = right child, second = left child), make the operator node and push it. At the end the stack holds the root.<\/p><p><b>Example:<\/b> <code>a b + c d - *<\/code><\/p><ol><li>Push a, push b.<\/li><li>'+' &rarr; pop b (right), a (left) &rarr; push (a+b).<\/li><li>Push c, push d.<\/li><li>'&minus;' &rarr; pop d, c &rarr; push (c&minus;d).<\/li><li>'*' &rarr; pop (c&minus;d) right, (a+b) left &rarr; root '*'.<\/li><\/ol><pre>        *\n      /   \\\n     +     -\n    / \\   / \\\n   a   b c   d<\/pre><p><b>Evaluation:<\/b> evaluate in postorder - value(node) = value(left) op value(right). With a=5, b=3, c=8, d=6: (5+3) &times; (8&minus;6) = 8 &times; 2 = <b>16<\/b>. (From prefix: scan right to left with the same stack idea.)<\/p>"},{"id":"D1-12","unit":"D1","src":["SL","NT"],"dia":true,"type":"Numerical","ease":2,"q":"Explain Huffman coding with an example (find the codes and the length of the encoded message).","ans":"<p><b>Huffman coding<\/b> is a <b>greedy, lossless compression<\/b> method that gives <b>shorter codes to frequent characters<\/b>. The codes are <b>prefix-free<\/b> (no code is a prefix of another), so decoding is unambiguous.<\/p><p><b>Steps:<\/b> (1) make a leaf for each character with its frequency; (2) repeatedly take the <b>two smallest<\/b> frequencies and join them under a new node whose weight is their sum; (3) repeat until one tree remains; (4) label left edges 0 and right edges 1; the path from the root gives each code.<\/p><p><b>Example:<\/b> A:5, B:9, C:12, D:13, E:16, F:45<\/p><ol><li>5 + 9 = 14; 12 + 13 = 25; 14 + 16 = 30; 25 + 30 = 55; 45 + 55 = 100 (root).<\/li><\/ol><table><tr><th>Char<\/th><th>Freq<\/th><th>Code<\/th><th>Bits<\/th><\/tr><tr><td>F<\/td><td>45<\/td><td>0<\/td><td>45<\/td><\/tr><tr><td>C<\/td><td>12<\/td><td>100<\/td><td>36<\/td><\/tr><tr><td>D<\/td><td>13<\/td><td>101<\/td><td>39<\/td><\/tr><tr><td>A<\/td><td>5<\/td><td>1100<\/td><td>20<\/td><\/tr><tr><td>B<\/td><td>9<\/td><td>1101<\/td><td>36<\/td><\/tr><tr><td>E<\/td><td>16<\/td><td>111<\/td><td>48<\/td><\/tr><\/table><p><b>Encoded length<\/b> = &Sigma; freq &times; code length = <b>224 bits<\/b> (fixed 3-bit codes would need 300). Average code length = 224/100 = 2.24 bits.<\/p>","diag":"                (100)\n               0/    \\1\n             F:45    (55)\n                   0/    \\1\n                 (25)     (30)\n                0/  \\1   0/   \\1\n              C:12 D:13 (14)  E:16\n                       0/  \\1\n                      A:5   B:9"},{"id":"D1-13","unit":"D1","src":["SL","NT"],"dia":true,"type":"Explain","ease":2,"q":"Explain how a general tree is converted into a binary tree, with example.","ans":"<p>A <b>general tree<\/b> can have any number of children, which is hard to store. We convert it using the <b>left-child, right-sibling<\/b> rule.<\/p><ol><li>The root of the general tree stays the root of the binary tree.<\/li><li>For each node, its <b>first (leftmost) child<\/b> becomes its <b>left child<\/b>.<\/li><li>Its <b>next sibling<\/b> becomes its <b>right child<\/b>.<\/li><li>Remove all other parent-child links.<\/li><li>The root of the binary tree never has a right child (the root has no sibling).<\/li><\/ol><p><b>Example:<\/b> A has children B, C, D; B has children E, F; D has child G. In the binary tree: A.left = B; B.left = E, B.right = C; E.right = F; C.right = D; D.left = G.<\/p>","diag":"General tree            Binary tree (left = first child, right = next sibling)\n        A                         A\n     /  |  \\                     /\n    B   C   D                   B\n   / \\      |                  / \\\n  E   F     G                 E   C\n                                \\   \\\n                                 F   D\n                                    /\n                                   G"},{"id":"D1-14","unit":"D1","src":["SL","NT"],"dia":false,"type":"Code","ease":3,"q":"Write the algorithm for inorder traversal of an inorder threaded binary tree (and explain insertion in a TBT).","ans":"<p><b>Inorder traversal without stack:<\/b> go to the leftmost node, print it, then follow the right link: if it is a <b>thread<\/b>, it directly gives the successor; if it is a <b>child<\/b>, go to the leftmost node of that right subtree.<\/p><pre>Node* leftmost(Node* p) {\n    while (p != NULL &amp;&amp; p-&gt;lthread == 0) p = p-&gt;left;\n    return p;\n}\nvoid inorderTBT(Node* root) {\n    Node* p = leftmost(root);\n    while (p != NULL) {\n        cout &lt;&lt; p-&gt;data &lt;&lt; \" \";\n        if (p-&gt;rthread == 1) p = p-&gt;right;      // thread -&gt; successor\n        else p = leftmost(p-&gt;right);            // go to right subtree\n    }\n}<\/pre><p><b>Insertion (new node q as right child of p, in a right-threaded tree):<\/b><\/p><ol><li>q-&gt;right = p-&gt;right; q-&gt;rthread = p-&gt;rthread (q takes p's old successor).<\/li><li>q-&gt;left = p; q-&gt;lthread = 1 (p is q's predecessor).<\/li><li>p-&gt;right = q; p-&gt;rthread = 0.<\/li><li>If q has a right subtree, the leftmost node of that subtree gets its left thread changed to q.<\/li><\/ol><p>Time O(n) for traversal, no extra stack space.<\/p>"},{"id":"D2-01","unit":"D2","src":["P23D"],"dia":false,"type":"Numerical","ease":2,"q":"Provide a step-by-step output demonstrating the execution of a non-recursive DFS algorithm on the given graph, starting from node 1. (Graph: 0->1, 0->2, 0->3, 1->3, 2->4, 3->5, 3->6, 4->5, 4->7, 5->2.)","ans":"<p><b>Non-recursive DFS<\/b> uses a <b>stack<\/b>: pop a vertex, visit it if unvisited, push its unvisited neighbours (in reverse order, so the smaller one is explored first).<\/p><table><tr><th>Step<\/th><th>Pop<\/th><th>Visited so far<\/th><th>Push<\/th><th>Stack (top at right)<\/th><\/tr><tr><td>0<\/td><td>-<\/td><td>-<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>1<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>2<\/td><td>3<\/td><td>1, 3<\/td><td>6, 5<\/td><td>6, 5<\/td><\/tr><tr><td>3<\/td><td>5<\/td><td>1, 3, 5<\/td><td>2<\/td><td>6, 2<\/td><\/tr><tr><td>4<\/td><td>2<\/td><td>1, 3, 5, 2<\/td><td>4<\/td><td>6, 4<\/td><\/tr><tr><td>5<\/td><td>4<\/td><td>1, 3, 5, 2, 4<\/td><td>7 (5 already visited)<\/td><td>6, 7<\/td><\/tr><tr><td>6<\/td><td>7<\/td><td>1, 3, 5, 2, 4, 7<\/td><td>-<\/td><td>6<\/td><\/tr><tr><td>7<\/td><td>6<\/td><td>1, 3, 5, 2, 4, 7, 6<\/td><td>-<\/td><td>empty<\/td><\/tr><\/table><p><b>DFS order from 1: 1, 3, 5, 2, 4, 7, 6.<\/b> Node 0 is <b>not reachable<\/b> from node 1 (all its edges go out of 0), so it is not visited. Time O(V + E).<\/p>","diag":"Directed graph (from the paper):\n 0 -> 1, 0 -> 2, 0 -> 3,  1 -> 3,  2 -> 4,\n 3 -> 5, 3 -> 6,  4 -> 5, 4 -> 7,  5 -> 2"},{"id":"D2-02","unit":"D2","src":["P23D","P23M"],"dia":true,"type":"Numerical","ease":2,"q":"Use Kruskal's algorithm to find the MST for the given graph (A-B 4, A-H 8, B-C 8, B-H 11, C-D 7, C-I 2, C-F 4, D-E 9, D-F 14, E-F 10, H-I 7, H-G 1, I-G 6, G-F 2). What is the time and space complexity? (Also: What is MST? Demonstrate Kruskal's algorithm with example.)","ans":"<p>A <b>Minimum Spanning Tree<\/b> is a subset of edges that connects <b>all V vertices with V&minus;1 edges, no cycle<\/b>, and the <b>minimum total weight<\/b>.<\/p><p><b>Kruskal:<\/b> sort edges by weight; pick the smallest edge that does not form a cycle (checked with union-find); stop at V&minus;1 = 8 edges.<\/p><table><tr><th>Edge<\/th><th>Wt<\/th><th>Action<\/th><\/tr><tr><td>H-G<\/td><td>1<\/td><td>Accept<\/td><\/tr><tr><td>C-I<\/td><td>2<\/td><td>Accept<\/td><\/tr><tr><td>G-F<\/td><td>2<\/td><td>Accept<\/td><\/tr><tr><td>A-B<\/td><td>4<\/td><td>Accept<\/td><\/tr><tr><td>C-F<\/td><td>4<\/td><td>Accept<\/td><\/tr><tr><td>I-G<\/td><td>6<\/td><td>Reject (cycle I-C-F-G)<\/td><\/tr><tr><td>C-D<\/td><td>7<\/td><td>Accept<\/td><\/tr><tr><td>H-I<\/td><td>7<\/td><td>Reject (cycle)<\/td><\/tr><tr><td>A-H<\/td><td>8<\/td><td>Accept<\/td><\/tr><tr><td>B-C<\/td><td>8<\/td><td>Reject (cycle)<\/td><\/tr><tr><td>D-E<\/td><td>9<\/td><td>Accept - 8 edges, stop<\/td><\/tr><\/table><p><b>MST cost = 1+2+2+4+4+7+8+9 = 37.<\/b> (B-C 8 could be taken instead of A-H 8 - same cost.)<\/p><p><b>Complexity:<\/b> sorting edges O(E log E); union-find operations ~O(E log V) &rarr; overall <b>O(E log E) = O(E log V)<\/b>. <b>Space O(V + E)<\/b> (edge list + parent array).<\/p>","diag":"MST (Kruskal), total cost = 37\nB --4-- A --8-- H --1-- G --2-- F --4-- C --7-- D --9-- E\n                                        |\n                                        2\n                                        |\n                                        I\nEdges taken: H-G 1, C-I 2, G-F 2, A-B 4, C-F 4, C-D 7, A-H 8, D-E 9"},{"id":"D2-03","unit":"D2","src":["P23D","P23M"],"dia":false,"type":"Code","ease":1,"q":"Write pseudocode for Prim's algorithm. What is the time and space complexity of Prim's algorithm?","ans":"<p><b>Prim's algorithm<\/b> (greedy) grows the MST from a start vertex, each time adding the <b>cheapest edge<\/b> that connects a tree vertex to a non-tree vertex.<\/p><pre>PRIM(G, w, s)\n  for each vertex v in V:\n      key[v] = INFINITY; parent[v] = NIL; inMST[v] = false\n  key[s] = 0\n  repeat V times:\n      u = vertex not in MST with minimum key[u]\n      inMST[u] = true\n      for each vertex v adjacent to u:\n          if inMST[v] == false and w(u, v) &lt; key[v]:\n              key[v] = w(u, v)\n              parent[v] = u\n  MST edges = (parent[v], v) for all v != s<\/pre><p><b>Time complexity:<\/b> with adjacency matrix and linear search for the minimum: <b>O(V<sup>2<\/sup>)<\/b> (good for dense graphs). With adjacency list + binary heap (priority queue): <b>O(E log V)<\/b>.<\/p><p><b>Space complexity:<\/b> <b>O(V)<\/b> extra for key[], parent[], inMST[] (plus O(V<sup>2<\/sup>) or O(V+E) for the graph).<\/p>"},{"id":"D2-04","unit":"D2","src":["P23M"],"dia":false,"type":"Compare","ease":1,"q":"What are the applications of the DFS algorithm? Differentiate between DFS and BFS (minimum 4 points).","ans":"<p><b>Applications of DFS:<\/b> detecting cycles in a graph, topological sorting, finding connected / strongly connected components, path finding between two vertices, solving mazes and puzzles, checking whether a graph is bipartite.<\/p><table><tr><th>Sr.<\/th><th>DFS<\/th><th>BFS<\/th><\/tr><tr><td>1<\/td><td>Depth First Search - goes deep along one path, then backtracks<\/td><td>Breadth First Search - visits all neighbours level by level<\/td><\/tr><tr><td>2<\/td><td>Uses a <b>stack<\/b> (or recursion)<\/td><td>Uses a <b>queue<\/b><\/td><\/tr><tr><td>3<\/td><td>Does not guarantee the shortest path<\/td><td>Gives shortest path (fewest edges) in unweighted graphs<\/td><\/tr><tr><td>4<\/td><td>Less memory for wide graphs<\/td><td>More memory - stores a whole level<\/td><\/tr><tr><td>5<\/td><td>Used in topological sort, cycle detection<\/td><td>Used in shortest path, web crawlers, social networks<\/td><\/tr><tr><td>6<\/td><td>Time O(V + E)<\/td><td>Time O(V + E)<\/td><\/tr><\/table>"},{"id":"D2-05","unit":"D2","src":["P23M","P23S"],"dia":true,"type":"Explain","ease":1,"q":"What is a graph? With example, describe the various ways in which graphs are represented.","ans":"<p>A <b>graph<\/b> G = (V, E) is a non-linear data structure made of a set of <b>vertices V<\/b> and a set of <b>edges E<\/b> connecting pairs of vertices. It can be directed or undirected, weighted or unweighted. e.g. cities connected by roads.<\/p><ol><li><b>Adjacency matrix:<\/b> a V&times;V matrix where A[i][j] = 1 (or weight) if there is an edge i&rarr;j, else 0. Symmetric for undirected graphs. Edge check in O(1); space <b>O(V<sup>2<\/sup>)<\/b>; good for dense graphs.<\/li><li><b>Adjacency list:<\/b> an array of V linked lists; list i holds all neighbours of vertex i. Space <b>O(V + E)<\/b> (undirected: V + 2E nodes); good for sparse graphs.<\/li><li><b>Adjacency multi-list:<\/b> each edge of an undirected graph is stored <b>only once<\/b> in a node shared by both vertex lists (fields: mark, v1, v2, link for v1, link for v2).<\/li><li><b>Inverse adjacency list:<\/b> for a directed graph, list i holds all vertices that have an edge <b>coming into<\/b> i - helps find in-degree quickly.<\/li><\/ol>","diag":"Graph:  1 --- 2           Adjacency matrix        Adjacency list\n        |   / |              1 2 3 4\n        |  /  |           1 [0 1 1 0]           1 -> 2 -> 3\n        | /   |           2 [1 0 1 1]           2 -> 1 -> 3 -> 4\n        3 --- 4           3 [1 1 0 1]           3 -> 1 -> 2 -> 4\n                          4 [0 1 1 0]           4 -> 2 -> 3"},{"id":"D2-06","unit":"D2","src":["P23S"],"dia":true,"type":"Numerical","ease":2,"q":"Find the Minimum Spanning Tree for the given graph using Prim's algorithm (edges 0-1 28, 0-5 10, 1-2 16, 1-6 14, 2-3 12, 3-4 22, 3-6 18, 4-5 25, 4-6 24). What is the time and space complexity of Prim's algorithm?","ans":"<p>Start from vertex 0; at each step add the cheapest edge from the tree to a new vertex.<\/p><table><tr><th>Step<\/th><th>Tree vertices<\/th><th>Candidate edges (min chosen)<\/th><th>Edge added<\/th><\/tr><tr><td>1<\/td><td>{0}<\/td><td>0-5 10, 0-1 28<\/td><td>0-5 (10)<\/td><\/tr><tr><td>2<\/td><td>{0,5}<\/td><td>5-4 25, 0-1 28<\/td><td>5-4 (25)<\/td><\/tr><tr><td>3<\/td><td>{0,5,4}<\/td><td>4-3 22, 4-6 24, 0-1 28<\/td><td>4-3 (22)<\/td><\/tr><tr><td>4<\/td><td>{0,5,4,3}<\/td><td>3-2 12, 3-6 18, 4-6 24, 0-1 28<\/td><td>3-2 (12)<\/td><\/tr><tr><td>5<\/td><td>{..,2}<\/td><td>2-1 16, 3-6 18, 4-6 24<\/td><td>2-1 (16)<\/td><\/tr><tr><td>6<\/td><td>{..,1}<\/td><td>1-6 14, 3-6 18, 4-6 24<\/td><td>1-6 (14)<\/td><\/tr><\/table><p><b>MST cost = 10 + 25 + 22 + 12 + 16 + 14 = 99<\/b> (6 edges for 7 vertices).<\/p><p><b>Complexity:<\/b> O(V<sup>2<\/sup>) with adjacency matrix; O(E log V) with adjacency list + min-heap. <b>Space:<\/b> O(V) for key[], parent[], visited[].<\/p>","diag":"MST (Prim from 0), total cost = 99\n   0 --10-- 5 --25-- 4 --22-- 3 --12-- 2 --16-- 1 --14-- 6\n(edges: 0-5, 5-4, 4-3, 3-2, 2-1, 1-6)"},{"id":"D2-07","unit":"D2","src":["P23S"],"dia":false,"type":"Explain","ease":1,"q":"What is greedy strategy? Explain with the help of an example. Write disadvantages of greedy strategy.","ans":"<p>A <b>greedy strategy<\/b> builds a solution step by step, at each step choosing the option that looks <b>best at that moment (locally optimal)<\/b>, hoping it leads to the overall best solution. Choices are never taken back.<\/p><p><b>Properties:<\/b> (1) <b>Greedy choice property<\/b> - a global optimum can be reached by local best choices; (2) <b>Optimal substructure<\/b> - an optimal solution contains optimal solutions of sub-problems.<\/p><p><b>Example - Kruskal's MST:<\/b> always pick the smallest-weight edge that does not form a cycle; this gives the minimum spanning tree. Other examples: Prim's, Dijkstra's, Huffman coding, coin change (Indian coins), fractional knapsack.<\/p><p><b>Coin example:<\/b> pay &#8377;18 with coins 10, 5, 2, 1 &rarr; 10 + 5 + 2 + 1 = 4 coins (optimal).<\/p><p><b>Disadvantages:<\/b><\/p><ol><li>Does <b>not always give the optimal answer<\/b> - e.g. coins {1, 3, 4}, amount 6: greedy gives 4+1+1 (3 coins) but 3+3 (2 coins) is better.<\/li><li>No backtracking - a wrong early choice cannot be corrected.<\/li><li>Works only for problems that have the greedy-choice property; proving correctness is hard.<\/li><li>Fails for 0/1 knapsack and for shortest paths with negative edges (Dijkstra).<\/li><\/ol>"},{"id":"D2-08","unit":"D2","src":["P23S"],"dia":false,"type":"Code","ease":1,"q":"Write pseudocode for Dijkstra's algorithm. What is the time and space complexity of Dijkstra's algorithm?","ans":"<p><b>Dijkstra's algorithm<\/b> finds the <b>shortest path from a source to all vertices<\/b> in a weighted graph with <b>non-negative<\/b> edge weights. It is greedy: always finalize the unvisited vertex with the smallest distance.<\/p><pre>DIJKSTRA(G, w, s)\n  for each vertex v in V:\n      dist[v] = INFINITY; prev[v] = NIL; visited[v] = false\n  dist[s] = 0\n  repeat V times:\n      u = unvisited vertex with minimum dist[u]\n      visited[u] = true\n      for each neighbour v of u:\n          if not visited[v] and dist[u] + w(u, v) &lt; dist[v]:\n              dist[v] = dist[u] + w(u, v)     // relaxation\n              prev[v] = u\n  return dist, prev<\/pre><p><b>Time:<\/b> <b>O(V<sup>2<\/sup>)<\/b> with adjacency matrix; <b>O((V + E) log V) &asymp; O(E log V)<\/b> with adjacency list + min-heap. <b>Space:<\/b> <b>O(V)<\/b> for dist[], prev[], visited[] (+ graph storage).<\/p><p><b>Example<\/b> (graph of D2-06, source 0): dist = 0:0, 5:10, 1:28, 4:35, 6:42, 2:44, 3:56.<\/p>"},{"id":"D2-09","unit":"D2","src":["SL"],"dia":false,"type":"Numerical","ease":2,"q":"Explain topological sorting with an example.","ans":"<p><b>Topological sorting<\/b> of a <b>Directed Acyclic Graph (DAG)<\/b> is a linear ordering of vertices such that for every edge u &rarr; v, <b>u comes before v<\/b>. It is not unique and is impossible if the graph has a cycle.<\/p><p><b>Source-removal (Kahn's) method:<\/b><\/p><ol><li>Find the in-degree of every vertex.<\/li><li>Put all vertices with in-degree 0 in a queue.<\/li><li>Remove a vertex from the queue, output it, and reduce the in-degree of its neighbours; add any that become 0.<\/li><li>Repeat until the queue is empty. If some vertices remain, the graph has a cycle.<\/li><\/ol><p><b>Example:<\/b> edges a&rarr;b, a&rarr;c, b&rarr;d, c&rarr;d, d&rarr;e. In-degrees: a0, b1, c1, d2, e1.<\/p><table><tr><th>Remove<\/th><th>Updated in-degrees<\/th><th>Queue<\/th><\/tr><tr><td>a<\/td><td>b0, c0<\/td><td>b, c<\/td><\/tr><tr><td>b<\/td><td>d1<\/td><td>c<\/td><\/tr><tr><td>c<\/td><td>d0<\/td><td>d<\/td><\/tr><tr><td>d<\/td><td>e0<\/td><td>e<\/td><\/tr><tr><td>e<\/td><td>-<\/td><td>empty<\/td><\/tr><\/table><p><b>Order: a, b, c, d, e<\/b> (a, c, b, d, e is also valid). DFS method: add each vertex to the front of a list when it finishes. Time <b>O(V + E)<\/b>. Uses: task scheduling, course prerequisites, build systems.<\/p>"},{"id":"D2-10","unit":"D2","src":["SL"],"dia":false,"type":"Numerical","ease":1,"q":"Explain BFS (breadth first search) of a graph with algorithm and example.","ans":"<p><b>BFS<\/b> visits the start vertex, then all its neighbours, then their neighbours, i.e. <b>level by level<\/b>, using a <b>queue<\/b>.<\/p><pre>BFS(G, s)\n  mark s visited; enqueue(s)\n  while queue not empty:\n      u = dequeue(); print u\n      for each neighbour v of u:\n          if v not visited:\n              mark v visited; enqueue(v)<\/pre><p><b>Example<\/b> (directed graph of D2-01, start 1):<\/p><table><tr><th>Dequeue<\/th><th>Enqueue<\/th><th>Queue<\/th><\/tr><tr><td>1<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>5, 6<\/td><td>5, 6<\/td><\/tr><tr><td>5<\/td><td>2<\/td><td>6, 2<\/td><\/tr><tr><td>6<\/td><td>-<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>7<\/td><td>7<\/td><\/tr><tr><td>7<\/td><td>-<\/td><td>empty<\/td><\/tr><\/table><p><b>BFS order: 1, 3, 5, 6, 2, 4, 7.<\/b> Time O(V + E); space O(V) for the queue and visited array.<\/p>"},{"id":"D2-11","unit":"D2","src":["SL"],"dia":false,"type":"Explain","ease":1,"q":"Explain basic graph terminology.","ans":"<ol><li><b>Graph G = (V, E):<\/b> set of vertices and edges.<\/li><li><b>Directed graph (digraph):<\/b> each edge (arc) has a direction u &rarr; v. <b>Undirected graph:<\/b> edges have no direction.<\/li><li><b>Weighted graph:<\/b> each edge has a cost/weight.<\/li><li><b>Adjacent vertices:<\/b> joined by an edge (path of length 1).<\/li><li><b>Degree:<\/b> number of edges at a vertex; for digraphs <b>in-degree<\/b> (incoming) and <b>out-degree<\/b> (outgoing).<\/li><li><b>Path:<\/b> sequence of vertices, each adjacent to the next. <b>Cycle:<\/b> path of at least 3 vertices starting and ending at the same vertex. <b>Loop:<\/b> edge from a vertex to itself.<\/li><li><b>Connected graph:<\/b> a path exists between every pair of vertices; <b>strongly connected<\/b> for digraphs (paths both ways).<\/li><li><b>Complete graph:<\/b> every pair of vertices is connected; it has n(n&minus;1)/2 edges.<\/li><li><b>Spanning tree:<\/b> subgraph that connects all vertices with V&minus;1 edges and no cycle.<\/li><\/ol>"},{"id":"D2-12","unit":"D2","src":["SL"],"dia":false,"type":"Explain","ease":1,"q":"Case study: data structures used in Web graphs and Google Maps.","ans":"<ol><li><b>Web graph:<\/b> every <b>web page is a vertex<\/b> and every <b>hyperlink is a directed edge<\/b>. It is huge and sparse, so it is stored as an <b>adjacency list<\/b>.<\/li><li><b>Crawling:<\/b> search engines use <b>BFS<\/b> to discover pages level by level from seed pages.<\/li><li><b>Ranking:<\/b> PageRank works on this directed graph - a page linked by many important pages gets a higher rank.<\/li><li><b>Google Maps:<\/b> road junctions/places are <b>vertices<\/b> and roads are <b>weighted edges<\/b> (distance or travel time); one-way roads are directed edges.<\/li><li><b>Shortest route:<\/b> uses <b>Dijkstra's algorithm<\/b> and the faster <b>A* algorithm<\/b>, which also uses a heuristic (straight-line distance to the destination) to explore fewer nodes.<\/li><li>Weights change with live traffic, so the same graph gives different best routes at different times.<\/li><\/ol>"},{"id":"D3-01","unit":"D3","src":["P23D","P23M"],"dia":false,"type":"Explain","ease":1,"q":"What is hashing? List various hash functions used to place elements in the hash table. What are the characteristics of a good hash function?","ans":"<p><b>Hashing<\/b> is a technique to map keys to locations in a <b>hash table<\/b> using a <b>hash function<\/b>, so that search, insert and delete take about <b>O(1)<\/b> time.<\/p><p><b>Hash functions:<\/b><\/p><ol><li><b>Division method:<\/b> h(k) = k mod m (m preferably prime). e.g. 1098 mod 997 = 102.<\/li><li><b>Mid-square:<\/b> square the key and take middle digits. e.g. 5016<sup>2<\/sup> = 25160256 &rarr; 160.<\/li><li><b>Folding:<\/b> split the key into parts and add. e.g. 123456789 &rarr; 123+456+789 = 1368 &rarr; 368.<\/li><li><b>Digit extraction:<\/b> pick selected digits of the key as the address.<\/li><li><b>Multiplication method:<\/b> h(k) = &lfloor;m (kA mod 1)&rfloor;, 0 &lt; A &lt; 1.<\/li><li><b>Direct / subtraction / rotation / universal hashing<\/b> - h(k)=k, h(k)=k&minus;c, rotate digits, random function from a family ((ak+b) mod p) mod m.<\/li><\/ol><p><b>Good hash function:<\/b> easy and fast to compute; distributes keys <b>uniformly<\/b> over the table; <b>minimizes collisions<\/b>; uses all parts of the key; gives the same address for the same key (deterministic); output always within table range.<\/p>"},{"id":"D3-02","unit":"D3","src":["P23D","P23M"],"dia":false,"type":"Numerical","ease":1,"q":"For the data 37, 90, 55, 22, 11, 17, 49, 87, table size m = 10, hash function key % 10, show the output step by step using quadratic probing Hi(key) = (Hash(key) + i^2) % m.","ans":"<table><tr><th>Key<\/th><th>h = key % 10<\/th><th>Probes<\/th><th>Index<\/th><\/tr><tr><td>37<\/td><td>7<\/td><td>i=0 &rarr; 7 free<\/td><td><b>7<\/b><\/td><\/tr><tr><td>90<\/td><td>0<\/td><td>i=0 &rarr; 0 free<\/td><td><b>0<\/b><\/td><\/tr><tr><td>55<\/td><td>5<\/td><td>i=0 &rarr; 5 free<\/td><td><b>5<\/b><\/td><\/tr><tr><td>22<\/td><td>2<\/td><td>i=0 &rarr; 2 free<\/td><td><b>2<\/b><\/td><\/tr><tr><td>11<\/td><td>1<\/td><td>i=0 &rarr; 1 free<\/td><td><b>1<\/b><\/td><\/tr><tr><td>17<\/td><td>7<\/td><td>i=0 &rarr; 7 full; i=1 &rarr; (7+1)%10 = 8 free<\/td><td><b>8<\/b><\/td><\/tr><tr><td>49<\/td><td>9<\/td><td>i=0 &rarr; 9 free<\/td><td><b>9<\/b><\/td><\/tr><tr><td>87<\/td><td>7<\/td><td>i=0 &rarr; 7 full; i=1 &rarr; 8 full; i=2 &rarr; (7+4)%10 = 1 full; i=3 &rarr; (7+9)%10 = 6 free<\/td><td><b>6<\/b><\/td><\/tr><\/table><p><b>Final table:<\/b><\/p><table><tr><th>Index<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><td>7<\/td><td>8<\/td><td>9<\/td><\/tr><tr><th>Key<\/th><td>90<\/td><td>11<\/td><td>22<\/td><td>-<\/td><td>-<\/td><td>55<\/td><td>87<\/td><td>37<\/td><td>17<\/td><td>49<\/td><\/tr><\/table><p>Collisions: 17 (1 extra probe) and 87 (3 extra probes). Quadratic probing reduces primary clustering compared to linear probing.<\/p>"},{"id":"D3-03","unit":"D3","src":["P23D","P23M"],"dia":false,"type":"Numerical","ease":2,"q":"What is the concept of chaining in hashing? Explain chaining with replacement and chaining without replacement with examples.","ans":"<p><b>Chaining (with linear probing):<\/b> each table slot stores the key and a <b>chain (link) field<\/b>. When a collision happens, the key is put in the next free slot by linear probing, and the <b>chain field of the last synonym points to it<\/b>, so later searches follow the chain instead of probing blindly. (Keys with the same home address are <b>synonyms<\/b>.)<\/p><p><b>Example:<\/b> m = 10, h(k) = k % 10, insert 11, 32, 41, 54, 33.<\/p><ol><li>11 &rarr; 1, 32 &rarr; 2, 54 &rarr; 4.<\/li><li>41 &rarr; home 1 is full (11, a synonym) &rarr; next free slot 3; chain[1] = 3.<\/li><li>33 &rarr; home 3 is full with <b>41, which is not a synonym<\/b> (its home is 1). Here the two methods differ.<\/li><\/ol><p><b>1. Chaining without replacement:<\/b> the existing key stays; 33 goes to the next free slot <b>5<\/b>. Table: 1:11(&rarr;3), 2:32, 3:41, 4:54, 5:33. Searching 33 later means starting at 3 and probing - slower.<\/p><p><b>2. Chaining with replacement:<\/b> since 41 is not in its home address, it is <b>moved<\/b> to the next free slot 5, the chain is updated (chain[1] = 5), and <b>33 is placed at its home 3<\/b>. Table: 1:11(&rarr;5), 2:32, 3:33, 4:54, 5:41.<\/p><table><tr><th>Without replacement<\/th><th>With replacement<\/th><\/tr><tr><td>Simple - existing keys never move<\/td><td>Keys sitting outside their home are moved out<\/td><\/tr><tr><td>Keys may end up far from home &rarr; more probes<\/td><td>Every key that owns its home address gets it &rarr; faster search<\/td><\/tr><tr><td>Chains can mix with other keys' areas<\/td><td>More work during insertion (move + update chain)<\/td><\/tr><\/table>"},{"id":"D3-04","unit":"D3","src":["P23D","P23M"],"dia":false,"type":"Code","ease":1,"q":"Write a pseudo C++ code for implementing linear probing without replacement as a collision resolution technique.","ans":"<pre>const int SIZE = 10;\nint table[SIZE];\n\nvoid init() {\n    for (int i = 0; i &lt; SIZE; i++) table[i] = -1;     // -1 = empty\n}\nint hashFn(int key) { return key % SIZE; }\n\nvoid insert(int key) {\n    int home = hashFn(key);\n    for (int i = 0; i &lt; SIZE; i++) {\n        int idx = (home + i) % SIZE;                     // linear probe\n        if (table[idx] == -1) {                          // empty slot\n            table[idx] = key;                            // existing keys never moved\n            return;\n        }\n    }\n    cout &lt;&lt; \"Hash table is full\";\n}\n\nint search(int key) {\n    int home = hashFn(key);\n    for (int i = 0; i &lt; SIZE; i++) {\n        int idx = (home + i) % SIZE;\n        if (table[idx] == -1) return -1;                 // not present\n        if (table[idx] == key) return idx;               // found\n    }\n    return -1;\n}\n\nvoid display() {\n    for (int i = 0; i &lt; SIZE; i++) cout &lt;&lt; i &lt;&lt; \" : \" &lt;&lt; table[i] &lt;&lt; endl;\n}<\/pre><p><b>Without replacement<\/b> means a key already in a slot is never moved, even if it does not belong to that home address. Average O(1), worst case O(n).<\/p>"},{"id":"D3-05","unit":"D3","src":["P23S"],"dia":true,"type":"Compare","ease":1,"q":"What is hashing? Explain open hashing and closed hashing with example.","ans":"<p><b>Hashing<\/b> maps keys to table addresses using a hash function for O(1) average access. When two keys hash to the same address (collision), we use either open or closed hashing.<\/p><p><b>1. Open hashing (separate chaining / closed addressing):<\/b> each table slot points to a <b>linked list<\/b>; all colliding keys are stored in that list <b>outside<\/b> the table. e.g. h(k) = k % 10: 21, 41, 51 all go in the list at index 1.<\/p><p><b>2. Closed hashing (open addressing):<\/b> all keys are stored <b>inside the table<\/b>; on collision, another free slot is searched (probing) - linear, quadratic or double hashing. e.g. 21 &rarr; 1, 41 &rarr; 1 full &rarr; 2 (linear probing).<\/p><table><tr><th>Open hashing (chaining)<\/th><th>Closed hashing (open addressing)<\/th><\/tr><tr><td>Keys stored in linked lists outside the table<\/td><td>Keys stored in the table itself<\/td><\/tr><tr><td>Load factor can exceed 1<\/td><td>Load factor must be &le; 1<\/td><\/tr><tr><td>Extra memory for pointers<\/td><td>No pointers needed<\/td><\/tr><tr><td>Deletion is easy<\/td><td>Deletion needs special marking<\/td><\/tr><tr><td>No clustering<\/td><td>Clustering can happen<\/td><\/tr><\/table>","diag":"Separate chaining (open hashing), h(k) = k % 10, keys 21, 33, 41, 63, 51\n 0 | /\n 1 | -> 21 -> 41 -> 51 -> /\n 2 | /\n 3 | -> 33 -> 63 -> /\n ..."},{"id":"D3-06","unit":"D3","src":["P23S"],"dia":false,"type":"Numerical","ease":1,"q":"Insert keys {9, 7, 11, 13, 12, 8} in a hash table (m = 10) using linear probing without replacement, h(k, i) = [h(k) + i] mod m and h(k) = 2k + 5.","ans":"<p>h(k) = (2k + 5) mod 10; on collision try h + 1, h + 2, ... (mod 10). Existing keys are never moved.<\/p><table><tr><th>Key<\/th><th>2k+5<\/th><th>h(k)<\/th><th>Probes<\/th><th>Index<\/th><\/tr><tr><td>9<\/td><td>23<\/td><td>3<\/td><td>3 free<\/td><td><b>3<\/b><\/td><\/tr><tr><td>7<\/td><td>19<\/td><td>9<\/td><td>9 free<\/td><td><b>9<\/b><\/td><\/tr><tr><td>11<\/td><td>27<\/td><td>7<\/td><td>7 free<\/td><td><b>7<\/b><\/td><\/tr><tr><td>13<\/td><td>31<\/td><td>1<\/td><td>1 free<\/td><td><b>1<\/b><\/td><\/tr><tr><td>12<\/td><td>29<\/td><td>9<\/td><td>9 full (7) &rarr; (9+1) mod 10 = 0 free<\/td><td><b>0<\/b><\/td><\/tr><tr><td>8<\/td><td>21<\/td><td>1<\/td><td>1 full (13) &rarr; 2 free<\/td><td><b>2<\/b><\/td><\/tr><\/table><table><tr><th>Index<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><td>7<\/td><td>8<\/td><td>9<\/td><\/tr><tr><th>Key<\/th><td>12<\/td><td>13<\/td><td>8<\/td><td>9<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>11<\/td><td>-<\/td><td>7<\/td><\/tr><\/table><p>Collisions: 12 and 8 (one extra probe each). Load factor = 6/10 = 0.6.<\/p>"},{"id":"D3-07","unit":"D3","src":["P23S"],"dia":false,"type":"Explain","ease":1,"q":"Explain the linear probing technique with and without replacement with examples.","ans":"<p><b>Linear probing<\/b> (open addressing): if the home slot h(k) is full, check h+1, h+2, ... (mod m) until a free slot is found. h(k, i) = (h(k) + i) mod m.<\/p><p><b>1. Without replacement:<\/b> a key already in a slot is never moved, even if it is not at its own home. Example (m = 10, k % 10): insert 11, 21, 12. 11 &rarr; 1; 21 &rarr; 1 full &rarr; 2; 12 &rarr; home 2 is taken by 21 (not its home) &rarr; 12 goes to 3. So 12 sits away from its home.<\/p><p><b>2. With replacement:<\/b> if the home slot is occupied by a key that is <b>not in its own home<\/b>, that key is moved to the next free slot and the new key takes its home. Same example: 12's home 2 holds 21 (home 1) &rarr; move 21 to 3, put 12 at 2. Table: 1:11, 2:12, 3:21.<\/p><table><tr><th>Without replacement<\/th><th>With replacement<\/th><\/tr><tr><td>Simple insertion<\/td><td>Insertion needs moving keys<\/td><\/tr><tr><td>Keys can be far from home - more probes when searching<\/td><td>More keys found at their home address - fewer probes<\/td><\/tr><\/table><p><b>Drawback of linear probing:<\/b> <b>primary clustering<\/b> - long runs of filled slots form and grow, slowing operations.<\/p>"},{"id":"D3-08","unit":"D3","src":["P23S"],"dia":false,"type":"Code","ease":2,"q":"Write an algorithm for chaining with replacement used as a technique for collision resolution.","ans":"<p>Each slot holds <b>key<\/b> and <b>chain<\/b> (index of next synonym, &minus;1 if none). Table size m, h(k) = k mod m.<\/p><pre>INSERT(k)\n 1. h = k mod m\n 2. if T[h] is empty:\n        T[h].key = k ; T[h].chain = -1 ; return\n 3. if hash(T[h].key) == h:                 // occupant is a synonym\n        find free slot j by linear probing from h\n        T[j].key = k ; T[j].chain = -1\n        p = h ; while T[p].chain != -1: p = T[p].chain\n        T[p].chain = j                          // attach at end of chain\n 4. else:                                     // occupant is NOT at its home -&gt; replace\n        find free slot j by linear probing\n        T[j] = T[h]                             // move old key and its chain to j\n        p = index whose chain points to h       // its predecessor in its own chain\n        T[p].chain = j                          // fix the link\n        T[h].key = k ; T[h].chain = -1           // new key takes its home\n 5. if no free slot: report \"table full\"<\/pre><p><b>Search(k):<\/b> go to h = k mod m; if T[h].key == k found; else follow the chain links until the key is found or chain = &minus;1.<\/p><p>Advantage: every key that owns a home address is stored there, so searches are short.<\/p>"},{"id":"D3-09","unit":"D3","src":["SL"],"dia":false,"type":"Numerical","ease":2,"q":"Explain double hashing with an example: insert 18, 32, 38, 41, 20, 44 into a table of size 13, H1(k) = k mod 13, H2(k) = 7 - (k mod 7).","ans":"<p><b>Double hashing<\/b> uses a second hash function to decide the jump size: <b>H(k, p) = [H1(k) + p &middot; H2(k)] mod m<\/b>, p = 0, 1, 2, ... H2(k) must never be 0. It reduces both primary and secondary clustering.<\/p><table><tr><th>Key<\/th><th>H1 = k mod 13<\/th><th>H2 = 7 &minus; (k mod 7)<\/th><th>Probes<\/th><th>Index<\/th><\/tr><tr><td>18<\/td><td>5<\/td><td>3<\/td><td>p=0 &rarr; 5<\/td><td><b>5<\/b><\/td><\/tr><tr><td>32<\/td><td>6<\/td><td>3<\/td><td>p=0 &rarr; 6<\/td><td><b>6<\/b><\/td><\/tr><tr><td>38<\/td><td>12<\/td><td>4<\/td><td>p=0 &rarr; 12<\/td><td><b>12<\/b><\/td><\/tr><tr><td>41<\/td><td>2<\/td><td>1<\/td><td>p=0 &rarr; 2<\/td><td><b>2<\/b><\/td><\/tr><tr><td>20<\/td><td>7<\/td><td>1<\/td><td>p=0 &rarr; 7<\/td><td><b>7<\/b><\/td><\/tr><tr><td>44<\/td><td>5<\/td><td>5<\/td><td>p=0 &rarr; 5 full; p=1 &rarr; (5+5) mod 13 = 10<\/td><td><b>10<\/b><\/td><\/tr><\/table><p><b>Final:<\/b> 2:41, 5:18, 6:32, 7:20, 10:44, 12:38 (others empty).<\/p>"},{"id":"D3-10","unit":"D3","src":["SL"],"dia":false,"type":"Numerical","ease":2,"q":"Explain load factor, load density and rehashing with an example (table size 7, linear probing, h(K) = K mod 7, max load factor 0.7, keys 10, 22, 31, 4, 15; rehash to size 13).","ans":"<ol><li><b>Load density:<\/b> the maximum number of records the table can hold (its capacity).<\/li><li><b>Load factor (&alpha;):<\/b> number of records stored &divide; table size (often in %). Keep it below about <b>0.7-0.75<\/b>, otherwise collisions grow fast.<\/li><li><b>Rehashing:<\/b> when &alpha; crosses the threshold, create a <b>bigger table<\/b> (about double, preferably prime) and re-insert all keys with the new hash function. Cost O(n) once, but later operations stay fast.<\/li><\/ol><p><b>Example - size 7:<\/b> 10 &rarr; 3; 22 &rarr; 1; 31 &rarr; 3 full &rarr; 4; 4 &rarr; 4 full &rarr; 5; 15 &rarr; 1 full &rarr; 2.<\/p><table><tr><th>Index<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr><tr><th>Key<\/th><td>-<\/td><td>22<\/td><td>15<\/td><td>10<\/td><td>31<\/td><td>4<\/td><td>-<\/td><\/tr><\/table><p><b>Load factor<\/b> = 5/7 = <b>0.714 &gt; 0.7<\/b> &rarr; rehash.<\/p><p><b>New table size 13, h(K) = K mod 13:<\/b> 10 &rarr; 10, 22 &rarr; 9, 31 &rarr; 5, 4 &rarr; 4, 15 &rarr; 2 - no collisions now. New load factor = 5/13 = 0.38.<\/p>"},{"id":"D3-11","unit":"D3","src":["SL"],"dia":true,"type":"Explain","ease":2,"q":"Explain dynamic hashing using directories (extendible hashing).","ans":"<p><b>Dynamic hashing<\/b> lets the hash structure <b>grow and shrink<\/b> with the data, instead of a fixed table size (static hashing). <b>Extendible hashing<\/b> does this with a <b>directory<\/b>.<\/p><ol><li>Each key is converted to binary; the first (or last) <b>d bits<\/b> are used, where d = <b>global depth<\/b>.<\/li><li>The <b>directory<\/b> has 2<sup>d<\/sup> entries; each points to a <b>bucket<\/b> (disk block) holding a fixed number of keys.<\/li><li>Each bucket has a <b>local depth<\/b> = number of bits its keys actually share.<\/li><li><b>Insert:<\/b> use d bits to find the bucket; if there is room, store the key.<\/li><li><b>Overflow:<\/b> split the full bucket into two using one more bit. If its local depth was equal to the global depth, the <b>directory doubles<\/b> (d increases by 1); otherwise only pointers are updated.<\/li><li><b>Search<\/b> needs just one directory lookup + one bucket access, so it is fast even for large files.<\/li><\/ol><p><b>Example (slides):<\/b> 8-bit keys 4, 32, 10, 11, 84, 88, 160, 168, 255 with 2-bit directory 00/01/10/11 and buckets of 4. Inserting 00110011 into the full '00' bucket forces a split, using 3 bits (000-111).<\/p><p><b>Directory-less dynamic hashing (linear hashing)<\/b> grows the table one bucket at a time in a fixed order, without a directory.<\/p>","diag":"           Directory (global depth 2)\n           +----+\n           | 00 |----> [ 4, 32, 10, 11 ]   bucket (local depth 2)\n           | 01 |----> [ 84, 88 ]\n           | 10 |----> [ 160, 168 ]\n           | 11 |----> [ 255 ]\n           +----+\n key -> binary -> first (global depth) bits pick the directory entry -> bucket\n bucket full -> split it; if local depth = global depth -> double the directory"},{"id":"D3-12","unit":"D3","src":["SL"],"dia":false,"type":"Explain","ease":2,"q":"Explain cuckoo hashing with an example.","ans":"<p><b>Cuckoo hashing<\/b> gives every key <b>two possible positions<\/b> using two hash functions h1 and h2. A new key takes its position; if that is occupied, the old key is <b>kicked out<\/b> (like a cuckoo pushing eggs out of a nest) and moves to its other position, possibly kicking another key.<\/p><ol><li>Insert k at h1(k). If empty &rarr; done.<\/li><li>If occupied, k replaces the occupant; the displaced key goes to its alternative position (h2 if it was at h1).<\/li><li>Repeat. If the kicks go in a <b>cycle<\/b> or exceed a limit, <b>rehash<\/b> with new functions / a bigger table.<\/li><\/ol><p><b>Example (slides):<\/b> size 7, h1(k) = k mod 7, h2(k) = &lfloor;k/7&rfloor; mod 7; keys 10, 24, 31.<\/p><ul><li>10 &rarr; h1 = 3, empty &rarr; index 3.<\/li><li>24 &rarr; h1 = 3, occupied by 10 &rarr; 24 takes 3, 10 is kicked out &rarr; h2(10) = 1 &rarr; index 1.<\/li><li>31 &rarr; h1 = 3 &rarr; kicks out 24; h2(24) = 3 again &rarr; it would kick 31 back &rarr; <b>cycle<\/b> &rarr; rehash/resize the table.<\/li><\/ul><p><b>Advantages:<\/b> lookup checks only 2 places &rarr; <b>O(1) worst-case search<\/b>, no clustering. <b>Limitations:<\/b> insertion may cause many kicks, cycles force rehashing, needs low load factor.<\/p>"},{"id":"D3-13","unit":"D3","src":["SL"],"dia":false,"type":"Explain","ease":2,"q":"Explain Robin Hood hashing with an example.","ans":"<p><b>Robin Hood hashing<\/b> is linear probing with one rule - <b>\"take from the rich, give to the poor\"<\/b>: a key that has travelled far from its home gets priority over a key that is close to home. This keeps probe lengths balanced.<\/p><ol><li><b>Probe distance D<\/b> = (current index &minus; home index + N) mod N.<\/li><li>While inserting, at each occupied slot compare D<sub>new<\/sub> with D<sub>existing<\/sub>.<\/li><li>If <b>D<sub>new<\/sub> &gt; D<sub>existing<\/sub><\/b> &rarr; swap: the new key takes the slot and the old key continues probing.<\/li><li>Otherwise move to the next slot.<\/li><\/ol><p><b>Example (slides):<\/b> N = 10, h(k) = k mod 10, keys 12, 22, 32, 42, 13, 23, 11, 21. Before 21: 1:11, 2:12, 3:22, 4:32, 5:42, 6:13, 7:23. Insert 21 (home 1): at index 1, D=0 vs 0 &rarr; move; at index 2, D=1 &gt; 12's D=0 &rarr; <b>swap<\/b>, 12 continues; at index 6, 12 has D=4 &gt; 13's D=3 &rarr; swap; 13 goes to 8.<\/p><p><b>Final:<\/b> 1:11, 2:21, 3:22, 4:32, 5:42, 6:12, 7:23, 8:13.<\/p><p><b>Benefit:<\/b> lower variance of search time; searches can stop early when the current slot's D is smaller than the searched key's D.<\/p>"},{"id":"D3-14","unit":"D3","src":["SL"],"dia":false,"type":"Explain","ease":1,"q":"What is a Bloom filter? Explain with an example.","ans":"<p>A <b>Bloom filter<\/b> is a <b>space-efficient probabilistic<\/b> data structure that tells whether an element is <b>possibly in a set<\/b> or <b>definitely not in the set<\/b>. It uses a bit array of m bits (all 0) and k hash functions.<\/p><ol><li><b>Insert x:<\/b> compute the k hash values and set those bits to 1.<\/li><li><b>Query x:<\/b> if <b>any<\/b> of the k bits is 0 &rarr; <b>definitely absent<\/b>; if all are 1 &rarr; <b>probably present<\/b> (a false positive is possible).<\/li><li><b>No false negatives<\/b>; elements cannot normally be deleted.<\/li><\/ol><p><b>Example (slides):<\/b> m = 5, h1(k) = k mod 5, h2(k) = (2k + 3) mod 5.<\/p><ul><li>Insert 9: h1 = 4, h2 = 21 mod 5 = 1 &rarr; bits [0 1 0 0 1].<\/li><li>Insert 11: h1 = 1, h2 = 25 mod 5 = 0 &rarr; bits [1 1 0 0 1].<\/li><li>Query 15: h1 = 0, h2 = 33 mod 5 = 3; bit 3 is 0 &rarr; <b>definitely not present<\/b>.<\/li><li>Query 16: h1 = 1, h2 = 35 mod 5 = 0; both bits are 1 &rarr; <b>probably present<\/b> - a <b>false positive<\/b> (16 was never inserted).<\/li><\/ul><p><b>Uses:<\/b> checking usernames, caches, spell checkers, databases (avoid useless disk reads).<\/p>"},{"id":"D3-15","unit":"D3","src":["SL"],"dia":false,"type":"Numerical","ease":2,"q":"Explain hopscotch hashing with an example (keys 12, 22, 32, 43, 52; m = 10; h(k) = k % m; neighbourhood H = 4).","ans":"<p><b>Hopscotch hashing<\/b> is open addressing where every key must stay within a small <b>neighbourhood<\/b> of H slots starting at its home: a key with home i lives in i, i+1, ..., i+H&minus;1. Search checks only these H slots, so it is very fast.<\/p><p><b>Insertion:<\/b> find the nearest empty slot by linear probing. If it is outside the neighbourhood, <b>hop<\/b> it closer: move some key that can legally go into the empty slot (the empty slot is within that key's own neighbourhood), freeing a slot nearer the home. Repeat until the free slot is inside the neighbourhood; if impossible, resize/rehash.<\/p><table><tr><th>Key<\/th><th>Home<\/th><th>Action<\/th><th>Index<\/th><\/tr><tr><td>12<\/td><td>2<\/td><td>free<\/td><td>2<\/td><\/tr><tr><td>22<\/td><td>2<\/td><td>2 full &rarr; 3 (within 2-5)<\/td><td>3<\/td><\/tr><tr><td>32<\/td><td>2<\/td><td>&rarr; 4 (within 2-5)<\/td><td>4<\/td><\/tr><tr><td>43<\/td><td>3<\/td><td>3, 4 full &rarr; 5 (within 3-6)<\/td><td>5<\/td><\/tr><tr><td>52<\/td><td>2<\/td><td>neighbourhood 2-5 full; nearest empty = 6 (outside). 22 (home 3) can move to 6 (inside 3-6) &rarr; move 22 to 6; slot 3 is free and inside 2-5<\/td><td>3<\/td><\/tr><\/table><p><b>Final:<\/b> 2:12, 3:52, 4:32, 5:43, 6:22. Every key is within 4 slots of its home.<\/p>"},{"id":"D3-16","unit":"D3","src":["SL"],"dia":false,"type":"Compare","ease":1,"q":"Differentiate between static hashing and dynamic hashing.","ans":"<table><tr><th>Sr.<\/th><th>Static hashing<\/th><th>Dynamic hashing<\/th><\/tr><tr><td>1<\/td><td>Number of buckets / table size is <b>fixed<\/b><\/td><td>Table <b>grows or shrinks<\/b> with the data<\/td><\/tr><tr><td>2<\/td><td>Hash function and address space do not change<\/td><td>Hash function uses more or fewer bits as data grows<\/td><\/tr><tr><td>3<\/td><td>Performance drops as the table fills (more collisions/overflow)<\/td><td>Performance stays steady - buckets split when full<\/td><\/tr><tr><td>4<\/td><td>Space wasted if data is small, overflow if data is large<\/td><td>Efficient space usage<\/td><\/tr><tr><td>5<\/td><td>Simple to implement<\/td><td>More complex (directories, splitting)<\/td><\/tr><tr><td>6<\/td><td>Use when the number of records is known and stable<\/td><td>Use in DBMS / files where records keep changing<\/td><\/tr><tr><td>7<\/td><td>e.g. division method with linear probing<\/td><td>e.g. extendible hashing, linear hashing<\/td><\/tr><\/table>"}],"FACTS":[{"h":"Trees","items":["Binary tree, root level 0: max nodes at level l = 2^l; max nodes for height h = 2^(h+1) - 1; leaves n0 = n2 + 1","n nodes -> n-1 edges and n+1 NULL links (used as threads in a TBT)","Array representation (root at 0): children 2i+1, 2i+2; parent (i-1)/2","Inorder LNR, Preorder NLR, Postorder LRN, Level order = queue (BFS); all O(n)","Inorder of a BST = sorted order (use it to check your BST)","BST delete: leaf -> remove; one child -> link parent to child; two children -> replace by inorder successor","Preorder/postorder + inorder uniquely build a binary tree; first of preorder (last of postorder) = root","TBT types: one-way (right/left threaded), two-way, two-way with header node; flags lthread/rthread","Expression tree: leaves operands, internal operators; postfix -> scan L to R with stack; prefix -> scan R to L","Huffman: merge two smallest repeatedly; left 0, right 1; encoded bits = sum(freq x code length)"]},{"h":"Graphs","items":["Adjacency matrix O(V^2) space, O(1) edge check; adjacency list O(V+E); multilist stores each undirected edge once; inverse list = incoming edges","DFS: stack/recursion, O(V+E); BFS: queue, O(V+E), shortest path in unweighted graphs","MST: V-1 edges, no cycle, minimum total weight","Kruskal: sort edges + union-find, O(E log E) = O(E log V), good for sparse graphs","Prim: grow from a vertex, O(V^2) matrix / O(E log V) heap, good for dense graphs","Dijkstra: single-source shortest path, no negative edges, O(V^2) / O(E log V)","Topological sort: only for DAGs, Kahn's in-degree method or DFS finish order, O(V+E)","PYQ answers: Kruskal MST = 37, Prim MST = 99, DFS from 1 = 1 3 5 2 4 7 6"]},{"h":"Hashing","items":["Load factor alpha = n / m; keep below ~0.7-0.75, else rehash (about double, prime size)","Division h = k mod m (m prime); mid-square; folding; digit extraction; multiplication; universal ((ak+b) mod p) mod m","Linear probing (h+i) mod m -> primary clustering; quadratic (h+i^2) mod m -> secondary clustering; double hashing (h1 + i*h2) mod m","Open hashing = separate chaining (lists outside table); closed hashing = open addressing (inside table)","Chaining without replacement: never move keys; with replacement: move a key that is not at its home","Extendible hashing: directory of 2^d entries, global depth d, local depth per bucket, split / double directory","Cuckoo: 2 positions per key, kick out, cycle -> rehash; lookup O(1) worst case","Robin Hood: swap if D_new > D_existing (probe distance); Hopscotch: key stays within H slots of home","Bloom filter: any bit 0 -> definitely absent; all 1 -> probably present (false positives, no false negatives)"]}],"STRATEGY":["Mid-term pattern (same as PAI): 3 units x 10 marks; in each unit choose ONE question (A + B) from the OR pair. Your past papers are 6-mark end-sem questions of the older 21BTCS402 paper - the same questions, just more marks.","Only Q1-Q6 of those papers belong to your Units I-III (Trees, Graphs, Hashing). Q7-Q10 (AVL, red-black, splay, B+ tree, heap sort, files) are NOT in this mid-term.","Numericals are the easiest full marks here: BST + traversals, tree from traversals, hashing tables, Kruskal/Prim. They repeat almost word-for-word across the 3 papers.","Choose questions without diagrams when the other option is a long drawing; but a small tree/table that IS the answer (BST, hash table) is quick - treat it as easy.","For every numerical show the working table (key | h(k) | probes | index), then the final table - marks are for steps.","For algorithms write: idea in 1-2 lines, pseudocode, then time and space complexity - complexity is asked in almost every graph question.","Check your BST by doing inorder (must come out sorted); check MST edges count = V - 1."],"VIDEOS":[{"unit":"D1","topic":"Threaded binary tree","vids":[{"id":"1E95XJd5bS0","title":"Threaded binary tree","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=threaded+binary+tree+types+one+way+two+way"},{"unit":"D1","topic":"BST construction, traversal & deletion","vids":[{"id":"oKf-SFhRI6c","title":"L44: Deletion in Binary Search Tree(BST) with example","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=binary+search+tree+insertion+deletion+all+cases"},{"unit":"D1","topic":"Construct binary tree from preorder and inorder","vids":[{"id":"PoBGyrIWisE","title":"5.7 Construct Binary Tree from Preorder and Inorder traversal with example","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=construct+binary+tree+from+preorder+and+inorder"},{"unit":"D1","topic":"Huffman coding","vids":[{"id":"co4_ahEDCho","title":"3.4 Huffman Coding - Greedy Method","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=huffman+coding+tree+example"},{"unit":"D1","topic":"Expression tree","vids":[],"search":"https://www.youtube.com/results?search_query=expression+tree+from+postfix+expression"},{"unit":"D2","topic":"DFS & BFS","vids":[{"id":"vf-cxgUXcMk","title":"6.2 BFS and DFS Graph Traversals| Breadth First Search and Depth First Search","ch":"","vf":"search"},{"id":"N2P7w22tN9c","title":"L-4.15: BFS & DFS","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=graph+representation+DFS+BFS"},{"unit":"D2","topic":"Prim's and Kruskal's MST","vids":[{"id":"_KX8GDvRzBc","title":"L-4.9: Prim's Algorithm for Minimum Cost Spanning Tree","ch":"","vf":"search"},{"id":"EjVHtpWkIho","title":"6.6 Kruskals Algorithm for Minimum Spanning Tree- Greedy method","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=prims+kruskals+algorithm+minimum+spanning+tree"},{"unit":"D2","topic":"Dijkstra's shortest path","vids":[{"id":"XB4MIexjvY0","title":"3.6 Dijkstra Algorithm - Single Source Shortest Path - Greedy Method","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=dijkstra+algorithm+single+source+shortest+path"},{"unit":"D2","topic":"Topological sorting","vids":[{"id":"96owfLr89Lk","title":"L-6.9:Kahn's Algorithm","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=topological+sorting+kahn+algorithm"},{"unit":"D3","topic":"Hashing & collision resolution (linear, quadratic, double)","vids":[{"id":"XAWsKlKxV8g","title":"Collision resolution techniques in Hashing","ch":"","vf":"search"},{"id":"-yQ2Kj-Jn0A","title":"L-6.6: Quadratic Probing in Hashing with example","ch":"","vf":"search"},{"id":"1P7ygNSe9lY","title":"L-6.7: Double Hashing","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=hashing+collision+resolution+linear+quadratic+probing+double+hashing"},{"unit":"D3","topic":"Chaining with and without replacement","vids":[{"id":"hmMYPZ5wLX0","title":"L-6.3: Chaining in Hashing","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=chaining+with+replacement+without+replacement+hashing"},{"unit":"D3","topic":"Extendible (dynamic) hashing","vids":[{"id":"cmneVtDrhAA","title":"Extendible Hashing - Data Structures","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=extendible+hashing+global+depth+local+depth"},{"unit":"D3","topic":"Cuckoo hashing & Bloom filter","vids":[{"id":"J12X51Q-Ocs","title":"Explanation of Cuckoo Hashing - Part 1 (2018 Computer Science Lectures)","ch":"","vf":"search"},{"id":"RSwjdlTp108","title":"Hashing - Bloom Filter","ch":"","vf":"search"}],"search":"https://www.youtube.com/results?search_query=cuckoo+hashing+bloom+filter+explained"},{"unit":"D3","topic":"Robin Hood & Hopscotch hashing","vids":[],"search":"https://www.youtube.com/results?search_query=robin+hood+hashing+hopscotch+hashing"}]},"PAI":{"UNITS":[{"id":"P1","name":"Unit I - Assembly Language Programming","short":"ALP (Unit I)"},{"id":"P2","name":"Unit II - 8086 Microprocessor","short":"8086 (Unit II)"},{"id":"P3","name":"Unit III - 80386 Microprocessor","short":"80386 (Unit III)"}],"SRC":{"A1":"Unit-I Assignment","A2":"Unit-II Assignment","A3":"Unit-III Assignment","CT":"Class Test","SL":"Slides"},"Q":[{"id":"P1-01","unit":"P1","src":["A1"],"dia":true,"type":"Explain","ease":2,"q":"Explain the functional block diagram of a microcomputer, describing the role played by the CPU, memory and Input/Output devices, and how they interact with one another.","ans":"<p>A <b>microcomputer<\/b> is a small computer built around a <b>microprocessor<\/b> (CPU on a single chip) along with memory and I/O devices, all connected through a <b>system bus<\/b>.<\/p><ol><li><b>CPU (Microprocessor):<\/b> The brain of the system. Its <b>ALU<\/b> does arithmetic and logic operations, <b>registers<\/b> hold data temporarily, and the <b>control unit<\/b> fetches, decodes and executes instructions.<\/li><li><b>Memory:<\/b> Stores programs and data. <b>ROM<\/b> holds permanent programs (like boot code) and <b>RAM<\/b> holds temporary data and user programs.<\/li><li><b>Input devices:<\/b> Keyboard, sensors, switches - they send data into the CPU.<\/li><li><b>Output devices:<\/b> Monitor, LCD, printer, LEDs - they show the results.<\/li><li><b>System bus:<\/b> <b>Address bus<\/b> (CPU sends the address of memory/I/O, one direction), <b>data bus<\/b> (data moves both ways) and <b>control bus<\/b> (RD, WR, clock, interrupt signals).<\/li><\/ol><p><b>Interaction:<\/b> The CPU puts an address on the address bus, gives a read/write signal on the control bus, and the data travels on the data bus between the CPU and memory or I/O. This fetch-decode-execute cycle repeats for every instruction.<\/p>","diag":"            +----------------------+\n            |         CPU          |\n            |  ALU | Registers |   |\n            |    Control Unit      |\n            +----------+-----------+\n                       |\n   ====================+===================== System Bus\n     Address Bus  |  Data Bus  |  Control Bus\n   =========+==================+=============\n            |                  |\n   +--------+-------+   +------+---------+\n   |     MEMORY     |   |  INPUT/OUTPUT  |\n   |  ROM  |  RAM   |   | Keyboard, LCD, |\n   +----------------+   | Printer, Ports |\n                        +----------------+"},{"id":"P1-02","unit":"P1","src":["A1"
