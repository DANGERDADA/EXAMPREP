function buildPlan(mode){
  const days = {emergency:1, "1day":1, "3day":3, "7day":7}[mode];
  const hrs = Math.max(1, Math.min(16, +S.hours[mode] || 1));
  const perDay = hrs*60;
  const ts = scopedTopics();
  const hasVid = t => (D.VIDEOS[t.video].vids||[]).length > 0;
  const blocksFor = (t, lvl) => {
    const b = [];
    if (mode === "emergency") {
      b.push({k:"formula", min:8, txt:`Read formulas: ${t.name}`});
      t.pyqs.slice(0,2).forEach(id => b.push({k:"pyq", min:10, txt:`Replay solved PYQ ${pyqLabel(id)} (cover the solution, attempt, then check)`, ref:id}));
      if (!t.pyqs.length) b.push({k:"learn", min:10, txt:`Skim the solved example: ${t.name}`});
      return b;
    }
    if (lvl < 2 && hasVid(t)) b.push({k:"video", min:20, txt:`Watch Pradeep Giri lecture (relevant part): ${t.name}`});
    b.push({k:"learn", min: Math.round(t.time*(lvl>=3?0.7:1)), txt:`Learn: ${t.name} - explanation + solved example`});
    b.push({k:"formula", min:10, txt:`Formula revision: ${t.name}`});
    const np = lvl>=3 ? Math.min(1,t.pyqs.length) : Math.min(2,t.pyqs.length);
    t.pyqs.slice(0,np).forEach(id => b.push({k:"pyq", min:15, txt:`Solve PYQ ${pyqLabel(id)} without notes, then check`, ref:id}));
    if (!t.pyqs.length) b.push({k:"pyq", min:10, txt:`Practise: quiz questions for ${t.name}`});
    return b;
  };
  const sum = arr => arr.reduce((a,x) => a+x.min, 0);
  const levels = [
    {lvl:0, f:t=>true, note:""},
    {lvl:1, f:t=>t.pri!=="P3", note:"P3 topics left out to fit your time."},
    {lvl:2, f:t=>t.pri!=="P3", note:"P3 topics and videos left out to fit your time."},
    {lvl:3, f:t=>t.pri!=="P3", note:"P3 topics and videos left out; learning time compressed."},
    {lvl:4, f:t=>t.pri==="P1", note:"Only P1 topics fit your time; P2/P3 left out."}];
  const overheadPerDay = 15 + (perDay>=90 ? Math.floor(perDay/60)*8 : 0);
  const finalMin = mode==="emergency" ? 20 : (days>=3 ? 90 : 30);
  const usable = days*perDay - days*overheadPerDay - finalMin;
  let chosen = null, chosenBlocks = [];
  const pool = mode==="emergency" ? [{lvl:0, f:t=>t.pri==="P1", note:"Emergency mode: only P1 topics, replaying solved PYQs."}] : levels;
  for (const L of pool) {
    const blocks = []; ts.filter(L.f).forEach(t => blocksFor(t, L.lvl).forEach(b => blocks.push(Object.assign({t:t.id}, b))));
    chosen = L; chosenBlocks = blocks;
    if (sum(blocks) <= usable) break;
  }
  // pack into days
  const out = []; let di = 0, used = 0, sinceBreak = 0, dayTopics = [];
  const dayArr = () => (out[di] = out[di] || {n:di+1, items:[]});
  const skipped = [];
  const closeDay = () => {
    const d = dayArr();
    if (dayTopics.length) d.items.push({k:"recall", min:15, txt:"Active recall: close notes and write every formula of today's topics from memory", id:`${mode}:recall:d${di+1}`});
  };
  chosenBlocks.forEach(b => {
    if (di >= days) { skipped.push(b); return; }
    const lastDayCap = di === days-1 ? perDay - finalMin : perDay;
    if (used + b.min + 15 > lastDayCap && used > 0) {
      closeDay(); di++; used = 0; sinceBreak = 0; dayTopics = [];
      if (di >= days) { skipped.push(b); return; }
      if (days >= 7 && (di===2||di===4||di===6)) { dayArr().items.push({k:"revise", min:15, txt:"Spaced review: formulas of all previous days (use Formula self-test mode)", id:`${mode}:spaced:d${di+1}`}); used += 15; }
    }
    if (sinceBreak + b.min > 55 && sinceBreak > 0 && perDay >= 90) { dayArr().items.push({k:"break", min:8, txt:"Short break - stand up, water, no phone scrolling", id:`${mode}:break:${di}:${used}`}); used += 8; sinceBreak = 0; }
    dayArr().items.push(Object.assign({id:`${mode}:${b.k}:${b.t}:${b.ref||""}`}, b));
    used += b.min; sinceBreak += b.min; if (!dayTopics.includes(b.t)) dayTopics.push(b.t);
  });
  if (di < days) closeDay();
  const last = out[Math.min(di, days-1)] || dayArr();
  if (days >= 3) last.items.push({k:"mock", min:60, txt:"Timed mock: attempt one full past paper from the PYQ tab in 60 minutes (choose OR questions as in the exam)", id:`${mode}:mock`});
  last.items.push({k:"revise", min: days>=3?30:(mode==="emergency"?20:30), txt:"Final revision: Last-Minute page + checklist; re-read formulas you starred", id:`${mode}:final`});
  for (let i=0;i<days;i++) if (!out[i]) out[i] = {n:i+1, items:[{k:"revise", min:20, txt:"Buffer day: redo any PYQ you got wrong; quiz on weak topics", id:`${mode}:buffer:d${i+1}`}]};
  const tasks = []; out.forEach(d => d.items.forEach(x => tasks.push(x)));
  const skippedTopics = [...new Set(skipped.map(b => b.t))].map(id => T[id].name);
  return {days:out, tasks, note:chosen?chosen.note:"", skipped:skippedTopics, perDay, hrs};
}

function quizFiltered(){

const IDX = [];
function buildIndex(){
  D.TOPICS.forEach(t => IDX.push({type:"Topic", title:t.name, sub:t.sub, text:(t.name+" "+t.sub+" "+strip(t.explain)+" "+t.qtypes.join(" ")).toLowerCase(), tab:"topics", a:"topic-"+t.id}));
  D.FORMULAS.forEach(f => IDX.push({type:"Formula", title:f.name, sub:T[f.topic].name, text:(f.name+" "+f.cat+" "+strip(f.tex)+" "+T[f.topic].name+" "+f.tip+" "+f.mistake).toLowerCase(), tab:"formulas", a:"f-"+f.id, pre:() => { FF.q=""; FF.unit="all"; FF.fav=false; }}));
  D.PYQS.forEach(p => IDX.push({type:"PYQ", title:PAPER[p.paper].name+" "+p.q, sub:strip(p.text), text:(PAPER[p.paper].name+" "+p.q+" "+strip(p.text)+" "+T[p.topic].name+" "+p.match).toLowerCase(), tab:"pyq", a:"pyq-"+p.id, pre:() => { PF.paper="all"; PF.topic="all"; }}));
  D.TUTS.forEach(q => IDX.push({type:"Tutorial", title:q.label+" - "+T[q.topic].name, sub:strip(q.text), text:(q.label+" tutorial "+q.t+" "+strip(q.text)+" "+T[q.topic].name+" "+q.sub).toLowerCase(), tab:"tutorials", a:"tq-"+q.id, pre:() => { UF={tut:"all",unit:"all",pri:"all",status:"all",rel:"all"}; }}));
  DSA.Q.forEach(q => IDX.push({type:"DSA", title:q.id+" - "+q.q.slice(0,80), sub:DU[q.unit].name, text:(q.q+" "+strip(q.ans)+" DSA "+DU[q.unit].name).toLowerCase(), tab:"dsaqa", a:"dq-"+q.id, pre:() => { DF2={unit:"all",src:"all",dia:"all",status:"all"}; }}));
  PAI.Q.forEach(q => IDX.push({type:"PAI", title:q.id+" - "+q.q.slice(0,80), sub:PU[q.unit].name, text:(q.q+" "+strip(q.ans)+" PAI "+PU[q.unit].name).toLowerCase(), tab:"paiqa", a:"pq-"+q.id, pre:() => { PF2={unit:"all",src:"all",dia:"all",status:"all"}; }}));
  D.MEMORISE.forEach((m,i) => m.items.forEach(x => IDX.push({type:"Memorise", title:m.h, sub:strip(x), text:(m.h+" "+strip(x)).toLowerCase(), tab:"memorise", a:"m-"+i})));
  D.QUIZ.forEach(q => IDX.push({type:"Quiz", title:strip(q.q).slice(0,90), sub:T[q.topic].name, text:(strip(q.q)+" "+q.opts.join(" ")+" "+T[q.topic].name).toLowerCase(), tab:"practice", a:"quiz-"+q.id, pre:() => { QF={topic:"all",type:"all",src:"all",diff:"all",set:null}; }}));
}
function doSearch(v){
  const box = $("#results"); const terms = v.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) { box.classList.remove("open"); box.innerHTML = ""; return; }
  const hits = IDX.filter(e => terms.every(w => e.text.includes(w) || e.title.toLowerCase().includes(w))).slice(0, 40);
  box.innerHTML = hits.length ? hits.map((h,i) => `<button data-hit="${i}"><span class="rt">${h.type}</span> ${esc(h.title)}<span class="rs">${esc(h.sub)}</span></button>`).join("") : `<div class="empty small">No matches for "${esc(v)}"</div>`;
  box._hits = hits; box.classList.add("open");
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); const tab = g.dataset.go; const anchor = g.dataset.anchor;
    if (tab === "pyq" && anchor) { PF.paper="all"; PF.topic="all"; if (rendered.pyq) drawBank(); }
    if (tab === "formulas" && anchor) { FF.q=""; FF.unit="all"; FF.fav=false; if (rendered.formulas) RENDER.formulas(); }
    if (tab === "dsaqa" && anchor) { DF2={unit:"all",src:"all",dia:"all",status:"all"}; if (rendered.dsaqa) RENDER.dsaqa(); }
    if (tab === "paiqa" && anchor) { PF2={unit:"all",src:"all",dia:"all",status:"all"}; if (rendered.paiqa) RENDER.paiqa(); }
    if (tab === "topics" && anchor) { TF={unit:"all",pri:"all",diff:"all",status:"all"}; if (rendered.topics) RENDER.topics(); }
    go(tab, anchor); return; }
  const sc = e.target.closest("[data-scope]");
  if (sc) { const u = sc.dataset.scope; S.scope[u] = !S.scope[u]; if (!Object.values(S.scope).some(Boolean)) S.scope[u] = true; save(); updateSide();
    if (!$("#tab-dashboard").hidden) RENDER.dashboard(); rerender("plan"); rerender("videos"); rerender("lastmin"); if (rendered.tutorials && UF.unit==="mine") drawTuts(); return; }
  const hit = e.target.closest("[data-hit]");
  if (hit) { const h = $("#results")._hits[+hit.dataset.hit]; if (h.pre) { h.pre(); rendered[h.tab] = false; } $("#results").classList.remove("open"); $("#q").blur(); go(h.tab, h.a); return; }
  if (!e.target.closest(".search")) $("#results").classList.remove("open");
  const fav = e.target.closest("[data-fav]");
  if (fav) { const id = fav.dataset.fav; if (S.fav[id]) delete S.fav[id]; else S.fav[id] = true; save(); fav.classList.toggle("on", !!S.fav[id]); fav.innerHTML = S.fav[id]?"&#9733;":"&#9734;"; if (FF.fav) drawFormulas(); return; }
  const cp = e.target.closest("[data-copy]"); if (cp) { copyText(F[cp.dataset.copy].tex); return; }
  const rv = e.target.closest("[data-reveal]"); if (rv) { FF.reveal[rv.dataset.reveal] = true; const id = rv.dataset.reveal; const c = $("#f-"+id); c.outerHTML = formulaCard(F[id]); renderMath($("#f-"+id)); return; }
  const hd = e.target.closest("[data-hide]"); if (hd) { delete FF.reveal[hd.dataset.hide]; const id = hd.dataset.hide; $("#f-"+id).outerHTML = formulaCard(F[id]); return; }
  const fm = e.target.closest("[data-fmode]"); if (fm) { FF.mode = fm.dataset.fmode; FF.reveal = {}; RENDER.formulas(); return; }
  if (e.target.closest("#ffav")) { FF.fav = !FF.fav; RENDER.formulas(); return; }
  if (e.target.closest("#revAll")) { D.FORMULAS.forEach(f => FF.reveal[f.id] = true); drawFormulas(); return; }
  if (e.target.closest("#hideAll")) { FF.reveal = {}; drawFormulas(); return; }
  if (e.target.closest("#printF")) { printFormulas(); return; }
  if (e.target.closest("#expAll")) { $$("#topicList details").forEach(d => d.open = true); return; }
  if (e.target.closest("#colAll")) { $$("#topicList details").forEach(d => d.open = false); return; }
  const ld = e.target.closest("[data-load]"); if (ld) { loadPlayer(ld.dataset.load, false); return; }
  const fl = e.target.closest("[data-forceload]"); if (fl) { loadPlayer(fl.dataset.forceload, true); return; }
  const cpl = e.target.closest("[data-closeplayer]"); if (cpl) { const sl = $(`[data-slot="${cpl.dataset.closeplayer}"]`); if (sl) sl.innerHTML = ""; return; }
  const bp = e.target.closest("[data-badplayer]"); if (bp) { const sl = $(`[data-slot="${bp.dataset.badplayer}"]`); if (sl) sl.innerHTML = `<div class="vnotice">Player closed. ${IS_FILE?"Embedded players are now treated as blocked in this browser, so the page will not keep retrying. ":""}Use <a href="${ytWatch(bp.dataset.badplayer)}" target="_blank" rel="noopener">Open on YouTube</a>.</div>`; if (IS_FILE) { S.embedBad = true; save(); } return; }
  if (e.target.closest("#resetEmbed")) { S.embedBad = false; save(); RENDER.videos(); toast("Embedded players allowed again"); return; }
  const spm = e.target.closest("[data-spmode]"); if (spm) { S.sprint.mode = spm.dataset.spmode; save(); RENDER.plan(); return; }
  if (e.target.closest("#spAll")) { S.sprint.excl = {}; save(); RENDER.plan(); return; }
  if (e.target.closest("#spP1")) { S.sprint.excl = {}; scopedTopics().forEach(t => { if (t.pri === "P3") S.sprint.excl[t.id] = true; }); save(); RENDER.plan(); return; }
  if (e.target.closest("#spClear")) { if (confirmReset()) { buildSprint().tasks.forEach(x => delete S.plan[x.id]); save(); RENDER.plan(); toast("Today's ticks cleared"); } return; }
  if (e.target.closest("#spPrint")) { window.print(); return; }
  if (e.target.closest("#exportBtn")) { exportData(); return; }
  if (e.target.closest("#dxAll")) { $$("#dqList details").forEach(d => d.open = true); return; }
  if (e.target.closest("#dxNone")) { $$("#dqList details").forEach(d => d.open = false); return; }
  if (e.target.closest("#dxPrint")) { $$("#dqList details").forEach(d => d.open = true); window.print(); return; }
  if (e.target.closest("#pxAll")) { $$("#pqList details").forEach(d => d.open = true); return; }
  if (e.target.closest("#pxNone")) { $$("#pqList details").forEach(d => d.open = false); return; }
  if (e.target.closest("#pxPrint")) { $$("#pqList details").forEach(d => d.open = true); window.print(); return; }
  if (e.target.closest("#importBtn")) { $("#importFile").value = ""; $("#importFile").click(); return; }
  if (e.target.closest("#resetAll")) { if (confirmReset()) { const theme = S.theme; S = {}; try { localStorage.removeItem(KEY); } catch(err) {} location.reload(); } return; }
  const pm = e.target.closest("[data-pmode]"); if (pm) { S.planMode = pm.dataset.pmode; save(); RENDER.plan(); return; }
  if (e.target.closest("#presetPlan")) { buildPlan(S.planMode).tasks.forEach(x => delete S.plan[x.id]); save(); RENDER.plan(); toast("Ticks cleared"); return; }
  const op = e.target.closest("[data-qid]");
  if (op && !op.disabled) { const q = D.QUIZ.find(x => x.id === op.dataset.qid); const pick = +op.dataset.pick; S.quiz[q.id] = {pick, ok: pick === q.a}; save(); updateSide();
    const card = $("#quiz-"+q.id); const n = card.querySelector("b").textContent.replace(/\D/g,""); card.outerHTML = quizCard(q, +n); renderMath($("#quiz-"+q.id)); refreshQuizStats(); return; }
  const rt = e.target.closest("[data-retry]"); if (rt) { const q = D.QUIZ.find(x => x.id === rt.dataset.retry); delete S.quiz[q.id]; save(); updateSide(); const card = $("#quiz-"+q.id); const n = card.querySelector("b").textContent.replace(/\D/g,""); card.outerHTML = quizCard(q, +n); renderMath($("#quiz-"+q.id)); refreshQuizStats(); return; }
  const hn = e.target.closest("[data-hint]"); if (hn) { $("#hint-"+hn.dataset.hint).hidden = false; hn.disabled = true; return; }
  if (e.target.closest("#q10")) { const pool = quizFiltered().map(q => q.id); for (let i = pool.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; } QF.set = pool.slice(0,10); QF.set.forEach(id => delete S.quiz[id]); save(); RENDER.practice(); return; }
  if (e.target.closest("#qall")) { QF.set = null; RENDER.practice(); return; }
  if (e.target.closest("#qreset")) { if (confirmReset()) { S.quiz = {}; save(); updateSide(); RENDER.practice(); toast("Scores reset"); } return; }
  if (e.target.closest("#focusBtn")) { document.body.classList.add("focus"); window.scrollTo(0,0); return; }
  if (e.target.closest("#exitFocus")) { document.body.classList.remove("focus"); return; }
  if (e.target.closest("#printL")) { $$("#tab-lastmin details").forEach(d => d.open = true); window.print(); return; }
  if (e.target.closest("#menuBtn")) { document.body.classList.toggle("nav-open"); return; }
  if (e.target.closest("#scrim")) { document.body.classList.remove("nav-open"); return; }
  if (e.target.closest("#fontBtn")) { S.hand = S.hand === false; applyHand(); save(); return; }
  if (e.target.closest("#themeBtn")) { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx); S.theme = nx; save(); return; }
});
function exportData(){
  try {
    const blob = new Blob([JSON.stringify({app:"mfc3prep", version:2, saved:new Date().toISOString(), data:S}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mfc3-progress-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Backup downloaded");
  } catch(e) { toast("Download not allowed here"); }
}
function importData(file){
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); const d = o && o.app === "mfc3prep" ? o.data : o;
      if (!d || typeof d !== "object" || !("done" in d || "plan" in d || "quiz" in d)) throw new Error("bad");
      localStorage.setItem(KEY, JSON.stringify(d)); toast("Progress restored"); setTimeout(() => location.reload(), 500);
    } catch(e) { toast("That file is not a backup from this site"); } };
  r.readAsText(file);
}
let resetArmed = 0;
function confirmReset(){ const now = Date.now(); if (now - resetArmed < 3000) { resetArmed = 0; return true; } resetArmed = now; toast("Press Reset again to confirm"); return false; }
function refreshQuizStats(){
  const st = quizStats(); const cards = $$("#tab-practice .grid.g4 .stat .n");
  if (cards.length === 3) { cards[0].textContent = st.att; cards[1].textContent = st.correct; cards[2].textContent = st.acc===null?"--":st.acc+"%"; }
}
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.done) { setDone(el.dataset.done, el.checked); if (TF.status !== "all" && rendered.topics && el.closest("#topicList")) setTimeout(drawTopics, 250); return; }
  if (el.dataset.tf) { TF[el.dataset.tf] = el.value; drawTopics(); return; }
  if (el.dataset.uf) { UF[el.dataset.uf] = el.value; drawTuts(); return; }
  if (el.dataset.df2) { DF2[el.dataset.df2] = el.value; drawDsa(); return; }
  if (el.dataset.dsadone) { const id = el.dataset.dsadone; if (el.checked) S.dsaDone[id] = true; else delete S.dsaDone[id]; save(); $$(`[data-dsadone="${id}"]`).forEach(c => c.checked = el.checked); const d = $("#dq-"+id); if (d) d.classList.toggle("done", el.checked); return; }
  if (el.dataset.pf2) { PF2[el.dataset.pf2] = el.value; drawPai(); return; }
  if (el.dataset.paidone) { const id = el.dataset.paidone; if (el.checked) S.paiDone[id] = true; else delete S.paiDone[id]; save(); $$(`[data-paidone="${id}"]`).forEach(c => c.checked = el.checked); const d = $("#pq-"+id); if (d) d.classList.toggle("done", el.checked); return; }
  if (el.dataset.tut) { const id = el.dataset.tut; if (el.checked) S.tut[id] = true; else delete S.tut[id]; save(); $$(`[data-tut="${id}"]`).forEach(c => c.checked = el.checked); const d = $("#tq-"+id); if (d) d.classList.toggle("done", el.checked); return; }
  if (el.dataset.pyqdone) { const id = el.dataset.pyqdone; if (el.checked) S.pyqDone[id] = true; else delete S.pyqDone[id]; save(); $$(`[data-pyqdone="${id}"]`).forEach(c => c.checked = el.checked); return; }
  if (el.dataset.rev) { const id = el.dataset.rev; if (el.checked) S.revised[id] = true; else delete S.revised[id]; save(); return; }
  if (el.dataset.sptopic) { const id = el.dataset.sptopic; if (el.checked) delete S.sprint.excl[id]; else S.sprint.excl[id] = true; save(); RENDER.plan(); return; }
  if (el.id === "spHours") { S.sprint.hours = clamp(parseFloat(el.value), 2, 18); save(); RENDER.plan(); return; }
  if (el.id === "spStart") { if (/^\d{1,2}:\d{2}$/.test(el.value)) { S.sprint.start = el.value; save(); RENDER.plan(); } return; }
  if (el.id === "spWL" || el.id === "spWP") { S.sprint[el.id === "spWL" ? "wLearn" : "wPractice"] = clamp(parseFloat(el.value), 0.5, 1.5); save(); RENDER.plan(); return; }
  if (el.id === "vall") { VALL = el.checked; drawVideos(); return; }
  if (el.id === "importFile" && el.files && el.files[0]) { importData(el.files[0]); return; }
  if (el.id === "pfPaper") { PF.paper = el.value; drawBank(); return; }
  if (el.id === "pfTopic") { PF.topic = el.value; drawBank(); return; }
  if (el.id === "fu") { FF.unit = el.value; drawFormulas(); return; }
  if (el.dataset.watch) { if (el.checked) S.watched[el.dataset.watch] = true; else delete S.watched[el.dataset.watch]; save(); $$(`[data-watch="${el.dataset.watch}"]`).forEach(c => c.checked = el.checked); return; }
  if (el.dataset.task) { if (el.checked) S.plan[el.dataset.task] = true; else delete S.plan[el.dataset.task]; save(); const row = el.closest(".task,.slot"); if (row) row.classList.toggle("done", el.checked); clearTimeout(window.__pt); window.__pt = setTimeout(() => { if (!$("#tab-plan").hidden) RENDER.plan(); }, 500); return; }
  if (el.id === "phrs") { const v = Math.max(1, Math.min(16, parseFloat(el.value) || 1)); S.hours[S.planMode] = v; save(); RENDER.plan(); return; }
  if (el.id === "pdate") { S.examDate = el.value; save(); RENDER.plan(); return; }
  if (el.dataset.check !== undefined) { if (el.checked) S.check[el.dataset.check] = true; else delete S.check[el.dataset.check]; save(); el.closest(".task").classList.toggle("done", el.checked); $("#ckc").textContent = Object.keys(S.check).length; return; }
  if (["qt","qy","qs","qd"].includes(el.id)) { const k = {qt:"topic",qy:"type",qs:"src",qd:"diff"}[el.id]; QF[k] = el.value; QF.set = null; RENDER.practice(); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") doSearch(e.target.value);
  if (e.target.id === "fq") { FF.q = e.target.value; clearTimeout(window.__fq); window.__fq = setTimeout(drawFormulas, 180); }
  if (e.target.id === "vq") { VQ = e.target.value; drawVideos(); }
  if (e.target.id === "spWL") $("#wlv").textContent = (+e.target.value).toFixed(1);
  if (e.target.id === "spWP") $("#wpv").textContent = (+e.target.value).toFixed(1);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#results").classList.remove("open"); document.body.classList.remove("nav-open"); document.body.classList.remove("focus"); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Enter" && e.target.id === "q") { const b = $("#results [data-hit]"); if (b) b.click(); }
});
$("#q").addEventListener("focus", e => { if (e.target.value) doSearch(e.target.value); });
window.addEventListener("hashchange", () => go(location.hash.slice(1)));

/* ================= init ================= */
if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
function applyHand(){ const on = S.hand !== false; document.body.classList.toggle("hand", on); $("#fontBtn").setAttribute("aria-pressed", on ? "true" : "false"); $("#fontBtn").title = on ? "Switch answers to clear print font" : "Write answers in handwriting"; }
applyHand();
$("#subjSel").addEventListener("change", e => go(SUBJ_HOME[e.target.value]));
buildNav(); buildIndex(); updateSide();
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem(KEY + ".tab") || "dashboard"; } catch(e) { start = "dashboard"; } }
go(start);
})();
