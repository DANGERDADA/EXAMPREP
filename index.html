ht)$"],"ans":"$\\frac{\\pi}{6}$ cubic units","id":"T15Q5","label":"T15 Q5","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":6,"topic":"areavol","sub":"Volume of tetrahedron","text":"Find the volume of the tetrahedron bounded by the co-ordinate planes and the plane $\\dfrac xa+\\dfrac yb+\\dfrac zc=1$","steps":["$V=\\int_0^a\\int_0^{b(1-x/a)}c\\left(1-\\frac xa-\\frac yb\\right)dy\\,dx$","Inner: $\\frac{bc}{2}\\left(1-\\frac xa\\right)^2$","$\\int_0^a\\frac{bc}{2}\\left(1-\\frac xa\\right)^2dx=\\frac{bc}{2}\\cdot\\frac a3$"],"ans":"$\\frac{abc}{6}$ cubic units","id":"T15Q6","label":"T15 Q6","pri":"P2","why":"Topic priority P2 (Prepare next)."}],"TUT_TITLES":{"1":"Eigen Values and Eigen Vectors","2":"Diagonalization of Matrix","3":"LU Decomposition method / Cholesky's method","4":"Formation of Differential Equation","5":"Exact Differential Equation / Equation Reducible to Exact Differential Equations","6":"Linear Differential Equation / Applications of Differential Equations: Growth and Decay","7":"Direct Partial Differentiation","8":"Euler's Theorem","9":"Jacobian / Maxima and Minima","10":"Differentiation under Integral Sign (Rule-I) / (Rule-II)","11":"Error Function","12":"Curve Tracing","13":"Double Integration","14":"Triple Integration","15":"Applications of Double Integration: Area / Applications of Triple Integration: Volume"},"FILES":[{"path":"PPT/UNIT-I Linear Algebra.pdf","kind":"Slides","pages":20,"status":"Analysed (text layer)","note":"23ASH1109 MFC-III, Unit I Linear Algebra (AY 2024-25): eigenvalues/vectors, diagonalization, LU, Cholesky, PCA. Contains 4 of the 8 TA-I Linear-Algebra PYQs word-for-word."},{"path":"PPT/UNIT-II.pdf","kind":"Slides","pages":20,"status":"Analysed (text layer)","note":"Unit II Differential Equations: order/degree, formation, VS/homogeneous, exact, reducible to exact (IF Rule I & II), linear, growth & decay. Bernoulli is listed in the syllabus slide but no worked content is given. Contains all 8 TA-I DE PYQs (examples or exercises)."},{"path":"PPT/UNIT III.pdf","kind":"Slides","pages":39,"status":"Not Mathematics - excluded","note":"This file is a DBMS deck (23CSE2022 Database Management Systems, Unit III Database Design: functional dependency, 1NF-5NF). It is NOT MFC-III maths, so nothing from it is used. Your Unit III/IV maths slides (Partial Differentiation, DUIS & Error Function) were not in the ZIP; those topics are built only from the TA-II papers."},{"path":"PYQ/TA-I short solution_.pdf","kind":"PYQ","pages":2,"status":"Analysed (scanned, read visually)","note":"Term Assessment I, Aug-2024, CSE, Set A, 26/08/2024, 20 marks, with short handwritten answers."},{"path":"PYQ/TA-I(SetB) short solution.pdf","kind":"PYQ","pages":2,"status":"Analysed (scanned, read visually)","note":"Term Assessment I, Aug-2024, IT, Set B, 26/08/2024, 20 marks, with short handwritten answers."},{"path":"PYQ/MFC-III TA-II Set AShort solution.pdf","kind":"PYQ","pages":2,"status":"Analysed (scanned, read visually)","note":"Term Assessment II, Oct-2024, IT, Set A, 17/10/2024, 20 marks, CO1/CO2 tags, short handwritten answers."},{"path":"PYQ/TA-II Solution Oct-25.pdf","kind":"PYQ","pages":8,"status":"Analysed (scanned, read visually)","note":"Term Assessment II, Oct-2025, CSE, 13/10/2025, 20 marks, CO3/CO4 tags. Pages 3-8 are a full model solution with mark split (e.g. 2+2+1)."},{"path":"MFC-III 2025-26 Tutorials Sem-I-1.pdf","kind":"Tutorials","pages":16,"status":"Analysed (text layer + visual check)","note":"Official 23ASH1109 tutorial sheet, Tutorials 1-15 (page k = Tutorial k; page 16 blank). 111 questions, all included in the Tutorials tab."}],"PAPERS":[{"id":"A","name":"TA-I Aug 2024 - Set A (CSE)","short":"TA-I '24 A","date":"26/08/2024","file":"PYQ/TA-I short solution_.pdf","marks":20},{"id":"B","name":"TA-I Aug 2024 - Set B (IT)","short":"TA-I '24 B","date":"26/08/2024","file":"PYQ/TA-I(SetB) short solution.pdf","marks":20},{"id":"C","name":"TA-II Oct 2024 - Set A (IT)","short":"TA-II '24","date":"17/10/2024","file":"PYQ/MFC-III TA-II Set AShort solution.pdf","marks":20},{"id":"D","name":"TA-II Oct 2025 (CSE)","short":"TA-II '25","date":"13/10/2025","file":"PYQ/TA-II Solution Oct-25.pdf","marks":20}],"UNITS":[{"id":"U1","name":"Unit I - Linear Algebra","short":"Linear Algebra","src":"PPT/UNIT-I Linear Algebra.pdf + Tutorials 1-3","exam":"TA-I","tuts":"T1-T3","map":"Confirmed (Unit I slide deck)"},{"id":"U2","name":"Unit II - Differential Equations","short":"Differential Eqns","src":"PPT/UNIT-II.pdf + Tutorials 4-6","exam":"TA-I","tuts":"T4-T6","map":"Confirmed (Unit II slide deck)"},{"id":"PD","name":"Partial Differentiation & Applications (likely Unit III)","short":"Partial Diff.","src":"TA-II papers + Tutorials 7-9 (no slides in ZIP)","exam":"TA-II","tuts":"T7-T9","map":"Uncertain - inferred from the CO3 tag in TA-II 2025"},{"id":"IC","name":"DUIS & Error Function (likely Unit IV)","short":"DUIS & erf","src":"TA-II papers + Tutorials 10-11 (no slides in ZIP)","exam":"TA-II","tuts":"T10-T11","map":"Uncertain - inferred from the CO4 tag in TA-II 2025"},{"id":"MI","name":"Curve Tracing & Multiple Integrals (unit number not stated)","short":"Curves & Integrals","src":"Tutorials 12-15 only (no slides, no PYQs in ZIP)","exam":"not in your TA papers","tuts":"T12-T15","map":"Uncertain - no unit number in any file"}],"TOPICS":[{"id":"exact","unit":"U2","order":1,"pri":"P1","diff":"Easy","time":30,"name":"Exact Differential Equations","sub":"Test M_y = N_x, then the standard rule","explain":"An equation $M\\,dx+N\\,dy=0$ is <b>exact<\/b> when it is the total differential of some $u(x,y)$. The test is $\\dfrac{\\partial M}{\\partial y}=\\dfrac{\\partial N}{\\partial x}$. If it passes, integrate $M$ w.r.t. $x$ treating $y$ as constant, add the integral of only those terms of $N$ that do not contain $x$, and equate to $c$.","why":"Appeared in both TA-I papers (Q3A, 5 marks each). Both questions are copied word-for-word from your Unit II slides (Example 03 and Exercise 1). It is a 3-line method - the fastest 5 marks in the syllabus.","formulas":["F22","F23"],"qtypes":["Obtain the general solution of a given exact DE","Same with an initial condition (e.g. y(1)=0)","Check exactness first, then solve"],"example":{"q":"Solve $(x+y-2)\\,dx+(x-y+4)\\,dy=0$. <span class='src'>[Unit II slides, Exact Example 01]<\/span>","steps":["$M=x+y-2,\\;N=x-y+4$","$M_y=1,\\;N_x=1\\Rightarrow$ exact","$\\int M\\,dx\\;(y\\text{ const}) = \\frac{x^2}{2}+xy-2x$","Terms of $N$ free of $x$: $-y+4\\Rightarrow\\int(-y+4)\\,dy=-\\frac{y^2}{2}+4y$","$\\frac{x^2}{2}+xy-2x-\\frac{y^2}{2}+4y=c\\;\\Rightarrow\\;x^2-y^2+2xy-4x+8y=c_1$"]},"pyqs":["A3A","B3A"],"video":"v_exact"},{"id":"linear","unit":"U2","order":2,"pri":"P1","diff":"Easy","time":35,"name":"Linear Differential Equations (first order)","sub":"dy/dx + Py = Q, IF = e^(∫P dx)","explain":"Put the equation in the form $\\dfrac{dy}{dx}+Py=Q$ ($P,Q$ functions of $x$). Multiply by the integrating factor $\\text{IF}=e^{\\int P\\,dx}$; the left side becomes $\\dfrac{d}{dx}(y\\cdot\\text{IF})$, so $y\\cdot\\text{IF}=\\int Q\\cdot\\text{IF}\\,dx+c$. If $x$ appears only to the first power, treat it as linear in $x$: $\\dfrac{dx}{dy}+Px=Q$.","why":"Both TA-I papers (Q3B). Both are exercises 1 and 2 from your Unit II slides, verbatim. Very mechanical once you can divide to standard form.","formulas":["F26","F27","F32"],"qtypes":["Solve $(1+x^2)y'+y=e^{\\tan^{-1}x}$ type","Rearrange $x^2y'=3x^2-2xy+1$ to standard form","Linear in $x$: $(1+y^2)dx=(\\tan^{-1}y-x)dy$"],"example":{"q":"Solve $(1+y^2)\\,dx=(\\tan^{-1}y-x)\\,dy$. <span class='src'>[Unit II slides, Linear Example 02]<\/span>","steps":["Single term in $x$ $\\Rightarrow$ linear in $x$: $\\dfrac{dx}{dy}+\\dfrac{x}{1+y^2}=\\dfrac{\\tan^{-1}y}{1+y^2}$","$P=\\frac{1}{1+y^2}\\Rightarrow \\text{IF}=e^{\\tan^{-1}y}$","$x\\,e^{\\tan^{-1}y}=\\int e^{\\tan^{-1}y}\\dfrac{\\tan^{-1}y}{1+y^2}dy$; put $t=\\tan^{-1}y$","$=\\int t e^t\\,dt=e^t(t-1)+c$","$x=\\tan^{-1}y-1+c\\,e^{-\\tan^{-1}y}$"]},"pyqs":["A3B","B3B"],"video":"v_linear"},{"id":"form","unit":"U2","order":3,"pri":"P1","diff":"Easy","time":25,"name":"Formation of Differential Equations","sub":"Eliminate n arbitrary constants by differentiating n times","explain":"If a relation has $n$ arbitrary constants, differentiate it $n$ times and eliminate the constants from the $n+1$ equations. The result is a DE of order $n$. Trick: write the derivative so the original $y$ reappears (e.g. multiply by $x$ for $\\log x$ terms), or eliminate with a determinant.","why":"Both TA-I papers (Q4A). Set A is Unit II Example 02 (A, B swapped), Set B is Exercise 1, verbatim. Takes ~5 minutes in the exam.","formulas":["F21"],"qtypes":["$y=Ae^{m_1x}+Be^{m_2x}$ (answer: $y''-(m_1+m_2)y'+m_1m_2y=0$)","$y=A\\sin(\\log x)+B\\cos(\\log x)$","Curves: circles touching an axis, $Ax^2+By^2=1$"],"example":{"q":"Form the DE of $y=a e^{2x}+b e^{3x}$. <span class='src'>[Unit II slides, Example 04]<\/span>","steps":["$y_1=2ae^{2x}+3be^{3x}$","$y_2=4ae^{2x}+9be^{3x}$","$y_2-5y_1+6y=(4-10+6)ae^{2x}+(9-15+6)be^{3x}=0$","$\\dfrac{d^2y}{dx^2}-5\\dfrac{dy}{dx}+6y=0$"]},"pyqs":["A4A","B4A"],"video":"v_form"},{"id":"eig","unit":"U1","order":4,"pri":"P1","diff":"Medium","time":60,"name":"Eigenvalues & Eigenvectors","sub":"Characteristic equation, S1/S2 shortcut, Cramer's rule for vectors","explain":"$\\lambda$ is an eigenvalue of $A$ if $AX=\\lambda X$ for some non-zero $X$. Solve $|A-\\lambda I|=0$. For $3\\times3$ use $\\lambda^3-S_1\\lambda^2+S_2\\lambda-|A|=0$ with $S_1=$ trace and $S_2=$ sum of minors of the diagonal elements. For each $\\lambda$ solve $(A-\\lambda I)X=0$; with two independent rows use the cross-multiplication (Cramer) rule $\\frac{x}{|..|}=\\frac{-y}{|..|}=\\frac{z}{|..|}$.","why":"Q1A in both TA-I papers (5 marks each). Set B's matrix is Unit I Example 2 and Set A's matrix is Unit I Exercise 4 - both verbatim. It is also the prerequisite for Diagonalization (Q2A) and PCA.","formulas":["F1","F2","F3","F4","F5","F6","F7","F8","F9"],"qtypes":["3x3: find eigenvalues + eigenvector for the smallest/largest eigenvalue","2x2: eigenvalues and both eigenvectors","Use properties (trace, determinant, A^-1, A^m)"],"example":{"q":"Find eigenvalues and eigenvectors of $A=\\begin{bmatrix}14&-10\\\\5&-1\\end{bmatrix}$. <span class='src'>[Unit I slides, Example 1]<\/span>","steps":["$S_1=14+(-1)=13,\\;|A|=-14+50=36$","$\\lambda^2-13\\lambda+36=0\\Rightarrow(\\lambda-4)(\\lambda-9)=0\\Rightarrow\\lambda=4,9$","$\\lambda=4$: $\\begin{bmatrix}10&-10\\\\5&-5\\end{bmatrix}X=0\\Rightarrow x_1=x_2\\Rightarrow X_1=\\begin{bmatrix}1\\\\1\\end{bmatrix}$","$\\lambda=9$: $\\begin{bmatrix}5&-10\\\\5&-10\\end{bmatrix}X=0\\Rightarrow x_1=2x_2\\Rightarrow X_2=\\begin{bmatrix}2\\\\1\\end{bmatrix}$","Check: $4+9=13=S_1$, $4\\times9=36=|A|$ ✓"]},"pyqs":["A1A","B1A"],"video":"v_eig"},{"id":"diag","unit":"U1","order":5,"pri":"P1","diff":"Easy","time":30,"name":"Diagonalization of Matrices","sub":"P = [eigenvectors as columns], P⁻¹AP = D","explain":"$A$ ($n\\times n$) is diagonalizable iff it has $n$ linearly independent eigenvectors - guaranteed when the eigenvalues are distinct. Put the eigenvectors as the columns of $P$; then $P^{-1}AP=D=\\text{diag}(\\lambda_1,\\dots,\\lambda_n)$ in the same order.","why":"Q2A in both TA-I papers, always a 2x2 matrix. Set B's matrix is Unit I Diagonalization Exercise 2 verbatim. Short and safe once eigenvectors are done.","formulas":["F10","F11","F12"],"qtypes":["Show A is diagonalizable and find P such that P⁻¹AP is diagonal (2x2)","Decide if a triangular 3x3 matrix is diagonalizable"],"example":{"q":"Diagonalize $A=\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$. <span class='src'>[Unit I slides, Diagonalization Example 1]<\/span>","steps":["$\\lambda^2-2\\lambda-3=0\\Rightarrow\\lambda=3,-1$ (distinct $\\Rightarrow$ diagonalizable)","$\\lambda=3$: $-x_1+x_2=0\\Rightarrow v_1=(1,1)^T$; $\\lambda=-1$: $x_1+x_2=0\\Rightarrow v_2=(-1,1)^T$","$P=\\begin{bmatrix}1&-1\\\\1&1\\end{bmatrix},\\;P^{-1}=\\begin{bmatrix}1/2&1/2\\\\-1/2&1/2\\end{bmatrix}$","$P^{-1}AP=\\begin{bmatrix}3&0\\\\0&-1\\end{bmatrix}=D$"]},"pyqs":["A2A","B2A"],"video":"v_diag"},{"id":"chol","unit":"U1","order":6,"pri":"P1","diff":"Medium","time":35,"name":"Cholesky Method","sub":"A = LLᵀ for symmetric positive-definite A; LZ = B, LᵀX = Z","explain":"If $A$ is symmetric and positive definite, $A=LL^T$ with $L$ lower triangular. Compare entries column by column: $l_{11}=\\sqrt{a_{11}}$, then the first column, then $l_{22}$, $l_{32}$, $l_{33}$. Solve $LZ=B$ (forward substitution), then $L^TX=Z$ (back substitution).","why":"Q2B in both TA-I papers. Set A is Unit I Cholesky Example 2 word-for-word (answer $x=(0.6,1.2,0.4)$). Both papers' matrices give whole-number L - a sign you are on track.","formulas":["F15","F16","F14"],"qtypes":["Solve a 3x3 system by Cholesky","Decompose A = LLᵀ only"],"example":{"q":"Decompose $A=\\begin{bmatrix}2&-1&0\\\\-1&3&1\\\\0&1&2\\end{bmatrix}$ by Cholesky. <span class='src'>[Unit I slides, Cholesky Example 1]<\/span>","steps":["$l_{11}=\\sqrt2,\\;l_{21}=-1/\\sqrt2,\\;l_{31}=0$","$l_{22}=\\sqrt{3-\\tfrac12}=\\sqrt{5/2}$","$l_{32}=\\dfrac{1-l_{21}l_{31}}{l_{22}}=\\dfrac{1}{\\sqrt{5/2}}=\\sqrt{2/5}$","$l_{33}=\\sqrt{2-0-\\tfrac25}=\\sqrt{8/5}$","$L=\\begin{bmatrix}\\sqrt2&0&0\\\\-\\tfrac{1}{\\sqrt2}&\\sqrt{\\tfrac52}&0\\\\0&\\sqrt{\\tfrac25}&\\sqrt{\\tfrac85}\\end{bmatrix}$"]},"pyqs":["A2B","B2B"],"video":"v_chol"},{"id":"duis1","unit":"IC","order":7,"pri":"P1","diff":"Medium","time":30,"name":"DUIS Rule I (constant limits) - Frullani-type integral","sub":"Differentiate w.r.t. the parameter, integrate back, fix the constant","explain":"For constant limits, $\\dfrac{d}{d\\alpha}\\int_a^b f(x,\\alpha)\\,dx=\\int_a^b\\dfrac{\\partial f}{\\partial\\alpha}dx$. Strategy: call the integral $I(\\alpha)$, differentiate under the sign so the awkward $\\tfrac1x$ cancels, integrate the easy result, then find the constant from a special value of $\\alpha$ (where $I$ is known, e.g. $I=0$).","why":"$\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$ was asked as Q3A in <b>both<\/b> TA-II papers (Oct-2024 and Oct-2025) - the only exact repeat across years in your PYQs.","formulas":["F44","F46","F47","F70"],"qtypes":["Show $\\int_0^\\infty \\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$","Evaluate integrals with a parameter (e.g. $\\int_0^\\infty e^{-x}\\frac{\\sin\\alpha x}{x}dx$)"],"example":{"q":"Show $\\displaystyle\\int_0^\\infty e^{-x}\\frac{\\sin\\alpha x}{x}\\,dx=\\tan^{-1}\\alpha$. <span class='src'>[Generated practice - standard DUIS example]<\/span>","steps":["Let $I(\\alpha)=\\int_0^\\infty e^{-x}\\frac{\\sin\\alpha x}{x}dx$","$I'(\\alpha)=\\int_0^\\infty e^{-x}\\cos\\alpha x\\,dx=\\dfrac{1}{1+\\alpha^2}$ (standard $\\int_0^\\infty e^{-ax}\\cos bx\\,dx=\\frac{a}{a^2+b^2}$)","$I(\\alpha)=\\tan^{-1}\\alpha+c$","$\\alpha=0\\Rightarrow I=0\\Rightarrow c=0$","$I=\\tan^{-1}\\alpha$"]},"pyqs":["C3A","D3A"],"video":"v_duis"},{"id":"erf","unit":"IC","order":8,"pri":"P1","diff":"Medium","time":45,"name":"Error Function erf & erfc","sub":"Definitions, odd property, derivative, completing the square","explain":"$\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^x e^{-u^2}du$ and $\\text{erfc}(x)=\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}du$, so $\\text{erf}+\\text{erfc}=1$, $\\text{erf}(0)=0$, $\\text{erf}(\\infty)=1$, and erf is odd. Most questions are: split $\\int_a^b=\\int_0^b-\\int_0^a$; differentiate with Leibnitz (chain rule on the upper limit); or complete the square in the exponent and substitute.","why":"The most-tested idea in TA-II: 4 of the 8 TA-II sub-questions you have (Oct-24 Q3B & Q4B, Oct-25 Q3B & Q4B). Definitions alone earn 2 of 5 marks in the 2025 model solution.","formulas":["F48","F49","F50","F51","F52","F53","F54","F55","F56","F57"],"qtypes":["Define erf and erfc; prove erfc(-x)+erfc(x)=2","Prove d/dx erf(x)=2/√π e^{-x²}; find d/dx erf(axⁿ)","Express ∫ₐᵇ e^{-x²}dx or ∫₀^∞ e^{-x²-2ax}dx using erf/erfc"],"example":{"q":"Find $\\dfrac{d}{dx}\\,\\text{erfc}(ax)$. <span class='src'>[Generated practice]<\/span>","steps":["$\\text{erfc}(ax)=1-\\text{erf}(ax)=1-\\frac{2}{\\sqrt\\pi}\\int_0^{ax}e^{-u^2}du$","Leibnitz on the upper limit: $\\frac{d}{dx}\\int_0^{ax}e^{-u^2}du=e^{-a^2x^2}\\cdot a$","$\\dfrac{d}{dx}\\text{erfc}(ax)=-\\dfrac{2a}{\\sqrt\\pi}e^{-a^2x^2}$"]},"pyqs":["C3B","C4B","D3B","D4B"],"video":"v_erf"},{"id":"pdbasic","unit":"PD","order":9,"pri":"P2","diff":"Easy","time":25,"name":"Partial Derivatives - basics","sub":"Differentiate w.r.t. one variable, others constant","explain":"$\\dfrac{\\partial u}{\\partial x}$ treats every other variable as a constant. Mixed derivatives of smooth functions are equal: $u_{xy}=u_{yx}$. This is the prerequisite for Euler's theorem, Jacobians, maxima-minima and composite functions.","why":"One direct question (Oct-24 Q2A: $u=\\log(\\tan x+\\tan y+\\tan z)$). More importantly every PD question uses these skills.","formulas":["F42","F71"],"qtypes":["Show an identity like $\\sum \\sin 2x\\,u_x = 2$","Verify $u_{xy}=u_{yx}$"],"example":{"q":"If $u=x^2y+y^3$, find $u_x,\\,u_y,\\,u_{xy}$. <span class='src'>[Generated practice]<\/span>","steps":["$u_x=2xy$ ($y$ constant)","$u_y=x^2+3y^2$ ($x$ constant)","$u_{xy}=\\frac{\\partial}{\\partial y}(2xy)=2x=\\frac{\\partial}{\\partial x}(x^2+3y^2)=u_{yx}$ ✓"]},"pyqs":["C2A"],"video":"v_pdbasic"},{"id":"euler","unit":"PD","order":10,"pri":"P1","diff":"Medium","time":50,"name":"Euler's Theorem on Homogeneous Functions","sub":"x u_x + y u_y = nu, the corollary g(u) = n f(u)/f'(u), and the 2nd-order form","explain":"$u(x,y)$ is homogeneous of degree $n$ if $u(tx,ty)=t^n u(x,y)$. Euler: $xu_x+yu_y=nu$ and $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=n(n-1)u$. When $u$ itself is not homogeneous but $f(u)$ is (e.g. $\\tan u$, $\\sin u$, $e^u$), use $xu_x+yu_y=g(u)=n\\frac{f(u)}{f'(u)}$ and $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(u)[g'(u)-1]$. For a sum $u=U+W$ apply Euler to each part separately.","why":"3 sub-questions across both TA-II papers (Oct-24 Q1A; Oct-25 Q1B and Q2B) - the most repeated Partial Differentiation idea.","formulas":["F33","F34","F35","F36","F37","F38"],"qtypes":["$u=\\tan^{-1}(\\cdot)$ or $\\sin^{-1}(\\cdot)$: find first- and second-order Euler expressions","Three-variable sum $u=U+\\log(\\cdot)$ with a degree-0 part","Find the degree by $x\\to tx$"],"example":{"q":"If $u=\\sin^{-1}\\dfrac{x^2+y^2}{x+y}$, show $xu_x+yu_y=\\tan u$. <span class='src'>[Generated practice]<\/span>","steps":["$f(u)=\\sin u=\\frac{x^2+y^2}{x+y}$; put $x\\to tx,y\\to ty$: $\\frac{t^2(x^2+y^2)}{t(x+y)}=t\\,f$ $\\Rightarrow n=1$","By the corollary $xu_x+yu_y=n\\dfrac{f(u)}{f'(u)}=\\dfrac{\\sin u}{\\cos u}$","$=\\tan u$ ∎"]},"pyqs":["C1A","D1B","D2B"],"video":"v_euler"},{"id":"reduc","unit":"U2","order":11,"pri":"P2","diff":"Medium","time":40,"name":"Reducible to Exact (Integrating Factor Rules I & II)","sub":"Homogeneous: 1/(Mx+Ny); y f₁(xy)dx + x f₂(xy)dy: 1/(Mx−Ny)","explain":"If $M_y\\neq N_x$, multiply by an integrating factor. <b>Rule I<\/b>: equation homogeneous and $Mx+Ny\\neq0\\Rightarrow$ IF $=\\frac{1}{Mx+Ny}$. <b>Rule II<\/b>: equation of the form $y\\,f_1(xy)\\,dx+x\\,f_2(xy)\\,dy=0$ and $Mx-Ny\\neq0\\Rightarrow$ IF $=\\frac{1}{Mx-Ny}$. After multiplying, check exactness and solve by the exact rule.","why":"Q4B in both TA-I papers. Set A is Unit II Reducible Example 01, Set B is Reducible Exercise 4 - both verbatim. Needs Exact DE first.","formulas":["F24","F25","F23"],"qtypes":["Reduce to exact and find the general solution (homogeneous)","Obtain the IF of $(1+xy)y\\,dx+(1-xy)x\\,dy=0$ and solve"],"example":{"q":"Solve $(x^2y^2+xy+1)y\\,dx+(x^2y^2-xy+1)x\\,dy=0$. <span class='src'>[Unit II slides, Reducible Example 02]<\/span>","steps":["Form $y f_1(xy)dx+xf_2(xy)dy$ $\\Rightarrow$ Rule II","$Mx-Ny=xy(x^2y^2+xy+1)-xy(x^2y^2-xy+1)=2x^2y^2$; IF $=\\frac{1}{2x^2y^2}$","New $M=\\frac y2+\\frac1{2x}+\\frac{1}{2x^2y}$, $N=\\frac x2-\\frac1{2y}+\\frac{1}{2xy^2}$; $M_y=\\tfrac12-\\tfrac{1}{2x^2y^2}=N_x$ ✓","$\\int M\\,dx=\\frac{xy}{2}+\\frac12\\log x-\\frac{1}{2xy}$; $N$ terms free of $x$: $-\\frac1{2y}\\Rightarrow-\\frac12\\log y$","$xy+\\log\\frac xy-\\frac{1}{xy}=c_1$"]},"pyqs":["A4B","B4B"],"video":"v_reduc"},{"id":"lu","unit":"U1","order":12,"pri":"P2","diff":"Medium","time":40,"name":"LU Decomposition (Doolittle)","sub":"A = LU, L has 1s on the diagonal; LZ = B, UX = Z","explain":"Write $A=LU$ with $L$ unit lower triangular and $U$ upper triangular. Compare entries row-by-row: first row of $U$ = first row of $A$; $l_{i1}=a_{i1}/u_{11}$; $u_{22}=a_{22}-l_{21}u_{12}$; $u_{23}=a_{23}-l_{21}u_{13}$; $l_{32}=(a_{32}-l_{31}u_{12})/u_{22}$; $u_{33}=a_{33}-l_{31}u_{13}-l_{32}u_{23}$. To solve $AX=B$: $LZ=B$ forward, $UX=Z$ backward.","why":"Q1B in both TA-I papers. Set B's matrix is Unit I LU Example 2 verbatim. Fractions make it error-prone, hence P2 (choose Q2 = Diagonalization + Cholesky if you prefer).","formulas":["F13","F14"],"qtypes":["Find the LU decomposition of a 3x3 matrix","Solve a system by LU decomposition"],"example":{"q":"Find LU of $A=\\begin{bmatrix}2&3&1\\\\1&2&3\\\\3&1&2\\end{bmatrix}$. <span class='src'>[Unit I slides, LU Example 1]<\/span>","steps":["$u_{11}=2,u_{12}=3,u_{13}=1$; $l_{21}=\\tfrac12,\\;l_{31}=\\tfrac32$","$u_{22}=2-\\tfrac12\\cdot3=\\tfrac12,\\;u_{23}=3-\\tfrac12\\cdot1=\\tfrac52$","$l_{32}=\\dfrac{1-\\tfrac32\\cdot3}{1/2}=-7$","$u_{33}=2-\\tfrac32\\cdot1-(-7)\\tfrac52=18$","$L=\\begin{bmatrix}1&0&0\\\\\\tfrac12&1&0\\\\\\tfrac32&-7&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&3&1\\\\0&\\tfrac12&\\tfrac52\\\\0&0&18\\end{bmatrix}$ (slide prints $l_{31}=1/3$ once - it is $3/2$)"]},"pyqs":["A1B","B1B"],"video":"v_lu"},{"id":"duis2","unit":"IC","order":13,"pri":"P2","diff":"Medium","time":30,"name":"DUIS Rule II (Leibnitz rule - variable limits)","sub":"Extra boundary terms f(ψ)ψ' − f(φ)φ'","explain":"$\\dfrac{d}{dx}\\int_{\\varphi(x)}^{\\psi(x)}f(t,x)\\,dt=\\int_{\\varphi}^{\\psi}\\dfrac{\\partial f}{\\partial x}dt+f(\\psi,x)\\psi'(x)-f(\\varphi,x)\\varphi'(x)$. In the PYQs the lower limit is 0 and the integrand vanishes at $t=x$, so the boundary terms are simple. Differentiate repeatedly until the target expression appears.","why":"Q4A in both TA-II papers - same concept, different integrand: $\\int_0^x f(t)\\sin a(x-t)dt$ (2024) and $\\int_0^x(x-t)^2G(t)dt$ (2025).","formulas":["F45"],"qtypes":["If $y=\\int_0^x f(t)\\sin a(x-t)dt$ show $y''+a^2y=af(x)$","If $f(x)=\\int_0^x(x-t)^2G(t)dt$ show $f'''=2G(x)$"],"example":{"q":"If $y=\\int_0^x(x-t)f(t)\\,dt$, show $\\dfrac{d^2y}{dx^2}=f(x)$. <span class='src'>[Generated practice, same pattern as PYQs]<\/span>","steps":["$y'=\\int_0^x f(t)\\,dt+(x-x)f(x)\\cdot1-0=\\int_0^x f(t)\\,dt$","$y''=0+f(x)\\cdot1-0=f(x)$ ∎"]},"pyqs":["C4A","D4A"],"video":"v_duis"},{"id":"jacob","unit":"PD","order":14,"pri":"P2","diff":"Medium","time":40,"name":"Jacobians","sub":"∂(u,v)/∂(x,y), JJ' = 1, 3x3 at a point","explain":"$J=\\dfrac{\\partial(u,v)}{\\partial(x,y)}=\\begin{vmatrix}u_x&u_y\\\\v_x&v_y\\end{vmatrix}$ (3x3 analogous). Property: $J\\,J'=1$ where $J'=\\frac{\\partial(x,y)}{\\partial(u,v)}$. So the inverse Jacobian is just $1/J$ - no need to solve for $x,y$ unless the question asks you to verify.","why":"Oct-24 Q1B (verify JJ'=1) and Oct-25 Q2A (3x3 inverse Jacobian at a point = −1/16).","formulas":["F39","F40","F41"],"qtypes":["Verify JJ'=1 for given u, v","Evaluate ∂(x,y,z)/∂(u,v,w) at a point using J'=1/J"],"example":{"q":"If $x=r\\cos\\theta,\\;y=r\\sin\\theta$, find $\\dfrac{\\partial(x,y)}{\\partial(r,\\theta)}$. <span class='src'>[Generated practice]<\/span>","steps":["$\\begin{vmatrix}x_r&x_\\theta\\\\y_r&y_\\theta\\end{vmatrix}=\\begin{vmatrix}\\cos\\theta&-r\\sin\\theta\\\\\\sin\\theta&r\\cos\\theta\\end{vmatrix}$","$=r\\cos^2\\theta+r\\sin^2\\theta=r$","Hence $\\frac{\\partial(r,\\theta)}{\\partial(x,y)}=\\frac1r$"]},"pyqs":["C1B","D2A"],"video":"v_jacob"},{"id":"composite","unit":"PD","order":15,"pri":"P2","diff":"Easy","time":15,"name":"Composite Functions & Chain Rule (wave equation)","sub":"z = f(x+ct) + φ(x−ct) ⇒ z_tt = c²z_xx","explain":"If $z=f(s)$ with $s=x+ct$ then $z_x=f'(s)\\,s_x=f'(s)$ and $z_t=f'(s)\\,s_t=c\\,f'(s)$. Differentiate twice and compare. The same chain-rule idea gives results like $u_x+u_y+u_z=0$ for $u=f(x-y,y-z,z-x)$.","why":"Oct-25 Q1A (5 marks, model answer split 2+2+1). Very short - good insurance marks.","formulas":["F42"],"qtypes":["Show $z_{tt}=c^2z_{xx}$","Show $u_x+u_y+u_z=0$ for symmetric differences"],"example":{"q":"If $u=f(x-y,\\,y-z,\\,z-x)$ show $u_x+u_y+u_z=0$. <span class='src'>[Generated practice]<\/span>","steps":["Let $r=x-y,\\;s=y-z,\\;t=z-x$","$u_x=u_r-u_t,\\;u_y=-u_r+u_s,\\;u_z=-u_s+u_t$","Add: $u_x+u_y+u_z=0$ ∎"]},"pyqs":["D1A"],"video":"v_pdbasic2"},{"id":"maxmin","unit":"PD","order":16,"pri":"P2","diff":"Hard","time":40,"name":"Maxima & Minima (two variables)","sub":"f_x = f_y = 0, then r, s, t and rt − s²","explain":"Stationary points: solve $f_x=0,\\;f_y=0$. At each, $r=f_{xx},\\;s=f_{xy},\\;t=f_{yy}$. $rt-s^2>0$ and $r<0\\Rightarrow$ maximum; $rt-s^2>0$ and $r>0\\Rightarrow$ minimum; $rt-s^2<0\\Rightarrow$ saddle (no extremum); $rt-s^2=0\\Rightarrow$ doubtful, investigate further.","why":"Once in the PYQs (Oct-24 Q2B, as the OR option) and 5 tutorial questions (T9 Q7-Q11). Procedural and reliable once practised, but each question takes longer - do it after the P1 topics.","formulas":["F43"],"qtypes":["Examine $f(x,y)$ for extreme values","Find stationary points and classify"],"example":{"q":"Examine $f=x^3+y^3-3axy\\;(a>0)$ for extreme values. <span class='src'>[Generated practice]<\/span>","steps":["$f_x=3x^2-3ay=0,\\;f_y=3y^2-3ax=0\\Rightarrow(0,0),(a,a)$","$r=6x,\\;s=-3a,\\;t=6y$","$(0,0)$: $rt-s^2=-9a^2<0\\Rightarrow$ saddle","$(a,a)$: $rt-s^2=36a^2-9a^2>0,\\;r=6a>0\\Rightarrow$ minimum, $f_{\\min}=-a^3$"]},"pyqs":["C2B"],"video":"v_maxmin"},{"id":"debasic","unit":"U2","order":17,"pri":"P3","diff":"Easy","time":25,"name":"DE basics: order, degree, variable separable, homogeneous","sub":"Definitions + y = vx substitution","explain":"Order = highest derivative; degree = power of that derivative after removing radicals/fractions. Variable separable: $g(y)dy=f(x)dx$. Homogeneous DE ($M,N$ homogeneous of the same degree): put $y=vx$, $\\frac{dy}{dx}=v+x\\frac{dv}{dx}$. Recognising 'homogeneous' is needed for IF Rule I.","why":"No PYQ asks this directly in your papers, but it supports Reducible-to-exact (Rule I) and is quick theory.","formulas":["F31"],"qtypes":["State order and degree","Solve by y = vx"],"example":{"q":"Order and degree of $\\left(\\dfrac{d^2y}{dx^2}\\right)^3+\\left(\\dfrac{dy}{dx}\\right)^4+y=0$? <span class='src'>[Generated practice]<\/span>","steps":["Highest derivative is $\\frac{d^2y}{dx^2}$ $\\Rightarrow$ order 2","Its power is 3 $\\Rightarrow$ degree 3"]},"pyqs":[],"video":"v_debasic"},{"id":"pca","unit":"U1","order":18,"pri":"P3","diff":"Easy","time":20,"name":"Principal Component Analysis (PCA)","sub":"Standardize → covariance → eigen → feature vector → recast","explain":"PCA reduces dimensions while keeping most information. Steps from your slides: (1) standardize $z=\\frac{x-\\bar x}{\\sigma}$; (2) covariance $S=\\frac{1}{n-1}BB^T$; (3) eigenvalues/eigenvectors of $S$ - eigenvectors are the principal directions, eigenvalues the variance carried; (4) feature vector = chosen eigenvectors; (5) recast data along them.","why":"In the Unit I syllabus but not asked in any of your 4 papers. Learn the 5 steps + advantages/disadvantages as theory insurance.","formulas":["F17","F18","F19"],"qtypes":["Explain PCA steps","Advantages / disadvantages / applications"],"example":{"q":"A covariance matrix is $S=\\begin{bmatrix}2&1\\\\1&2\\end{bmatrix}$. Find the first principal component and its share of variance. <span class='src'>[Generated practice]<\/span>","steps":["$\\lambda^2-4\\lambda+3=0\\Rightarrow\\lambda=3,1$","$\\lambda=3$: $x_1=x_2\\Rightarrow$ PC1 direction $\\frac{1}{\\sqrt2}(1,1)$","Variance share $=\\frac{3}{3+1}=75\\%$"]},"pyqs":[],"video":"v_pca"},{"id":"bern","unit":"U2","order":19,"pri":"P3","diff":"Medium","time":25,"name":"Bernoulli's Differential Equation","sub":"dy/dx + Py = Qyⁿ, put v = y¹⁻ⁿ","explain":"Divide by $y^n$ and put $v=y^{1-n}$: the equation becomes linear in $v$: $\\frac{dv}{dx}+(1-n)Pv=(1-n)Q$. Solve as a linear DE.","why":"Listed in your Unit II syllabus slide, but the slides contain no worked Bernoulli content and no PYQ asks it.","formulas":["F28"],"qtypes":["Solve $y'+Py=Qy^n$"],"example":{"q":"Solve $\\dfrac{dy}{dx}+\\dfrac{y}{x}=xy^2$. <span class='src'>[Generated practice]<\/span>","steps":["Divide by $y^2$: $y^{-2}y'+\\frac1x y^{-1}=x$; put $v=y^{-1}$, $v'=-y^{-2}y'$","$-v'+\\frac vx=x\\Rightarrow v'-\\frac vx=-x$","IF $=e^{-\\int dx/x}=\\frac1x$; $\\frac vx=\\int(-1)dx=-x+c$","$\\frac{1}{y}=cx-x^2$"]},"pyqs":[],"video":"v_bern"},{"id":"growth","unit":"U2","order":17.5,"pri":"P2","diff":"Easy","time":20,"name":"Growth & Decay applications","sub":"dx/dt = kx ⇒ x = x₀e^{kt}","explain":"Natural growth $\\frac{dx}{dt}=kx\\Rightarrow x=x_0e^{kt}$ ($k>0$). Decay $\\frac{dm}{dt}=-km\\Rightarrow m=m_0e^{-kt}$. Use the two given conditions to find $x_0$ and $k$; half-life $t_{1/2}=\\frac{\\ln 2}{k}$.","why":"Not in any of your PYQs, but 5 tutorial questions (T6 Q6-Q10) and two slide examples. Only one formula to learn - very quick, so it is worth 20 minutes.","formulas":["F29","F30"],"qtypes":["Population triples in 2 h - when is it 100x?","Half-life of radium"],"example":{"q":"A bacterial population triples between noon and 2 PM. When is it 100 times the noon value? <span class='src'>[Unit II slides, Growth Example 01]<\/span>","steps":["$B=B_0e^{kt}$; $3B_0=B_0e^{2k}\\Rightarrow k=\\tfrac12\\ln3=0.5493$","$100=e^{0.5493t}\\Rightarrow t=\\frac{\\ln100}{0.5493}=8.38$ h","About 8.38 hours after noon (~8:23 PM). (The slide writes '8.383 PM' - read it as 8.38 h after noon.)"]},"pyqs":[],"video":"v_growth"},{"id":"funcdep","unit":"PD","order":14.5,"pri":"P3","diff":"Easy","time":20,"name":"Functional Dependence","sub":"u, v (, w) dependent ⇔ Jacobian = 0; then find the relation","explain":"Functions $u,v$ of $x,y$ are <b>functionally dependent<\/b> (one is a function of the other) iff $\\dfrac{\\partial(u,v)}{\\partial(x,y)}=0$ identically. If dependent, eliminate $x,y$ to find the relation, e.g. by spotting a combination such as $x/y$ or using an identity like $(x+y+z)^2=\\sum x^2+2\\sum xy$.","why":"Not in your PYQs; 2 tutorial questions (T9 Q5, Q6). It reuses the Jacobian method, so it costs little extra time once Jacobians are done.","formulas":["F59","F39","F40"],"qtypes":["Test dependence by J = 0","Find the functional relation"],"example":{"q":"Are $u=x+y,\\;v=x^2+2xy+y^2$ functionally dependent? <span class='src'>[Generated practice]<\/span>","steps":["$J=\\begin{vmatrix}1&1\\\\2x+2y&2x+2y\\end{vmatrix}=0\\Rightarrow$ dependent","Relation: $v=(x+y)^2=u^2$"]},"pyqs":[],"video":"v_funcdep"},{"id":"dint","unit":"MI","order":21,"pri":"P2","diff":"Medium","time":45,"name":"Double Integration","sub":"Iterated integrals, limits from the region, infinite regions","explain":"Evaluate the inner integral first, treating the outer variable as a constant. For a region between curves, sketch it, find intersection points, and write $x$ from $a$ to $b$, $y$ from the lower curve to the upper curve. If an inner limit contains $x$, the inner variable must be $y$.","why":"Not in your 4 TA papers (they only cover Units I-IV topics), but 6 tutorial questions (T13). It is the base skill for area and volume (T15), so learn it first in this group.","formulas":["F60","F61"],"qtypes":["Evaluate a given iterated integral","Integrate over a region bounded by curves","Region extending to infinity"],"example":{"q":"Evaluate $\\int_0^1\\int_0^{x}xy\\,dy\\,dx$. <span class='src'>[Generated practice]<\/span>","steps":["Inner: $x\\left[\\frac{y^2}{2}\\right]_0^x=\\frac{x^3}{2}$","Outer: $\\int_0^1\\frac{x^3}{2}dx=\\frac18$"]},"pyqs":[],"video":"v_dint"},{"id":"areavol","unit":"MI","order":22,"pri":"P2","diff":"Medium","time":40,"name":"Area & Volume by Multiple Integrals","sub":"A = ∬ dx dy, V = ∭ dx dy dz, polar r dr dθ","explain":"Area of a region $R$: $A=\\iint_R dx\\,dy$. Volume of a solid: $V=\\iiint dx\\,dy\\,dz$, or $V=\\iint_R(z_{top}-z_{bottom})\\,dx\\,dy$. Circular symmetry ($x^2+y^2$) $\\Rightarrow$ polar coordinates with $dx\\,dy=r\\,dr\\,d\\theta$.","why":"6 tutorial questions (T15). Areas between a parabola and a line are quick, standard marks; volumes reuse double integration.","formulas":["F62","F63","F61","F64"],"qtypes":["Area between two curves","Area of (part of) an ellipse","Volume under a plane over a region","Volume between two surfaces (polar)"],"example":{"q":"Area between $y=x^2$ and $y=4$. <span class='src'>[Generated practice]<\/span>","steps":["Intersections $x=\\pm2$","$A=\\int_{-2}^{2}(4-x^2)dx=16-\\frac{16}{3}=\\frac{32}{3}$"]},"pyqs":[],"video":"v_areavol"},{"id":"tint","unit":"MI","order":23,"pri":"P2","diff":"Medium","time":35,"name":"Triple Integration","sub":"Innermost first; limits tell you the order","explain":"Integrate the innermost variable first (its limits may involve the other two), then the middle, then the outer variable with constant limits. If the printed $dx\\,dy\\,dz$ order disagrees with the limits, follow the limits.","why":"4 tutorial questions (T14). Pure calculation - reliable marks if you are careful with limits.","formulas":["F65","F64"],"qtypes":["Evaluate a given triple integral","Volume of a tetrahedron"],"example":{"q":"Evaluate $\\int_0^1\\int_0^1\\int_0^1(x+y+z)\\,dx\\,dy\\,dz$. <span class='src'>[Generated practice]<\/span>","steps":["Inner: $\\frac12+y+z$","Middle: $\\frac12+\\frac12+z=1+z$","Outer: $1+\\frac12=\\frac32$"]},"pyqs":[],"video":"v_tint"},{"id":"curve","unit":"MI","order":24,"pri":"P3","diff":"Hard","time":45,"name":"Curve Tracing","sub":"Symmetry, origin, tangents, asymptotes, region; polar roses","explain":"For a Cartesian curve check, in order: (1) symmetry (even powers of $y$ $\\Rightarrow$ about the x-axis, etc.), (2) does it pass through the origin, and the tangents there (lowest-degree terms = 0), (3) intercepts, (4) asymptotes parallel to the axes (equate the coefficient of the highest power of $y$ or $x$ to zero), (5) region where the curve exists. For roses $r=a\\cos n\\theta$ / $a\\sin n\\theta$: $n$ petals if $n$ is odd, $2n$ if even, each of length $a$.","why":"6 tutorial questions (T12) but no PYQ in your ZIP. Takes longer (needs a neat sketch), so it is lowest value per minute here - learn the checklist and the rose rule.","formulas":["F66","F67","F68","F69"],"qtypes":["Trace a Cartesian curve ($xy^2=\\dots$, $y^2(2a-x)=x^3$)","Trace a polar rose $r=a\\cos n\\theta$, $a\\sin n\\theta$"],"example":{"q":"How many petals does $r=a\\sin4\\theta$ have? <span class='src'>[Generated practice]<\/span>","steps":["$n=4$ is even $\\Rightarrow2n=8$ petals, each of length $a$"]},"pyqs":[],"video":"v_curve"}],"PYQS":[{"id":"A1A","paper":"A","q":"Q1 A","page":1,"marks":5,"topic":"eig","or":"Q1 or Q2","text":"Determine the eigen values of the matrix $A=\\begin{bmatrix}4&6&6\\\\1&3&2\\\\-1&-4&-3\\end{bmatrix}$ and also obtain the eigen vector corresponding to the smallest eigen value of $A$.","match":"Exact match: Unit I slides, Eigen Exercise 4 (same matrix).","steps":["$S_1=4+3-3=4$","$S_2=\\begin{vmatrix}3&2\\\\-4&-3\\end{vmatrix}+\\begin{vmatrix}4&6\\\\-1&-3\\end{vmatrix}+\\begin{vmatrix}4&6\\\\1&3\\end{vmatrix}=-1-6+6=-1$","$|A|=4(-9+8)-6(-3+2)+6(-4+3)=-4+6-6=-4$","$\\lambda^3-4\\lambda^2-\\lambda+4=0\\Rightarrow\\lambda^2(\\lambda-4)-(\\lambda-4)=0\\Rightarrow(\\lambda-4)(\\lambda^2-1)=0$","$\\lambda=-1,\\,1,\\,4$ (check: sum $=4=S_1$, product $=-4=|A|$)","Smallest $\\lambda=-1$: $(A+I)X=0$, rows $5x+6y+6z=0$ and $x+4y+2z=0$","Cramer: $\\dfrac{x}{12-24}=\\dfrac{-y}{10-6}=\\dfrac{z}{20-6}\\Rightarrow\\dfrac{x}{-12}=\\dfrac{y}{-4}=\\dfrac{z}{14}$","$X=\\begin{bmatrix}6\\\\2\\\\-7\\end{bmatrix}$ (any non-zero multiple, e.g. $(-6,-2,7)^T$)"],"answer":"$\\lambda=-1,1,4$; eigenvector for $\\lambda=-1$: $(6,2,-7)^T$."},{"id":"A1B","paper":"A","q":"Q1 B","page":1,"marks":5,"topic":"lu","or":"Q1 or Q2","text":"Find the LU decomposition of the matrix $A=\\begin{bmatrix}3&2&7\\\\2&3&1\\\\3&4&1\\end{bmatrix}$.","match":"Not in slides (same method as Unit I LU Example 1).","steps":["$A=LU$, $L=\\begin{bmatrix}1&0&0\\\\l_{21}&1&0\\\\l_{31}&l_{32}&1\\end{bmatrix}$, $U=\\begin{bmatrix}u_{11}&u_{12}&u_{13}\\\\0&u_{22}&u_{23}\\\\0&0&u_{33}\\end{bmatrix}$","Row 1: $u_{11}=3,\\;u_{12}=2,\\;u_{13}=7$","$l_{21}=\\frac23,\\;l_{31}=\\frac33=1$","$u_{22}=3-\\frac23(2)=\\frac53,\\quad u_{23}=1-\\frac23(7)=-\\frac{11}{3}$","$l_{32}=\\dfrac{4-1(2)}{5/3}=\\dfrac65$","$u_{33}=1-1(7)-\\frac65\\left(-\\frac{11}{3}\\right)=-6+\\frac{22}{5}=-\\frac85$","$L=\\begin{bmatrix}1&0&0\\\\\\frac23&1&0\\\\1&\\frac65&1\\end{bmatrix},\\;U=\\begin{bmatrix}3&2&7\\\\0&\\frac53&-\\frac{11}{3}\\\\0&0&-\\frac85\\end{bmatrix}$"],"answer":"$l_{21}=2/3,\\;l_{31}=1,\\;l_{32}=6/5$; $U$ diagonal $3,\\,5/3,\\,-8/5$."},{"id":"A2A","paper":"A","q":"Q2 A","page":1,"marks":5,"topic":"diag","or":"Q1 or Q2","text":"Show that the matrix $A=\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$ is diagonalizable. Then find matrix $P$ such that $P^{-1}AP$ is diagonal.","match":"Not in slides (same method as Diagonalization Example 1).","steps":["$\\lambda^2-7\\lambda+10=0\\Rightarrow\\lambda=2,5$ - distinct, so 2 independent eigenvectors $\\Rightarrow$ diagonalizable","$\\lambda=2$: $\\begin{bmatrix}2&1\\\\2&1\\end{bmatrix}X=0\\Rightarrow 2x+y=0\\Rightarrow X_1=(1,-2)^T$","$\\lambda=5$: $\\begin{bmatrix}-1&1\\\\2&-2\\end{bmatrix}X=0\\Rightarrow x=y\\Rightarrow X_2=(1,1)^T$","$P=\\begin{bmatrix}1&1\\\\-2&1\\end{bmatrix},\\;|P|=3,\\;P^{-1}=\\frac13\\begin{bmatrix}1&-1\\\\2&1\\end{bmatrix}$","$AP=\\begin{bmatrix}2&5\\\\-4&5\\end{bmatrix}$, $P^{-1}AP=\\frac13\\begin{bmatrix}6&0\\\\0&15\\end{bmatrix}=\\begin{bmatrix}2&0\\\\0&5\\end{bmatrix}$"],"answer":"$P=\\begin{bmatrix}1&1\\\\-2&1\\end{bmatrix}$, $D=\\text{diag}(2,5)$."},{"id":"A2B","paper":"A","q":"Q2 B","page":1,"marks":5,"topic":"chol","or":"Q1 or Q2","text":"Solve by Cholesky method: $9x_1+6x_2+12x_3=17.4,\\;6x_1+13x_2+11x_3=23.6,\\;12x_1+11x_2+26x_3=30.8$.","match":"Exact match: Unit I slides, Cholesky Example 2 (identical system and numbers).","steps":["$A=\\begin{bmatrix}9&6&12\\\\6&13&11\\\\12&11&26\\end{bmatrix}$ symmetric; $A=LL^T$","$l_{11}=3,\\;l_{21}=6/3=2,\\;l_{31}=12/3=4$","$l_{22}=\\sqrt{13-4}=3,\\;l_{32}=\\frac{11-2\\cdot4}{3}=1,\\;l_{33}=\\sqrt{26-16-1}=3$","$LZ=B$: $3z_1=17.4\\Rightarrow z_1=5.8$; $2(5.8)+3z_2=23.6\\Rightarrow z_2=4$; $4(5.8)+4+3z_3=30.8\\Rightarrow z_3=1.2$","$L^TX=Z$: $3x_3=1.2\\Rightarrow x_3=0.4$; $3x_2+x_3=4\\Rightarrow x_2=1.2$; $3x_1+2(1.2)+4(0.4)=5.8\\Rightarrow x_1=0.6$"],"answer":"$L=\\begin{bmatrix}3&0&0\\\\2&3&0\\\\4&1&3\\end{bmatrix}$, $x_1=0.6,\\;x_2=1.2,\\;x_3=0.4$."},{"id":"A3A","paper":"A","q":"Q3 A","page":2,"marks":5,"topic":"exact","or":"Q3 or Q4","text":"Obtain the general solution of $(2xy+e^y)\\,dx+(x^2+xe^y)\\,dy=0$.","match":"Exact match: Unit II slides, Exact Example 03 (the slide also adds y(1)=0, giving c=1).","steps":["$M=2xy+e^y,\\;N=x^2+xe^y$","$M_y=2x+e^y=N_x\\Rightarrow$ exact","$\\int M\\,dx\\;(y\\text{ const})=x^2y+xe^y$; every term of $N$ contains $x$","General solution: $x^2y+xe^y=c$"],"answer":"$x^2y+xe^y=c$ (the handwritten key writes '$y=$' - the correct right side is the constant $c$)."},{"id":"A3B","paper":"A","q":"Q3 B","page":2,"marks":5,"topic":"linear","or":"Q3 or Q4","text":"Solve $(1+x^2)\\dfrac{dy}{dx}+y=e^{\\tan^{-1}x}$.","match":"Exact match: Unit II slides, Linear DE Exercise 1.","steps":["Divide by $1+x^2$: $\\dfrac{dy}{dx}+\\dfrac{1}{1+x^2}y=\\dfrac{e^{\\tan^{-1}x}}{1+x^2}$","$\\text{IF}=e^{\\int\\frac{dx}{1+x^2}}=e^{\\tan^{-1}x}$","$y\\,e^{\\tan^{-1}x}=\\int\\dfrac{e^{2\\tan^{-1}x}}{1+x^2}dx$; put $t=\\tan^{-1}x,\\;dt=\\frac{dx}{1+x^2}$","$=\\int e^{2t}dt=\\frac{e^{2t}}{2}+c$","$y\\,e^{\\tan^{-1}x}=\\tfrac12e^{2\\tan^{-1}x}+c$"],"answer":"$y\\,e^{\\tan^{-1}x}=\\tfrac12 e^{2\\tan^{-1}x}+c$"},{"id":"A4A","paper":"A","q":"Q4 A","page":2,"marks":5,"topic":"form","or":"Q3 or Q4","text":"Form the differential equation by eliminating the arbitrary constants from $y=A\\sin(\\log x)+B\\cos(\\log x)$.","match":"Exact match (A, B swapped): Unit II slides, Formation Example 02.","steps":["Two constants $\\Rightarrow$ differentiate twice","$y_1=\\dfrac{A\\cos(\\log x)-B\\sin(\\log x)}{x}\\Rightarrow xy_1=A\\cos(\\log x)-B\\sin(\\log x)$","Differentiate: $xy_2+y_1=\\dfrac{-A\\sin(\\log x)-B\\cos(\\log x)}{x}=-\\dfrac{y}{x}$","$x^2y_2+xy_1+y=0$"],"answer":"$x^2\\dfrac{d^2y}{dx^2}+x\\dfrac{dy}{dx}+y=0$"},{"id":"A4B","paper":"A","q":"Q4 B","page":2,"marks":5,"topic":"reduc","or":"Q3 or Q4","text":"Reduce $(x^2y-2xy^2)\\,dx-(x^3-3x^2y)\\,dy=0$ into an exact differential equation and find the general solution.","match":"Exact match: Unit II slides, Reducible-to-exact Example 01.","steps":["$M=x^2y-2xy^2,\\;N=-x^3+3x^2y$; $M_y=x^2-4xy\\neq N_x=-3x^2+6xy$","Homogeneous of degree 3 $\\Rightarrow$ Rule I","$Mx+Ny=x^3y-2x^2y^2-x^3y+3x^2y^2=x^2y^2\\Rightarrow\\text{IF}=\\frac{1}{x^2y^2}$","$\\left(\\frac1y-\\frac2x\\right)dx+\\left(-\\frac{x}{y^2}+\\frac3y\\right)dy=0$; $M_y=-\\frac1{y^2}=N_x$ ✓","$\\int\\left(\\frac1y-\\frac2x\\right)dx+\\int\\frac3y\\,dy=c$","$\\frac xy-2\\log x+3\\log y=c$"],"answer":"$\\dfrac xy-2\\log x+3\\log y=c$, i.e. $\\dfrac xy+\\log\\dfrac{y^3}{x^2}=c$"},{"id":"B1A","paper":"B","q":"Q1 A","page":1,"marks":5,"topic":"eig","or":"Q1 or Q2","text":"Determine the eigen values of $A=\\begin{bmatrix}8&-8&-2\\\\4&-3&-2\\\\3&-4&1\\end{bmatrix}$ and obtain the eigen vector corresponding to the largest eigen value.","match":"Exact match: Unit I slides, Eigen Example 2 (fully worked there).","steps":["$S_1=8-3+1=6$","$S_2=\\begin{vmatrix}-3&-2\\\\-4&1\\end{vmatrix}+\\begin{vmatrix}8&-2\\\\3&1\\end{vmatrix}+\\begin{vmatrix}8&-8\\\\4&-3\\end{vmatrix}=-11+14+8=11$","$|A|=8(-11)+8(10)-2(-7)=6$","$\\lambda^3-6\\lambda^2+11\\lambda-6=0\\Rightarrow(\\lambda-1)(\\lambda-2)(\\lambda-3)=0$","Largest $\\lambda=3$: $\\begin{bmatrix}5&-8&-2\\\\4&-6&-2\\\\3&-4&-2\\end{bmatrix}X=0$","Rows 1, 2: $\\dfrac{x}{16-12}=\\dfrac{-y}{-10+8}=\\dfrac{z}{-30+32}\\Rightarrow\\dfrac x4=\\dfrac y2=\\dfrac z2$","$X_3=(2,1,1)^T$"],"answer":"$\\lambda=1,2,3$; for $\\lambda=3$: $(2,1,1)^T$. (Others: $\\lambda=1\\to(4,3,2)^T$, $\\lambda=2\\to(3,2,1)^T$.)"},{"id":"B1B","paper":"B","q":"Q1 B","page":1,"marks":5,"topic":"lu","or":"Q1 or Q2","text":"Find the LU decomposition of $A=\\begin{bmatrix}2&2&3\\\\4&-2&1\\\\1&5&4\\end{bmatrix}$.","match":"Exact match: Unit I slides, LU Example 2 (there it also solves AX=B with B=(4,9,3)).","steps":["$u_{11}=2,\\;u_{12}=2,\\;u_{13}=3$","$l_{21}=4/2=2,\\;l_{31}=1/2$","$u_{22}=-2-2(2)=-6,\\;u_{23}=1-2(3)=-5$","$l_{32}=\\dfrac{5-\\frac12(2)}{-6}=-\\dfrac23$","$u_{33}=4-\\frac12(3)-\\left(-\\frac23\\right)(-5)=4-\\frac32-\\frac{10}{3}=-\\frac56$","$L=\\begin{bmatrix}1&0&0\\\\2&1&0\\\\\\frac12&-\\frac23&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&2&3\\\\0&-6&-5\\\\0&0&-\\frac56\\end{bmatrix}$","(Slide extension, B=(4,9,3)): $Z=(4,1,5/3)$, $X=(7/2,\\,3/2,\\,-2)$"],"answer":"$l_{21}=2,\\;l_{31}=+\\tfrac12,\\;l_{32}=-\\tfrac23$; $U$ diagonal $2,-6,-5/6$."},{"id":"B2A","paper":"B","q":"Q2 A","page":1,"marks":5,"topic":"diag","or":"Q1 or Q2","text":"Show that $A=\\begin{bmatrix}-4&-6\\\\3&5\\end{bmatrix}$ is diagonalizable. Then find $P$ such that $P^{-1}AP$ is diagonal.","match":"Exact match: Unit I slides, Diagonalization Exercise 2 (also Eigen Exercise 2).","steps":["$S_1=1,\\;|A|=-20+18=-2\\Rightarrow\\lambda^2-\\lambda-2=0\\Rightarrow\\lambda=-1,2$ (distinct)","$\\lambda=-1$: $-3x-6y=0\\Rightarrow X_1=(-2,1)^T$","$\\lambda=2$: $-6x-6y=0\\Rightarrow X_2=(-1,1)^T$","$P=\\begin{bmatrix}-2&-1\\\\1&1\\end{bmatrix},\\;|P|=-1,\\;P^{-1}=\\begin{bmatrix}-1&-1\\\\1&2\\end{bmatrix}$","$P^{-1}AP=\\begin{bmatrix}-1&0\\\\0&2\\end{bmatrix}$"],"answer":"$P=\\begin{bmatrix}-2&-1\\\\1&1\\end{bmatrix}$, $D=\\text{diag}(-1,2)$."},{"id":"B2B","paper":"B","q":"Q2 B","page":1,"marks":5,"topic":"chol","or":"Q1 or Q2","text":"Solve by Cholesky method: $4x_1+2x_2+14x_3=14,\\;2x_1+17x_2-5x_3=-101,\\;14x_1-5x_2+83x_3=155$.","match":"Not in slides (same method as Cholesky Example 2).","steps":["$l_{11}=\\sqrt4=2,\\;l_{21}=2/2=1,\\;l_{31}=14/2=7$","$l_{22}=\\sqrt{17-1}=4,\\;l_{32}=\\frac{-5-7(1)}{4}=-3,\\;l_{33}=\\sqrt{83-49-9}=5$","$LZ=B$: $2z_1=14\\Rightarrow z_1=7$; $7+4z_2=-101\\Rightarrow z_2=-27$; $49+81+5z_3=155\\Rightarrow z_3=5$","$L^TX=Z$: $5x_3=5\\Rightarrow x_3=1$; $4x_2-3(1)=-27\\Rightarrow x_2=-6$; $2x_1-6+7=7\\Rightarrow x_1=3$"],"answer":"$L=\\begin{bmatrix}2&0&0\\\\1&4&0\\\\7&-3&5\\end{bmatrix}$, $x_1=3,\\;x_2=-6,\\;x_3=1$."},{"id":"B3A","paper":"B","q":"Q3 A","page":2,"marks":5,"topic":"exact","or":"Q3 or Q4","text":"Find the general solution of $(1+xy^2)\\,dx+(1+x^2y)\\,dy=0$.","match":"Exact match: Unit II slides, Exact DE Exercise 1.","steps":["$M_y=2xy=N_x\\Rightarrow$ exact","$\\int M\\,dx=x+\\frac{x^2y^2}{2}$","Terms of $N$ free of $x$: $1\\Rightarrow\\int1\\,dy=y$","$x+\\frac{x^2y^2}{2}+y=c$"],"answer":"$x+y+\\dfrac{x^2y^2}{2}=c$"},{"id":"B3B","paper":"B","q":"Q3 B","page":2,"marks":5,"topic":"linear","or":"Q3 or Q4","text":"Solve $x^2\\dfrac{dy}{dx}=3x^2-2xy+1$.","match":"Exact match: Unit II slides, Linear DE Exercise 2.","steps":["Divide by $x^2$: $\\dfrac{dy}{dx}+\\dfrac2xy=3+\\dfrac{1}{x^2}$","$\\text{IF}=e^{\\int 2/x\\,dx}=x^2$","$yx^2=\\int\\left(3+\\frac1{x^2}\\right)x^2dx=\\int(3x^2+1)dx$","$x^2y=x^3+x+c$"],"answer":"$x^2y=x^3+x+c$"},{"id":"B4A","paper":"B","q":"Q4 A","page":2,"marks":5,"topic":"form","or":"Q3 or Q4","text":"Form the differential equation whose general solution is $y=ae^{-2x}+be^{-3x}$.","match":"Exact match: Unit II slides, Formation Exercise 1.","steps":["$y_1=-2ae^{-2x}-3be^{-3x}$","$y_2=4ae^{-2x}+9be^{-3x}$","$y_2+5y_1+6y=(4-10+6)ae^{-2x}+(9-15+6)be^{-3x}=0$","$\\dfrac{d^2y}{dx^2}+5\\dfrac{dy}{dx}+6y=0$"],"answer":"$y''+5y'+6y=0$"},{"id":"B4B","paper":"B","q":"Q4 B","page":2,"marks":5,"topic":"reduc","or":"Q3 or Q4","text":"Obtain the integrating factor of $(1+xy)y\\,dx+(1-xy)x\\,dy=0$ and use it to find the general solution.","match":"Exact match: Unit II slides, Reducible Exercise 4.","steps":["Form $y f_1(xy)dx+xf_2(xy)dy\\Rightarrow$ Rule II","$Mx-Ny=xy(1+xy)-xy(1-xy)=2x^2y^2\\Rightarrow\\text{IF}=\\frac{1}{2x^2y^2}$","$\\left(\\frac{1}{2x^2y}+\\frac{1}{2x}\\right)dx+\\left(\\frac{1}{2xy^2}-\\frac{1}{2y}\\right)dy=0$ (exact)","$\\int M\\,dx=-\\frac{1}{2xy}+\\frac12\\log x$; $N$ terms free of $x$: $-\\frac1{2y}\\Rightarrow-\\frac12\\log y$","$-\\frac{1}{2xy}+\\frac12\\log x-\\frac12\\log y=c$"],"answer":"$\\log\\dfrac xy-\\dfrac{1}{xy}=C$"},{"id":"C1A","paper":"C","q":"Q1 A","page":1,"marks":5,"topic":"euler","or":"Q1 or Q2","text":"If $u=\\tan^{-1}\\left(\\dfrac{x^3+y^3}{x+y}\\right)$ then show that $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=\\sin2u\\,[1-4\\sin^2u]$.","match":"No slides available for this unit.","steps":["$f(u)=\\tan u=\\frac{x^3+y^3}{x+y}$ is homogeneous of degree $n=3-1=2$","$g(u)=n\\dfrac{f(u)}{f'(u)}=\\dfrac{2\\tan u}{\\sec^2u}=2\\sin u\\cos u=\\sin2u$","So $xu_x+yu_y=\\sin 2u$","$g'(u)=2\\cos2u$; corollary: $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(u)[g'(u)-1]$","$=\\sin2u\\,(2\\cos2u-1)=\\sin2u\\,(2-4\\sin^2u-1)=\\sin2u\\,(1-4\\sin^2u)$ ∎"],"answer":"Use $g(u)=\\sin 2u$ and $g(g'-1)$."},{"id":"C1B","paper":"C","q":"Q1 B","page":1,"marks":5,"topic":"jacob","or":"Q1 or Q2","text":"Calculate $J=\\dfrac{\\partial(u,v)}{\\partial(x,y)}$ and $J'=\\dfrac{\\partial(x,y)}{\\partial(u,v)}$ and verify $JJ'=1$, given $u=x+\\dfrac{y^2}{x},\\;v=\\dfrac{y^2}{x}$.","match":"No slides available for this unit.","steps":["$J=\\begin{vmatrix}1-\\frac{y^2}{x^2}&\\frac{2y}{x}\\\\-\\frac{y^2}{x^2}&\\frac{2y}{x}\\end{vmatrix}=\\frac{2y}{x}\\left(1-\\frac{y^2}{x^2}\\right)+\\frac{2y}{x}\\cdot\\frac{y^2}{x^2}=\\frac{2y}{x}$","Inverse: $u-v=x\\Rightarrow x=u-v$; $y^2=vx=v(u-v)\\Rightarrow y=\\sqrt{v(u-v)}$","$x_u=1,\\;x_v=-1,\\;y_u=\\frac{v}{2y},\\;y_v=\\frac{u-2v}{2y}$","$J'=\\frac{u-2v}{2y}+\\frac{v}{2y}=\\frac{u-v}{2y}=\\frac{x}{2y}$","$JJ'=\\frac{2y}{x}\\cdot\\frac{x}{2y}=1$ ✓"],"answer":"$J=\\frac{2y}{x},\\;J'=\\frac{x}{2y},\\;JJ'=1$"},{"id":"C2A","paper":"C","q":"Q2 A","page":1,"marks":5,"topic":"pdbasic","or":"Q1 or Q2","text":"If $u=\\log(\\tan x+\\tan y+\\tan z)$ then show that $\\sin2x\\,u_x+\\sin2y\\,u_y+\\sin2z\\,u_z=2$.","match":"No slides available for this unit.","steps":["Let $S=\\tan x+\\tan y+\\tan z$; $u_x=\\dfrac{\\sec^2x}{S}$","$\\sin2x\\,u_x=\\dfrac{2\\sin x\\cos x}{\\cos^2x\\,S}=\\dfrac{2\\tan x}{S}$","Similarly $\\sin2y\\,u_y=\\frac{2\\tan y}{S}$, $\\sin2z\\,u_z=\\frac{2\\tan z}{S}$","Sum $=\\dfrac{2(\\tan x+\\tan y+\\tan z)}{S}=2$ ∎"],"answer":"= 2"},{"id":"C2B","paper":"C","q":"Q2 B","page":1,"marks":5,"topic":"maxmin","or":"Q1 or Q2","text":"Examine the function $f(x,y)=x^4+y^4-2x^2+4xy-2y^2$ for extreme values.","match":"No slides available for this unit.","steps":["$f_x=4x^3-4x+4y=0,\\;f_y=4y^3+4x-4y=0$","Add: $x^3+y^3=0\\Rightarrow y=-x$; then $x^3-2x=0\\Rightarrow x=0,\\pm\\sqrt2$","Points: $(0,0),\\;(\\sqrt2,-\\sqrt2),\\;(-\\sqrt2,\\sqrt2)$","$r=12x^2-4,\\;s=4,\\;t=12y^2-4$","At $(\\pm\\sqrt2,\\mp\\sqrt2)$: $r=20,\\,t=20,\\,rt-s^2=384>0,\\,r>0\\Rightarrow$ minimum; $f=4+4-4-8-4=-8$","At $(0,0)$: $r=t=-4,\\,s=4\\Rightarrow rt-s^2=0$ (doubtful). $f(x,0)=x^4-2x^2<0$ but $f(x,x)=2x^4>0$ near 0 $\\Rightarrow$ no extremum"],"answer":"Minimum value $-8$ at $(\\sqrt2,-\\sqrt2)$ and $(-\\sqrt2,\\sqrt2)$; no extremum at $(0,0)$."},{"id":"C3A","paper":"C","q":"Q3 A","page":2,"marks":5,"topic":"duis1","or":"Q3 or Q4","text":"Show that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}\\,dx=\\log\\left(\\frac ba\\right),\\;a,b>0$.","match":"Exact repeat: same question as TA-II Oct-2025 Q3 A.","steps":["Let $I(a)=\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx$ ($b$ fixed)","DUIS Rule I: $\\dfrac{dI}{da}=\\int_0^\\infty\\frac{-xe^{-ax}}{x}dx=-\\int_0^\\infty e^{-ax}dx=-\\frac1a$","$I(a)=-\\log a+c$","When $a=b$ the integrand is 0, so $I(b)=0\\Rightarrow c=\\log b$","$I=\\log b-\\log a=\\log\\frac ba$ ∎"],"answer":"$\\log(b/a)$"},{"id":"C3B","paper":"C","q":"Q3 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","text":"Prove that $\\displaystyle\\int_a^b e^{-x^2}dx=\\frac{\\sqrt\\pi}{2}\\left[\\text{erf}(b)-\\text{erf}(a)\\right]$.","match":"No slides available for this unit.","steps":["Definition: $\\text{erf}(t)=\\frac{2}{\\sqrt\\pi}\\int_0^te^{-u^2}du\\Rightarrow\\int_0^te^{-u^2}du=\\frac{\\sqrt\\pi}{2}\\text{erf}(t)$","$\\int_a^b=\\int_a^0+\\int_0^b=\\int_0^b-\\int_0^a$","$=\\frac{\\sqrt\\pi}{2}\\text{erf}(b)-\\frac{\\sqrt\\pi}{2}\\text{erf}(a)$ ∎"],"answer":"Split at 0 and use the definition."},{"id":"C4A","paper":"C","q":"Q4 A","page":2,"marks":5,"topic":"duis2","or":"Q3 or Q4","text":"If $y=\\displaystyle\\int_0^x f(t)\\sin a(x-t)\\,dt$, show that $\\dfrac{d^2y}{dx^2}+a^2y=af(x)$.","match":"Same concept as TA-II Oct-2025 Q4 A (Leibnitz rule).","steps":["Leibnitz: $\\frac{dy}{dx}=\\int_0^x af(t)\\cos a(x-t)dt+f(x)\\sin a(x-x)\\cdot1-0$","$=a\\int_0^x f(t)\\cos a(x-t)dt$ (since $\\sin0=0$)","$\\frac{d^2y}{dx^2}=a\\int_0^x-af(t)\\sin a(x-t)dt+af(x)\\cos0=-a^2y+af(x)$","$\\Rightarrow y''+a^2y=af(x)$ ∎"],"answer":"Differentiate twice with Leibnitz."},{"id":"C4B","paper":"C","q":"Q4 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","text":"Prove that $\\dfrac{d}{dx}[\\text{erf}(x)]=\\dfrac{2}{\\sqrt\\pi}e^{-x^2}$ and use it to show $\\dfrac{d}{dx}[\\text{erf}(ax^n)]=\\dfrac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}$.","match":"No slides available for this unit.","steps":["$\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^xe^{-u^2}du$; Leibnitz (or FTC): $\\frac{d}{dx}\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}e^{-x^2}$","$\\text{erf}(ax^n)=\\frac{2}{\\sqrt\\pi}\\int_0^{ax^n}e^{-u^2}du$","$\\frac{d}{dx}=\\frac{2}{\\sqrt\\pi}e^{-(ax^n)^2}\\cdot\\frac{d}{dx}(ax^n)=\\frac{2}{\\sqrt\\pi}e^{-a^2x^{2n}}\\cdot anx^{n-1}$","$=\\dfrac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}$ ∎"],"answer":"Chain rule on the upper limit."},{"id":"D1A","paper":"D","q":"Q1 A","page":1,"marks":5,"topic":"composite","or":"Q1 or Q2","co":"CO3/L3","text":"If $z=f(x+ct)+\\varphi(x-ct)$ then show that $\\dfrac{\\partial^2z}{\\partial t^2}=c^2\\dfrac{\\partial^2z}{\\partial x^2}$.","match":"Model solution on PDF page 3 (mark split 2 + 2 + 1).","steps":["$z_x=f'(x+ct)+\\varphi'(x-ct)$, $z_{xx}=f''(x+ct)+\\varphi''(x-ct)$ [2 marks]","$z_t=cf'(x+ct)-c\\varphi'(x-ct)$, $z_{tt}=c^2f''+c^2\\varphi''=c^2[f''+\\varphi'']$ [2 marks]","Hence $z_{tt}=c^2z_{xx}$ [1 mark]"],"answer":"$z_{tt}=c^2z_{xx}$"},{"id":"D1B","paper":"D","q":"Q1 B","page":1,"marks":5,"topic":"euler","or":"Q1 or Q2","co":"CO3/L4","text":"If $u=\\sin^{-1}(x^3+y^3)$ then find $xu_x+yu_y$ and $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}$.","match":"Model solution on PDF pages 3-4.","steps":["$f(u)=\\sin u=x^3+y^3$ homogeneous, $n=3$ [1 mark]","$xu_x+yu_y=n\\frac{f(u)}{f'(u)}=3\\frac{\\sin u}{\\cos u}=3\\tan u$ [2 marks]","$g(u)=3\\tan u,\\;g'(u)=3\\sec^2u$","$x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(g'-1)=3\\tan u\\,(3\\sec^2u-1)$ [2 marks]"],"answer":"$3\\tan u$ and $3\\tan u(3\\sec^2u-1)$"},{"id":"D2A","paper":"D","q":"Q2 A","page":1,"marks":5,"topic":"jacob","or":"Q1 or Q2","co":"CO3/L4","text":"If $u=x^2+3y^2-z^3,\\;v=4x^2yz,\\;w=2z^2-xy$, evaluate $\\dfrac{\\partial(x,y,z)}{\\partial(u,v,w)}$ at $(1,1,0)$.","match":"Model solution on PDF page 4.","steps":["By $JJ'=1$: $\\frac{\\partial(x,y,z)}{\\partial(u,v,w)}=1\\Big/\\frac{\\partial(u,v,w)}{\\partial(x,y,z)}$ [1 mark]","$J=\\begin{vmatrix}2x&6y&-3z^2\\\\8xyz&4x^2z&4x^2y\\\\-y&-x&4z\\end{vmatrix}$","At $(1,1,0)$: $J=\\begin{vmatrix}2&6&0\\\\0&0&4\\\\-1&-1&0\\end{vmatrix}=2(0+4)-6(0+4)+0=-16$ [3 marks]","$\\frac{\\partial(x,y,z)}{\\partial(u,v,w)}=-\\frac{1}{16}$ [1 mark]"],"answer":"$-\\dfrac1{16}$ (tip: substitute the point before expanding)"},{"id":"D2B","paper":"D","q":"Q2 B","page":1,"marks":5,"topic":"euler","or":"Q1 or Q2","co":"CO3/L3","text":"If $u=\\dfrac{xyz}{2x+y+z}+\\log\\left(\\dfrac{x^2+y^2+z^2}{xy+yz}\\right)$ then find $xu_x+yu_y+zu_z$.","match":"Model solution on PDF page 5.","steps":["$u=U+W$, $U=\\frac{xyz}{2x+y+z}$, $W=\\log\\frac{x^2+y^2+z^2}{xy+yz}$","$U(tx,ty,tz)=\\frac{t^3xyz}{t(2x+y+z)}=t^2U\\Rightarrow n=2\\Rightarrow\\sum xU_x=2U$ [2 marks]","$e^W=\\frac{x^2+y^2+z^2}{xy+yz}$ is homogeneous of degree 0 $\\Rightarrow\\sum xW_x=0\\cdot\\frac{e^W}{e^W}=0$ [2 marks]","$xu_x+yu_y+zu_z=\\dfrac{2xyz}{2x+y+z}$ [1 mark]"],"answer":"$\\dfrac{2xyz}{2x+y+z}$"},{"id":"D3A","paper":"D","q":"Q3 A","page":1,"marks":5,"topic":"duis1","or":"Q3 or Q4","co":"CO4/L3","text":"Show that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}\\,dx=\\log\\left(\\frac ba\\right),\\;a,b>0$.","match":"Exact repeat of TA-II Oct-2024 Q3 A. Model solution on PDF pages 5-6.","steps":["$I(a)=\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx$","$\\frac{dI}{da}=-\\int_0^\\infty e^{-ax}dx=-\\frac1a$ [2 marks]","$I=-\\log a+c$; $a=b\\Rightarrow I=0\\Rightarrow c=\\log b$ [2 marks]","$I=\\log\\frac ba$ [1 mark]","Note: the 2025 model answer splits into $I(a)-I(b)$ and differentiates each; the single-parameter route above is cleaner (each separate piece diverges)."],"answer":"$\\log(b/a)$"},{"id":"D3B","paper":"D","q":"Q3 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","co":"CO4/L4","text":"Show that $\\displaystyle\\int_0^\\infty e^{-x^2-2ax}dx=\\frac{\\sqrt\\pi}{2}e^{a^2}\\,\\text{erfc}(a)$.","match":"Model solution on PDF pages 6-7.","steps":["Complete the square: $-x^2-2ax=-(x+a)^2+a^2$ [1 mark]","$\\text{LHS}=e^{a^2}\\int_0^\\infty e^{-(x+a)^2}dx$; put $x+a=t$: $x=0\\to t=a$, $x=\\infty\\to t=\\infty$ [1 mark]","$=e^{a^2}\\int_a^\\infty e^{-t^2}dt=e^{a^2}\\cdot\\frac{\\sqrt\\pi}{2}\\text{erfc}(a)$ [3 marks]"],"answer":"$\\frac{\\sqrt\\pi}{2}e^{a^2}\\text{erfc}(a)$"},{"id":"D4A","paper":"D","q":"Q4 A","page":2,"marks":5,"topic":"duis2","or":"Q3 or Q4","co":"CO4/L3","text":"If $f(x)=\\displaystyle\\int_0^x(x-t)^2G(t)\\,dt$ then show that $\\dfrac{d^3f}{dx^3}-2G(x)=0$.","match":"Same concept as TA-II Oct-2024 Q4 A. Model solution on PDF page 7.","steps":["Leibnitz: $f'=\\int_0^x2(x-t)G(t)dt+(x-x)^2G(x)-0=\\int_0^x2(x-t)G(t)dt$ [2 marks]","$f''=\\int_0^x2G(t)dt+2(x-x)G(x)=2\\int_0^xG(t)dt$ [2 marks]","$f'''=2G(x)\\Rightarrow f'''-2G(x)=0$ [1 mark]"],"answer":"$f'''=2G(x)$"},{"id":"D4B","paper":"D","q":"Q4 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","co":"CO4/L4","text":"Define the Error function and Complementary Error function and hence prove $\\text{erfc}(-x)+\\text{erfc}(x)=2$.","match":"Model solution on PDF page 8.","steps":["$\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^xe^{-u^2}du$ [1 mark]","$\\text{erfc}(x)=\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}du$ [1 mark]","$\\text{erf}+\\text{erfc}=1\\Rightarrow\\text{erfc}(-x)=1-\\text{erf}(-x)$ [1 mark]","LHS $=1-\\text{erf}(-x)+1-\\text{erf}(x)$ [1 mark]","erf is odd: $\\text{erf}(-x)=-\\text{erf}(x)\\Rightarrow$ LHS $=2$ [1 mark]"],"answer":"= 2"}],"REPEATS":[{"kind":"Exact repeat across years","title":"Frullani integral $\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$","items":["C3A","D3A"],"note":"Same wording, same marks (5), same slot (Q3 A) in Oct-2024 and Oct-2025."},{"kind":"Exact repeat of a slide example","title":"Cholesky: 9x₁+6x₂+12x₃=17.4 ...","items":["A2B"],"slide":"Unit I slides - Cholesky Example 2","note":"Identical numbers; slide shows full working."},{"kind":"Exact repeat of a slide example","title":"Eigen 3x3: [[8,-8,-2],[4,-3,-2],[3,-4,1]]","items":["B1A"],"slide":"Unit I slides - Eigen Example 2"},{"kind":"Exact repeat of a slide exercise","title":"Eigen 3x3: [[4,6,6],[1,3,2],[-1,-4,-3]]","items":["A1A"],"slide":"Unit I slides - Eigen Exercise 4 (answers printed)"},{"kind":"Exact repeat of a slide example","title":"LU: [[2,2,3],[4,-2,1],[1,5,4]]","items":["B1B"],"slide":"Unit I slides - LU Example 2"},{"kind":"Exact repeat of a slide exercise","title":"Diagonalize [[-4,-6],[3,5]]","items":["B2A"],"slide":"Unit I slides - Diagonalization Exercise 2"},{"kind":"Exact repeat of a slide example","title":"Exact: (2xy+e^y)dx+(x²+xe^y)dy=0","items":["A3A"],"slide":"Unit II slides - Exact Example 03"},{"kind":"Exact repeat of a slide exercise","title":"Exact: (1+xy²)dx+(1+x²y)dy=0","items":["B3A"],"slide":"Unit II slides - Exact Exercise 1"},{"kind":"Exact repeat of a slide exercise","title":"Linear: (1+x²)y'+y=e^{tan⁻¹x}","items":["A3B"],"slide":"Unit II slides - Linear Exercise 1"},{"kind":"Exact repeat of a slide exercise","title":"Linear: x²y'=3x²-2xy+1","items":["B3B"],"slide":"Unit II slides - Linear Exercise 2"},{"kind":"Exact repeat of a slide example","title":"Formation: y = A sin(log x) + B cos(log x)","items":["A4A"],"slide":"Unit II slides - Formation Example 02 (A, B swapped)"},{"kind":"Exact repeat of a slide exercise","title":"Formation: y = ae^{-2x}+be^{-3x}","items":["B4A"],"slide":"Unit II slides - Formation Exercise 1"},{"kind":"Exact repeat of a slide example","title":"Reducible (Rule I): (x²y-2xy²)dx-(x³-3x²y)dy=0","items":["A4B"],"slide":"Unit II slides - Reducible Example 01"},{"kind":"Exact repeat of a slide exercise","title":"Reducible (Rule II): (1+xy)y dx+(1-xy)x dy=0","items":["B4B"],"slide":"Unit II slides - Reducible Exercise 4"}],"GROUPS":[{"title":"Error function manipulations","method":"Definition of erf/erfc + split limits / Leibnitz / complete the square","items":["C3B","C4B","D3B","D4B"]},{"title":"Euler's theorem (corollary g(u) = n f/f')","method":"Find n by x→tx; g(u)=nf/f'; second order g(g'−1)","items":["C1A","D1B","D2B"]},{"title":"Leibnitz rule with integrand vanishing at t = x","method":"Differentiate under the sign repeatedly; boundary term uses f(x,x)","items":["C4A","D4A"]},{"title":"Jacobian + JJ' = 1","method":"Compute J; inverse Jacobian is 1/J","items":["C1B","D2A"]},{"title":"Eigenvalues of a 3x3 + one eigenvector","method":"S1, S2, |A| shortcut; Cramer's rule on two rows","items":["A1A","B1A"]},{"title":"2x2 diagonalization","method":"Distinct eigenvalues ⇒ P of eigenvectors, D = diag","items":["A2A","B2A"]},{"title":"Triangular factorisation of 3x3","method":"Compare entries of LU or LLᵀ; forward then backward substitution","items":["A1B","B1B","A2B","B2B"]},{"title":"Exact DE","method":"M_y = N_x; ∫M dx + ∫(N without x) dy = c","items":["A3A","B3A","A4B","B4B"]},{"title":"Linear first-order DE","method":"Standard form, IF = e^{∫P}","items":["A3B","B3B"]},{"title":"Formation by eliminating 2 constants","method":"Differentiate twice and recombine","items":["A4A","B4A"]}],"VALUABLE":[{"id":"C3A","why":"Only exact repeat across two different years (Oct-24 and Oct-25, both Q3 A). 4 lines of working."},{"id":"A3A","why":"Exact DE, copied from Unit II Example 03. The quickest 5 marks: one test, one integral."},{"id":"A2B","why":"Cholesky system identical to Unit I Example 2 - integer L, answers 0.6, 1.2, 0.4 to self-check."},{"id":"D4B","why":"erf/erfc definitions + odd property. Definitions alone are 2 of 5 marks; erf appears in 4 TA-II questions."},{"id":"C1A","why":"Teaches the full Euler corollary (first and second order) used in 3 TA-II questions."},{"id":"B1A","why":"3x3 eigenvalue problem fully worked in Unit I Example 2; eigenvalues are the prerequisite for Q2 A."},{"id":"B3B","why":"Linear DE from Unit II Exercise 2 - shows the 'divide to standard form' step examiners look for."},{"id":"A4B","why":"IF Rule I (homogeneous) from Unit II Example 01 - the step-by-step pattern for every Q4 B."},{"id":"D2A","why":"3x3 Jacobian at a point with J' = 1/J. Substituting the point first makes it quick."},{"id":"C4A","why":"Leibnitz rule twice - the same idea as Oct-25 Q4 A, so one method covers both."}],"FORMULAS":[{"id":"F1","unit":"U1","topic":"eig","cat":"Definition","name":"Eigenvalue equation","tex":"AX=\\lambda X,\\quad X\\neq 0","sym":"$A$: $n\\times n$ matrix, $\\lambda$: eigenvalue (scalar), $X$: eigenvector","cond":"X must be non-zero","ex":"","pyq":["A1A","B1A"],"mistake":"Taking X = 0 as an eigenvector.","tip":"Eigen = 'own': A only stretches its own vector.","src":"Unit I slides"},{"id":"F2","unit":"U1","topic":"eig","cat":"Method","name":"Characteristic equation","tex":"|A-\\lambda I|=0","sym":"$I$: identity of the same order","cond":"Square matrix","ex":"","pyq":["A1A","B1A","A2A","B2A"],"mistake":"Subtracting λ from every entry instead of only the diagonal.","tip":"λ goes only on the diagonal.","src":"Unit I slides"},{"id":"F3","unit":"U1","topic":"eig","cat":"Shortcut","name":"2x2 characteristic equation","tex":"\\lambda^2-S_1\\lambda+|A|=0","sym":"$S_1=a_{11}+a_{22}$ (trace)","cond":"2x2 only","ex":"$\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$: $\\lambda^2-7\\lambda+10=0$","pyq":["A2A","B2A"],"mistake":"Writing −|A| at the end - for 2x2 it is +|A| (as in the slide examples).","tip":"Signs alternate: − S1, + |A|.","src":"Unit I slides"},{"id":"F4","unit":"U1","topic":"eig","cat":"Shortcut","name":"3x3 characteristic equation","tex":"\\lambda^3-S_1\\lambda^2+S_2\\lambda-|A|=0","sym":"$S_1$ = trace, $S_2$ = sum of minors of the diagonal elements $(M_{11}+M_{22}+M_{33})$","cond":"3x3","ex":"$S_1=6,S_2=11,|A|=6\\Rightarrow\\lambda=1,2,3$","pyq":["A1A","B1A"],"mistake":"Using cofactors of off-diagonal elements for S2.","tip":"Signs: − + − after λ³.","src":"Unit I slides"},{"id":"F5","unit":"U1","topic":"eig","cat":"Property","name":"Sum of eigenvalues","tex":"\\lambda_1+\\lambda_2+\\cdots+\\lambda_n=\\text{trace}(A)","sym":"","cond":"","ex":"$-1+1+4=4=4+3-3$","pyq":["A1A"],"mistake":"","tip":"Use it to check your roots in 5 seconds.","src":"Unit I slides"},{"id":"F6","unit":"U1","topic":"eig","cat":"Property","name":"Product of eigenvalues","tex":"\\lambda_1\\lambda_2\\cdots\\lambda_n=|A|","sym":"","cond":"","ex":"$(-1)(1)(4)=-4=|A|$","pyq":["A1A"],"mistake":"","tip":"A singular matrix has a zero eigenvalue.","src":"Unit I slides"},{"id":"F7","unit":"U1","topic":"eig","cat":"Property","name":"Eigenvalues of related matrices","tex":"A^{-1}\\!:\\tfrac1{\\lambda_i}\\quad kA\\!:k\\lambda_i\\quad A^m\\!:\\lambda_i^m\\quad A-kI\\!:\\lambda_i-k\\quad A^T\\!:\\lambda_i","sym":"","cond":"$A^{-1}$ needs all $\\lambda_i\\neq0$","ex":"$\\lambda=1,2,3\\Rightarrow A^{-1}$: $1,\\tfrac12,\\tfrac13$","pyq":[],"mistake":"","tip":"Eigenvectors stay the same for all of these.","src":"Unit I slides"},{"id":"F8","unit":"U1","topic":"eig","cat":"Property","name":"Triangular / diagonal matrix","tex":"\\lambda_i=a_{ii}","sym":"","cond":"Upper, lower triangular or diagonal","ex":"","pyq":[],"mistake":"","tip":"Read eigenvalues straight off the diagonal.","src":"Unit I slides"},{"id":"F9","unit":"U1","topic":"eig","cat":"Method","name":"Eigenvector by cross-multiplication (Cramer's rule)","tex":"\\frac{x_1}{\\begin{vmatrix}b_1&c_1\\\\b_2&c_2\\end{vmatrix}}=\\frac{-x_2}{\\begin{vmatrix}a_1&c_1\\\\a_2&c_2\\end{vmatrix}}=\\frac{x_3}{\\begin{vmatrix}a_1&b_1\\\\a_2&b_2\\end{vmatrix}}","sym":"$(a_1,b_1,c_1),(a_2,b_2,c_2)$: two independent rows of $A-\\lambda I$","cond":"Rows must be independent","ex":"","pyq":["A1A","B1A"],"mistake":"Forgetting the minus sign on the middle term.","tip":"Cover-up rule: hide the column of the variable; middle gets −.","src":"Unit I slides"},{"id":"F10","unit":"U1","topic":"diag","cat":"Theorem","name":"Diagonalization","tex":"P^{-1}AP=D=\\text{diag}(\\lambda_1,\\dots,\\lambda_n)","sym":"$P=[X_1\\;X_2\\cdots X_n]$ eigenvectors as columns","cond":"A has n linearly independent eigenvectors (always true for distinct eigenvalues)","ex":"","pyq":["A2A","B2A"],"mistake":"Putting eigenvectors as rows of P, or listing D in a different order from P.","tip":"Order in D = order of columns in P.","src":"Unit I slides"},{"id":"F11","unit":"U1","topic":"diag","cat":"Standard result","name":"Inverse of a 2x2","tex":"\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}","sym":"","cond":"ad − bc ≠ 0","ex":"","pyq":["A2A","B2A"],"mistake":"","tip":"Swap the diagonal, negate the off-diagonal, divide by det.","src":"Standard (used in slides)"},{"id":"F12","unit":"U1","topic":"diag","cat":"Standard result","name":"Powers via diagonalization","tex":"A^n=PD^nP^{-1}","sym":"","cond":"A diagonalizable","ex":"","pyq":[],"mistake":"","tip":"Not in your slides - standard extension, useful for 1-mark theory.","src":"Standard (not in your slides)"},{"id":"F13","unit":"U1","topic":"lu","cat":"Method","name":"Doolittle LU entries (3x3)","tex":"\\begin{aligned}&u_{1j}=a_{1j},\\;\\; l_{i1}=\\tfrac{a_{i1}}{u_{11}}\\\\&u_{22}=a_{22}-l_{21}u_{12},\\;\\;u_{23}=a_{23}-l_{21}u_{13}\\\\&l_{32}=\\tfrac{a_{32}-l_{31}u_{12}}{u_{22}},\\;\\;u_{33}=a_{33}-l_{31}u_{13}-l_{32}u_{23}\\end{aligned}","sym":"$L$ unit lower triangular ($l_{ii}=1$), $U$ upper triangular","cond":"Pivots u11, u22 ≠ 0","ex":"","pyq":["A1B","B1B"],"mistake":"Writing l21 = a12/u11 (it is a21/u11).","tip":"Order: row of U, column of L, row of U, column of L...","src":"Unit I slides"},{"id":"F14","unit":"U1","topic":"lu","cat":"Method","name":"Solving with a factorisation","tex":"AX=B,\\;A=LU:\\quad LZ=B\\;(\\text{forward}),\\quad UX=Z\\;(\\text{backward})","sym":"For Cholesky replace U by Lᵀ","cond":"","ex":"","pyq":["A2B","B2B"],"mistake":"Doing back-substitution first.","tip":"L first (top-down), then U (bottom-up).","src":"Unit I slides"},{"id":"F15","unit":"U1","topic":"chol","cat":"Method","name":"Cholesky entries (3x3)","tex":"\\begin{aligned}&l_{11}=\\sqrt{a_{11}},\\;l_{21}=\\tfrac{a_{21}}{l_{11}},\\;l_{31}=\\tfrac{a_{31}}{l_{11}}\\\\&l_{22}=\\sqrt{a_{22}-l_{21}^2},\\;l_{32}=\\tfrac{a_{32}-l_{21}l_{31}}{l_{22}}\\\\&l_{33}=\\sqrt{a_{33}-l_{31}^2-l_{32}^2}\\end{aligned}","sym":"$A=LL^T$","cond":"A symmetric and positive definite","ex":"$\\begin{bmatrix}9&6&12\\\\6&13&11\\\\12&11&26\\end{bmatrix}\\Rightarrow L=\\begin{bmatrix}3&0&0\\\\2&3&0\\\\4&1&3\\end{bmatrix}$","pyq":["A2B","B2B"],"mistake":"Forgetting to subtract l21·l31 in l32.","tip":"Diagonal entries = square roots; off-diagonal = divide by the diagonal above.","src":"Unit I slides"},{"id":"F16","unit":"U1","topic":"chol","cat":"Definition","name":"Positive definite","tex":"X^TAX>0\\;\\;\\forall X\\neq0","sym":"","cond":"A symmetric (real) - a real symmetric matrix is Hermitian","ex":"","pyq":[],"mistake":"","tip":"All eigenvalues > 0.","src":"Unit I slides"},{"id":"F17","unit":"U1","topic":"pca","cat":"Method","name":"Standardization (PCA step 1)","tex":"z=\\frac{x-\\bar x}{\\sigma}","sym":"$\\bar x$ mean, $\\sigma$ standard deviation","cond":"","ex":"","pyq":[],"mistake":"","tip":"Puts all variables on the same scale.","src":"Unit I slides"},{"id":"F18","unit":"U1","topic":"pca","cat":"Method","name":"Sample covariance matrix","tex":"S=\\frac{1}{n-1}BB^T","sym":"$B$: data in mean-deviation form ($p\\times n$)","cond":"","ex":"","pyq":[],"mistake":"Dividing by n instead of n − 1.","tip":"","src":"Unit I slides"},{"id":"F19","unit":"U1","topic":"pca","cat":"Standard result","name":"Variance explained","tex":"\\text{share of PC}_i=\\frac{\\lambda_i}{\\sum_j\\lambda_j}","sym":"$\\lambda_i$: eigenvalues of $S$","cond":"","ex":"$\\lambda=3,1\\Rightarrow75\\%$","pyq":[],"mistake":"","tip":"Slides say eigenvalues give the variance carried by each PC.","src":"Standard (implied by slides)"},{"id":"F21","unit":"U2","topic":"form","cat":"Method","name":"Formation of a DE","tex":"n\\text{ arbitrary constants}\\;\\Rightarrow\\;\\text{differentiate }n\\text{ times}\\;\\Rightarrow\\;\\text{DE of order }n","sym":"","cond":"","ex":"$y=ae^{m_1x}+be^{m_2x}\\Rightarrow y''-(m_1+m_2)y'+m_1m_2y=0$","pyq":["A4A","B4A"],"mistake":"Leaving a constant in the final answer.","tip":"For e^{-2x}, e^{-3x}: roots −2, −3 ⇒ y''+5y'+6y=0.","src":"Unit II slides"},{"id":"F22","unit":"U2","topic":"exact","cat":"Condition","name":"Condition of exactness","tex":"M\\,dx+N\\,dy=0\\text{ exact}\\iff\\frac{\\partial M}{\\partial y}=\\frac{\\partial N}{\\partial x}","sym":"$M,N$ functions of $x,y$","cond":"Necessary and sufficient","ex":"","pyq":["A3A","B3A"],"mistake":"Comparing M_x with N_y.","tip":"'M with y, N with x' - cross over.","src":"Unit II slides"},{"id":"F23","unit":"U2","topic":"exact","cat":"Method","name":"Solution of an exact DE","tex":"\\int_{y\\,\\text{const}}M\\,dx+\\int(\\text{terms of }N\\text{ not containing }x)\\,dy=c","sym":"","cond":"After checking exactness","ex":"$(2xy+e^y)dx+(x^2+xe^y)dy=0\\Rightarrow x^2y+xe^y=c$","pyq":["A3A","B3A","A4B","B4B"],"mistake":"Integrating all of N again (double counting).","tip":"Only N-terms with no x at all.","src":"Unit II slides"},{"id":"F24","unit":"U2","topic":"reduc","cat":"Rule","name":"Integrating factor - Rule I","tex":"\\text{Homogeneous }M\\,dx+N\\,dy=0,\\;Mx+Ny\\neq0\\;\\Rightarrow\\;\\text{IF}=\\frac{1}{Mx+Ny}","sym":"","cond":"M, N homogeneous of the same degree","ex":"$Mx+Ny=x^2y^2\\Rightarrow$ IF $=\\frac{1}{x^2y^2}$","pyq":["A4B"],"mistake":"Forgetting the sign of N (here N = −(x³−3x²y)).","tip":"Homogeneous → Plus.","src":"Unit II slides"},{"id":"F25","unit":"U2","topic":"reduc","cat":"Rule","name":"Integrating factor - Rule II","tex":"y\\,f_1(xy)\\,dx+x\\,f_2(xy)\\,dy=0,\\;Mx-Ny\\neq0\\;\\Rightarrow\\;\\text{IF}=\\frac{1}{Mx-Ny}","sym":"","cond":"Form y f1(xy) dx + x f2(xy) dy","ex":"$(1+xy)y\\,dx+(1-xy)x\\,dy$: IF $=\\frac{1}{2x^2y^2}$","pyq":["B4B"],"mistake":"Using + instead of −.","tip":"xy-form → Minus.","src":"Unit II slides"},{"id":"F26","unit":"U2","topic":"linear","cat":"Method","name":"Linear DE in y","tex":"\\frac{dy}{dx}+Py=Q\\;\\Rightarrow\\;\\text{IF}=e^{\\int P\\,dx},\\quad y\\cdot\\text{IF}=\\int Q\\cdot\\text{IF}\\,dx+c","sym":"$P,Q$: functions of $x$ only","cond":"Coefficient of dy/dx must be 1","ex":"$y'+\\frac2xy=3+\\frac1{x^2}$: IF $=x^2$","pyq":["A3B","B3B"],"mistake":"Not dividing by the coefficient of dy/dx first.","tip":"Standard form first, always.","src":"Unit II slides"},{"id":"F27","unit":"U2","topic":"linear","cat":"Method","name":"Linear DE in x","tex":"\\frac{dx}{dy}+Px=Q\\;\\Rightarrow\\;x\\,e^{\\int P\\,dy}=\\int Q\\,e^{\\int P\\,dy}dy+c","sym":"$P,Q$: functions of $y$","cond":"Use when x appears to the first power only","ex":"","pyq":[],"mistake":"","tip":"Single x term? Go linear in x.","src":"Unit II slides"},{"id":"F28","unit":"U2","topic":"bern","cat":"Method","name":"Bernoulli's equation","tex":"\\frac{dy}{dx}+Py=Qy^n\\;\\xrightarrow{\\;v=y^{1-n}\\;}\\;\\frac{dv}{dx}+(1-n)Pv=(1-n)Q","sym":"","cond":"n ≠ 0, 1","ex":"","pyq":[],"mistake":"Forgetting the factor (1 − n).","tip":"Not worked in your slides - standard method.","src":"Syllabus slide (method standard)"},{"id":"F29","unit":"U2","topic":"growth","cat":"Model","name":"Law of natural growth","tex":"\\frac{dx}{dt}=kx\\;\\Rightarrow\\;x=x_0e^{kt},\\;k>0","sym":"","cond":"","ex":"Triples in 2 h: $k=\\tfrac12\\ln3$","pyq":[],"mistake":"","tip":"","src":"Unit II slides"},{"id":"F30","unit":"U2","topic":"growth","cat":"Model","name":"Law of natural decay & half-life","tex":"\\frac{dm}{dt}=-km\\;\\Rightarrow\\;m=m_0e^{-kt},\\quad t_{1/2}=\\frac{\\ln2}{k}","sym":"","cond":"k > 0","ex":"Radium: $k=0.000443\\Rightarrow t_{1/2}\\approx1565$ yr","pyq":[],"mistake":"","tip":"","src":"Unit II slides"},{"id":"F31","unit":"U2","topic":"debasic","cat":"Method","name":"Homogeneous DE substitution","tex":"y=vx,\\quad\\frac{dy}{dx}=v+x\\frac{dv}{dx}","sym":"","cond":"M, N homogeneous of the same degree","ex":"","pyq":[],"mistake":"","tip":"For dx/dy = f(x/y) use x = vy.","src":"Unit II slides"},{"id":"F32","unit":"U2","topic":"linear","cat":"Standard result","name":"Integrals used in DE answers","tex":"\\int\\frac{f'(x)}{f(x)}dx=\\log f(x),\\quad e^{\\log f}=f,\\quad\\int\\frac{e^{k\\tan^{-1}x}}{1+x^2}dx=\\frac{e^{k\\tan^{-1}x}}{k}","sym":"","cond":"","ex":"","pyq":["A3B"],"mistake":"","tip":"Substitute t = tan⁻¹x whenever 1/(1+x²) is present.","src":"Standard (used in slides)"},{"id":"F33","unit":"PD","topic":"euler","cat":"Definition","name":"Homogeneous function of degree n","tex":"u(tx,ty)=t^n\\,u(x,y)","sym":"","cond":"","ex":"$\\frac{x^3+y^3}{x+y}\\Rightarrow n=2$","pyq":["C1A","D1B","D2B"],"mistake":"Finding the degree of u = tan⁻¹(...) instead of tan u.","tip":"Degree = (top degree) − (bottom degree).","src":"TA-II papers / model solution"},{"id":"F34","unit":"PD","topic":"euler","cat":"Theorem","name":"Euler's theorem (2 variables)","tex":"x\\frac{\\partial u}{\\partial x}+y\\frac{\\partial u}{\\partial y}=nu","sym":"","cond":"u homogeneous of degree n","ex":"","pyq":["D2B"],"mistake":"","tip":"","src":"TA-II model solution"},{"id":"F35","unit":"PD","topic":"euler","cat":"Theorem","name":"Euler's theorem (3 variables)","tex":"xu_x+yu_y+zu_z=nu","sym":"","cond":"u(x,y,z) homogeneous of degree n","ex":"$U=\\frac{xyz}{2x+y+z}$: $=2U$","pyq":["D2B"],"mistake":"","tip":"Degree 0 ⇒ the sum is 0.","src":"TA-II model solution"},{"id":"F36","unit":"PD","topic":"euler","cat":"Theorem","name":"Euler second order","tex":"x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=n(n-1)u","sym":"","cond":"u homogeneous of degree n","ex":"","pyq":[],"mistake":"","tip":"","src":"Standard"},{"id":"F37","unit":"PD","topic":"euler","cat":"Corollary","name":"Euler corollary - first order","tex":"f(u)\\text{ homogeneous of degree }n\\;\\Rightarrow\\;xu_x+yu_y=g(u)=n\\frac{f(u)}{f'(u)}","sym":"e.g. $f(u)=\\tan u,\\sin u,e^u$","cond":"","ex":"$\\sin u=x^3+y^3\\Rightarrow 3\\tan u$","pyq":["C1A","D1B"],"mistake":"Forgetting to divide by f'(u).","tip":"n · f over f-dash.","src":"TA-II model solution"},{"id":"F38","unit":"PD","topic":"euler","cat":"Corollary","name":"Euler corollary - second order","tex":"x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(u)\\,[g'(u)-1]","sym":"$g(u)=n\\,f(u)/f'(u)$","cond":"","ex":"$g=\\sin2u\\Rightarrow\\sin2u(2\\cos2u-1)$","pyq":["C1A","D1B"],"mistake":"Writing g'(u) + 1.","tip":"'g times (g-dash minus one)'.","src":"TA-II model solution"},{"id":"F39","unit":"PD","topic":"jacob","cat":"Definition","name":"Jacobian (2 variables)","tex":"J=\\frac{\\partial(u,v)}{\\partial(x,y)}=\\begin{vmatrix}u_x&u_y\\\\v_x&v_y\\end{vmatrix}","sym":"","cond":"","ex":"$x=r\\cos\\theta,y=r\\sin\\theta\\Rightarrow r$","pyq":["C1B"],"mistake":"Putting derivatives w.r.t. the same variable in a row instead of a column.","tip":"Rows = functions, columns = variables.","src":"TA-II papers"},{"id":"F40","unit":"PD","topic":"jacob","cat":"Definition","name":"Jacobian (3 variables)","tex":"\\frac{\\partial(u,v,w)}{\\partial(x,y,z)}=\\begin{vmatrix}u_x&u_y&u_z\\\\v_x&v_y&v_z\\\\w_x&w_y&w_z\\end{vmatrix}","sym":"","cond":"","ex":"","pyq":["D2A"],"mistake":"","tip":"Substitute the point before expanding.","src":"TA-II model solution"},{"id":"F41","unit":"PD","topic":"jacob","cat":"Property","name":"JJ' = 1","tex":"\\frac{\\partial(u,v)}{\\partial(x,y)}\\cdot\\frac{\\partial(x,y)}{\\partial(u,v)}=1","sym":"","cond":"J ≠ 0","ex":"$J=-16\\Rightarrow J'=-\\frac1{16}$","pyq":["C1B","D2A"],"mistake":"","tip":"Inverse Jacobian = reciprocal.","src":"TA-II model solution"},{"id":"F42","unit":"PD","topic":"composite","cat":"Method","name":"Chain rule for composite functions","tex":"z=f(s),\\;s=s(x,t):\\quad z_x=f'(s)\\,s_x,\\;\\;z_t=f'(s)\\,s_t","sym":"","cond":"","ex":"$s=x+ct\\Rightarrow z_t=cf'$, $z_{tt}=c^2f''$","pyq":["D1A","C2A"],"mistake":"Dropping the inner derivative (the −c for x − ct).","tip":"Outer derivative × inner derivative.","src":"TA-II model solution"},{"id":"F43","unit":"PD","topic":"maxmin","cat":"Test","name":"Max-min test for f(x,y)","tex":"\\begin{aligned}&f_x=f_y=0;\\;r=f_{xx},\\,s=f_{xy},\\,t=f_{yy}\\\\&rt-s^2>0,\\,r<0:\\max;\\quad rt-s^2>0,\\,r>0:\\min\\\\&rt-s^2<0:\\text{saddle};\\quad rt-s^2=0:\\text{doubtful}\\end{aligned}","sym":"","cond":"","ex":"$(\\sqrt2,-\\sqrt2)$: $rt-s^2=384,\\,r=20\\Rightarrow$ min","pyq":["C2B"],"mistake":"Deciding max/min from rt − s² alone without checking r.","tip":"Positive discriminant, then the sign of r decides.","src":"TA-II paper (standard test)"},{"id":"F44","unit":"IC","topic":"duis1","cat":"Rule","name":"DUIS Rule I (constant limits)","tex":"\\frac{d}{d\\alpha}\\int_a^bf(x,\\alpha)\\,dx=\\int_a^b\\frac{\\partial f}{\\partial\\alpha}\\,dx","sym":"$a,b$ independent of $\\alpha$","cond":"f and ∂f/∂α continuous","ex":"","pyq":["C3A","D3A"],"mistake":"Forgetting the constant of integration after integrating back.","tip":"Differentiate, integrate, fix c with a special α.","src":"TA-II model solution"},{"id":"F45","unit":"IC","topic":"duis2","cat":"Rule","name":"DUIS Rule II (Leibnitz rule)","tex":"\\frac{d}{d\\alpha}\\int_{\\varphi(\\alpha)}^{\\psi(\\alpha)}f(x,\\alpha)\\,dx=\\int_\\varphi^\\psi\\frac{\\partial f}{\\partial\\alpha}dx+f(\\psi,\\alpha)\\frac{d\\psi}{d\\alpha}-f(\\varphi,\\alpha)\\frac{d\\varphi}{d\\alpha}","sym":"","cond":"","ex":"$\\int_0^x(x-t)^2G\\,dt\\Rightarrow f'=\\int_0^x2(x-t)G\\,dt$","pyq":["C4A","D4A","C4B"],"mistake":"Omitting the boundary terms (or their signs).","tip":"Upper limit +, lower limit −.","src":"TA-II model solution"},{"id":"F46","unit":"IC","topic":"duis1","cat":"Standard result","name":"Frullani-type integral","tex":"\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}\\,dx=\\log\\frac{b}{a}","sym":"","cond":"a, b > 0","ex":"","pyq":["C3A","D3A"],"mistake":"Writing log(a/b).","tip":"The one with − sign in front (b) goes on top.","src":"TA-II papers"},{"id":"F47","unit":"IC","topic":"duis1","cat":"Standard result","name":"Basic exponential integrals","tex":"\\int_0^\\infty e^{-ax}dx=\\frac1a,\\quad\\int_0^\\infty e^{-ax}\\cos bx\\,dx=\\frac{a}{a^2+b^2},\\quad\\int_0^\\infty e^{-ax}\\sin bx\\,dx=\\frac{b}{a^2+b^2}","sym":"","cond":"a > 0","ex":"","pyq":["C3A","D3A"],"mistake":"","tip":"","src":"Standard"},{"id":"F48","unit":"IC","topic":"erf","cat":"Definition","name":"Error function","tex":"\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^xe^{-u^2}\\,du","s
