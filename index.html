ym":"","cond":"","ex":"","pyq":["C3B","C4B","D4B"],"mistake":"Missing the 2/√π factor.","tip":"'Two over root pi'.","src":"TA-II model solution"},{"id":"F49","unit":"IC","topic":"erf","cat":"Definition","name":"Complementary error function","tex":"\\text{erfc}(x)=\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}\\,du","sym":"","cond":"","ex":"","pyq":["D3B","D4B"],"mistake":"","tip":"Same integrand, limits x to ∞.","src":"TA-II model solution"},{"id":"F50","unit":"IC","topic":"erf","cat":"Property","name":"erf + erfc","tex":"\\text{erf}(x)+\\text{erfc}(x)=1","sym":"","cond":"","ex":"","pyq":["D4B"],"mistake":"","tip":"","src":"TA-II model solution"},{"id":"F51","unit":"IC","topic":"erf","cat":"Property","name":"Special values","tex":"\\text{erf}(0)=0,\\quad\\text{erf}(\\infty)=1,\\quad\\int_0^\\infty e^{-u^2}du=\\frac{\\sqrt\\pi}{2}","sym":"","cond":"","ex":"","pyq":[],"mistake":"","tip":"","src":"Standard"},{"id":"F52","unit":"IC","topic":"erf","cat":"Property","name":"erf is odd","tex":"\\text{erf}(-x)=-\\text{erf}(x)","sym":"","cond":"","ex":"","pyq":["D4B"],"mistake":"","tip":"Substitute u = −v in the definition to prove.","src":"TA-II model solution"},{"id":"F53","unit":"IC","topic":"erf","cat":"Property","name":"erfc(−x) + erfc(x)","tex":"\\text{erfc}(-x)+\\text{erfc}(x)=2","sym":"","cond":"","ex":"","pyq":["D4B"],"mistake":"","tip":"","src":"TA-II model solution"},{"id":"F54","unit":"IC","topic":"erf","cat":"Derivative","name":"Derivative of erf","tex":"\\frac{d}{dx}\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}e^{-x^2}","sym":"","cond":"","ex":"","pyq":["C4B"],"mistake":"","tip":"","src":"TA-II paper"},{"id":"F55","unit":"IC","topic":"erf","cat":"Derivative","name":"Derivative of erf(axⁿ)","tex":"\\frac{d}{dx}\\text{erf}(ax^n)=\\frac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}","sym":"","cond":"","ex":"","pyq":["C4B"],"mistake":"Writing e^{-ax^{2n}} (the a must be squared).","tip":"Chain rule: e^{-(inside)²} × (inside)'.","src":"TA-II paper"},{"id":"F56","unit":"IC","topic":"erf","cat":"Standard result","name":"Finite-limit Gaussian integral","tex":"\\int_a^be^{-x^2}dx=\\frac{\\sqrt\\pi}{2}\\left[\\text{erf}(b)-\\text{erf}(a)\\right]","sym":"","cond":"","ex":"","pyq":["C3B"],"mistake":"","tip":"","src":"TA-II paper"},{"id":"F57","unit":"IC","topic":"erf","cat":"Standard result","name":"Completing the square with erfc","tex":"\\int_0^\\infty e^{-x^2-2ax}dx=\\frac{\\sqrt\\pi}{2}\\,e^{a^2}\\,\\text{erfc}(a)","sym":"","cond":"","ex":"","pyq":["D3B"],"mistake":"Wrong new lower limit (it becomes a, not 0).","tip":"−x²−2ax = −(x+a)² + a².","src":"TA-II paper"},{"id":"F58","unit":"IC","topic":"erf","cat":"Standard result","name":"Series of erf","tex":"\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\left(x-\\frac{x^3}{3}+\\frac{x^5}{10}-\\frac{x^7}{42}+\\cdots\\right)","sym":"","cond":"","ex":"","pyq":[],"mistake":"","tip":"Expand e^{-u²} and integrate term by term. Not in your papers - standard.","src":"Standard (not in your papers)"},{"id":"F59","unit":"PD","topic":"funcdep","cat":"Condition","name":"Functional dependence test","tex":"u,v\\text{ functionally dependent}\\iff\\frac{\\partial(u,v)}{\\partial(x,y)}=0\\quad(\\text{3 functions: }\\tfrac{\\partial(u,v,w)}{\\partial(x,y,z)}=0)","sym":"","cond":"The Jacobian must vanish identically (for all x, y), not just at a point","ex":"$u=\\frac xy,\\;v=\\frac{x+y}{x-y}$: $J=0$, $v=\\frac{u+1}{u-1}$","pyq":[],"mistake":"Concluding dependence from J = 0 at a single point.","tip":"J ≠ 0 ⇒ independent; J ≡ 0 ⇒ find the relation.","src":"Tutorial 9"},{"id":"F60","unit":"MI","topic":"dint","cat":"Method","name":"Iterated double integral","tex":"\\int_a^b\\int_{\\phi_1(x)}^{\\phi_2(x)}f(x,y)\\,dy\\,dx=\\int_a^b\\left[\\int_{\\phi_1(x)}^{\\phi_2(x)}f\\,dy\\right]dx","sym":"$\\phi_1,\\phi_2$: lower and upper boundary curves","cond":"Inner limits may depend on the outer variable only","ex":"$\\int_0^1\\int_0^{1-x}(x+y)dy\\,dx=\\frac13$","pyq":[],"mistake":"Integrating w.r.t. x first when the inner limits contain x.","tip":"Variable limits are always on the inside.","src":"Tutorial 13"},{"id":"F61","unit":"MI","topic":"dint","cat":"Standard result","name":"Polar coordinates","tex":"x=r\\cos\\theta,\\;y=r\\sin\\theta,\\quad dx\\,dy=r\\,dr\\,d\\theta,\\quad x^2+y^2=r^2","sym":"","cond":"Use for circles, cones, paraboloids (x²+y²)","ex":"Cone/paraboloid volume: $\\int_0^{2\\pi}\\int_0^1(r-r^2)r\\,dr\\,d\\theta=\\frac\\pi6$","pyq":[],"mistake":"Forgetting the extra factor r.","tip":"This r is the Jacobian ∂(x,y)/∂(r,θ).","src":"Standard (needed for Tutorial 15 Q5)"},{"id":"F62","unit":"MI","topic":"areavol","cat":"Formula","name":"Area by double integration","tex":"A=\\iint_R dx\\,dy=\\int_a^b\\left[y_{\\text{upper}}(x)-y_{\\text{lower}}(x)\\right]dx","sym":"","cond":"a, b from the intersection points","ex":"$y=x^2,\\;y=2x+3$: $\\int_{-1}^3(2x+3-x^2)dx=\\frac{32}3$","pyq":[],"mistake":"Subtracting the curves the wrong way round (negative area).","tip":"Top minus bottom.","src":"Tutorial 15"},{"id":"F63","unit":"MI","topic":"areavol","cat":"Formula","name":"Volume by multiple integration","tex":"V=\\iiint_V dx\\,dy\\,dz=\\iint_R\\left[z_{\\text{top}}-z_{\\text{bottom}}\\right]dx\\,dy","sym":"","cond":"","ex":"Cylinders $y^2=x$, $x^2=y$ under $x+y+z=2$: $V=\\frac{11}{30}$","pyq":[],"mistake":"","tip":"","src":"Tutorial 15"},{"id":"F64","unit":"MI","topic":"areavol","cat":"Standard result","name":"Standard areas & volumes","tex":"\\text{Ellipse: }\\pi ab,\\quad\\text{tetrahedron }\\tfrac xa+\\tfrac yb+\\tfrac zc=1:\\;\\frac{abc}{6},\\quad\\int_{-a}^{a}\\sqrt{a^2-x^2}\\,dx=\\frac{\\pi a^2}{2}","sym":"","cond":"","ex":"Half ellipse above x-axis: $\\frac{\\pi ab}{2}$","pyq":[],"mistake":"","tip":"Use these to check answers.","src":"Tutorial 15 / standard"},{"id":"F65","unit":"MI","topic":"tint","cat":"Method","name":"Iterated triple integral","tex":"\\int_a^b\\int_{y_1(x)}^{y_2(x)}\\int_{z_1(x,y)}^{z_2(x,y)}f\\,dz\\,dy\\,dx","sym":"","cond":"Innermost limits may depend on both outer variables","ex":"$\\int_0^1\\int_0^{1-x}\\int_0^{1-x-y}dz\\,dy\\,dx=\\frac16$","pyq":[],"mistake":"Following the printed dx dy dz order when the limits demand another order.","tip":"Limits decide the order.","src":"Tutorial 14"},{"id":"F66","unit":"MI","topic":"curve","cat":"Rule","name":"Symmetry rules (Cartesian)","tex":"\\begin{aligned}&\\text{only even powers of }y\\Rightarrow\\text{symmetric about x-axis}\\\\&\\text{only even powers of }x\\Rightarrow\\text{about y-axis}\\\\&(x,y)\\to(-x,-y)\\text{ unchanged}\\Rightarrow\\text{about origin};\\;\\;x\\leftrightarrow y\\Rightarrow\\text{about }y=x\\end{aligned}","sym":"","cond":"","ex":"$xy^2=4a^2(a-x)$: about the x-axis","pyq":[],"mistake":"","tip":"Check symmetry first - it halves the work.","src":"Tutorial 12 (standard rules)"},{"id":"F67","unit":"MI","topic":"curve","cat":"Rule","name":"Origin and tangents at the origin","tex":"\\text{No constant term}\\Rightarrow\\text{passes through }O;\\;\\text{tangents at }O:\\text{ lowest-degree terms}=0","sym":"","cond":"","ex":"$y^2(2a-x)=x^3$: lowest terms $2ay^2=0\\Rightarrow y=0$ (cusp)","pyq":[],"mistake":"","tip":"","src":"Tutorial 12 (standard rules)"},{"id":"F68","unit":"MI","topic":"curve","cat":"Rule","name":"Asymptotes parallel to the axes","tex":"\\text{Parallel to x-axis: coefficient of highest power of }x=0;\\;\\;\\text{parallel to y-axis: coefficient of highest power of }y=0","sym":"","cond":"","ex":"$y^2(2a-x)=x^3\\Rightarrow x=2a$; $xy^2=\\dots\\Rightarrow x=0$","pyq":[],"mistake":"","tip":"","src":"Tutorial 12 (standard rules)"},{"id":"F69","unit":"MI","topic":"curve","cat":"Rule","name":"Polar roses","tex":"r=a\\cos n\\theta\\text{ or }a\\sin n\\theta:\\;\\begin{cases}n\\text{ petals}&n\\text{ odd}\\\\2n\\text{ petals}&n\\text{ even}\\end{cases},\\;\\text{petal length }a","sym":"","cond":"","ex":"$r=a\\cos3\\theta$: 3 petals; $r=a\\sin2\\theta$: 4 petals","pyq":[],"mistake":"","tip":"cos: a petal on the initial line; sin: rotated.","src":"Tutorial 12 (standard result)"},{"id":"F70","unit":"IC","topic":"duis1","cat":"Standard result","name":"Results used with DUIS (Tutorial 10)","tex":"\\int_0^1x^a\\,dx=\\frac1{a+1},\\quad\\int_0^\\infty\\frac{dx}{1+bx^2}=\\frac{\\pi}{2\\sqrt b},\\quad\\int_0^\\infty\\frac{\\sin x}{x}dx=\\frac\\pi2,\\quad\\int_0^\\infty\\frac{e^{-ax}\\sin x}{x}dx=\\cot^{-1}a","sym":"","cond":"a > −1 for the first, b > 0","ex":"$\\int_0^1\\frac{x^a-1}{\\log x}dx=\\log(a+1)$","pyq":[],"mistake":"","tip":"x^a differentiated w.r.t. a gives x^a log x - that cancels the log x.","src":"Tutorial 10"},{"id":"F71","unit":"PD","topic":"pdbasic","cat":"Standard result","name":"Derivatives of r","tex":"r^2=x^2+y^2+z^2\\Rightarrow\\frac{\\partial r}{\\partial x}=\\frac xr,\\;\\;\\frac{\\partial}{\\partial x}r^n=nr^{n-2}x","sym":"","cond":"","ex":"$u=r^{-1}$: $u_{xx}+u_{yy}+u_{zz}=0$","pyq":[],"mistake":"","tip":"Saves time in Laplace-equation questions (T7 Q1).","src":"Standard (Tutorial 7)"}],"VIDEOS":{"v_exact":{"vids":[{"id":"ZfkKqOKD3wI","title":"First Order Ordinary Differential Equation|Lecture 01|Exact Differential Equations|All University","dur":"16:12","covers":"Exact DEs, checking exactness, reducing to exact form (per the video's tags)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=exact%20differential%20equation"},"v_linear":{"vids":[{"id":"GBjmQ-JHzjU","title":"First Order Differential Equation|One Shot|Engineering Mathematics |Pradeep Giri Sir","dur":null,"covers":"One-shot of first-order DEs (linear DE section; YouTube page does not list chapters)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=linear%20differential%20equation"},"v_form":{"vids":[],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=formation%20of%20differential%20equation","note":"No Pradeep Giri video specifically on 'formation of DE' could be verified."},"v_eig":{"vids":[{"id":"atmwPK1B9Js","title":"LINEAR ALGERBA|EIGEN VALUES AND EIGEN VECTORS|ONE SHOT|PRADEEP GIRI SIR","du }],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=euler%20theorem%20homogeneous"},"v_reduc":{"vids":[{"id":"ZfkKqOKD3wI","title":"First Order Ordinary Differential Equation|Lecture 01|Exact Differential Equations|All University","dur":"16:12","covers":"Tags mention reducing to exact form; IF Rules I/II not itemised"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=integrating%20factor%20exact"},"v_jacob":{"vids":[{"id":"o80YgDXuAX8","title":"JACOBIAN | Lecture 01 | MATHEMATICS |PRADEEP GIRI SIR","dur":null,"covers":"Jacobians (introductory lecture of the series)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=jacobian"},"v_pdbasic2":{"vids":[{"id":"VIMZq5x4Wqk","title":"PARTIAL DIFFERENTIATION|ONE SHOT |ALL UNIVERSITY|ENGINEERING MATHEMATICS|PRADEEP GIRI SIR","dur":null,"covers":"Partial differentiation one shot (composite-function part not itemised by YouTube)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=composite%20function%20partial"},"v_maxmin":{"vids":[{"id":"In3oZPIymm8","title":"Maxima and Minima of a function of two variables|Lecture 01|Application of Partial Differentiation","dur":null,"covers":"Maxima/minima of f(x,y)"},{"id":"xwOhlrBGYiE","title":"MAXIMA AND MINIMA |ONE SHOT |ALL UNIVERSITY|ENGINEERING MATHEMATICS|PRADEEP GIRI SIR","dur":null,"covers":"Maxima and minima (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=maxima%20minima"},"v_debasic":{"vids":[{"id":"Hah_B7PlX6Q","title":"Differential Equation of First Order and First Degree |Lecture 01|Pradeep Giri Sir","dur":null,"covers":"Introduction; tags mention variable separable, homogeneous, linear"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=first%20order%20first%20degree"},"v_pca":{"vids":[],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=principal%20component%20analysis","note":"No PCA lecture on the channel could be verified."},"v_bern":{"vids":[],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=bernoulli%20differential%20equation","note":"No Bernoulli-specific lecture could be verified."},"v_growth":{"vids":[],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=applications%20of%20differential%20equations","note":"Not verified for growth/decay (channel has an 'Applications of DE - Kirchhoff's law' lecture, which is a different application)."},"v_funcdep":{"vids":[{"id":"Al2odERqCuA","title":"JACOBIAN|Lecture 04|Functional Dependence | MATHEMATICS |PRADEEP GIRI SIR","dur":null,"covers":"Functional dependence using Jacobians"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=functional%20dependence"},"v_dint":{"vids":[{"id":"spFLUHQOh_g","title":"DOUBLE INTEGRATION | ENGINEERING MATHEMATICS | ONESHOT | ALL UNIVERSITY | Pradeep Giri Sir","dur":null,"covers":"Double integration (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=double%20integration"},"v_tint":{"vids":[{"id":"E2yfGTX8aoI","title":"TRIPLE INTEGRAL|Lecture 01|TRIPLE INTEGRAL PROBLEMS| MATHEMATICS","dur":"31:07","covers":"Introductory triple-integral problems (shorter, focused)"},{"id":"uzn1ybMLmJA","title":"TRIPLE INTEGRATION | ONESHOT | ALL UNIVERSITY | Pradeep Giri Sir","dur":null,"covers":"Triple integration (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=triple%20integration"},"v_areavol":{"vids":[{"id":"Vg45Ex92ja4","title":"Multiple Integral|One Shot|Dbatu|Engineering Mathematics 1|Pradeep Giri Sir","dur":null,"channel":"Pradeep Giri Academy Live","covers":"Multiple integrals one shot; area/volume part not itemised by YouTube"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=area%20volume%20double%20integration"},"v_curve":{"vids":[{"id":"guy8xnByO04","title":"CURVE TRACING|ONE SHOT||ENGINEERING MATHEMATICS|PRADEEP GIRI SIR","dur":null,"covers":"Curve tracing (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=curve%20tracing"}},"MEMORISE":[{"h":"Important identities","items":["$\\sin2u=2\\sin u\\cos u=\\dfrac{2\\tan u}{\\sec^2u}$, $\\;\\cos2u=1-2\\sin^2u$","$\\dfrac{d}{dx}\\tan^{-1}x=\\dfrac1{1+x^2}$, $\\;\\dfrac{d}{dx}\\sin^{-1}x=\\dfrac{1}{\\sqrt{1-x^2}}$","$e^{\\log f}=f$, $\\;\\int\\frac{f'}{f}dx=\\log f$","$-x^2-2ax=-(x+a)^2+a^2$ (completing the square)","$\\text{erf}+\\text{erfc}=1$, $\\;\\text{erf}(-x)=-\\text{erf}(x)$"]},{"h":"Theorems & statements","items":["<b>Diagonalization theorem:<\/b> $A_{n\\times n}$ is diagonalizable $\\iff$ it has $n$ linearly independent eigenvectors.","Eigenvectors for distinct eigenvalues are linearly independent.","Eigenvalues of a real symmetric matrix are real; eigenvectors for different eigenvalues are orthogonal.","<b>Euler:<\/b> $u$ homogeneous of degree $n\\Rightarrow xu_x+yu_y=nu$.","<b>JJ' = 1<\/b> for a transformation and its inverse.","<b>Leibnitz rule<\/b> (DUIS II): add $f(\\psi)\\psi'-f(\\varphi)\\varphi'$."]},{"h":"Definitions (write these word-for-word)","items":["<b>Eigenvalue:<\/b> scalar $\\lambda$ with $AX=\\lambda X$, $X\\neq0$. Characteristic equation $|A-\\lambda I|=0$.","<b>Similar matrices:<\/b> $B=P^{-1}AP$ for some invertible $P$.","<b>Order<\/b> = highest derivative; <b>degree<\/b> = its power after clearing radicals/fractions.","<b>General solution<\/b>: number of arbitrary constants = order. <b>Particular solution<\/b>: constants given values.","<b>Exact DE<\/b>: $Mdx+Ndy=du$ for some $u$. <b>Integrating factor<\/b>: multiplier making a DE exact.","<b>Homogeneous function<\/b> of degree $n$: $u(tx,ty)=t^nu(x,y)$.","<b>erf / erfc<\/b>: $\\frac{2}{\\sqrt\\pi}\\int_0^x e^{-u^2}du$ / $\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}du$.","<b>Positive definite<\/b>: symmetric with $X^TAX>0$ for all $X\\neq0$."]},{"h":"Conditions & restrictions","items":["Cholesky needs $A$ <b>symmetric and positive definite<\/b>; LU (Doolittle) needs non-zero pivots.","Exactness: $M_y=N_x$. IF Rule I needs homogeneous and $Mx+Ny\\neq0$; Rule II needs $yf_1(xy)dx+xf_2(xy)dy$ and $Mx-Ny\\neq0$.","Linear DE: coefficient of $dy/dx$ must be 1 before reading $P$.","DUIS Rule I: limits must not depend on the parameter; otherwise use Leibnitz.","Frullani result needs $a,b>0$."]},{"h":"Standard results","items":["$y=Ae^{m_1x}+Be^{m_2x}\\Rightarrow y''-(m_1+m_2)y'+m_1m_2y=0$","$y=A\\sin(\\log x)+B\\cos(\\log x)\\Rightarrow x^2y''+xy'+y=0$","$\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$","$\\int_0^\\infty e^{-x^2}dx=\\frac{\\sqrt\\pi}2$, $\\;\\int_0^\\infty e^{-x^2-2ax}dx=\\frac{\\sqrt\\pi}{2}e^{a^2}\\text{erfc}(a)$","$y=\\int_0^x f(t)\\sin a(x-t)dt\\Rightarrow y''+a^2y=af(x)$; $\\;f=\\int_0^x(x-t)^2G\\,dt\\Rightarrow f'''=2G$","$r=a\\cos n\\theta$: $n$ petals ($n$ odd) or $2n$ ($n$ even)","Tetrahedron $\\frac xa+\\frac yb+\\frac zc=1$: $V=\\frac{abc}{6}$; ellipse area $\\pi ab$","$\\int_0^\\infty\\frac{\\sin x}{x}dx=\\frac\\pi2$; $\\int_0^1\\frac{x^a-1}{\\log x}dx=\\log(a+1)$","Functional dependence $\\iff J=0$; e.g. $(x+y+z)^2=\\sum x^2+2\\sum xy$"]},{"h":"Problem-solving steps","items":["<b>Eigen 3x3:<\/b> $S_1,S_2,|A|$ → cubic → guess a root ($\\pm1,\\pm2$) → factor → check sum/product → $(A-\\lambda I)X=0$ → Cramer on 2 rows.","<b>Diagonalize:<\/b> eigenvalues → say 'distinct ⇒ diagonalizable' → eigenvectors → $P$ → $P^{-1}$ → show $P^{-1}AP=D$.","<b>LU / Cholesky:<\/b> write general $L,U$ → compare entries in order → $LZ=B$ forward → back-substitute.","<b>Exact:<\/b> identify $M,N$ → test → integrate → '$=c$'.","<b>Reducible:<\/b> test fails → identify rule → compute $Mx\\pm Ny$ → multiply → re-test → solve as exact.","<b>Euler corollary:<\/b> isolate $f(u)$ → degree $n$ by $x\\to tx$ → $g=nf/f'$ → $g(g'-1)$.","<b>DUIS I:<\/b> name $I(\\alpha)$ → differentiate inside → integrate → constant from a special value.","<b>Max-min:<\/b> $f_x=f_y=0$ → points → $r,s,t$ at each → classify → value of $f$.","<b>Double integral:<\/b> sketch region → intersection points → variable limits inside → integrate inner → outer.","<b>Area / volume:<\/b> area $=\\int(\\text{top}-\\text{bottom})dx$; volume $=\\iint(z_{top}-z_{bottom})dA$; circular → polar with $r\\,dr\\,d\\theta$.","<b>Curve tracing:<\/b> symmetry → origin & tangents → intercepts → asymptotes → region → sketch."]},{"h":"Special cases","items":["Triangular matrix: eigenvalues are the diagonal entries.","Repeated eigenvalue: may or may not give independent eigenvectors — diagonalizability must be checked.","Zero eigenvalue $\\iff|A|=0$; $A^{-1}$ does not exist.","$rt-s^2=0$: test is inconclusive; examine $f$ along lines (e.g. $y=0$, $y=x$).","$e^W$ homogeneous of degree 0 $\\Rightarrow\\sum xW_x=0$.","Single $x$ term in a DE → treat as linear in $x$."]},{"h":"Common sign errors","items":["Middle term in Cramer's rule: $-x_2$.","In $(x^2y-2xy^2)dx-(x^3-3x^2y)dy=0$, $N=-(x^3-3x^2y)$ — carry the minus.","$x-ct$ gives $z_t=-c\\varphi'$, but $z_{tt}=+c^2\\varphi''$.","Leibnitz: lower-limit term is subtracted.","$\\log(b/a)$ not $\\log(a/b)$; $\\frac{d}{dx}\\text{erfc}=-\\frac{2}{\\sqrt\\pi}e^{-x^2}$."]},{"h":"Common calculation mistakes","items":["$S_2$ uses only the three diagonal minors.","In LU, $l_{21}=a_{21}/u_{11}$ (column below the pivot), not $a_{12}/u_{11}$.","Cholesky $l_{32}=(a_{32}-l_{21}l_{31})/l_{22}$ — the product term is often forgotten.","In $\\text{erf}(ax^n)$ the exponent is $-a^2x^{2n}$.","Substitute the point into a Jacobian before expanding the determinant.","Always verify: eigen sum = trace; $LU$ multiplies back to $A$; $Ax$ = $B$ with your answer.","In $\\int_0^5\\int_0^{x^2}\\dots dx\\,dy$ the inner limit has $x$, so integrate $y$ first.","Polar area/volume: never forget the extra $r$."]},{"h":"Frequently confused concepts","items":["<b>Homogeneous DE<\/b> (solve by $y=vx$) vs <b>homogeneous function<\/b> (Euler's theorem) — same word, different tasks.","<b>IF Rule I<\/b> ($\\frac1{Mx+Ny}$, homogeneous) vs <b>Rule II<\/b> ($\\frac1{Mx-Ny}$, $xy$-form).","<b>IF of a linear DE<\/b> ($e^{\\int P}$) vs <b>IF for reducible exact<\/b> (Rules I/II).","<b>LU<\/b> ($L$ has 1s on the diagonal, any square matrix) vs <b>Cholesky<\/b> ($U=L^T$, symmetric positive definite only).","<b>DUIS Rule I<\/b> (fixed limits) vs <b>Rule II / Leibnitz<\/b> (variable limits).","<b>erf<\/b> ($0\\to x$) vs <b>erfc<\/b> ($x\\to\\infty$)."]},{"h":"Exam presentation tips (20-mark TA, 1 hour)","items":["Attempt Q1 <b>or<\/b> Q2 and Q3 <b>or<\/b> Q4 — decide within the first 2 minutes; pick the pair you can fully finish.","Each sub-question is 5 marks (≈ 12 minutes). The 2025 model answer gives marks per step (e.g. 2 + 2 + 1), so write every intermediate line.","State the method/condition in words: 'Since $M_y=N_x$, the equation is exact', 'Since eigenvalues are distinct, A is diagonalizable', 'By DUIS Rule I...'.","Number your equations (1), (2) and box the final answer.","Write definitions before using them (erf/erfc earn marks on their own).","Leave 3 minutes to check sum/product of eigenvalues and substitute answers back."]}],"LASTMIN":{"formulas":["F4","F9","F10","F15","F13","F22","F23","F24","F25","F26","F37","F38","F41","F44","F45","F46","F48","F49","F55","F57","F59","F60","F61","F62","F65","F69"],"concepts":["TA-I is a fixed template in your papers: Q1 = Eigen + LU, Q2 = Diagonalization + Cholesky, Q3 = Exact + Linear, Q4 = Formation + Reducible-to-exact.","13 of the 16 TA-I questions you have are copied from the Unit I/II slide examples & exercises — redo every slide example and exercise.","TA-II (both years): Q1/Q2 = Partial differentiation (Euler, Jacobian, chain rule, max-min); Q3/Q4 = DUIS + Error function.","Error function is the single most-asked TA-II idea (4 sub-questions). Euler's theorem is next (3).","Frullani integral log(b/a) was asked in both TA-II years in the same slot.","21 official tutorial questions are word-for-word the same as 22 of your 32 PYQ sub-questions (e.g. T3 Q6, T5 Q1, T10 Q4, T11 Q4) - the tutorial sheet is your best practice set."],"patterns":["3x3 eigenvalues with integer roots (1,2,3 or −1,1,4) + one eigenvector","2x2 diagonalization with distinct eigenvalues","Cholesky with integer L (3,2,4 / 2,1,7 first column)","Exact DE with M_y = N_x immediately true","IF Rule I (homogeneous) or Rule II (xy-form)","Euler corollary with tan⁻¹ or sin⁻¹","Leibnitz rule on ∫₀ˣ (kernel in x − t) G(t) dt","erf: definition / derivative / completing the square"],"again":["C3A","A2B","B1A","C1A","D4B","A4B","B4B","D2A","C4A","D3B"],"checklist":["I can write S1, S2, |A| and the 3x3 characteristic equation","I can get an eigenvector by Cramer's rule (with the middle minus)","I can build P and P⁻¹ for a 2x2 and show P⁻¹AP = D","I can fill L and U (Doolittle) in the right order","I can do Cholesky and solve LZ = B, LᵀX = Z","I can test exactness and write ∫M dx + ∫(N without x) dy = c","I know IF Rule I (1/(Mx+Ny)) vs Rule II (1/(Mx−Ny))","I can put a linear DE in standard form and find e^{∫P}","I can eliminate 2 constants to form a DE","I can find the degree and use g(u) = n f/f' and g(g'−1)","I know JJ' = 1 and can expand a 3x3 Jacobian at a point","I can classify stationary points with rt − s²","I can do the Frullani integral by DUIS","I can apply the Leibnitz rule with boundary terms","I can define erf, erfc and prove erfc(−x)+erfc(x)=2","I can differentiate erf(axⁿ) and complete the square for erfc(a)","I can test functional dependence with J = 0 and find the relation","I can set limits for a double integral over a region between curves","I can find an area between curves and a volume under a plane","I can evaluate a triple integral in the order its limits demand","I can run the curve-tracing checklist and know the rose petal rule"]},"VERIFIED":"Title and channel checked on the YouTube watch page (20 Oct 2026).","CHANNEL":"https://www.youtube.com/@pradeepgiriacademy","QUIZ":[{"id":"q1","topic":"eig","type":"formula","src":"Generated","diff":"Easy","q":"The sum of the eigenvalues of a square matrix equals:","opts":["its determinant","its trace","its rank","zero"],"a":1,"hint":"Look at S₁ in the characteristic equation.","sol":["$\\lambda_1+\\cdots+\\lambda_n=S_1=$ trace (sum of diagonal elements)."]},{"id":"q2","topic":"eig","type":"formula","src":"Generated","diff":"Easy","q":"In $\\lambda^3-S_1\\lambda^2+S_2\\lambda-|A|=0$, $S_2$ is:","opts":["sum of all 2x2 minors","sum of minors of the diagonal elements","product of diagonal elements","trace of A²"],"a":1,"hint":"Only three minors are added.","sol":["$S_2=M_{11}+M_{22}+M_{33}$, the minors of $a_{11},a_{22},a_{33}$."]},{"id":"q3","topic":"eig","type":"numerical","src":"Generated","diff":"Easy","q":"Eigenvalues of $\\begin{bmatrix}2&0&0\\\\5&3&0\\\\1&4&7\\end{bmatrix}$ are:","opts":["2, 3, 7","2, 5, 1","12, 0, 0","7, 4, 1"],"a":0,"hint":"The matrix is triangular.","sol":["Triangular $\\Rightarrow$ eigenvalues are the diagonal entries $2,3,7$."]},{"id":"q4","topic":"eig","type":"concept","src":"Generated","diff":"Medium","q":"If the eigenvalues of $A$ are $1,2,3$, the eigenvalues of $A^{-1}+2I$ are:","opts":["3, 4, 5","3, 2.5, 7/3","1, 1/2, 1/3","−1, 0, 1"],"a":1,"hint":"Combine the A⁻¹ and A + kI properties.","sol":["$A^{-1}$ has $1,\\tfrac12,\\tfrac13$","Adding $2I$ adds 2: $3,\\;2.5,\\;\\tfrac73$"]},{"id":"q5","topic":"eig","type":"pyq","src":"PYQ A1A","diff":"Medium","q":"For $A=\\begin{bmatrix}4&6&6\\\\1&3&2\\\\-1&-4&-3\\end{bmatrix}$ the eigenvalues are:","opts":["1, 2, 3","−1, 1, 4","−1, 2, 3","0, 1, 3"],"a":1,"hint":"S₁ = 4, S₂ = −1, |A| = −4.","sol":["$\\lambda^3-4\\lambda^2-\\lambda+4=(\\lambda-4)(\\lambda^2-1)=0$","$\\lambda=-1,1,4$; check sum $=4$, product $=-4$"]},{"id":"q6","topic":"eig","type":"numerical","src":"Generated","diff":"Medium","q":"For $A=\\begin{bmatrix}14&-10\\\\5&-1\\end{bmatrix}$, an eigenvector for $\\lambda=9$ is:","opts":["(1, 1)ᵀ","(2, 1)ᵀ","(1, 2)ᵀ","(−2, 1)ᵀ"],"a":1,"hint":"Row: 5x₁ − 10x₂ = 0.","sol":["$(A-9I)=\\begin{bmatrix}5&-10\\\\5&-10\\end{bmatrix}\\Rightarrow x_1=2x_2$","$X=(2,1)^T$"]},{"id":"q7","topic":"diag","type":"concept","src":"Generated","diff":"Easy","q":"An $n\\times n$ matrix is diagonalizable if and only if it has:","opts":["n distinct entries","n linearly independent eigenvectors","a non-zero determinant","a symmetric form"],"a":1,"hint":"Diagonalization theorem.","sol":["Diagonalization theorem: n linearly independent eigenvectors (distinct eigenvalues guarantee this)."]},{"id":"q8","topic":"diag","type":"pyq","src":"PYQ A2A","diff":"Easy","q":"$A=\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$. Then $P^{-1}AP$ equals:","opts":["diag(1, 6)","diag(2, 5)","diag(4, 3)","diag(−2, 5)"],"a":1,"hint":"λ² − 7λ + 10 = 0.","sol":["$\\lambda=2,5$ (distinct) $\\Rightarrow D=\\text{diag}(2,5)$ with $P=\\begin{bmatrix}1&1\\\\-2&1\\end{bmatrix}$"]},{"id":"q9","topic":"diag","type":"numerical","src":"Generated","diff":"Medium","q":"If $P=\\begin{bmatrix}-2&-1\\\\1&1\\end{bmatrix}$ then $P^{-1}$ is:","opts":["[[−1, −1], [1, 2]]","[[1, 1], [−1, −2]]","[[1, −1], [1, 2]]","[[−1, 1], [−1, 2]]"],"a":0,"hint":"|P| = −1.","sol":["$|P|=-2+1=-1$","$P^{-1}=\\frac{1}{-1}\\begin{bmatrix}1&1\\\\-1&-2\\end{bmatrix}=\\begin{bmatrix}-1&-1\\\\1&2\\end{bmatrix}$"]},{"id":"q10","topic":"lu","type":"concept","src":"Generated","diff":"Easy","q":"In Doolittle's LU decomposition, the diagonal entries of L are:","opts":["the pivots","all 1","square roots of aᵢᵢ","zero"],"a":1,"hint":"Unit lower triangular.","sol":["L is unit lower triangular: lᵢᵢ = 1."]},{"id":"q11","topic":"lu","type":"pyq","src":"PYQ B1B","diff":"Medium","q":"For $A=\\begin{bmatrix}2&2&3\\\\4&-2&1\\\\1&5&4\\end{bmatrix}=LU$, $u_{22}$ is:","opts":["−2","−6","2","−5"],"a":1,"hint":"u₂₂ = a₂₂ − l₂₁u₁₂.","sol":["$l_{21}=4/2=2$","$u_{22}=-2-2(2)=-6$"]},{"id":"q12","topic":"lu","type":"pyq","src":"PYQ A1B","diff":"Hard","q":"For $A=\\begin{bmatrix}3&2&7\\\\2&3&1\\\\3&4&1\\end{bmatrix}=LU$, $u_{33}$ is:","opts":["−8/5","8/5","−11/3","6/5"],"a":0,"hint":"First get l₃₂    </div></details>`;

function plotSVG(key){
  const W = 200, H = 160, cx = 100, cy = 80; let sc = 34, pts = [], asym = "", lab = "";
  const path = arr => arr.map((p,i) => (i?"L":"M") + (cx + p[0]*sc).toFixed(1) + " " + (cy - p[1]*sc).toFixed(1)).join(" ");
  let paths = [];
  if (key === "agnesi") { sc = 38; const up = [], dn = []; for (let x = 1; x >= 0.06; x -= 0.01) { const y = 2*Math.sqrt((1-x)/x); if (y < 2.1) { up.push([x-0.5, y]); dn.push([x-0.5, -y]); } }
    paths = [path(up), path(dn)]; asym = `<line class="as" x1="${cx-0.5*sc}" y1="4" x2="${cx-0.5*sc}" y2="${H-4}"/>`; lab = `<text x="${cx-0.5*sc+3}" y="12">x = 0 (asymptote)</text><text x="${cx+0.5*sc-4}" y="${cy+10}">a</text>`; }
  else if (key === "cissoid") { sc = 34; const up = [], dn = []; for (let x = 0; x <= 1.94; x += 0.01) { const y = Math.sqrt(x*x*x/(2-x)); if (y < 2.2) { up.push([x-1, y]); dn.push([x-1, -y]); } }
    paths = [path(up), path(dn)]; asym = `<line class="as" x1="${cx+1*sc}" y1="4" x2="${cx+1*sc}" y2="${H-4}"/>`; lab = `<text x="${cx+sc+3}" y="12">x = 2a</text><text x="${cx-sc+2}" y="${cy+10}">O</text>`; }
  else { const n = key.includes("2") ? 2 : 3, f = key.includes("cos") ? Math.cos : Math.sin; sc = 64;
    for (let i = 0; i <= 720; i++) { const th = i*Math.PI/360, r = f(n*th); pts.push([r*Math.cos(th), r*Math.sin(th)]); } paths = [path(pts)]; lab = `<text x="${cx+sc+2}" y="${cy-3}">a</text>`; }
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sketch of the curve (a = 1)"><line class="ax" x1="4" y1="${cy}" x2="${W-4}" y2="${cy}"/><line class="ax" x1="${key==="agnesi"?cx-0.5*sc:key==="cissoid"?cx-sc:cx}" y1="4" x2="${key==="agnesi"?cx-0.5*sc:key==="cissoid"?cx-sc:cx}" y2="${H-4}"/>${asym}${paths.map(d => `<path class="cv" d="${d}"/>`).join("")}${lab}<text x="${W-46}" y="${H-5}">sketch, a = 1</text></svg>`;
}

/* ================= G. Study plan ================= */
function buildPlan(mode){
  const days = {emergency:1, "1day":1, "3day":3, "7day":7}[mode];
  const hrs = Math.max(1, Math.min(16, +S.hours[mode] || 1));
  const perDay = hrs*60;
  const ts = scopedTopics();
  const hasVid = t => (D.VIDEOS[t.video].vids||[]).length > 0;
  const blocksFor = (t, lvl) => {
    const b = [];
    if (mode === "emergency") {
      b.push({k:"formula", min:8, txt:`Read formulas: ${t.name}`});
      t.pyqs.slice(0,2).forEach(id => b.push({k:"pyq", min:10, txt:`Replay solved PYQ ${pyqLabel(id)} (cover the solution, attempt, then check)`, ref:id}));
      if (!t.pyqs.length) b.push({k:"learn", min:10, txt:`Skim the solved example: ${t.name}`});
      return b;
    }
    if (lvl < 2 && hasVid(t)) b.push({k:"video", min:20, txt:`Watch Pradeep Giri lecture (relevant part): ${t.name}`});
    b.push({k:"learn", min: Math.round(t.time*(lvl>=3?0.7:1)), txt:`Learn: ${t.name} - explanation + solved example`});
    b.push({k:"formula", min:10, txt:`Formula revision: ${t.name}`});
    const np = lvl>=3 ? Math.min(1,t.pyqs.length) : Math.min(2,t.pyqs.length);
    t.pyqs.slice(0,np).forEach(id => b.push({k:"pyq", min:15, txt:`Solve PYQ ${pyqLabel(id)} without notes, then check`, ref:id}));
    if (!t.pyqs.length) b.push({k:"pyq", min:10, txt:`Practise: quiz questions for ${t.name}`});
    return b;
  };
  const sum = arr => arr.reduce((a,x) => a+x.min, 0);
  const levels = [
    {lvl:0, f:t=>true, note:""},
    {lvl:1, f:t=>t.pri!=="P3", note:"P3 topics left out to fit your time."},
    {lvl:2, f:t=>t.pri!=="P3", note:"P3 topics and videos left out to fit your time."},
    {lvl:3, f:t=>t.pri!=="P3", note:"P3 topics and videos left out; learning time compressed."},
    {lvl:4, f:t=>t.pri==="P1", note:"Only P1 topics fit your time; P2/P3 left out."}];
  const overheadPerDay = 15 + (perDay>=90 ? Math.floor(perDay/60)*8 : 0);
  const finalMin = mode==="emergency" ? 20 : (days>=3 ? 90 : 30);
  const usable = days*perDay - days*overheadPerDay - finalMin;
  let chosen = null, chosenBlocks = [];
  const pool = mode==="emergency" ? [{lvl:0, f:t=>t.pri==="P1", note:"Emergency mode: only P1 topics, replaying solved PYQs."}] : levels;
  for (const L of pool) {
    const blocks = []; ts.filter(L.f).forEach(t => blocksFor(t, L.lvl).forEach(b => blocks.push(Object.assign({t:t.id}, b))));
    chosen = L; chosenBlocks = blocks;
    if (sum(blocks) <= usable) break;
  }
  // pack into days
  const out = []; let di = 0, used = 0, sinceBreak = 0, dayTopics = [];
  const dayArr = () => (out[di] = out[di] || {n:di+1, items:[]});
  const skipped = [];
  const closeDay = () => {
    const d = dayArr();
    if (dayTopics.length) d.items.push({k:"recall", min:15, txt:"Active recall: close notes and write every formula of today's topics from memory", id:`${mode}:recall:d${di+1}`});
  };
  chosenBlocks.forEach(b => {
    if (di >= days) { skipped.push(b); return; }
    const lastDayCap = di === days-1 ? perDay - finalMin : perDay;
    if (used + b.min + 15 > lastDayCap && used > 0) {
      closeDay(); di++; used = 0; sinceBreak = 0; dayTopics = [];
      if (di >= days) { skipped.push(b); return; }
      if (days >= 7 && (di===2||di===4||di===6)) { dayArr().items.push({k:"revise", min:15, txt:"Spaced review: formulas of all previous days (use Formula self-test mode)", id:`${mode}:spaced:d${di+1}`}); used += 15; }
    }
    if (sinceBreak + b.min > 55 && sinceBreak > 0 && perDay >= 90) { dayArr().items.push({k:"break", min:8, txt:"Short break - stand up, water, no phone scrolling", id:`${mode}:break:${di}:${used}`}); used += 8; sinceBreak = 0; }
    dayArr().items.push(Object.assign({id:`${mode}:${b.k}:${b.t}:${b.ref||""}`}, b));
    used += b.min; sinceBreak += b.min; if (!dayTopics.includes(b.t)) dayTopics.push(b.t);
  });
  if (di < days) closeDay();
  const last = out[Math.min(di, days-1)] || dayArr();
  if (days >= 3) last.items.push({k:"mock", min:60, txt:"Timed mock: attempt one full past paper from the PYQ tab in 60 minutes (choose OR questions as in the exam)", id:`${mode}:mock`});
  last.items.push({k:"revise", min: days>=3?30:(mode==="emergency"?20:30), txt:"Final revision: Last-Minute page + checklist; re-read formulas you starred", id:`${mode}:final`});
  for (let i=0;i<days;i++) if (!out[i]) out[i] = {n:i+1, items:[{k:"revise", min:20, txt:"Buffer day: redo any PYQ you got wrong; quiz on weak topics", id:`${mode}:buffer:d${i+1}`}]};
  const tasks = []; out.forEach(d => d.items.forEach(x => tasks.push(x)));
  const skippedTopics = [...new Set(skipped.map(b => b.t))].map(id => T[id].name);
  return {days:out, tasks, note:chosen?chosen.note:"", skipped:skippedTopics, perDay, hrs};
}
const PREREQ = {diag:"eig", reduc:"exact", euler:"pdbasic", jacob:"pdbasic", funcdep:"jacob", composite:"pdbasic", maxmin:"pdbasic", duis2:"duis1", areavol:"dint", tint:"dint"};
function sprintModeName(m){ return {emergency:"Emergency", intensive:"Intensive", practice:"Practice-heavy"}[m] || "Intensive"; }
function sprintOrder(ts){
  const sorted = ts.slice().sort((a,b) => PRI_ORDER[a.pri]-PRI_ORDER[b.pri] || a.order-b.order);
  const ids = new Set(ts.map(t => t.id)), out = [];
  const place = t => { if (out.includes(t)) return; const pr = PREREQ[t.id]; if (pr && ids.has(pr)) place(T[pr]); out.push(t); };
  sorted.forEach(place); return out;
}
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, isFinite(+v) ? +v : lo));
const hm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
function tutRank(q){ return q.rel==="exact" ? 0 : q.rel==="similar" ? 1 : q.slide ? 2 : 3; }
function buildSprint(){
  const sp = S.sprint, mode = ["emergency","intensive","practice"].includes(sp.mode) ? sp.mode : "intensive";
  const win = Math.round(clamp(sp.hours, 2, 18) * 60);
  const wl = clamp(sp.wLearn, 0.5, 1.5), wp = clamp(sp.wPractice, 0.5, 1.5);
  // depth per priority for each mode
  const MINI = {learn:0.35, vid:false, form:5, ex:0, tut:1, pyq:0, recall:3};
  const DEPTH = {
    emergency: {P1:{learn:0.4, vid:false, form:8, ex:6, tut:1, pyq:1, recall:4}, P2:Object.assign({}, MINI), P3:null},
    intensive: {P1:{learn:0.7, vid:true, form:8, ex:8, tut:2, pyq:2, recall:5}, P2:{learn:0.55, vid:false, form:6, ex:6, tut:1, pyq:1, recall:4}, P3:Object.assign({}, MINI)},
    practice:  {P1:{learn:0.5, vid:false, form:6, ex:6, tut:3, pyq:2, recall:5}, P2:{learn:0.4, vid:false, form:5, ex:0, tut:2, pyq:1, recall:4}, P3:Object.assign({}, MINI)}}[mode];
  const qMin = t => ({Easy:8, Medium:12, Hard:15}[t.diff] || 12);
  const sel = sprintOrder(scopedTopics().filter(t => !sp.excl[t.id]));
  const startMin = (() => { const m = /^(\d{1,2}):(\d{2})$/.exec(sp.start||""); return m ? (+m[1])*60 + (+m[2]) : 420; })();
  const meals = [];
  if (win >= 8*60) meals.push({at:5*60, min:40, txt:"Lunch - a proper meal away from the desk; drink water"});
  if (win >= 11*60) meals.push({at:9*60+15, min:15, txt:"Tea / snack + 5-minute walk"});
  if (win >= 13*60) meals.push({at:12*60, min:40, txt:"Dinner - light meal, no screens"});
  const finals = mode === "emergency"
    ? [{k:"revise", min:25, txt:"Final revision: Last-Minute page - must-remember formulas, common mistakes, checklist", id:"sp:final"}]
    : [{k:"mock", min:25, txt:"Mini mock: one OR-pair (2 sub-questions, 10 marks) from a PYQ paper in your units, timed", id:"sp:mock"},
       {k:"revise", min:20, txt:"Final revision: Last-Minute page - formulas, mistakes, checklist", id:"sp:final"}];
  const finalMin = finals.reduce((a,x) => a+x.min, 0), mealMin = meals.reduce((a,x) => a+x.min, 0);
  const studyCap = Math.max(30, Math.floor((win - mealMin - finalMin) * 50/55));   // ~5 min break per 50 min studied
  const blocksFor = (t, c) => {
    const b = []; const v = (D.VIDEOS[t.video].vids||[])[0];
    if (c.vid && v) b.push({k:"video", min:Math.min(15, Math.round(t.time*0.4)), txt:`Focused video: only the part on "${t.sub}" (skip intros) - ${v.title}`, vid:v.id});
    b.push({k:"learn", min:Math.max(6, Math.round(t.time*c.learn*wl)), txt:`Learn: ${t.name} - concise explanation in Important Topics`, topic:t.id});
    b.push({k:"formula", min:c.form, txt:`Formulas & conditions for ${t.name} (tick "Revised")`});
    if (c.ex) b.push({k:"example", min:c.ex, txt:`Follow the worked example for ${t.name} line by line`, topic:t.id});
    const tq = tutsOf(t.id).slice().sort((x,y) => tutRank(x)-tutRank(y) || x.t-y.t || x.n-y.n).slice(0, c.tut);
    tq.forEach(q => b.push({k:"tut", min:Math.round(qMin(t)*wp), txt:`Solve ${q.label} on your own (${q.sub}), then check`, tq:q.id}));
    const covered = new Set(tq.filter(q => q.rel === "exact").map(q => q.pyq));
    if (c.pyq) t.pyqs.filter(id => !covered.has(id)).slice(0, c.pyq).forEach(id => b.push({k:"pyq", min:Math.round(12*wp), txt:`Solve PYQ ${pyqLabel(id)} under exam conditions`, pyq:id}));
    if (!tq.length && !t.pyqs.length) b.push({k:"pyq", min:Math.round(8*wp), txt:`Practice quiz: ${t.name} questions in Practice & Self-Test`});
    b.push({k:"recall", min:c.recall, txt:`Closed-book recall test: write the method and formulas of ${t.name} from memory, then check`, done:t.id});
    b.forEach(x => x.id = `sp:${t.id}:${x.k}${x.tq?":"+x.tq:""}${x.pyq?":"+x.pyq:""}`);
    return b;
  };
  const cfgCopy = () => ({P1:DEPTH.P1&&Object.assign({},DEPTH.P1), P2:DEPTH.P2&&Object.assign({},DEPTH.P2), P3:DEPTH.P3&&Object.assign({},DEPTH.P3)});
  let cfg = cfgCopy(), dropTail = 0;
  const build = () => { const list = sel.filter(t => cfg[t.pri]); const keepN = list.length - dropTail; const bl = [];
    list.forEach((t,i) => { if (t.pri === "P1" || i < keepN) blocksFor(t, cfg[t.pri]).forEach(x => bl.push(x)); }); return bl; };
  const steps = [
    [() => {}, ""],
    [() => { cfg.P3 = null; }, "P3 topics left out to fit your hours (tick them back on, or add hours, if your syllabus needs them)."],
    [() => { if (cfg.P2) cfg.P2 = Object.assign({}, MINI); }, "P3 left out; P2 topics get a quick pass (short reading, formulas, 1 tutorial question)."],
    [() => { cfg.P1.vid = false; }, "Videos dropped to save time; P2 quick pass; P3 left out."],
    [() => { cfg.P1.tut = 1; cfg.P1.pyq = 1; }, "Compressed: 1 tutorial question + 1 PYQ per P1 topic, P2 quick pass, no videos, P3 left out."],
    [() => { cfg.P1.learn *= 0.75; }, "Heavily compressed: shorter reading for P1, P2 quick pass, P3 left out."]];
  let blocks = [], note = "";
  for (const [fn, n] of steps) { fn(); blocks = build(); note = n; if (blocks.reduce((a,x)=>a+x.min,0) <= studyCap) break; }
  while (blocks.reduce((a,x)=>a+x.min,0) > studyCap && dropTail < sel.filter(t => cfg[t.pri] && t.pri !== "P1").length) { dropTail++; blocks = build(); note = "Only part of the P2 topics fit - the lowest-value ones are left out (see below)."; }
  let total = 0; const kept = [];
  blocks.forEach(x => { if (total + x.min <= studyCap) { kept.push(x); total += x.min; } });
  const tid = x => x.id.split(":")[1];
  const skipped = sel.filter(t => !kept.some(x => tid(x) === t.id)).map(t => t.name);
  const partial = sel.filter(t => kept.some(x => tid(x) === t.id) && blocks.some(x => tid(x) === t.id && !kept.includes(x))).map(t => t.name);
  // fill spare time with extra tutorial practice (P1 first)
  const usedTq = new Set(kept.filter(x => x.tq).map(x => x.tq)); const extras = [];
  const pool = sel.filter(t => kept.some(x => tid(x) === t.id)).flatMap(t => tutsOf(t.id).filter(q => !usedTq.has(q.id)).sort((x,y) => tutRank(x)-tutRank(y)).map(q => ({q, t})));
  for (const {q, t} of pool) { if (studyCap - total < 15) break; const m = Math.round(qMin(t)*wp); if (total + m > studyCap) continue; extras.push({k:"tut", min:m, txt:`Extra practice: ${q.label} (${t.name.split(" (")[0]})`, tq:q.id, id:`sp:extra:${q.id}`}); total += m; }
  const study = kept.concat(extras);

  study.forEach(x => {
    pushMeals();
    if (since > 0 && since + x.min > 55) { rows.push({k:"break", min:5, txt:"Short break: stand up, stretch, drink water", t0:el}); el += 5; since = 0; pushMeals(); }

  });
  pushMeals();
  finals.forEach(x => { rows.push(Object.assign({t0:el}, x)); el += x.min; });
  rows.forEach(r => r.clock = hm(startMin + r.t0));

}

  D.PYQS.forEach(p => IDX.push({type:"PYQ", title:PAPER[p.paper].name+" "+p.q, sub:strip(p.text), text:(PAPER[p.paper].name+" "+p.q+" "+strip(p.text)+" "+T[p.topic].name+" "+p.match).toLowerCase(), tab:"pyq", a:"pyq-"+p.id, pre:() => { PF.paper="all"; PF.topic="all"; }}));
  D.TUTS.forEach(q => IDX.push({type:"Tutorial", title:q.label+" - "+T[q.topic].name, sub:strip(q.text), text:(q.label+" tutorial "+q.t+" "+strip(q.text)+" "+T[q.topic].name+" "+q.sub).toLowerCase(), tab:"tutorials", a:"tq-"+q.id, pre:() => { UF={tut:"all",unit:"all",pri:"all",status:"all",rel:"all"}; }}));
  D.MEMORISE.forEach((m,i) => m.items.forEach(x => IDX.push({type:"Memorise", title:m.h, sub:strip(x), text:(m.h+" "+strip(x)).toLowerCase(), tab:"memorise", a:"m-"+i})));
  D.QUIZ.forEach(q => IDX.push({type:"Quiz", title:strip(q.q).slice(0,90), sub:T[q.topic].name, text:(strip(q.q)+" "+q.opts.join(" ")+" "+T[q.topic].name).toLowerCase(), tab:"practice", a:"quiz-"+q.id, pre:() => { QF={topic:"all",type:"all",src:"all",diff:"all",set:null}; }}));
}
function doSearch(v){
  const box = $("#results"); const terms = v.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) { box.classList.remove("open"); box.innerHTML = ""; return; }
  const hits = IDX.filter(e => terms.every(w => e.text.includes(w) || e.title.toLowerCase().includes(w))).slice(0, 40);
  box.innerHTML = hits.length ? hits.map((h,i) => `<button data-hit="${i}"><span class="rt">${h.type}</span> ${esc(h.title)}<span class="rs">${esc(h.sub)}</span></button>`).join("") : `<div class="empty small">No matches for "${esc(v)}"</div>`;
  box._hits = hits; box.classList.add("open");
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); const tab = g.dataset.go; const anchor = g.dataset.anchor;
    if (tab === "pyq" && anchor) { PF.paper="all"; PF.topic="all"; if (rendered.pyq) drawBank(); }
    if (tab === "formulas" && anchor) { FF.q=""; FF.unit="all"; FF.fav=false; if (rendered.formulas) RENDER.formulas(); }
    if (tab === "topics" && anchor) { TF={unit:"all",pri:"all",diff:"all",status:"all"}; if (rendered.topics) RENDER.topics(); }
    go(tab, anchor); return; }
  const sc = e.target.closest("[data-scope]");
  if (sc) { const u = sc.dataset.scope; S.scope[u] = !S.scope[u]; if (!Object.values(S.scope).some(Boolean)) S.scope[u] = true; save(); updateSide();
    if (!$("#tab-dashboard").hidden) RENDER.dashboard(); rerender("plan"); rerender("videos"); rerender("lastmin"); if (rendered.tutorials && UF.unit==="mine") drawTuts(); return; }
  const hit = e.target.closest("[data-hit]");
  if (hit) { const h = $("#results")._hits[+hit.dataset.hit]; if (h.pre) { h.pre(); rendered[h.tab] = false; } $("#results").classList.remove("open"); $("#q").blur(); go(h.tab, h.a); return; }
  if (!e.target.closest(".search")) $("#results").classList.remove("open");
  const fav = e.target.closest("[data-fav]");
  if (fav) { const id = fav.dataset.fav; if (S.fav[id]) delete S.fav[id]; else S.fav[id] = true; save(); fav.classList.toggle("on", !!S.fav[id]); fav.innerHTML = S.fav[id]?"&#9733;":"&#9734;"; if (FF.fav) drawFormulas(); return; }
  const cp = e.target.closest("[data-copy]"); if (cp) { copyText(F[cp.dataset.copy].tex); return; }
  const rv = e.target.closest("[data-reveal]"); if (rv) { FF.reveal[rv.dataset.reveal] = true; const id = rv.dataset.reveal; const c = $("#f-"+id); c.outerHTML = formulaCard(F[id]); renderMath($("#f-"+id)); return; }
  const hd = e.target.closest("[data-hide]"); if (hd) { delete FF.reveal[hd.dataset.hide]; const id = hd.dataset.hide; $("#f-"+id).outerHTML = formulaCard(F[id]); return; }
  const fm = e.target.closest("[data-fmode]"); if (fm) { FF.mode = fm.dataset.fmode; FF.reveal = {}; RENDER.formulas(); return; }
  if (e.target.closest("#ffav")) { FF.fav = !FF.fav; RENDER.formulas(); return; }
  if (e.target.closest("#revAll")) { D.FORMULAS.forEach(f => FF.reveal[f.id] = true); drawFormulas(); return; }
  if (e.target.closest("#hideAll")) { FF.reveal = {}; drawFormulas(); return; }
  if (e.target.closest("#printF")) { printFormulas(); return; }
  if (e.target.closest("#expAll")) { $$("#topicList details").forEach(d => d.open = true); return; }
  if (e.target.closest("#colAll")) { $$("#topicList details").forEach(d => d.open = false); return; }
  const ld = e.target.closest("[data-load]"); if (ld) { loadPlayer(ld.dataset.load, false); return; }
  const fl = e.target.closest("[data-forceload]"); if (fl) { loadPlayer(fl.dataset.forceload, true); return; }
  const cpl = e.target.closest("[data-closeplayer]"); if (cpl) { const sl = $(`[data-slot="${cpl.dataset.closeplayer}"]`); if (sl) sl.innerHTML = ""; return; }
  const bp = e.target.closest("[data-badplayer]"); if (bp) { const sl = $(`[data-slot="${bp.dataset.badplayer}"]`); if (sl) sl.innerHTML = `<div class="vnotice">Player closed. ${IS_FILE?"Embedded players are now treated as blocked in this browser, so the page will not keep retrying. ":""}Use <a href="${ytWatch(bp.dataset.badplayer)}" target="_blank" rel="noopener">Open on YouTube</a>.</div>`; if (IS_FILE) { S.embedBad = true; save(); } return; }
  if (e.target.closest("#resetEmbed")) { S.embedBad = false; save(); RENDER.videos(); toast("Embedded players allowed again"); return; }
  const spm = e.target.closest("[data-spmode]"); if (spm) { S.sprint.mode = spm.dataset.spmode; save(); RENDER.plan(); return; }
  if (e.target.closest("#spAll")) { S.sprint.excl = {}; save(); RENDER.plan(); return; }
  if (e.target.closest("#spP1")) { S.sprint.excl = {}; scopedTopics().forEach(t => { if (t.pri === "P3") S.sprint.excl[t.id] = true; }); save(); RENDER.plan(); return; }
  if (e.target.closest("#spClear")) { if (confirmReset()) { buildSprint().tasks.forEach(x => delete S.plan[x.id]); save(); RENDER.plan(); toast("Today's ticks cleared"); } return; }
  if (e.target.closest("#spPrint")) { window.print(); return; }
  if (e.target.closest("#exportBtn")) { exportData(); return; }
  if (e.target.closest("#importBtn")) { $("#importFile").value = ""; $("#importFile").click(); return; }
  if (e.target.closest("#resetAll")) { if (confirmReset()) { const theme = S.theme; S = {}; try { localStorage.removeItem(KEY); } catch(err) {} location.reload(); } return; }
  const pm = e.target.closest("[data-pmode]"); if (pm) { S.planMode = pm.dataset.pmode; save(); RENDER.plan(); return; }
  if (e.target.closest("#presetPlan")) { buildPlan(S.planMode).tasks.forEach(x => delete S.plan[x.id]); save(); RENDER.plan(); toast("Ticks cleared"); return; }
  const op = e.target.closest("[data-qid]");
  if (op && !op.disabled) { const q = D.QUIZ.find(x => x.id === op.dataset.qid); const pick = +op.dataset.pick; S.quiz[q.id] = {pick, ok: pick === q.a}; save(); updateSide();
    const card = $("#quiz-"+q.id); const n = card.querySelector("b").textContent.replace(/\D/g,""); card.outerHTML = quizCard(q, +n); renderMath($("#quiz-"+q.id)); refreshQuizStats(); return; }
  const rt = e.target.closest("[data-retry]"); if (rt) { const q = D.QUIZ.find(x => x.id === rt.dataset.retry); delete S.quiz[q.id]; save(); updateSide(); const card = $("#quiz-"+q.id); const n = card.querySelector("b").textContent.replace(/\D/g,""); card.outerHTML = quizCard(q, +n); renderMath($("#quiz-"+q.id)); refreshQuizStats(); return; }
  const hn = e.target.closest("[data-hint]"); if (hn) { $("#hint-"+hn.dataset.hint).hidden = false; hn.disabled = true; return; }
  if (e.target.closest("#q10")) { const pool = quizFiltered().map(q => q.id); for (let i = pool.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; } QF.set = pool.slice(0,10); QF.set.forEach(id => delete S.quiz[id]); save(); RENDER.practice(); return; }
  if (e.target.closest("#qall")) { QF.set = null; RENDER.practice(); return; }
  if (e.target.closest("#qreset")) { if (confirmReset()) { S.quiz = {}; save(); updateSide(); RENDER.practice(); toast("Scores reset"); } return; }
  if (e.target.closest("#focusBtn")) { document.body.classList.add("focus"); window.scrollTo(0,0); return; }
  if (e.target.closest("#exitFocus")) { document.body.classList.remove("focus"); return; }
  if (e.target.closest("#printL")) { $$("#tab-lastmin details").forEach(d => d.open = true); window.print(); return; }
  if (e.target.closest("#menuBtn")) { document.body.classList.toggle("nav-open"); return; }
  if (e.target.closest("#scrim")) { document.body.classList.remove("nav-open"); return; }
  if (e.target.closest("#themeBtn")) { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx); S.theme = nx; save(); return; }
});
function exportData(){
  try {
    const blob = new Blob([JSON.stringify({app:"mfc3prep", version:2, saved:new Date().toISOString(), data:S}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mfc3-progress-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Backup downloaded");
  } catch(e) { toast("Download not allowed here"); }
}
function importData(file){
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); const d = o && o.app === "mfc3prep" ? o.data : o;
      if (!d || typeof d !== "object" || !("done" in d || "plan" in d || "quiz" in d)) throw new Error("bad");
      localStorage.setItem(KEY, JSON.stringify(d)); toast("Progress restored"); setTimeout(() => location.reload(), 500);
    } catch(e) { toast("That file is not a backup from this site"); } };
  r.readAsText(file);
}
let resetArmed = 0;
function confirmReset(){ const now = Date.now(); if (now - resetArmed < 3000) { resetArmed = 0; return true; } resetArmed = now; toast("Press Reset again to confirm"); return false; }
function refreshQuizStats(){
  const st = quizStats(); const cards = $$("#tab-practice .grid.g4 .stat .n");
  if (cards.length === 3) { cards[0].textContent = st.att; cards[1].textContent = st.correct; cards[2].textContent = st.acc===null?"--":st.acc+"%"; }
}
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.done) { setDone(el.dataset.done, el.checked); if (TF.status !== "all" && rendered.topics && el.closest("#topicList")) setTimeout(drawTopics, 250); return; }
  if (el.dataset.tf) { TF[el.dataset.tf] = el.value; drawTopics(); return; }
  if (el.dataset.uf) { UF[el.dataset.uf] = el.value; drawTuts(); return; }
  if (el.dataset.tut) { const id = el.dataset.tut; if (el.checked) S.tut[id] = true; else delete S.tut[id]; save(); $$(`[data-tut="${id}"]`).forEach(c => c.checked = el.checked); const d = $("#tq-"+id); if (d) d.classList.toggle("done", el.checked); return; }
  if (el.dataset.pyqdone) { const id = el.dataset.pyqdone; if (el.checked) S.pyqDone[id] = true; else delete S.pyqDone[id]; save(); $$(`[data-pyqdone="${id}"]`).forEach(c => c.checked = el.checked); return; }
  if (el.dataset.rev) { const id = el.dataset.rev; if (el.checked) S.revised[id] = true; else delete S.revised[id]; save(); return; }
  if (el.dataset.sptopic) { const id = el.dataset.sptopic; if (el.checked) delete S.sprint.excl[id]; else S.sprint.excl[id] = true; save(); RENDER.plan(); return; }
  if (el.id === "spHours") { S.sprint.hours = clamp(parseFloat(el.value), 2, 18); save(); RENDER.plan(); return; }
  if (el.id === "spStart") { if (/^\d{1,2}:\d{2}$/.test(el.value)) { S.sprint.start = el.value; save(); RENDER.plan(); } return; }
  if (el.id === "spWL" || el.id === "spWP") { S.sprint[el.id === "spWL" ? "wLearn" : "wPractice"] = clamp(parseFloat(el.value), 0.5, 1.5); save(); RENDER.plan(); return; }
  if (el.id === "vall") { VALL = el.checked; drawVideos(); return; }
  if (el.id === "importFile" && el.files && el.files[0]) { importData(el.files[0]); return; }
  if (el.id === "pfPaper") { PF.paper = el.value; drawBank(); return; }
  if (el.id === "pfTopic") { PF.topic = el.value; drawBank(); return; }
  if (el.id === "fu") { FF.unit = el.value; drawFormulas(); return; }
  if (el.dataset.watch) { if (el.checked) S.watched[el.dataset.watch] = true; else delete S.watched[el.dataset.watch]; save(); $$(`[data-watch="${el.dataset.watch}"]`).forEach(c => c.checked = el.checked); return; }
  if (el.dataset.task) { if (el.checked) S.plan[el.dataset.task] = true; else delete S.plan[el.dataset.task]; save(); const row = el.closest(".task,.slot"); if (row) row.classList.toggle("done", el.checked); clearTimeout(window.__pt); window.__pt = setTimeout(() => { if (!$("#tab-plan").hidden) RENDER.plan(); }, 500); return; }
  if (el.id === "phrs") { const v = Math.max(1, Math.min(16, parseFloat(el.value) || 1)); S.hours[S.planMode] = v; save(); RENDER.plan(); return; }
  if (el.id === "pdate") { S.examDate = el.value; save(); RENDER.plan(); return; }
  if (el.dataset.check !== undefined) { if (el.checked) S.check[el.dataset.check] = true; else delete S.check[el.dataset.check]; save(); el.closest(".task").classList.toggle("done", el.checked); $("#ckc").textContent = Object.keys(S.check).length; return; }
  if (["qt","qy","qs","qd"].includes(el.id)) { const k = {qt:"topic",qy:"type",qs:"src",qd:"diff"}[el.id]; QF[k] = el.value; QF.set = null; RENDER.practice(); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") doSearch(e.target.value);
  if (e.target.id === "fq") { FF.q = e.target.value; clearTimeout(window.__fq); window.__fq = setTimeout(drawFormulas, 180); }
  if (e.target.id === "vq") { VQ = e.target.value; drawVideos(); }
  if (e.target.id === "spWL") $("#wlv").textContent = (+e.target.value).toFixed(1);
  if (e.target.id === "spWP") $("#wpv").textContent = (+e.target.value).toFixed(1);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#results").classList.remove("open"); document.body.classList.remove("nav-open"); document.body.classList.remove("focus"); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Enter" && e.target.id === "q") { const b = $("#results [data-hit]"); if (b) b.click(); }
});
$("#q").addEventListener("focus", e => { if (e.target.value) doSearch(e.target.value); });
window.addEventListener("hashchange", () => go(location.hash.slice(1)));

/* ================= init ================= */
if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
buildNav(); buildIndex(); updateSide();
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem(KEY + ".tab") || "dashboard"; } catch(e) { start = "dashboard"; } }
go(start);
})();
