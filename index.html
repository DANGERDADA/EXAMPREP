2 B","page":1,"marks":5,"topic":"chol","or":"Q1 or Q2","text":"Solve by Cholesky method: $9x_1+6x_2+12x_3=17.4,\\;6x_1+13x_2+11x_3=23.6,\\;12x_1+11x_2+26x_3=30.8$.","match":"Exact match: Unit I slides, Cholesky Example 2 (identical system and numbers).","steps":["$A=\\begin{bmatrix}9&6&12\\\\6&13&11\\\\12&11&26\\end{bmatrix}$ symmetric; $A=LL^T$","$l_{11}=3,\\;l_{21}=6/3=2,\\;l_{31}=12/3=4$","$l_{22}=\\sqrt{13-4}=3,\\;l_{32}=\\frac{11-2\\cdot4}{3}=1,\\;l_{33}=\\sqrt{26-16-1}=3$","$LZ=B$: $3z_1=17.4\\Rightarrow z_1=5.8$; $2(5.8)+3z_2=23.6\\Rightarrow z_2=4$; $4(5.8)+4+3z_3=30.8\\Rightarrow z_3=1.2$","$L^TX=Z$: $3x_3=1.2\\Rightarrow x_3=0.4$; $3x_2+x_3=4\\Rightarrow x_2=1.2$; $3x_1+2(1.2)+4(0.4)=5.8\\Rightarrow x_1=0.6$"],"answer":"$L=\\begin{bmatrix}3&0&0\\\\2&3&0\\\\4&1&3\\end{bmatrix}$, $x_1=0.6,\\;x_2=1.2,\\;x_3=0.4$."},{"id":"A3A","paper":"A","q":"Q3 A","page":2,"marks":5,"topic":"exact","or":"Q3 or Q4","text":"Obtain the general solution of $(2xy+e^y)\\,dx+(x^2+xe^y)\\,dy=0$.","match":"Exact match: Unit II slides, Exact Example 03 (the slide also adds y(1)=0, giving c=1).","steps":["$M=2xy+e^y,\\;N=x^2+xe^y$","$M_y=2x+e^y=N_x\\Rightarrow$ exact","$\\int M\\,dx\\;(y\\text{ const})=x^2y+xe^y$; every term of $N$ contains $x$","General solution: $x^2y+xe^y=c$"],"answer":"$x^2y+xe^y=c$ (the handwritten key writes '$y=$' - the correct right side is the constant $c$)."},{"id":"A3B","paper":"A","q":"Q3 B","page":2,"marks":5,"topic":"linear","or":"Q3 or Q4","text":"Solve $(1+x^2)\\dfrac{dy}{dx}+y=e^{\\tan^{-1}x}$.","match":"Exact match: Unit II slides, Linear DE Exercise 1.","steps":["Divide by $1+x^2$: $\\dfrac{dy}{dx}+\\dfrac{1}{1+x^2}y=\\dfrac{e^{\\tan^{-1}x}}{1+x^2}$","$\\text{IF}=e^{\\int\\frac{dx}{1+x^2}}=e^{\\tan^{-1}x}$","$y\\,e^{\\tan^{-1}x}=\\int\\dfrac{e^{2\\tan^{-1}x}}{1+x^2}dx$; put $t=\\tan^{-1}x,\\;dt=\\frac{dx}{1+x^2}$","$=\\int e^{2t}dt=\\frac{e^{2t}}{2}+c$","$y\\,e^{\\tan^{-1}x}=\\tfrac12e^{2\\tan^{-1}x}+c$"],"answer":"$y\\,e^{\\tan^{-1}x}=\\tfrac12 e^{2\\tan^{-1}x}+c$"},{"id":"A4A","paper":"A","q":"Q4 A","page":2,"marks":5,"topic":"form","or":"Q3 or Q4","text":"Form the differential equation by eliminating the arbitrary constants from $y=A\\sin(\\log x)+B\\cos(\\log x)$.","match":"Exact match (A, B swapped): Unit II slides, Formation Example 02.","steps":["Two constants $\\Rightarrow$ differentiate twice","$y_1=\\dfrac{A\\cos(\\log x)-B\\sin(\\log x)}{x}\\Rightarrow xy_1=A\\cos(\\log x)-B\\sin(\\log x)$","Differentiate: $xy_2+y_1=\\dfrac{-A\\sin(\\log x)-B\\cos(\\log x)}{x}=-\\dfrac{y}{x}$","$x^2y_2+xy_1+y=0$"],"answer":"$x^2\\dfrac{d^2y}{dx^2}+x\\dfrac{dy}{dx}+y=0$"},{"id":"A4B","paper":"A","q":"Q4 B","page":2,"marks":5,"topic":"reduc","or":"Q3 or Q4","text":"Reduce $(x^2y-2xy^2)\\,dx-(x^3-3x^2y)\\,dy=0$ into an exact differential equation and find the general solution.","match":"Exact match: Unit II slides, Reducible-to-exact Example 01.","steps":["$M=x^2y-2xy^2,\\;N=-x^3+3x^2y$; $M_y=x^2-4xy\\neq N_x=-3x^2+6xy$","Homogeneous of degree 3 $\\Rightarrow$ Rule I","$Mx+Ny=x^3y-2x^2y^2-x^3y+3x^2y^2=x^2y^2\\Rightarrow\\text{IF}=\\frac{1}{x^2y^2}$","$\\left(\\frac1y-\\frac2x\\right)dx+\\left(-\\frac{x}{y^2}+\\frac3y\\right)dy=0$; $M_y=-\\frac1{y^2}=N_x$ ✓","$\\int\\left(\\frac1y-\\frac2x\\right)dx+\\int\\frac3y\\,dy=c$","$\\frac xy-2\\log x+3\\log y=c$"],"answer":"$\\dfrac xy-2\\log x+3\\log y=c$, i.e. $\\dfrac xy+\\log\\dfrac{y^3}{x^2}=c$"},{"id":"B1A","paper":"B","q":"Q1 A","page":1,"marks":5,"topic":"eig","or":"Q1 or Q2","text":"Determine the eigen values of $A=\\begin{bmatrix}8&-8&-2\\\\4&-3&-2\\\\3&-4&1\\end{bmatrix}$ and obtain the eigen vector corresponding to the largest eigen value.","match":"Exact match: Unit I slides, Eigen Example 2 (fully worked there).","steps":["$S_1=8-3+1=6$","$S_2=\\begin{vmatrix}-3&-2\\\\-4&1\\end{vmatrix}+\\begin{vmatrix}8&-2\\\\3&1\\end{vmatrix}+\\begin{vmatrix}8&-8\\\\4&-3\\end{vmatrix}=-11+14+8=11$","$|A|=8(-11)+8(10)-2(-7)=6$","$\\lambda^3-6\\lambda^2+11\\lambda-6=0\\Rightarrow(\\lambda-1)(\\lambda-2)(\\lambda-3)=0$","Largest $\\lambda=3$: $\\begin{bmatrix}5&-8&-2\\\\4&-6&-2\\\\3&-4&-2\\end{bmatrix}X=0$","Rows 1, 2: $\\dfrac{x}{16-12}=\\dfrac{-y}{-10+8}=\\dfrac{z}{-30+32}\\Rightarrow\\dfrac x4=\\dfrac y2=\\dfrac z2$","$X_3=(2,1,1)^T$"],"answer":"$\\lambda=1,2,3$; for $\\lambda=3$: $(2,1,1)^T$. (Others: $\\lambda=1\\to(4,3,2)^T$, $\\lambda=2\\to(3,2,1)^T$.)"},{"id":"B1B","paper":"B","q":"Q1 B","page":1,"marks":5,"topic":"lu","or":"Q1 or Q2","text":"Find the LU decomposition of $A=\\begin{bmatrix}2&2&3\\\\4&-2&1\\\\1&5&4\\end{bmatrix}$.","match":"Exact match: Unit I slides, LU Example 2 (there it also solves AX=B with B=(4,9,3)).","steps":["$u_{11}=2,\\;u_{12}=2,\\;u_{13}=3$","$l_{21}=4/2=2,\\;l_{31}=1/2$","$u_{22}=-2-2(2)=-6,\\;u_{23}=1-2(3)=-5$","$l_{32}=\\dfrac{5-\\frac12(2)}{-6}=-\\dfrac23$","$u_{33}=4-\\frac12(3)-\\left(-\\frac23\\right)(-5)=4-\\frac32-\\frac{10}{3}=-\\frac56$","$L=\\begin{bmatrix}1&0&0\\\\2&1&0\\\\\\frac12&-\\frac23&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&2&3\\\\0&-6&-5\\\\0&0&-\\frac56\\end{bmatrix}$","(Slide extension, B=(4,9,3)): $Z=(4,1,5/3)$, $X=(7/2,\\,3/2,\\,-2)$"],"answer":"$l_{21}=2,\\;l_{31}=+\\tfrac12,\\;l_{32}=-\\tfrac23$; $U$ diagonal $2,-6,-5/6$."},{"id":"B2A","paper":"B","q":"Q2 A","page":1,"marks":5,"topic":"diag","or":"Q1 or Q2","text":"Show that $A=\\begin{bmatrix}-4&-6\\\\3&5\\end{bmatrix}$ is diagonalizable. Then find $P$ such that $P^{-1}AP$ is diagonal.","match":"Exact match: Unit I slides, Diagonalization Exercise 2 (also Eigen Exercise 2).","steps":["$S_1=1,\\;|A|=-20+18=-2\\Rightarrow\\lambda^2-\\lambda-2=0\\Rightarrow\\lambda=-1,2$ (distinct)","$\\lambda=-1$: $-3x-6y=0\\Rightarrow X_1=(-2,1)^T$","$\\lambda=2$: $-6x-6y=0\\Rightarrow X_2=(-1,1)^T$","$P=\\begin{bmatrix}-2&-1\\\\1&1\\end{bmatrix},\\;|P|=-1,\\;P^{-1}=\\begin{bmatrix}-1&-1\\\\1&2\\end{bmatrix}$","$P^{-1}AP=\\begin{bmatrix}-1&0\\\\0&2\\end{bmatrix}$"],"answer":"$P=\\begin{bmatrix}-2&-1\\\\1&1\\end{bmatrix}$, $D=\\text{diag}(-1,2)$."},{"id":"B2B","paper":"B","q":"Q2 B","page":1,"marks":5,"topic":"chol","or":"Q1 or Q2","text":"Solve by Cholesky method: $4x_1+2x_2+14x_3=14,\\;2x_1+17x_2-5x_3=-101,\\;14x_1-5x_2+83x_3=155$.","match":"Not in slides (same method as Cholesky Example 2).","steps":["$l_{11}=\\sqrt4=2,\\;l_{21}=2/2=1,\\;l_{31}=14/2=7$","$l_{22}=\\sqrt{17-1}=4,\\;l_{32}=\\frac{-5-7(1)}{4}=-3,\\;l_{33}=\\sqrt{83-49-9}=5$","$LZ=B$: $2z_1=14\\Rightarrow z_1=7$; $7+4z_2=-101\\Rightarrow z_2=-27$; $49+81+5z_3=155\\Rightarrow z_3=5$","$L^TX=Z$: $5x_3=5\\Rightarrow x_3=1$; $4x_2-3(1)=-27\\Rightarrow x_2=-6$; $2x_1-6+7=7\\Rightarrow x_1=3$"],"answer":"$L=\\begin{bmatrix}2&0&0\\\\1&4&0\\\\7&-3&5\\end{bmatrix}$, $x_1=3,\\;x_2=-6,\\;x_3=1$."},{"id":"B3A","paper":"B","q":"Q3 A","page":2,"marks":5,"topic":"exact","or":"Q3 or Q4","text":"Find the general solution of $(1+xy^2)\\,dx+(1+x^2y)\\,dy=0$.","match":"Exact match: Unit II slides, Exact DE Exercise 1.","steps":["$M_y=2xy=N_x\\Rightarrow$ exact","$\\int M\\,dx=x+\\frac{x^2y^2}{2}$","Terms of $N$ free of $x$: $1\\Rightarrow\\int1\\,dy=y$","$x+\\frac{x^2y^2}{2}+y=c$"],"answer":"$x+y+\\dfrac{x^2y^2}{2}=c$"},{"id":"B3B","paper":"B","q":"Q3 B","page":2,"marks":5,"topic":"linear","or":"Q3 or Q4","text":"Solve $x^2\\dfrac{dy}{dx}=3x^2-2xy+1$.","match":"Exact match: Unit II slides, Linear DE Exercise 2.","steps":["Divide by $x^2$: $\\dfrac{dy}{dx}+\\dfrac2xy=3+\\dfrac{1}{x^2}$","$\\text{IF}=e^{\\int 2/x\\,dx}=x^2$","$yx^2=\\int\\left(3+\\frac1{x^2}\\right)x^2dx=\\int(3x^2+1)dx$","$x^2y=x^3+x+c$"],"answer":"$x^2y=x^3+x+c$"},{"id":"B4A","paper":"B","q":"Q4 A","page":2,"marks":5,"topic":"form","or":"Q3 or Q4","text":"Form the differential equation whose general solution is $y=ae^{-2x}+be^{-3x}$.","match":"Exact match: Unit II slides, Formation Exercise 1.","steps":["$y_1=-2ae^{-2x}-3be^{-3x}$","$y_2=4ae^{-2x}+9be^{-3x}$","$y_2+5y_1+6y=(4-10+6)ae^{-2x}+(9-15+6)be^{-3x}=0$","$\\dfrac{d^2y}{dx^2}+5\\dfrac{dy}{dx}+6y=0$"],"answer":"$y''+5y'+6y=0$"},{"id":"B4B","paper":"B","q":"Q4 B","page":2,"marks":5,"topic":"reduc","or":"Q3 or Q4","text":"Obtain the integrating factor of $(1+xy)y\\,dx+(1-xy)x\\,dy=0$ and use it to find the general solution.","match":"Exact match: Unit II slides, Reducible Exercise 4.","steps":["Form $y f_1(xy)dx+xf_2(xy)dy\\Rightarrow$ Rule II","$Mx-Ny=xy(1+xy)-xy(1-xy)=2x^2y^2\\Rightarrow\\text{IF}=\\frac{1}{2x^2y^2}$","$\\left(\\frac{1}{2x^2y}+\\frac{1}{2x}\\right)dx+\\left(\\frac{1}{2xy^2}-\\frac{1}{2y}\\right)dy=0$ (exact)","$\\int M\\,dx=-\\frac{1}{2xy}+\\frac12\\log x$; $N$ terms free of $x$: $-\\frac1{2y}\\Rightarrow-\\frac12\\log y$","$-\\frac{1}{2xy}+\\frac12\\log x-\\frac12\\log y=c$"],"answer":"$\\log\\dfrac xy-\\dfrac{1}{xy}=C$"},{"id":"C1A","paper":"C","q":"Q1 A","page":1,"marks":5,"topic":"euler","or":"Q1 or Q2","text":"If $u=\\tan^{-1}\\left(\\dfrac{x^3+y^3}{x+y}\\right)$ then show that $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=\\sin2u\\,[1-4\\sin^2u]$.","match":"No slides available for this unit.","steps":["$f(u)=\\tan u=\\frac{x^3+y^3}{x+y}$ is homogeneous of degree $n=3-1=2$","$g(u)=n\\dfrac{f(u)}{f'(u)}=\\dfrac{2\\tan u}{\\sec^2u}=2\\sin u\\cos u=\\sin2u$","So $xu_x+yu_y=\\sin 2u$","$g'(u)=2\\cos2u$; corollary: $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(u)[g'(u)-1]$","$=\\sin2u\\,(2\\cos2u-1)=\\sin2u\\,(2-4\\sin^2u-1)=\\sin2u\\,(1-4\\sin^2u)$ ∎"],"answer":"Use $g(u)=\\sin 2u$ and $g(g'-1)$."},{"id":"C1B","paper":"C","q":"Q1 B","page":1,"marks":5,"topic":"jacob","or":"Q1 or Q2","text":"Calculate $J=\\dfrac{\\partial(u,v)}{\\partial(x,y)}$ and $J'=\\dfrac{\\partial(x,y)}{\\partial(u,v)}$ and verify $JJ'=1$, given $u=x+\\dfrac{y^2}{x},\\;v=\\dfrac{y^2}{x}$.","match":"No slides available for this unit.","steps":["$J=\\begin{vmatrix}1-\\frac{y^2}{x^2}&\\frac{2y}{x}\\\\-\\frac{y^2}{x^2}&\\frac{2y}{x}\\end{vmatrix}=\\frac{2y}{x}\\left(1-\\frac{y^2}{x^2}\\right)+\\frac{2y}{x}\\cdot\\frac{y^2}{x^2}=\\frac{2y}{x}$","Inverse: $u-v=x\\Rightarrow x=u-v$; $y^2=vx=v(u-v)\\Rightarrow y=\\sqrt{v(u-v)}$","$x_u=1,\\;x_v=-1,\\;y_u=\\frac{v}{2y},\\;y_v=\\frac{u-2v}{2y}$","$J'=\\frac{u-2v}{2y}+\\frac{v}{2y}=\\frac{u-v}{2y}=\\frac{x}{2y}$","$JJ'=\\frac{2y}{x}\\cdot\\frac{x}{2y}=1$ ✓"],"answer":"$J=\\frac{2y}{x},\\;J'=\\frac{x}{2y},\\;JJ'=1$"},{"id":"C2A","paper":"C","q":"Q2 A","page":1,"marks":5,"topic":"pdbasic","or":"Q1 or Q2","text":"If $u=\\log(\\tan x+\\tan y+\\tan z)$ then show that $\\sin2x\\,u_x+\\sin2y\\,u_y+\\sin2z\\,u_z=2$.","match":"No slides available for this unit.","steps":["Let $S=\\tan x+\\tan y+\\tan z$; $u_x=\\dfrac{\\sec^2x}{S}$","$\\sin2x\\,u_x=\\dfrac{2\\sin x\\cos x}{\\cos^2x\\,S}=\\dfrac{2\\tan x}{S}$","Similarly $\\sin2y\\,u_y=\\frac{2\\tan y}{S}$, $\\sin2z\\,u_z=\\frac{2\\tan z}{S}$","Sum $=\\dfrac{2(\\tan x+\\tan y+\\tan z)}{S}=2$ ∎"],"answer":"= 2"},{"id":"C2B","paper":"C","q":"Q2 B","page":1,"marks":5,"topic":"maxmin","or":"Q1 or Q2","text":"Examine the function $f(x,y)=x^4+y^4-2x^2+4xy-2y^2$ for extreme values.","match":"No slides available for this unit.","steps":["$f_x=4x^3-4x+4y=0,\\;f_y=4y^3+4x-4y=0$","Add: $x^3+y^3=0\\Rightarrow y=-x$; then $x^3-2x=0\\Rightarrow x=0,\\pm\\sqrt2$","Points: $(0,0),\\;(\\sqrt2,-\\sqrt2),\\;(-\\sqrt2,\\sqrt2)$","$r=12x^2-4,\\;s=4,\\;t=12y^2-4$","At $(\\pm\\sqrt2,\\mp\\sqrt2)$: $r=20,\\,t=20,\\,rt-s^2=384>0,\\,r>0\\Rightarrow$ minimum; $f=4+4-4-8-4=-8$","At $(0,0)$: $r=t=-4,\\,s=4\\Rightarrow rt-s^2=0$ (doubtful). $f(x,0)=x^4-2x^2<0$ but $f(x,x)=2x^4>0$ near 0 $\\Rightarrow$ no extremum"],"answer":"Minimum value $-8$ at $(\\sqrt2,-\\sqrt2)$ and $(-\\sqrt2,\\sqrt2)$; no extremum at $(0,0)$."},{"id":"C3A","paper":"C","q":"Q3 A","page":2,"marks":5,"topic":"duis1","or":"Q3 or Q4","text":"Show that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}\\,dx=\\log\\left(\\frac ba\\right),\\;a,b>0$.","match":"Exact repeat: same question as TA-II Oct-2025 Q3 A.","steps":["Let $I(a)=\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx$ ($b$ fixed)","DUIS Rule I: $\\dfrac{dI}{da}=\\int_0^\\infty\\frac{-xe^{-ax}}{x}dx=-\\int_0^\\infty e^{-ax}dx=-\\frac1a$","$I(a)=-\\log a+c$","When $a=b$ the integrand is 0, so $I(b)=0\\Rightarrow c=\\log b$","$I=\\log b-\\log a=\\log\\frac ba$ ∎"],"answer":"$\\log(b/a)$"},{"id":"C3B","paper":"C","q":"Q3 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","text":"Prove that $\\displaystyle\\int_a^b e^{-x^2}dx=\\frac{\\sqrt\\pi}{2}\\left[\\text{erf}(b)-\\text{erf}(a)\\right]$.","match":"No slides available for this unit.","steps":["Definition: $\\text{erf}(t)=\\frac{2}{\\sqrt\\pi}\\int_0^te^{-u^2}du\\Rightarrow\\int_0^te^{-u^2}du=\\frac{\\sqrt\\pi}{2}\\text{erf}(t)$","$\\int_a^b=\\int_a^0+\\int_0^b=\\int_0^b-\\int_0^a$","$=\\frac{\\sqrt\\pi}{2}\\text{erf}(b)-\\frac{\\sqrt\\pi}{2}\\text{erf}(a)$ ∎"],"answer":"Split at 0 and use the definition."},{"id":"C4A","paper":"C","q":"Q4 A","page":2,"marks":5,"topic":"duis2","or":"Q3 or Q4","text":"If $y=\\displaystyle\\int_0^x f(t)\\sin a(x-t)\\,dt$, show that $\\dfrac{d^2y}{dx^2}+a^2y=af(x)$.","match":"Same concept as TA-II Oct-2025 Q4 A (Leibnitz rule).","steps":["Leibnitz: $\\frac{dy}{dx}=\\int_0^x af(t)\\cos a(x-t)dt+f(x)\\sin a(x-x)\\cdot1-0$","$=a\\int_0^x f(t)\\cos a(x-t)dt$ (since $\\sin0=0$)","$\\frac{d^2y}{dx^2}=a\\int_0^x-af(t)\\sin a(x-t)dt+af(x)\\cos0=-a^2y+af(x)$","$\\Rightarrow y''+a^2y=af(x)$ ∎"],"answer":"Differentiate twice with Leibnitz."},{"id":"C4B","paper":"C","q":"Q4 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","text":"Prove that $\\dfrac{d}{dx}[\\text{erf}(x)]=\\dfrac{2}{\\sqrt\\pi}e^{-x^2}$ and use it to show $\\dfrac{d}{dx}[\\text{erf}(ax^n)]=\\dfrac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}$.","match":"No slides available for this unit.","steps":["$\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^xe^{-u^2}du$; Leibnitz (or FTC): $\\frac{d}{dx}\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}e^{-x^2}$","$\\text{erf}(ax^n)=\\frac{2}{\\sqrt\\pi}\\int_0^{ax^n}e^{-u^2}du$","$\\frac{d}{dx}=\\frac{2}{\\sqrt\\pi}e^{-(ax^n)^2}\\cdot\\frac{d}{dx}(ax^n)=\\frac{2}{\\sqrt\\pi}e^{-a^2x^{2n}}\\cdot anx^{n-1}$","$=\\dfrac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}$ ∎"],"answer":"Chain rule on the upper limit."},{"id":"D1A","paper":"D","q":"Q1 A","page":1,"marks":5,"topic":"composite","or":"Q1 or Q2","co":"CO3/L3","text":"If $z=f(x+ct)+\\varphi(x-ct)$ then show that $\\dfrac{\\partial^2z}{\\partial t^2}=c^2\\dfrac{\\partial^2z}{\\partial x^2}$.","match":"Model solution on PDF page 3 (mark split 2 + 2 + 1).","steps":["$z_x=f'(x+ct)+\\varphi'(x-ct)$, $z_{xx}=f''(x+ct)+\\varphi''(x-ct)$ [2 marks]","$z_t=cf'(x+ct)-c\\varphi'(x-ct)$, $z_{tt}=c^2f''+c^2\\varphi''=c^2[f''+\\varphi'']$ [2 marks]","Hence $z_{tt}=c^2z_{xx}$ [1 mark]"],"answer":"$z_{tt}=c^2z_{xx}$"},{"id":"D1B","paper":"D","q":"Q1 B","page":1,"marks":5,"topic":"euler","or":"Q1 or Q2","co":"CO3/L4","text":"If $u=\\sin^{-1}(x^3+y^3)$ then find $xu_x+yu_y$ and $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}$.","match":"Model solution on PDF pages 3-4.","steps":["$f(u)=\\sin u=x^3+y^3$ homogeneous, $n=3$ [1 mark]","$xu_x+yu_y=n\\frac{f(u)}{f'(u)}=3\\frac{\\sin u}{\\cos u}=3\\tan u$ [2 marks]","$g(u)=3\\tan u,\\;g'(u)=3\\sec^2u$","$x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(g'-1)=3\\tan u\\,(3\\sec^2u-1)$ [2 marks]"],"answer":"$3\\tan u$ and $3\\tan u(3\\sec^2u-1)$"},{"id":"D2A","paper":"D","q":"Q2 A","page":1,"marks":5,"topic":"jacob","or":"Q1 or Q2","co":"CO3/L4","text":"If $u=x^2+3y^2-z^3,\\;v=4x^2yz,\\;w=2z^2-xy$, evaluate $\\dfrac{\\partial(x,y,z)}{\\partial(u,v,w)}$ at $(1,1,0)$.","match":"Model solution on PDF page 4.","steps":["By $JJ'=1$: $\\frac{\\partial(x,y,z)}{\\partial(u,v,w)}=1\\Big/\\frac{\\partial(u,v,w)}{\\partial(x,y,z)}$ [1 mark]","$J=\\begin{vmatrix}2x&6y&-3z^2\\\\8xyz&4x^2z&4x^2y\\\\-y&-x&4z\\end{vmatrix}$","At $(1,1,0)$: $J=\\begin{vmatrix}2&6&0\\\\0&0&4\\\\-1&-1&0\\end{vmatrix}=2(0+4)-6(0+4)+0=-16$ [3 marks]","$\\frac{\\partial(x,y,z)}{\\partial(u,v,w)}=-\\frac{1}{16}$ [1 mark]"],"answer":"$-\\dfrac1{16}$ (tip: substitute the point before expanding)"},{"id":"D2B","paper":"D","q":"Q2 B","page":1,"marks":5,"topic":"euler","or":"Q1 or Q2","co":"CO3/L3","text":"If $u=\\dfrac{xyz}{2x+y+z}+\\log\\left(\\dfrac{x^2+y^2+z^2}{xy+yz}\\right)$ then find $xu_x+yu_y+zu_z$.","match":"Model solution on PDF page 5.","steps":["$u=U+W$, $U=\\frac{xyz}{2x+y+z}$, $W=\\log\\frac{x^2+y^2+z^2}{xy+yz}$","$U(tx,ty,tz)=\\frac{t^3xyz}{t(2x+y+z)}=t^2U\\Rightarrow n=2\\Rightarrow\\sum xU_x=2U$ [2 marks]","$e^W=\\frac{x^2+y^2+z^2}{xy+yz}$ is homogeneous of degree 0 $\\Rightarrow\\sum xW_x=0\\cdot\\frac{e^W}{e^W}=0$ [2 marks]","$xu_x+yu_y+zu_z=\\dfrac{2xyz}{2x+y+z}$ [1 mark]"],"answer":"$\\dfrac{2xyz}{2x+y+z}$"},{"id":"D3A","paper":"D","q":"Q3 A","page":1,"marks":5,"topic":"duis1","or":"Q3 or Q4","co":"CO4/L3","text":"Show that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}\\,dx=\\log\\left(\\frac ba\\right),\\;a,b>0$.","match":"Exact repeat of TA-II Oct-2024 Q3 A. Model solution on PDF pages 5-6.","steps":["$I(a)=\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx$","$\\frac{dI}{da}=-\\int_0^\\infty e^{-ax}dx=-\\frac1a$ [2 marks]","$I=-\\log a+c$; $a=b\\Rightarrow I=0\\Rightarrow c=\\log b$ [2 marks]","$I=\\log\\frac ba$ [1 mark]","Note: the 2025 model answer splits into $I(a)-I(b)$ and differentiates each; the single-parameter route above is cleaner (each separate piece diverges)."],"answer":"$\\log(b/a)$"},{"id":"D3B","paper":"D","q":"Q3 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","co":"CO4/L4","text":"Show that $\\displaystyle\\int_0^\\infty e^{-x^2-2ax}dx=\\frac{\\sqrt\\pi}{2}e^{a^2}\\,\\text{erfc}(a)$.","match":"Model solution on PDF pages 6-7.","steps":["Complete the square: $-x^2-2ax=-(x+a)^2+a^2$ [1 mark]","$\\text{LHS}=e^{a^2}\\int_0^\\infty e^{-(x+a)^2}dx$; put $x+a=t$: $x=0\\to t=a$, $x=\\infty\\to t=\\infty$ [1 mark]","$=e^{a^2}\\int_a^\\infty e^{-t^2}dt=e^{a^2}\\cdot\\frac{\\sqrt\\pi}{2}\\text{erfc}(a)$ [3 marks]"],"answer":"$\\frac{\\sqrt\\pi}{2}e^{a^2}\\text{erfc}(a)$"},{"id":"D4A","paper":"D","q":"Q4 A","page":2,"marks":5,"topic":"duis2","or":"Q3 or Q4","co":"CO4/L3","text":"If $f(x)=\\displaystyle\\int_0^x(x-t)^2G(t)\\,dt$ then show that $\\dfrac{d^3f}{dx^3}-2G(x)=0$.","match":"Same concept as TA-II Oct-2024 Q4 A. Model solution on PDF page 7.","steps":["Leibnitz: $f'=\\int_0^x2(x-t)G(t)dt+(x-x)^2G(x)-0=\\int_0^x2(x-t)G(t)dt$ [2 marks]","$f''=\\int_0^x2G(t)dt+2(x-x)G(x)=2\\int_0^xG(t)dt$ [2 marks]","$f'''=2G(x)\\Rightarrow f'''-2G(x)=0$ [1 mark]"],"answer":"$f'''=2G(x)$"},{"id":"D4B","paper":"D","q":"Q4 B","page":2,"marks":5,"topic":"erf","or":"Q3 or Q4","co":"CO4/L4","text":"Define the Error function and Complementary Error function and hence prove $\\text{erfc}(-x)+\\text{erfc}(x)=2$.","match":"Model solution on PDF page 8.","steps":["$\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^xe^{-u^2}du$ [1 mark]","$\\text{erfc}(x)=\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}du$ [1 mark]","$\\text{erf}+\\text{erfc}=1\\Rightarrow\\text{erfc}(-x)=1-\\text{erf}(-x)$ [1 mark]","LHS $=1-\\text{erf}(-x)+1-\\text{erf}(x)$ [1 mark]","erf is odd: $\\text{erf}(-x)=-\\text{erf}(x)\\Rightarrow$ LHS $=2$ [1 mark]"],"answer":"= 2"}],"REPEATS":[{"kind":"Exact repeat across years","title":"Frullani integral $\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$","items":["C3A","D3A"],"note":"Same wording, same marks (5), same slot (Q3 A) in Oct-2024 and Oct-2025."},{"kind":"Exact repeat of a slide example","title":"Cholesky: 9x₁+6x₂+12x₃=17.4 ...","items":["A2B"],"slide":"Unit I slides - Cholesky Example 2","note":"Identical numbers; slide shows full working."},{"kind":"Exact repeat of a slide example","title":"Eigen 3x3: [[8,-8,-2],[4,-3,-2],[3,-4,1]]","items":["B1A"],"slide":"Unit I slides - Eigen Example 2"},{"kind":"Exact repeat of a slide exercise","title":"Eigen 3x3: [[4,6,6],[1,3,2],[-1,-4,-3]]","items":["A1A"],"slide":"Unit I slides - Eigen Exercise 4 (answers printed)"},{"kind":"Exact repeat of a slide example","title":"LU: [[2,2,3],[4,-2,1],[1,5,4]]","items":["B1B"],"slide":"Unit I slides - LU Example 2"},{"kind":"Exact repeat of a slide exercise","title":"Diagonalize [[-4,-6],[3,5]]","items":["B2A"],"slide":"Unit I slides - Diagonalization Exercise 2"},{"kind":"Exact repeat of a slide example","title":"Exact: (2xy+e^y)dx+(x²+xe^y)dy=0","items":["A3A"],"slide":"Unit II slides - Exact Example 03"},{"kind":"Exact repeat of a slide exercise","title":"Exact: (1+xy²)dx+(1+x²y)dy=0","items":["B3A"],"slide":"Unit II slides - Exact Exercise 1"},{"kind":"Exact repeat of a slide exercise","title":"Linear: (1+x²)y'+y=e^{tan⁻¹x}","items":["A3B"],"slide":"Unit II slides - Linear Exercise 1"},{"kind":"Exact repeat of a slide exercise","title":"Linear: x²y'=3x²-2xy+1","items":["B3B"],"slide":"Unit II slides - Linear Exercise 2"},{"kind":"Exact repeat of a slide example","title":"Formation: y = A sin(log x) + B cos(log x)","items":["A4A"],"slide":"Unit II slides - Formation Example 02 (A, B swapped)"},{"kind":"Exact repeat of a slide exercise","title":"Formation: y = ae^{-2x}+be^{-3x}","items":["B4A"],"slide":"Unit II slides - Formation Exercise 1"},{"kind":"Exact repeat of a slide example","title":"Reducible (Rule I): (x²y-2xy²)dx-(x³-3x²y)dy=0","items":["A4B"],"slide":"Unit II slides - Reducible Example 01"},{"kind":"Exact repeat of a slide exercise","title":"Reducible (Rule II): (1+xy)y dx+(1-xy)x dy=0","items":["B4B"],"slide":"Unit II slides - Reducible Exercise 4"}],"GROUPS":[{"title":"Error function manipulations","method":"Definition of erf/erfc + split limits / Leibnitz / complete the square","items":["C3B","C4B","D3B","D4B"]},{"title":"Euler's theorem (corollary g(u) = n f/f')","method":"Find n by x→tx; g(u)=nf/f'; second order g(g'−1)","items":["C1A","D1B","D2B"]},{"title":"Leibnitz rule with integrand vanishing at t = x","method":"Differentiate under the sign repeatedly; boundary term uses f(x,x)","items":["C4A","D4A"]},{"title":"Jacobian + JJ' = 1","method":"Compute J; inverse Jacobian is 1/J","items":["C1B","D2A"]},{"title":"Eigenvalues of a 3x3 + one eigenvector","method":"S1, S2, |A| shortcut; Cramer's rule on two rows","items":["A1A","B1A"]},{"title":"2x2 diagonalization","method":"Distinct eigenvalues ⇒ P of eigenvectors, D = diag","items":["A2A","B2A"]},{"title":"Triangular factorisation of 3x3","method":"Compare entries of LU or LLᵀ; forward then backward substitution","items":["A1B","B1B","A2B","B2B"]},{"title":"Exact DE","method":"M_y = N_x; ∫M dx + ∫(N without x) dy = c","items":["A3A","B3A","A4B","B4B"]},{"title":"Linear first-order DE","method":"Standard form, IF = e^{∫P}","items":["A3B","B3B"]},{"title":"Formation by eliminating 2 constants","method":"Differentiate twice and recombine","items":["A4A","B4A"]}],"VALUABLE":[{"id":"C3A","why":"Only exact repeat across two different years (Oct-24 and Oct-25, both Q3 A). 4 lines of working."},{"id":"A3A","why":"Exact DE, copied from Unit II Example 03. The quickest 5 marks: one test, one integral."},{"id":"A2B","why":"Cholesky system identical to Unit I Example 2 - integer L, answers 0.6, 1.2, 0.4 to self-check."},{"id":"D4B","why":"erf/erfc definitions + odd property. Definitions alone are 2 of 5 marks; erf appears in 4 TA-II questions."},{"id":"C1A","why":"Teaches the full Euler corollary (first and second order) used in 3 TA-II questions."},{"id":"B1A","why":"3x3 eigenvalue problem fully worked in Unit I Example 2; eigenvalues are the prerequisite for Q2 A."},{"id":"B3B","why":"Linear DE from Unit II Exercise 2 - shows the 'divide to standard form' step examiners look for."},{"id":"A4B","why":"IF Rule I (homogeneous) from Unit II Example 01 - the step-by-step pattern for every Q4 B."},{"id":"D2A","why":"3x3 Jacobian at a point with J' = 1/J. Substituting the point first makes it quick."},{"id":"C4A","why":"Leibnitz rule twice - the same idea as Oct-25 Q4 A, so one method covers both."}],"FORMULAS":[{"id":"F1","unit":"U1","topic":"eig","cat":"Definition","name":"Eigenvalue equation","tex":"AX=\\lambda X,\\quad X\\neq 0","sym":"$A$: $n\\times n$ matrix, $\\lambda$: eigenvalue (scalar), $X$: eigenvector","cond":"X must be non-zero","ex":"","pyq":["A1A","B1A"],"mistake":"Taking X = 0 as an eigenvector.","tip":"Eigen = 'own': A only stretches its own vector.","src":"Unit I slides"},{"id":"F2","unit":"U1","topic":"eig","cat":"Method","name":"Characteristic equation","tex":"|A-\\lambda I|=0","sym":"$I$: identity of the same order","cond":"Square matrix","ex":"","pyq":["A1A","B1A","A2A","B2A"],"mistake":"Subtracting λ from every entry instead of only the diagonal.","tip":"λ goes only on the diagonal.","src":"Unit I slides"},{"id":"F3","unit":"U1","topic":"eig","cat":"Shortcut","name":"2x2 characteristic equation","tex":"\\lambda^2-S_1\\lambda+|A|=0","sym":"$S_1=a_{11}+a_{22}$ (trace)","cond":"2x2 only","ex":"$\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$: $\\lambda^2-7\\lambda+10=0$","pyq":["A2A","B2A"],"mistake":"Writing −|A| at the end - for 2x2 it is +|A| (as in the slide examples).","tip":"Signs alternate: − S1, + |A|.","src":"Unit I slides"},{"id":"F4","unit":"U1","topic":"eig","cat":"Shortcut","name":"3x3 characteristic equation","tex":"\\lambda^3-S_1\\lambda^2+S_2\\lambda-|A|=0","sym":"$S_1$ = trace, $S_2$ = sum of minors of the diagonal elements $(M_{11}+M_{22}+M_{33})$","cond":"3x3","ex":"$S_1=6,S_2=11,|A|=6\\Rightarrow\\lambda=1,2,3$","pyq":["A1A","B1A"],"mistake":"Using cofactors of off-diagonal elements for S2.","tip":"Signs: − + − after λ³.","src":"Unit I slides"},{"id":"F5","unit":"U1","topic":"eig","cat":"Property","name":"Sum of eigenvalues","tex":"\\lambda_1+\\lambda_2+\\cdots+\\lambda_n=\\text{trace}(A)","sym":"","cond":"","ex":"$-1+1+4=4=4+3-3$","pyq":["A1A"],"mistake":"","tip":"Use it to check your roots in 5 seconds.","src":"Unit I slides"},{"id":"F6","unit":"U1","topic":"eig","cat":"Property","name":"Product of eigenvalues","tex":"\\lambda_1\\lambda_2\\cdots\\lambda_n=|A|","sym":"","cond":"","ex":"$(-1)(1)(4)=-4=|A|$","pyq":["A1A"],"mistake":"","tip":"A singular matrix has a zero eigenvalue.","src":"Unit I slides"},{"id":"F7","unit":"U1","topic":"eig","cat":"Property","name":"Eigenvalues of related matrices","tex":"A^{-1}\\!:\\tfrac1{\\lambda_i}\\quad kA\\!:k\\lambda_i\\quad A^m\\!:\\lambda_i^m\\quad A-kI\\!:\\lambda_i-k\\quad A^T\\!:\\lambda_i","sym":"","cond":"$A^{-1}$ needs all $\\lambda_i\\neq0$","ex":"$\\lambda=1,2,3\\Rightarrow A^{-1}$: $1,\\tfrac12,\\tfrac13$","pyq":[],"mistake":"","tip":"Eigenvectors stay the same for all of these.","src":"Unit I slides"},{"id":"F8","unit":"U1","topic":"eig","cat":"Property","name":"Triangular / diagonal matrix","tex":"\\lambda_i=a_{ii}","sym":"","cond":"Upper, lower triangular or diagonal","ex":"","pyq":[],"mistake":"","tip":"Read eigenvalues straight off the diagonal.","src":"Unit I slides"},{"id":"F9","unit":"U1","topic":"eig","cat":"Method","name":"Eigenvector by cross-multiplication (Cramer's rule)","tex":"\\frac{x_1}{\\begin{vmatrix}b_1&c_1\\\\b_2&c_2\\end{vmatrix}}=\\frac{-x_2}{\\begin{vmatrix}a_1&c_1\\\\a_2&c_2\\end{vmatrix}}=\\frac{x_3}{\\begin{vmatrix}a_1&b_1\\\\a_2&b_2\\end{vmatrix}}","sym":"$(a_1,b_1,c_1),(a_2,b_2,c_2)$: two independent rows of $A-\\lambda I$","cond":"Rows must be independent","ex":"","pyq":["A1A","B1A"],"mistake":"Forgetting the minus sign on the middle term.","tip":"Cover-up rule: hide the column of the variable; middle gets −.","src":"Unit I slides"},{"id":"F10","unit":"U1","topic":"diag","cat":"Theorem","name":"Diagonalization","tex":"P^{-1}AP=D=\\text{diag}(\\lambda_1,\\dots,\\lambda_n)","sym":"$P=[X_1\\;X_2\\cdots X_n]$ eigenvectors as columns","cond":"A has n linearly independent eigenvectors (always true for distinct eigenvalues)","ex":"","pyq":["A2A","B2A"],"mistake":"Putting eigenvectors as rows of P, or listing D in a different order from P.","tip":"Order in D = order of columns in P.","src":"Unit I slides"},{"id":"F11","unit":"U1","topic":"diag","cat":"Standard result","name":"Inverse of a 2x2","tex":"\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}","sym":"","cond":"ad − bc ≠ 0","ex":"","pyq":["A2A","B2A"],"mistake":"","tip":"Swap the diagonal, negate the off-diagonal, divide by det.","src":"Standard (used in slides)"},{"id":"F12","unit":"U1","topic":"diag","cat":"Standard result","name":"Powers via diagonalization","tex":"A^n=PD^nP^{-1}","sym":"","cond":"A diagonalizable","ex":"","pyq":[],"mistake":"","tip":"Not in your slides - standard extension, useful for 1-mark theory.","src":"Standard (not in your slides)"},{"id":"F13","unit":"U1","topic":"lu","cat":"Method","name":"Doolittle LU entries (3x3)","tex":"\\begin{aligned}&u_{1j}=a_{1j},\\;\\; l_{i1}=\\tfrac{a_{i1}}{u_{11}}\\\\&u_{22}=a_{22}-l_{21}u_{12},\\;\\;u_{23}=a_{23}-l_{21}u_{13}\\\\&l_{32}=\\tfrac{a_{32}-l_{31}u_{12}}{u_{22}},\\;\\;u_{33}=a_{33}-l_{31}u_{13}-l_{32}u_{23}\\end{aligned}","sym":"$L$ unit lower triangular ($l_{ii}=1$), $U$ upper triangular","cond":"Pivots u11, u22 ≠ 0","ex":"","pyq":["A1B","B1B"],"mistake":"Writing l21 = a12/u11 (it is a21/u11).","tip":"Order: row of U, column of L, row of U, column of L...","src":"Unit I slides"},{"id":"F14","unit":"U1","topic":"lu","cat":"Method","name":"Solving with a factorisation","tex":"AX=B,\\;A=LU:\\quad LZ=B\\;(\\text{forward}),\\quad UX=Z\\;(\\text{backward})","sym":"For Cholesky replace U by Lᵀ","cond":"","ex":"","pyq":["A2B","B2B"],"mistake":"Doing back-substitution first.","tip":"L first (top-down), then U (bottom-up).","src":"Unit I slides"},{"id":"F15","unit":"U1","topic":"chol","cat":"Method","name":"Cholesky entries (3x3)","tex":"\\begin{aligned}&l_{11}=\\sqrt{a_{11}},\\;l_{21}=\\tfrac{a_{21}}{l_{11}},\\;l_{31}=\\tfrac{a_{31}}{l_{11}}\\\\&l_{22}=\\sqrt{a_{22}-l_{21}^2},\\;l_{32}=\\tfrac{a_{32}-l_{21}l_{31}}{l_{22}}\\\\&l_{33}=\\sqrt{a_{33}-l_{31}^2-l_{32}^2}\\end{aligned}","sym":"$A=LL^T$","cond":"A symmetric and positive definite","ex":"$\\begin{bmatrix}9&6&12\\\\6&13&11\\\\12&11&26\\end{bmatrix}\\Rightarrow L=\\begin{bmatrix}3&0&0\\\\2&3&0\\\\4&1&3\\end{bmatrix}$","pyq":["A2B","B2B"],"mistake":"Forgetting to subtract l21·l31 in l32.","tip":"Diagonal entries = square roots; off-diagonal = divide by the diagonal above.","src":"Unit I slides"},{"id":"F16","unit":"U1","topic":"chol","cat":"Definition","name":"Positive definite","tex":"X^TAX>0\\;\\;\\forall X\\neq0","sym":"","cond":"A symmetric (real) - a real symmetric matrix is Hermitian","ex":"","pyq":[],"mistake":"","tip":"All eigenvalues > 0.","src":"Unit I slides"},{"id":"F17","unit":"U1","topic":"pca","cat":"Method","name":"Standardization (PCA step 1)","tex":"z=\\frac{x-\\bar x}{\\sigma}","sym":"$\\bar x$ mean, $\\sigma$ standard deviation","cond":"","ex":"","pyq":[],"mistake":"","tip":"Puts all variables on the same scale.","src":"Unit I slides"},{"id":"F18","unit":"U1","topic":"pca","cat":"Method","name":"Sample covariance matrix","tex":"S=\\frac{1}{n-1}BB^T","sym":"$B$: data in mean-deviation form ($p\\times n$)","cond":"","ex":"","pyq":[],"mistake":"Dividing by n instead of n − 1.","tip":"","src":"Unit I slides"},{"id":"F19","unit":"U1","topic":"pca","cat":"Standard result","name":"Variance explained","tex":"\\text{share of PC}_i=\\frac{\\lambda_i}{\\sum_j\\lambda_j}","sym":"$\\lambda_i$: eigenvalues of $S$","cond":"","ex":"$\\lambda=3,1\\Rightarrow75\\%$","pyq":[],"mistake":"","tip":"Slides say eigenvalues give the variance carried by each PC.","src":"Standard (implied by slides)"},{"id":"F21","unit":"U2","topic":"form","cat":"Method","name":"Formation of a DE","tex":"n\\text{ arbitrary constants}\\;\\Rightarrow\\;\\text{differentiate }n\\text{ times}\\;\\Rightarrow\\;\\text{DE of order }n","sym":"","cond":"","ex":"$y=ae^{m_1x}+be^{m_2x}\\Rightarrow y''-(m_1+m_2)y'+m_1m_2y=0$","pyq":["A4A","B4A"],"mistake":"Leaving a constant in the final answer.","tip":"For e^{-2x}, e^{-3x}: roots −2, −3 ⇒ y''+5y'+6y=0.","src":"Unit II slides"},{"id":"F22","unit":"U2","topic":"exact","cat":"Condition","name":"Condition of exactness","tex":"M\\,dx+N\\,dy=0\\text{ exact}\\iff\\frac{\\partial M}{\\partial y}=\\frac{\\partial N}{\\partial x}","sym":"$M,N$ functions of $x,y$","cond":"Necessary and sufficient","ex":"","pyq":["A3A","B3A"],"mistake":"Comparing M_x with N_y.","tip":"'M with y, N with x' - cross over.","src":"Unit II slides"},{"id":"F23","unit":"U2","topic":"exact","cat":"Method","name":"Solution of an exact DE","tex":"\\int_{y\\,\\text{const}}M\\,dx+\\int(\\text{terms of }N\\text{ not containing }x)\\,dy=c","sym":"","cond":"After checking exactness","ex":"$(2xy+e^y)dx+(x^2+xe^y)dy=0\\Rightarrow x^2y+xe^y=c$","pyq":["A3A","B3A","A4B","B4B"],"mistake":"Integrating all of N again (double counting).","tip":"Only N-terms with no x at all.","src":"Unit II slides"},{"id":"F24","unit":"U2","topic":"reduc","cat":"Rule","name":"Integrating factor - Rule I","tex":"\\text{Homogeneous }M\\,dx+N\\,dy=0,\\;Mx+Ny\\neq0\\;\\Rightarrow\\;\\text{IF}=\\frac{1}{Mx+Ny}","sym":"","cond":"M, N homogeneous of the same degree","ex":"$Mx+Ny=x^2y^2\\Rightarrow$ IF $=\\frac{1}{x^2y^2}$","pyq":["A4B"],"mistake":"Forgetting the sign of N (here N = −(x³−3x²y)).","tip":"Homogeneous → Plus.","src":"Unit II slides"},{"id":"F25","unit":"U2","topic":"reduc","cat":"Rule","name":"Integrating factor - Rule II","tex":"y\\,f_1(xy)\\,dx+x\\,f_2(xy)\\,dy=0,\\;Mx-Ny\\neq0\\;\\Rightarrow\\;\\text{IF}=\\frac{1}{Mx-Ny}","sym":"","cond":"Form y f1(xy) dx + x f2(xy) dy","ex":"$(1+xy)y\\,dx+(1-xy)x\\,dy$: IF $=\\frac{1}{2x^2y^2}$","pyq":["B4B"],"mistake":"Using + instead of −.","tip":"xy-form → Minus.","src":"Unit II slides"},{"id":"F26","unit":"U2","topic":"linear","cat":"Method","name":"Linear DE in y","tex":"\\frac{dy}{dx}+Py=Q\\;\\Rightarrow\\;\\text{IF}=e^{\\int P\\,dx},\\quad y\\cdot\\text{IF}=\\int Q\\cdot\\text{IF}\\,dx+c","sym":"$P,Q$: functions of $x$ only","cond":"Coefficient of dy/dx must be 1","ex":"$y'+\\frac2xy=3+\\frac1{x^2}$: IF $=x^2$","pyq":["A3B","B3B"],"mistake":"Not dividing by the coefficient of dy/dx first.","tip":"Standard form first, always.","src":"Unit II slides"},{"id":"F27","unit":"U2","topic":"linear","cat":"Method","name":"Linear DE in x","tex":"\\frac{dx}{dy}+Px=Q\\;\\Rightarrow\\;x\\,e^{\\int P\\,dy}=\\int Q\\,e^{\\int P\\,dy}dy+c","sym":"$P,Q$: functions of $y$","cond":"Use when x appears to the first power only","ex":"","pyq":[],"mistake":"","tip":"Single x term? Go linear in x.","src":"Unit II slides"},{"id":"F28","unit":"U2","topic":"bern","cat":"Method","name":"Bernoulli's equation","tex":"\\frac{dy}{dx}+Py=Qy^n\\;\\xrightarrow{\\;v=y^{1-n}\\;}\\;\\frac{dv}{dx}+(1-n)Pv=(1-n)Q","sym":"","cond":"n ≠ 0, 1","ex":"","pyq":[],"mistake":"Forgetting the factor (1 − n).","tip":"Not worked in your slides - standard method.","src":"Syllabus slide (method standard)"},{"id":"F29","unit":"U2","topic":"growth","cat":"Model","name":"Law of natural growth","tex":"\\frac{dx}{dt}=kx\\;\\Rightarrow\\;x=x_0e^{kt},\\;k>0","sym":"","cond":"","ex":"Triples in 2 h: $k=\\tfrac12\\ln3$","pyq":[],"mistake":"","tip":"","src":"Unit II slides"},{"id":"F30","unit":"U2","topic":"growth","cat":"Model","name":"Law of natural decay & half-life","tex":"\\frac{dm}{dt}=-km\\;\\Rightarrow\\;m=m_0e^{-kt},\\quad t_{1/2}=\\frac{\\ln2}{k}","sym":"","cond":"k > 0","ex":"Radium: $k=0.000443\\Rightarrow t_{1/2}\\approx1565$ yr","pyq":[],"mistake":"","tip":"","src":"Unit II slides"},{"id":"F31","unit":"U2","topic":"debasic","cat":"Method","name":"Homogeneous DE substitution","tex":"y=vx,\\quad\\frac{dy}{dx}=v+x\\frac{dv}{dx}","sym":"","cond":"M, N homogeneous of the same degree","ex":"","pyq":[],"mistake":"","tip":"For dx/dy = f(x/y) use x = vy.","src":"Unit II slides"},{"id":"F32","unit":"U2","topic":"linear","cat":"Standard result","name":"Integrals used in DE answers","tex":"\\int\\frac{f'(x)}{f(x)}dx=\\log f(x),\\quad e^{\\log f}=f,\\quad\\int\\frac{e^{k\\tan^{-1}x}}{1+x^2}dx=\\frac{e^{k\\tan^{-1}x}}{k}","sym":"","cond":"","ex":"","pyq":["A3B"],"mistake":"","tip":"Substitute t = tan⁻¹x whenever 1/(1+x²) is present.","src":"Standard (used in slides)"},{"id":"F33","unit":"PD","topic":"euler","cat":"Definition","name":"Homogeneous function of degree n","tex":"u(tx,ty)=t^n\\,u(x,y)","sym":"","cond":"","ex":"$\\frac{x^3+y^3}{x+y}\\Rightarrow n=2$","pyq":["C1A","D1B","D2B"],"mistake":"Finding the degree of u = tan⁻¹(...) instead of tan u.","tip":"Degree = (top degree) − (bottom degree).","src":"TA-II papers / model solution"},{"id":"F34","unit":"PD","topic":"euler","cat":"Theorem","name":"Euler's theorem (2 variables)","tex":"x\\frac{\\partial u}{\\partial x}+y\\frac{\\partial u}{\\partial y}=nu","sym":"","cond":"u homogeneous of degree n","ex":"","pyq":["D2B"],"mistake":"","tip":"","src":"TA-II model solution"},{"id":"F35","unit":"PD","topic":"euler","cat":"Theorem","name":"Euler's theorem (3 variables)","tex":"xu_x+yu_y+zu_z=nu","sym":"","cond":"u(x,y,z) homogeneous of degree n","ex":"$U=\\frac{xyz}{2x+y+z}$: $=2U$","pyq":["D2B"],"mistake":"","tip":"Degree 0 ⇒ the sum is 0.","src":"TA-II model solution"},{"id":"F36","unit":"PD","topic":"euler","cat":"Theorem","name":"Euler second order","tex":"x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=n(n-1)u","sym":"","cond":"u homogeneous of degree n","ex":"","pyq":[],"mistake":"","tip":"","src":"Standard"},{"id":"F37","unit":"PD","topic":"euler","cat":"Corollary","name":"Euler corollary - first order","tex":"f(u)\\text{ homogeneous of degree }n\\;\\Rightarrow\\;xu_x+yu_y=g(u)=n\\frac{f(u)}{f'(u)}","sym":"e.g. $f(u)=\\tan u,\\sin u,e^u$","cond":"","ex":"$\\sin u=x^3+y^3\\Rightarrow 3\\tan u$","pyq":["C1A","D1B"],"mistake":"Forgetting to divide by f'(u).","tip":"n · f over f-dash.","src":"TA-II model solution"},{"id":"F38","unit":"PD","topic":"euler","cat":"Corollary","name":"Euler corollary - second order","tex":"x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(u)\\,[g'(u)-1]","sym":"$g(u)=n\\,f(u)/f'(u)$","cond":"","ex":"$g=\\sin2u\\Rightarrow\\sin2u(2\\cos2u-1)$","pyq":["C1A","D1B"],"mistake":"Writing g'(u) + 1.","tip":"'g times (g-dash minus one)'.","src":"TA-II model solution"},{"id":"F39","unit":"PD","topic":"jacob","cat":"Definition","name":"Jacobian (2 variables)","tex":"J=\\frac{\\partial(u,v)}{\\partial(x,y)}=\\begin{vmatrix}u_x&u_y\\\\v_x&v_y\\end{vmatrix}","sym":"","cond":"","ex":"$x=r\\cos\\theta,y=r\\sin\\theta\\Rightarrow r$","pyq":["C1B"],"mistake":"Putting derivatives w.r.t. the same variable in a row instead of a column.","tip":"Rows = functions, columns = variables.","src":"TA-II papers"},{"id":"F40","unit":"PD","topic":"jacob","cat":"Definition","name":"Jacobian (3 variables)","tex":"\\frac{\\partial(u,v,w)}{\\partial(x,y,z)}=\\begin{vmatrix}u_x&u_y&u_z\\\\v_x&v_y&v_z\\\\w_x&w_y&w_z\\end{vmatrix}","sym":"","cond":"","ex":"","pyq":["D2A"],"mistake":"","tip":"Substitute the point before expanding.","src":"TA-II model solution"},{"id":"F41","unit":"PD","topic":"jacob","cat":"Property","name":"JJ' = 1","tex":"\\frac{\\partial(u,v)}{\\partial(x,y)}\\cdot\\frac{\\partial(x,y)}{\\partial(u,v)}=1","sym":"","cond":"J ≠ 0","ex":"$J=-16\\Rightarrow J'=-\\frac1{16}$","pyq":["C1B","D2A"],"mistake":"","tip":"Inverse Jacobian = reciprocal.","src":"TA-II model solution"},{"id":"F42","unit":"PD","topic":"composite","cat":"Method","name":"Chain rule for composite functions","tex":"z=f(s),\\;s=s(x,t):\\quad z_x=f'(s)\\,s_x,\\;\\;z_t=f'(s)\\,s_t","sym":"","cond":"","ex":"$s=x+ct\\Rightarrow z_t=cf'$, $z_{tt}=c^2f''$","pyq":["D1A","C2A"],"mistake":"Dropping the inner derivative (the −c for x − ct).","tip":"Outer derivative × inner derivative.","src":"TA-II model solution"},{"id":"F43","unit":"PD","topic":"maxmin","cat":"Test","name":"Max-min test for f(x,y)","tex":"\\begin{aligned}&f_x=f_y=0;\\;r=f_{xx},\\,s=f_{xy},\\,t=f_{yy}\\\\&rt-s^2>0,\\,r<0:\\max;\\quad rt-s^2>0,\\,r>0:\\min\\\\&rt-s^2<0:\\text{saddle};\\quad rt-s^2=0:\\text{doubtful}\\end{aligned}","sym":"","cond":"","ex":"$(\\sqrt2,-\\sqrt2)$: $rt-s^2=384,\\,r=20\\Rightarrow$ min","pyq":["C2B"],"mistake":"Deciding max/min from rt − s² alone without checking r.","tip":"Positive discriminant, then the sign of r decides.","src":"TA-II paper (standard test)"},{"id":"F44","unit":"IC","topic":"duis1","cat":"Rule","name":"DUIS Rule I (constant limits)","tex":"\\frac{d}{d\\alpha}\\int_a^bf(x,\\alpha)\\,dx=\\int_a^b\\frac{\\partial f}{\\partial\\alpha}\\,dx","sym":"$a,b$ independent of $\\alpha$","cond":"f and ∂f/∂α continuous","ex":"","pyq":["C3A","D3A"],"mistake":"Forgetting the constant of integration after integrating back.","tip":"Differentiate, integrate, fix c with a special α.","src":"TA-II model solution"},{"id":"F45","unit":"IC","topic":"duis2","cat":"Rule","name":"DUIS Rule II (Leibnitz rule)","tex":"\\frac{d}{d\\alpha}\\int_{\\varphi(\\alpha)}^{\\psi(\\alpha)}f(x,\\alpha)\\,dx=\\int_\\varphi^\\psi\\frac{\\partial f}{\\partial\\alpha}dx+f(\\psi,\\alpha)\\frac{d\\psi}{d\\alpha}-f(\\varphi,\\alpha)\\frac{d\\varphi}{d\\alpha}","sym":"","cond":"","ex":"$\\int_0^x(x-t)^2G\\,dt\\Rightarrow f'=\\int_0^x2(x-t)G\\,dt$","pyq":["C4A","D4A","C4B"],"mistake":"Omitting the boundary terms (or their signs).","tip":"Upper limit +, lower limit −.","src":"TA-II model solution"},{"id":"F46","unit":"IC","topic":"duis1","cat":"Standard result","name":"Frullani-type integral","tex":"\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}\\,dx=\\log\\frac{b}{a}","sym":"","cond":"a, b > 0","ex":"","pyq":["C3A","D3A"],"mistake":"Writing log(a/b).","tip":"The one with − sign in front (b) goes on top.","src":"TA-II papers"},{"id":"F47","unit":"IC","topic":"duis1","cat":"Standard result","name":"Basic exponential integrals","tex":"\\int_0^\\infty e^{-ax}dx=\\frac1a,\\quad\\int_0^\\infty e^{-ax}\\cos bx\\,dx=\\frac{a}{a^2+b^2},\\quad\\int_0^\\infty e^{-ax}\\sin bx\\,dx=\\frac{b}{a^2+b^2}","sym":"","cond":"a > 0","ex":"","pyq":["C3A","D3A"],"mistake":"","tip":"","src":"Standard"},{"id":"F48","unit":"IC","topic":"erf","cat":"Definition","name":"Error function","tex":"\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^xe^{-u^2}\\,du","sym":"","cond":"","ex":"","pyq":["C3B","C4B","D4B"],"mistake":"Missing the 2/√π factor.","tip":"'Two over root pi'.","src":"TA-II model solution"},{"id":"F49","unit":"IC","topic":"erf","cat":"Definition","name":"Complementary error function","tex":"\\text{erfc}(x)=\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}\\,du","sym":"","cond":"","ex":"","pyq":["D3B","D4B"],"mistake":"","tip":"Same integrand, limits x to ∞.","src":"TA-II model solution"},{"id":"F50","unit":"IC","topic":"erf","cat":"Property","name":"erf + erfc","tex":"\\text{erf}(x)+\\text{erfc}(x)=1","sym":"","cond":"","ex":"","pyq":["D4B"],"mistake":"","tip":"","src":"TA-II model solution"},{"id":"F51","unit":"IC","topic":"erf","cat":"Property","name":"Special values","tex":"\\text{erf}(0)=0,\\quad\\text{erf}(\\infty)=1,\\quad\\int_0^\\infty e^{-u^2}du=\\frac{\\sqrt\\pi}{2}","sym":"","cond":"","ex":"","pyq":[],"mistake":"","tip":"","src":"Standard"},{"id":"F52","unit":"IC","topic":"erf","cat":"Property","name":"erf is odd","tex":"\\text{erf}(-x)=-\\text{erf}(x)","sym":"","cond":"","ex":"","pyq":["D4B"],"mistake":"","tip":"Substitute u = −v in the definition to prove.","src":"TA-II model solution"},{"id":"F53","unit":"IC","topic":"erf","cat":"Property","name":"erfc(−x) + erfc(x)","tex":"\\text{erfc}(-x)+\\text{erfc}(x)=2","sym":"","cond":"","ex":"","pyq":["D4B"],"mistake":"","tip":"","src":"TA-II model solution"},{"id":"F54","unit":"IC","topic":"erf","cat":"Derivative","name":"Derivative of erf","tex":"\\frac{d}{dx}\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}e^{-x^2}","sym":"","cond":"","ex":"","pyq":["C4B"],"mistake":"","tip":"","src":"TA-II paper"},{"id":"F55","unit":"IC","topic":"erf","cat":"Derivative","name":"Derivative of erf(axⁿ)","tex":"\\frac{d}{dx}\\text{erf}(ax^n)=\\frac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}","sym":"","cond":"","ex":"","pyq":["C4B"],"mistake":"Writing e^{-ax^{2n}} (the a must be squared).","tip":"Chain rule: e^{-(inside)²} × (inside)'.","src":"TA-II paper"},{"id":"F56","unit":"IC","topic":"erf","cat":"Standard result","name":"Finite-limit Gaussian integral","tex":"\\int_a^be^{-x^2}dx=\\frac{\\sqrt\\pi}{2}\\left[\\text{erf}(b)-\\text{erf}(a)\\right]","sym":"","cond":"","ex":"","pyq":["C3B"],"mistake":"","tip":"","src":"TA-II paper"},{"id":"F57","unit":"IC","topic":"erf","cat":"Standard result","name":"Completing the square with erfc","tex":"\\int_0^\\infty e^{-x^2-2ax}dx=\\frac{\\sqrt\\pi}{2}\\,e^{a^2}\\,\\text{erfc}(a)","sym":"","cond":"","ex":"","pyq":["D3B"],"mistake":"Wrong new lower limit (it becomes a, not 0).","tip":"−x²−2ax = −(x+a)² + a².","src":"TA-II paper"},{"id":"F58","unit":"IC","topic":"erf","cat":"Standard result","name":"Series of erf","tex":"\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\left(x-\\frac{x^3}{3}+\\frac{x^5}{10}-\\frac{x^7}{42}+\\cdots\\right)","sym":"","cond":"","ex":"","pyq":[],"mistake":"","tip":"Expand e^{-u²} and integrate term by term. Not in your papers - standard.","src":"Standard (not in your papers)"},{"id":"F59","unit":"PD","topic":"funcdep","cat":"Condition","name":"Functional dependence test","tex":"u,v\\text{ functionally dependent}\\iff\\frac{\\partial(u,v)}{\\partial(x,y)}=0\\quad(\\text{3 functions: }\\tfrac{\\partial(u,v,w)}{\\partial(x,y,z)}=0)","sym":"","cond":"The Jacobian must vanish identically (for all x, y), not just at a point","ex":"$u=\\frac xy,\\;v=\\frac{x+y}{x-y}$: $J=0$, $v=\\frac{u+1}{u-1}$","pyq":[],"mistake":"Concluding dependence from J = 0 at a single point.","tip":"J ≠ 0 ⇒ independent; J ≡ 0 ⇒ find the relation.","src":"Tutorial 9"},{"id":"F60","unit":"MI","topic":"dint","cat":"Method","name":"Iterated double integral","tex":"\\int_a^b\\int_{\\phi_1(x)}^{\\phi_2(x)}f(x,y)\\,dy\\,dx=\\int_a^b\\left[\\int_{\\phi_1(x)}^{\\phi_2(x)}f\\,dy\\right]dx","sym":"$\\phi_1,\\phi_2$: lower and upper boundary curves","cond":"Inner limits may depend on the outer variable only","ex":"$\\int_0^1\\int_0^{1-x}(x+y)dy\\,dx=\\frac13$","pyq":[],"mistake":"Integrating w.r.t. x first when the inner limits contain x.","tip":"Variable limits are always on the inside.","src":"Tutorial 13"},{"id":"F61","unit":"MI","topic":"dint","cat":"Standard result","name":"Polar coordinates","tex":"x=r\\cos\\theta,\\;y=r\\sin\\theta,\\quad dx\\,dy=r\\,dr\\,d\\theta,\\quad x^2+y^2=r^2","sym":"","cond":"Use for circles, cones, paraboloids (x²+y²)","ex":"Cone/paraboloid volume: $\\int_0^{2\\pi}\\int_0^1(r-r^2)r\\,dr\\,d\\theta=\\frac\\pi6$","pyq":[],"mistake":"Forgetting the extra factor r.","tip":"This r is the Jacobian ∂(x,y)/∂(r,θ).","src":"Standard (needed for Tutorial 15 Q5)"},{"id":"F62","unit":"MI","topic":"areavol","cat":"Formula","name":"Area by double integration","tex":"A=\\iint_R dx\\,dy=\\int_a^b\\left[y_{\\text{upper}}(x)-y_{\\text{lower}}(x)\\right]dx","sym":"","cond":"a, b from the intersection points","ex":"$y=x^2,\\;y=2x+3$: $\\int_{-1}^3(2x+3-x^2)dx=\\frac{32}3$","pyq":[],"mistake":"Subtracting the curves the wrong way round (negative area).","tip":"Top minus bottom.","src":"Tutorial 15"},{"id":"F63","unit":"MI","topic":"areavol","cat":"Formula","name":"Volume by multiple integration","tex":"V=\\iiint_V dx\\,dy\\,dz=\\iint_R\\left[z_{\\text{top}}-z_{\\text{bottom}}\\right]dx\\,dy","sym":"","cond":"","ex":"Cylinders $y^2=x$, $x^2=y$ under $x+y+z=2$: $V=\\frac{11}{30}$","pyq":[],"mistake":"","tip":"","src":"Tutorial 15"},{"id":"F64","unit":"MI","topic":"areavol","cat":"Standard result","name":"Standard areas & volumes","tex":"\\text{Ellipse: }\\pi ab,\\quad\\text{tetrahedron }\\tfrac xa+\\tfrac yb+\\tfrac zc=1:\\;\\frac{abc}{6},\\quad\\int_{-a}^{a}\\sqrt{a^2-x^2}\\,dx=\\frac{\\pi a^2}{2}","sym":"","cond":"","ex":"Half ellipse above x-axis: $\\frac{\\pi ab}{2}$","pyq":[],"mistake":"","tip":"Use these to check answers.","src":"Tutorial 15 / standard"},{"id":"F65","unit":"MI","topic":"tint","cat":"Method","name":"Iterated triple integral","tex":"\\int_a^b\\int_{y_1(x)}^{y_2(x)}\\int_{z_1(x,y)}^{z_2(x,y)}f\\,dz\\,dy\\,dx","sym":"","cond":"Innermost limits may depend on both outer variables","ex":"$\\int_0^1\\int_0^{1-x}\\int_0^{1-x-y}dz\\,dy\\,dx=\\frac16$","pyq":[],"mistake":"Following the printed dx dy dz order when the limits demand another order.","tip":"Limits decide the order.","src":"Tutorial 14"},{"id":"F66","unit":"MI","topic":"curve","cat":"Rule","name":"Symmetry rules (Cartesian)","tex":"\\begin{aligned}&\\text{only even powers of }y\\Rightarrow\\text{symmetric about x-axis}\\\\&\\text{only even powers of }x\\Rightarrow\\text{about y-axis}\\\\&(x,y)\\to(-x,-y)\\text{ unchanged}\\Rightarrow\\text{about origin};\\;\\;x\\leftrightarrow y\\Rightarrow\\text{about }y=x\\end{aligned}","sym":"","cond":"","ex":"$xy^2=4a^2(a-x)$: about the x-axis","pyq":[],"mistake":"","tip":"Check symmetry first - it halves the work.","src":"Tutorial 12 (standard rules)"},{"id":"F67","unit":"MI","topic":"curve","cat":"Rule","name":"Origin and tangents at the origin","tex":"\\text{No constant term}\\Rightarrow\\text{passes through }O;\\;\\text{tangents at }O:\\text{ lowest-degree terms}=0","sym":"","cond":"","ex":"$y^2(2a-x)=x^3$: lowest terms $2ay^2=0\\Rightarrow y=0$ (cusp)","pyq":[],"mistake":"","tip":"","src":"Tutorial 12 (standard rules)"},{"id":"F68","unit":"MI","topic":"curve","cat":"Rule","name":"Asymptotes parallel to the axes","tex":"\\text{Parallel to x-axis: coefficient of highest power of }x=0;\\;\\;\\text{parallel to y-axis: coefficient of highest power of }y=0","sym":"","cond":"","ex":"$y^2(2a-x)=x^3\\Rightarrow x=2a$; $xy^2=\\dots\\Rightarrow x=0$","pyq":[],"mistake":"","tip":"","src":"Tutorial 12 (standard rules)"},{"id":"F69","unit":"MI","topic":"curve","cat":"Rule","name":"Polar roses","tex":"r=a\\cos n\\theta\\text{ or }a\\sin n\\theta:\\;\\begin{cases}n\\text{ petals}&n\\text{ odd}\\\\2n\\text{ petals}&n\\text{ even}\\end{cases},\\;\\text{petal length }a","sym":"","cond":"","ex":"$r=a\\cos3\\theta$: 3 petals; $r=a\\sin2\\theta$: 4 petals","pyq":[],"mistake":"","tip":"cos: a petal on the initial line; sin: rotated.","src":"Tutorial 12 (standard result)"},{"id":"F70","unit":"IC","topic":"duis1","cat":"Standard result","name":"Results used with DUIS (Tutorial 10)","tex":"\\int_0^1x^a\\,dx=\\frac1{a+1},\\quad\\int_0^\\infty\\frac{dx}{1+bx^2}=\\frac{\\pi}{2\\sqrt b},\\quad\\int_0^\\infty\\frac{\\sin x}{x}dx=\\frac\\pi2,\\quad\\int_0^\\infty\\frac{e^{-ax}\\sin x}{x}dx=\\cot^{-1}a","sym":"","cond":"a > −1 for the first, b > 0","ex":"$\\int_0^1\\frac{x^a-1}{\\log x}dx=\\log(a+1)$","pyq":[],"mistake":"","tip":"x^a differentiated w.r.t. a gives x^a log x - that cancels the log x.","src":"Tutorial 10"},{"id":"F71","unit":"PD","topic":"pdbasic","cat":"Standard result","name":"Derivatives of r","tex":"r^2=x^2+y^2+z^2\\Rightarrow\\frac{\\partial r}{\\partial x}=\\frac xr,\\;\\;\\frac{\\partial}{\\partial x}r^n=nr^{n-2}x","sym":"","cond":"","ex":"$u=r^{-1}$: $u_{xx}+u_{yy}+u_{zz}=0$","pyq":[],"mistake":"","tip":"Saves time in Laplace-equation questions (T7 Q1).","src":"Standard (Tutorial 7)"}],"VIDEOS":{"v_exact":{"vids":[{"id":"ZfkKqOKD3wI","title":"First Order Ordinary Differential Equation|Lecture 01|Exact Differential Equations|All University","dur":"16:12","covers":"Exact DEs, checking exactness, reducing to exact form (per the video's tags)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=exact%20differential%20equation"},"v_linear":{"vids":[{"id":"GBjmQ-JHzjU","title":"First Order Differential Equation|One Shot|Engineering Mathematics |Pradeep Giri Sir","dur":null,"covers":"One-shot of first-order DEs (linear DE section; YouTube page does not list chapters)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=linear%20differential%20equation"},"v_form":{"vids":[],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=formation%20of%20differential%20equation","note":"No Pradeep Giri video specifically on 'formation of DE' could be verified."},"v_eig":{"vids":[{"id":"atmwPK1B9Js","title":"LINEAR ALGERBA|EIGEN VALUES AND EIGEN VECTORS|ONE SHOT|PRADEEP GIRI SIR","dur":null,"covers":"Eigenvalues and eigenvectors (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=eigen%20values%20eigen%20vectors"},"v_diag":{"vids":[{"id":"ixx136WXxXc"," ch":"https://www.youtube.com/@pradeepgiriacademy/search?query=applications%20of%20differential%20equations","note":"Not verified for growth/decay (channel has an 'Applications of DE - Kirchhoff's law' lecture, which is a different application)."},"v_funcdep":{"vids":[{"id":"Al2odERqCuA","title":"JACOBIAN|Lecture 04|Functional Dependence | MATHEMATICS |PRADEEP GIRI SIR","dur":null,"covers":"Functional dependence using Jacobians"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=functional%20dependence"},"v_dint":{"vids":[{"id":"spFLUHQOh_g","title":"DOUBLE INTEGRATION | ENGINEERING MATHEMATICS | ONESHOT | ALL UNIVERSITY | Pradeep Giri Sir","dur":null,"covers":"Double integration (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=double%20integration"},"v_tint":{"vids":[{"id":"E2yfGTX8aoI","title":"TRIPLE INTEGRAL|Lecture 01|TRIPLE INTEGRAL PROBLEMS| MATHEMATICS","dur":"31:07","covers":"Introductory triple-integral problems (shorter, focused)"},{"id":"uzn1ybMLmJA","title":"TRIPLE INTEGRATION | ONESHOT | ALL UNIVERSITY | Pradeep Giri Sir","dur":null,"covers":"Triple integration (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=triple%20integration"},"v_areavol":{"vids":[{"id":"Vg45Ex92ja4","title":"Multiple Integral|One Shot|Dbatu|Engineering Mathematics 1|Pradeep Giri Sir","dur":null,"channel":"Pradeep Giri Academy Live","covers":"Multiple integrals one shot; area/volume part not itemised by YouTube"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=area%20volume%20double%20integration"},"v_curve":{"vids":[{"id":"guy8xnByO04","title":"CURVE TRACING|ONE SHOT||ENGINEERING MATHEMATICS|PRADEEP GIRI SIR","dur":null,"covers":"Curve tracing (one shot)"}],"search":"https://www.youtube.com/@pradeepgiriacademy/search?query=curve%20tracing"}},"MEMORISE":[{"h":"Important identities","items":["$\\sin2u=2\\sin u\\cos u=\\dfrac{2\\tan u}{\\sec^2u}$, $\\;\\cos2u=1-2\\sin^2u$","$\\dfrac{d}{dx}\\tan^{-1}x=\\dfrac1{1+x^2}$, $\\;\\dfrac{d}{dx}\\sin^{-1}x=\\dfrac{1}{\\sqrt{1-x^2}}$","$e^{\\log f}=f$, $\\;\\int\\frac{f'}{f}dx=\\log f$","$-x^2-2ax=-(x+a)^2+a^2$ (completing the square)","$\\text{erf}+\\text{erfc}=1$, $\\;\\text{erf}(-x)=-\\text{erf}(x)$"]},{"h":"Theorems & statements","items":["<b>Diagonalization theorem:<\/b> $A_{n\\times n}$ is diagonalizable $\\iff$ it has $n$ linearly independent eigenvectors.","Eigenvectors for distinct eigenvalues are linearly independent.","Eigenvalues of a real symmetric matrix are real; eigenvectors for different eigenvalues are orthogonal.","<b>Euler:<\/b> $u$ homogeneous of degree $n\\Rightarrow xu_x+yu_y=nu$.","<b>JJ' = 1<\/b> for a transformation and its inverse.","<b>Leibnitz rule<\/b> (DUIS II): add $f(\\psi)\\psi'-f(\\varphi)\\varphi'$."]},{"h":"Definitions (write these word-for-word)","items":["<b>Eigenvalue:<\/b> scalar $\\lambda$ with $AX=\\lambda X$, $X\\neq0$. Characteristic equation $|A-\\lambda I|=0$.","<b>Similar matrices:<\/b> $B=P^{-1}AP$ for some invertible $P$.","<b>Order<\/b> = highest derivative; <b>degree<\/b> = its power after clearing radicals/fractions.","<b>General solution<\/b>: number of arbitrary constants = order. <b>Particular solution<\/b>: constants given values.","<b>Exact DE<\/b>: $Mdx+Ndy=du$ for some $u$. <b>Integrating factor<\/b>: multiplier making a DE exact.","<b>Homogeneous function<\/b> of degree $n$: $u(tx,ty)=t^nu(x,y)$.","<b>erf / erfc<\/b>: $\\frac{2}{\\sqrt\\pi}\\int_0^x e^{-u^2}du$ / $\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}du$.","<b>Positive definite<\/b>: symmetric with $X^TAX>0$ for all $X\\neq0$."]},{"h":"Conditions & restrictions","items":["Cholesky needs $A$ <b>symmetric and positive definite<\/b>; LU (Doolittle) needs non-zero pivots.","Exactness: $M_y=N_x$. IF Rule I needs homogeneous and $Mx+Ny\\neq0$; Rule II needs $yf_1(xy)dx+xf_2(xy)dy$ and $Mx-Ny\\neq0$.","Linear DE: coefficient of $dy/dx$ must be 1 before reading $P$.","DUIS Rule I: limits must not depend on the parameter; otherwise use Leibnitz.","Frullani result needs $a,b>0$."]},{"h":"Standard results","items":["$y=Ae^{m_1x}+Be^{m_2x}\\Rightarrow y''-(m_1+m_2)y'+m_1m_2y=0$","$y=A\\sin(\\log x)+B\\cos(\\log x)\\Rightarrow x^2y''+xy'+y=0$","$\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$","$\\int_0^\\infty e^{-x^2}dx=\\frac{\\sqrt\\pi}2$, $\\;\\int_0^\\infty e^{-x^2-2ax}dx=\\frac{\\sqrt\\pi}{2}e^{a^2}\\text{erfc}(a)$","$y=\\int_0^x f(t)\\sin a(x-t)dt\\Rightarrow y''+a^2y=af(x)$; $\\;f=\\int_0^x(x-t)^2G\\,dt\\Rightarrow f'''=2G$","$r=a\\cos n\\theta$: $n$ petals ($n$ odd) or $2n$ ($n$ even)","Tetrahedron $\\frac xa+\\frac yb+\\frac zc=1$: $V=\\frac{abc}{6}$; ellipse area $\\pi ab$","$\\int_0^\\infty\\frac{\\sin x}{x}dx=\\frac\\pi2$; $\\int_0^1\\frac{x^a-1}{\\log x}dx=\\log(a+1)$","Functional dependence $\\iff J=0$; e.g. $(x+y+z)^2=\\sum x^2+2\\sum xy$"]},{"h":"Problem-solving steps","items":["<b>Eigen 3x3:<\/b> $S_1,S_2,|A|$ → cubic → guess a root ($\\pm1,\\pm2$) → factor → check sum/product → $(A-\\lambda I)X=0$ → Cramer on 2 rows.","<b>Diagonalize:<\/b> eigenvalues → say 'distinct ⇒ diagonalizable' → eigenvectors → $P$ → $P^{-1}$ → show $P^{-1}AP=D$.","<b>LU / Cholesky:<\/b> write general $L,U$ → compare entries in order → $LZ=B$ forward → back-substitute.","<b>Exact:<\/b> identify $M,N$ → test → integrate → '$=c$'.","<b>Reducible:<\/b> test fails → identify rule → compute $Mx\\pm Ny$ → multiply → re-test → solve as exact.","<b>Euler corollary:<\/b> isolate $f(u)$ → degree $n$ by $x\\to tx$ → $g=nf/f'$ → $g(g'-1)$.","<b>DUIS I:<\/b> name $I(\\alpha)$ → differentiate inside → integrate → constant from a special value.","<b>Max-min:<\/b> $f_x=f_y=0$ → points → $r,s,t$ at each → classify → value of $f$.","<b>Double integral:<\/b> sketch region → intersection points → variable limits inside → integrate inner → outer.","<b>Area / volume:<\/b> area $=\\int(\\text{top}-\\text{bottom})dx$; volume $=\\iint(z_{top}-z_{bottom})dA$; circular → polar with $r\\,dr\\,d\\theta$.","<b>Curve tracing:<\/b> symmetry → origin & tangents → intercepts → asymptotes → region → sketch."]},{"h":"Special cases","items":["Triangular matrix: eigenvalues are the diagonal entries.","Repeated eigenvalue: may or may not give independent eigenvectors — diagonalizability must be checked.","Zero eigenvalue $\\iff|A|=0$; $A^{-1}$ does not exist.","$rt-s^2=0$: test is inconclusive; examine $f$ along lines (e.g. $y=0$, $y=x$).","$e^W$ homogeneous of degree 0 $\\Rightarrow\\sum xW_x=0$.","Single $x$ term in a DE → treat as linear in $x$."]},{"h":"Common sign errors","items":["Middle term in Cramer's rule: $-x_2$.","In $(x^2y-2xy^2)dx-(x^3-3x^2y)dy=0$, $N=-(x^3-3x^2y)$ — carry the minus.","$x-ct$ gives $z_t=-c\\varphi'$, but $z_{tt}=+c^2\\varphi''$.","Leibnitz: lower-limit term is subtracted.","$\\log(b/a)$ not $\\log(a/b)$; $\\frac{d}{dx}\\text{erfc}=-\\frac{2}{\\sqrt\\pi}e^{-x^2}$."]},{"h":"Common calculation mistakes","items":["$S_2$ uses only the three diagonal minors.","In LU, $l_{21}=a_{21}/u_{11}$ (column below the pivot), not $a_{12}/u_{11}$.","Cholesky $l_{32}=(a_{32}-l_{21}l_{31})/l_{22}$ — the product term is often forgotten.","In $\\text{erf}(ax^n)$ the exponent is $-a^2x^{2n}$.","Substitute the point into a Jacobian before expanding the determinant.","Always verify: eigen sum = trace; $LU$ multiplies back to $A$; $Ax$ = $B$ with your answer.","In $\\int_0^5\\int_0^{x^2}\\dots dx\\,dy$ the inner limit has $x$, so integrate $y$ first.","Polar area/volume: never forget the extra $r$."]},{"h":"Frequently confused concepts","items":["<b>Homogeneous DE<\/b> (solve by $y=vx$) vs <b>homogeneous function<\/b> (Euler's theorem) — same word, different tasks.","<b>IF Rule I<\/b> ($\\frac1{Mx+Ny}$, homogeneous) vs <b>Rule II<\/b> ($\\frac1{Mx-Ny}$, $xy$-form).","<b>IF of a linear DE<\/b> ($e^{\\int P}$) vs <b>IF for reducible exact<\/b> (Rules I/II).","<b>LU<\/b> ($L$ has 1s on the diagonal, any square matrix) vs <b>Cholesky<\/b> ($U=L^T$, symmetric positive definite only).","<b>DUIS Rule I<\/b> (fixed limits) vs <b>Rule II / Leibnitz<\/b> (variable limits).","<b>erf<\/b> ($0\\to x$) vs <b>erfc<\/b> ($x\\to\\infty$)."]},{"h":"Exam presentation tips (20-mark TA, 1 hour)","items":["Attempt Q1 <b>or<\/b> Q2 and Q3 <b>or<\/b> Q4 — decide within the first 2 minutes; pick the pair you can fully finish.","Each sub-question is 5 marks (≈ 12 minutes). The 2025 model answer gives marks per step (e.g. 2 + 2 + 1), so write every intermediate line.","State the method/condition in words: 'Since $M_y=N_x$, the equation is exact', 'Since eigenvalues are distinct, A is diagonalizable', 'By DUIS Rule I...'.","Number your equations (1), (2) and box the final answer.","Write definitions before using them (erf/erfc earn marks on their own).","Leave 3 minutes to check sum/product of eigenvalues and substitute answers back."]}],"LASTMIN":{"formulas":["F4","F9","F10","F15","F13","F22","F23","F24","F25","F26","F37","F38","F41","F44","F45","F46","F48","F49","F55","F57","F59","F60","F61","F62","F65","F69"],"concepts":["TA-I is a fixed template in your papers: Q1 = Eigen + LU, Q2 = Diagonalization + Cholesky, Q3 = Exact + Linear, Q4 = Formation + Reducible-to-exact.","13 of the 16 TA-I questions you have are copied from the Unit I/II slide examples & exercises — redo every slide example and exercise.","TA-II (both years): Q1/Q2 = Partial differentiation (Euler, Jacobian, chain rule, max-min); Q3/Q4 = DUIS + Error function.","Error function is the single most-asked TA-II idea (4 sub-questions). Euler's theorem is next (3).","Frullani integral log(b/a) was asked in both TA-II years in the same slot.","21 official tutorial questions are word-for-word the same as 22 of your 32 PYQ sub-questions (e.g. T3 Q6, T5 Q1, T10 Q4, T11 Q4) - the tutorial sheet is your best practice set."],"patterns":["3x3 eigenvalues with integer roots (1,2,3 or −1,1,4) + one eigenvector","2x2 diagonalization with distinct eigenvalues","Cholesky with integer L (3,2,4 / 2,1,7 first column)","Exact DE with M_y = N_x immediately true","IF Rule I (homogeneous) or Rule II (xy-form)","Euler corollary with tan⁻¹ or sin⁻¹","Leibnitz rule on ∫₀ˣ (kernel in x − t) G(t) dt","erf: definition / derivative / completing the square"],"again":["C3A","A2B","B1A","C1A","D4B","A4B","B4B","D2A","C4A","D3B"],"checklist":["I can write S1, S2, |A| and the 3x3 characteristic equation","I can get an eigenvector by Cramer's rule (with the middle minus)","I can build P and P⁻¹ for a 2x2 and show P⁻¹AP = D","I can fill L and U (Doolittle) in the right order","I can do Cholesky and solve LZ = B, LᵀX = Z","I can test exactness and write ∫M dx + ∫(N without x) dy = c","I know IF Rule I (1/(Mx+Ny)) vs Rule II (1/(Mx−Ny))","I can put a linear DE in standard form and find e^{∫P}","I can eliminate 2 constants to form a DE","I can find the degree and use g(u) = n f/f' and g(g'−1)","I know JJ' = 1 and can expand a 3x3 Jacobian at a point","I can classify stationary points with rt − s²","I can do the Frullani integral by DUIS","I can apply the Leibnitz rule with boundary terms","I can define erf, erfc and prove erfc(−x)+erfc(x)=2","I can differentiate erf(axⁿ) and complete the square for erfc(a)","I can test functional dependence with J = 0 and find the relation","I can set limits for a double integral over a region between curves","I can find an area between curves and a volume under a plane","I can evaluate a triple integral in the order its limits demand","I can run the curve-tracing checklist and know the rose petal rule"]},"VERIFIED":"Title and channel checked on the YouTube watch page (20 Oct 2026).","CHANNEL":"https://www.youtube.com/@pradeepgiriacademy","QUIZ":[{"id":"q1","topic":"eig","type":"formula","src":"Generated","diff":"Easy","q":"The sum of the eigenvalues of a square matrix equals:","opts":["its determinant","its trace","its rank","zero"],"a":1,"hint":"Look at S₁ in the characteristic equation.","sol":["$\\lambda_1+\\cdots+\\lambda_n=S_1=$ trace (sum of diagonal elements)."]},{"id":"q2","topic":"eig","type":"formula","src":"Generated","diff":"Easy","q":"In $\\lambda^3-S_1\\lambda^2+S_2\\lambda-|A|=0$, $S_2$ is:","opts":["sum of all 2x2 minors","sum of minors of the diagonal elements","product of diagonal elements","trace of A²"],"a":1,"hint":"Only three minors are added.","sol":["$S_2=M_{11}+M_{22}+M_{33}$, the minors of $a_{11},a_{22},a_{33}$."]},{"id":"q3","topic":"eig","type":"numerical","src":"Generated","diff":"Easy","q":"Eigenvalues of $\\begin{bmatrix}2&0&0\\\\5&3&0\\\\1&4&7\\end{bmatrix}$ are:","opts":["2, 3, 7","2, 5, 1","12, 0, 0","7, 4, 1"],"a":0,"hint":"The matrix is triangular.","sol":["Triangular $\\Rightarrow$ eigenvalues are the diagonal entries $2,3,7$."]},{"id":"q4","topic":"eig","type":"concept","src":"Generated","diff":"Medium","q":"If the eigenvalues of $A$ are $1,2,3$, the eigenvalues of $A^{-1}+2I$ are:","opts":["3, 4, 5","3, 2.5, 7/3","1, 1/2, 1/3","−1, 0, 1"],"a":1,"hint":"Combine the A⁻¹ and A + kI properties.","sol":["$A^{-1}$ has $1,\\tfrac12,\\tfrac13$","Adding $2I$ adds 2: $3,\\;2.5,\\;\\tfrac73$"]},{"id":"q5","topic":"eig","type":"pyq","src":"PYQ A1A","diff":"Medium","q":"For $A=\\begin{bmatrix}4&6&6\\\\1&3&2\\\\-1&-4&-3\\end{bmatrix}$ the eigenvalues are:","opts":["1, 2, 3","−1, 1, 4","−1, 2, 3","0, 1, 3"],"a":1,"hint":"S₁ = 4, S₂ = −1, |A| = −4.","sol":["$\\lambda^3-4\\lambda^2-\\lambda+4=(\\lambda-4)(\\lambda^2-1)=0$","$\\lambda=-1,1,4$; check sum $=4$, product $=-4$"]},{"id":"q6","topic":"eig","type":"numerical","src":"Generated","diff":"Medium","q":"For $A=\\begin{bmatrix}14&-10\\\\5&-1\\end{bmatrix}$, an eigenvector for $\\lambda=9$ is:","opts":["(1, 1)ᵀ","(2, 1)ᵀ","(1, 2)ᵀ","(−2, 1)ᵀ"],"a":1,"hint":"Row: 5x₁ − 10x₂ = 0.","sol":["$(A-9I)=\\begin{bmatrix}5&-10\\\\5&-10\\end{bmatrix}\\Rightarrow x_1=2x_2$","$X=(2,1)^T$"]},{"id":"q7","topic":"diag","type":"concept","src":"Generated","diff":"Easy","q":"An $n\\times n$ matrix is diagonalizable if and only if it has:","opts":["n distinct entries","n linearly independent eigenvectors","a non-zero determinant","a symmetric form"],"a":1,"hint":"Diagonalization theorem.","sol":["Diagonalization theorem: n linearly independent eigenvectors (distinct eigenvalues guarantee this)."]},{"id":"q8","topic":"diag","type":"pyq","src":"PYQ A2A","diff":"Easy","q":"$A=\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$. Then $P^{-1}AP$ equals:","opts":["diag(1, 6)","diag(2, 5)","diag(4, 3)","diag(−2, 5)"],"a":1,"hint":"λ² − 7λ + 10 = 0.","sol":["$\\lambda=2,5$ (distinct) $\\Rightarrow D=\\text{diag}(2,5)$ with $P=\\begin{bmatrix}1&1\\\\-2&1\\end{bmatrix}$"]},{"id":"q9","topic":"diag","type":"numerical","src":"Generated","diff":"Medium","q":"If $P=\\begin{bmatrix}-2&-1\\\\1&1\\end{bmatrix}$ then $P^{-1}$ is:","opts":["[[−1, −1], [1, 2]]","[[1, 1], [−1, −2]]","[[1, −1], [1, 2]]","[[−1, 1], [−1, 2]]"],"a":0,"hint":"|P| = −1.","sol":["$|P|=-2+1=-1$","$P^{-1}=\\frac{1}{-1}\\begin{bmatrix}1&1\\\\-1&-2\\end{bmatrix}=\\begin{bmatrix}-1&-1\\\\1&2\\end{bmatrix}$"]},{"id":"q10","topic":"lu","type":"concept","src":"Generated","diff":"Easy","q":"In Doolittle's LU decomposition, the diagonal entries of L are:","opts":["the pivots","all 1","square roots of aᵢᵢ","zero"],"a":1,"hint":"Unit lower triangular.","sol":["L is unit lower triangular: lᵢᵢ = 1."]},{"id":"q11","topic":"lu","type":"pyq","src":"PYQ B1B","diff":"Medium","q":"For $A=\\begin{bmatrix}2&2&3\\\\4&-2&1\\\\1&5&4\\end{bmatrix}=LU$, $u_{22}$ is:","opts":["−2","−6","2","−5"],"a":1,"hint":"u₂₂ = a₂₂ − l₂₁u₁₂.","sol":["$l_{21}=4/2=2$","$u_{22}=-2-2(2)=-6$"]},{"id":"q12","topic":"lu","type":"pyq","src":"PYQ A1B","diff":"Hard","q":"For $A=\\begin{bmatrix}3&2&7\\\\2&3&1\\\\3&4&1\\end{bmatrix}=LU$, $u_{33}$ is:","opts":["−8/5","8/5","−11/3","6/5"],"a":0,"hint":"First get l₃₂ = 6/5 and u₂₃ = −11/3.","sol":["$u_{33}=a_{33}-l_{31}u_{13}-l_{32}u_{23}=1-7-\\frac65\\left(-\\frac{11}3\\right)$","$=-6+\\frac{22}{5}=-\\frac85$"]},{"id":"q13","topic":"lu","type":"concept","src":"Generated","diff":"Easy","q":"Solving AX = B with A = LU, the first system you solve is:","opts":["UX = B by back substitution","LZ = B by forward substitution","UZ = B by forward substitution","LX = Z by back substitution"],"a":1,"hint":"Z = UX is the intermediate.","sol":["LUX = B; let UX = Z ⇒ LZ = B (forward), then UX = Z (backward)."]},{"id":"q14","topic":"chol","type":"concept","src":"Generated","diff":"Easy","q":"Cholesky's method A = LLᵀ requires A to be:","opts":["upper triangular","symmetric and positive definite","singular","orthogonal"],"a":1,"hint":"Square roots must be real.","sol":["A must be symmetric (Hermitian) and positive definite."]},{"id":"q15","topic":"chol","type":"pyq","src":"PYQ B2B","diff":"Medium","q":"For $A=\\begin{bmatrix}4&2&14\\\\2&17&-5\\\\14&-5&83\\end{bmatrix}$, Cholesky gives $l_{33}=$","opts":["3","5","7","√83"],"a":1,"hint":"l₃₁ = 7, l₃₂ = −3.","sol":["$l_{33}=\\sqrt{83-7^2-(-3)^2}=\\sqrt{25}=5$"]},{"id":"q16","topic":"chol","type":"pyq","src":"PYQ A2B","diff":"Medium","q":"In the system $9x_1+6x_2+12x_3=17.4,\\ 6x_1+13x_2+11x_3=23.6,\\ 12x_1+11x_2+26x_3=30.8$, $x_3=$","opts":["1.2","0.4","0.6","4"],"a":1,"hint":"Z = (5.8, 4, 1.2) and l₃₃ = 3.","sol":["$L^TX=Z$: $3x_3=1.2\\Rightarrow x_3=0.4$"]},{"id":"q17","topic":"chol","type":"formula","src":"Generated","diff":"Easy","q":"In Cholesky, $l_{22}=$","opts":["√(a₂₂ − l₂₁²)","a₂₂ − l₂₁","a₂₁ / l₁₁","√(a₂₂) − l₂₁"],"a":0,"hint":"Compare the (2,2) entry of LLᵀ.","sol":["$(LL^T)_{22}=l_{21}^2+l_{22}^2=a_{22}$"]},{"id":"q18","topic":"pca","type":"concept","src":"Generated","diff":"Easy","q":"In PCA, the principal components are:","opts":["eigenvalues of the data matrix","eigenvectors of the covariance matrix","rows of the standardized data","the means of each variable"],"a":1,"hint":"Step 3 in your slides.","sol":["Eigenvectors of the covariance matrix give the directions (principal components); eigenvalues give the variance carried."]},{"id":"q19","topic":"form","type":"pyq","src":"PYQ B4A","diff":"Easy","q":"The DE whose general solution is $y=ae^{-2x}+be^{-3x}$ is:","opts":["y'' − 5y' + 6y = 0","y'' + 5y' + 6y = 0","y'' + 6y' + 5y = 0","y'' − 6y = 0"],"a":1,"hint":"Roots −2, −3.","sol":["$m^2-(m_1+m_2)m+m_1m_2=m^2+5m+6$","$y''+5y'+6y=0$"]},{"id":"q20","topic":"form","type":"concept","src":"Generated","diff":"Easy","q":"Eliminating 2 arbitrary constants gives a differential equation of order:","opts":["1","2","3","depends on degree"],"a":1,"hint":"Differentiate as many times as there are constants.","sol":["n constants ⇒ order n."]},{"id":"q21","topic":"form","type":"pyq","src":"PYQ A4A","diff":"Medium","q":"Eliminating $A,B$ from $y=A\\sin(\\log x)+B\\cos(\\log x)$ gives:","opts":["x²y'' + xy' + y = 0","x²y'' − xy' + y = 0","y'' + y = 0","x²y'' + xy' − y = 0"],"a":0,"hint":"Multiply y₁ by x before differentiating again.","sol":["$xy_1=A\\cos\\log x-B\\sin\\log x$","$x^2y_2+xy_1=-y$"]},{"id":"q22","topic":"exact","type":"formula","src":"Generated","diff":"Easy","q":"M dx + N dy = 0 is exact if:","opts":["∂M/∂x = ∂N/∂y","∂M/∂y = ∂N/∂x","M = N","Mx + Ny = 0"],"a":1,"hint":"Cross-derivatives.","sol":["$M_y=N_x$."]},{"id":"q23","topic":"exact","type":"pyq","src":"PYQ A3A","diff":"Easy","q":"The general solution of $(2xy+e^y)dx+(x^2+xe^y)dy=0$ is:","opts":["x²y + xeʸ = c","x²y + eʸ = c","xy² + xeʸ = c","x² + xeʸ = c"],"a":0,"hint":"∫M dx with y constant.","sol":["$M_y=2x+e^y=N_x$","$\\int M\\,dx=x^2y+xe^y$; no $x$-free terms in $N$"]},{"id":"q24","topic":"exact","type":"pyq","src":"PYQ B3A","diff":"Easy","q":"The general solution of $(1+xy^2)dx+(1+x^2y)dy=0$ is:","opts":["x + y + x²y² = c","x + y + x²y²/2 = c","x + x²y²/2 = c","xy + x²y²/2 = c"],"a":1,"hint":"Don't forget the '1' in N.","sol":["$\\int M\\,dx=x+\\frac{x^2y^2}{2}$; $N$ term free of $x$ is $1\\Rightarrow y$"]},{"id":"q25","topic":"reduc","type":"formula","src":"Generated","diff":"Easy","q":"For a homogeneous non-exact M dx + N dy = 0 (Mx + Ny ≠ 0), the IF is:","opts":["1/(Mx − Ny)","1/(Mx + Ny)","e^{∫P dx}","1/(xy)"],"a":1,"hint":"Rule I.","sol":["Rule I: IF = 1/(Mx + Ny)."]},{"id":"q26","topic":"reduc","type":"pyq","src":"PYQ B4B","diff":"Medium","q":"The IF of $(1+xy)y\\,dx+(1-xy)x\\,dy=0$ is:","opts":["1/(2x²y²)","1/(x²y²)","1/(2xy)","x²y²"],"a":0,"hint":"Rule II: Mx − Ny.","sol":["$Mx-Ny=xy+x^2y^2-(xy-x^2y^2)=2x^2y^2$"]},{"id":"q27","topic":"reduc","type":"pyq","src":"PYQ A4B","diff":"Hard","q":"After multiplying $(x^2y-2xy^2)dx-(x^3-3x^2y)dy=0$ by its IF, the solution is:","opts":["x/y − 2 log x + 3 log y = c","x/y + 2 log x − 3 log y = c","y/x − 2 log x + 3 log y = c","xy − 2 log x + 3 log y = c"],"a":0,"hint":"IF = 1/(x²y²).","sol":["$(\\frac1y-\\frac2x)dx+(-\\frac x{y^2}+\\frac3y)dy=0$","$\\frac xy-2\\log x+3\\log y=c$"]},{"id":"q28","topic":"linear","type":"pyq","src":"PYQ B3B","diff":"Easy","q":"The integrating factor of $x^2\\frac{dy}{dx}=3x^2-2xy+1$ is:","opts":["x","x²","e^{2x}","1/x²"],"a":1,"hint":"Standard form: y' + (2/x)y = 3 + 1/x².","sol":["$P=\\frac2x\\Rightarrow e^{\\int P}=e^{2\\log x}=x^2$"]},{"id":"q29","topic":"linear","type":"pyq","src":"PYQ A3B","diff":"Medium","q":"Solution of $(1+x^2)y'+y=e^{\\tan^{-1}x}$:","opts":["y e^{tan⁻¹x} = ½ e^{2tan⁻¹x} + c","y = e^{tan⁻¹x} + c","y e^{tan⁻¹x} = tan⁻¹x + c","y(1+x²) = e^{tan⁻¹x} + c"],"a":0,"hint":"IF = e^{tan⁻¹x}; put t = tan⁻¹x.","sol":["$y e^{\\tan^{-1}x}=\\int e^{2t}dt=\\tfrac12e^{2t}+c$"]},{"id":"q30","topic":"bern","type":"formula","src":"Generated","diff":"Medium","q":"Bernoulli's equation $y'+Py=Qy^n$ becomes linear with the substitution:","opts":["v = yⁿ","v = y^{1−n}","v = y/x","v = xy"],"a":1,"hint":"Divide by yⁿ first.","sol":["$v=y^{1-n}\\Rightarrow v'+(1-n)Pv=(1-n)Q$"]},{"id":"q31","topic":"growth","type":"numerical","src":"Generated","diff":"Easy","q":"A substance decays with m = m₀e^{−kt}. Its half-life is:","opts":["k/ln2","ln2/k","2/k","ln k / 2"],"a":1,"hint":"Set m = m₀/2.","sol":["$\\tfrac12=e^{-kt}\\Rightarrow t=\\frac{\\ln2}{k}$"]},{"id":"q32","topic":"deba function topicProgress(){
  const ts = scopedTopics(); const d = ts.filter(t => S.done[t.id]).length;
  return {done:d, total:ts.length, pct: ts.length ? Math.round(100*d/ts.length) : 0};
}
function quizStats(){
  const ids = Object.keys(S.quiz).filter(k => D.QUIZ.some(q => q.id === k));
  const c = ids.filter(k => S.quiz[k].ok).length;
  return {att:ids.length, correct:c, acc: ids.length ? Math.round(100*c/ids.length) : null};
}

}

function plotSVG(key){
  const W = 200, H = 160, cx = 100, cy = 80; let sc = 34, pts = [], asym = "", lab = "";
  const path = arr => arr.map((p,i) => (i?"L":"M") + (cx + p[0]*sc).toFixed(1) + " " + (cy - p[1]*sc).toFixed(1)).join(" ");
  let paths = [];
  if (key === "agnesi") { sc = 38; const up = [], dn = []; for (let x = 1; x >= 0.06; x -= 0.01) { const y = 2*Math.sqrt((1-x)/x); if (y < 2.1) { up.push([x-0.5, y]); dn.push([x-0.5, -y]); } }
    paths = [path(up), path(dn)]; asym = `<line class="as" x1="${cx-0.5*sc}" y1="4" x2="${cx-0.5*sc}" y2="${H-4}"/>`; lab = `<text x="${cx-0.5*sc+3}" y="12">x = 0 (asymptote)</text><text x="${cx+0.5*sc-4}" y="${cy+10}">a</text>`; }
  else if (key === "cissoid") { sc = 34; const up = [], dn = []; for (let x = 0; x <= 1.94; x += 0.01) { const y = Math.sqrt(x*x*x/(2-x)); if (y < 2.2) { up.push([x-1, y]); dn.push([x-1, -y]); } }
    paths = [path(up), path(dn)]; asym = `<line class="as" x1="${cx+1*sc}" y1="4" x2="${cx+1*sc}" y2="${H-4}"/>`; lab = `<text x="${cx+sc+3}" y="12">x = 2a</text><text x="${cx-sc+2}" y="${cy+10}">O</text>`; }
  else { const n = key.includes("2") ? 2 : 3, f = key.includes("cos") ? Math.cos : Math.sin; sc = 64;
    for (let i = 0; i <= 720; i++) { const th = i*Math.PI/360, r = f(n*th); pts.push([r*Math.cos(th), r*Math.sin(th)]); } paths = [path(pts)]; lab = `<text x="${cx+sc+2}" y="${cy-3}">a</text>`; }
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sketch of the curve (a = 1)"><line class="ax" x1="4" y1="${cy}" x2="${W-4}" y2="${cy}"/><line class="ax" x1="${key==="agnesi"?cx-0.5*sc:key==="cissoid"?cx-sc:cx}" y1="4" x2="${key==="agnesi"?cx-0.5*sc:key==="cissoid"?cx-sc:cx}" y2="${H-4}"/>${asym}${paths.map(d => `<path class="cv" d="${d}"/>`).join("")}${lab}<text x="${W-46}" y="${H-5}">sketch, a = 1</text></svg>`;
}
