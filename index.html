uching $y$ axis at origin and centers on $x$ axis.","slide":"Unit II Formation Example 06","steps":["Circle: $(x-a)^2+y^2=a^2\\Rightarrow x^2+y^2=2ax$ (one constant)","Differentiate: $2x+2yy'=2a\\Rightarrow a=x+yy'$","Substitute: $x^2+y^2=2x(x+yy')$"],"ans":"$2xy\\dfrac{dy}{dx}=y^2-x^2$","id":"T4Q4","label":"T4 Q4","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":5,"topic":"form","sub":"Two exponentials","text":"Form the differential equation whose general solution is $y=ae^{-2x}+be^{-3x}$, where $a$ and $b$ are arbitrary constants","pyq":"B4A","slide":"Unit II Formation Exercise 1","id":"T4Q5","label":"T4 Q5","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":4,"n":6,"topic":"form","sub":"Two constants","text":"Obtain the differential equations whose general solution is $y=e^x(A\\cos x+B\\sin x)$ Where A and B are arbitrary constants.","steps":["Let $w=e^x(-A\\sin x+B\\cos x)$; then $y_1=y+w$","$w'=w-y$ (differentiate $w$)","$y_2=y_1+w'=y_1+(y_1-y)-y$"],"ans":"$\\dfrac{d^2y}{dx^2}-2\\dfrac{dy}{dx}+2y=0$","id":"T4Q6","label":"T4 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":4,"n":7,"topic":"form","sub":"Determinant elimination","text":"Form the differential equations by eliminating the arbitrary constants from $Ax^2+By^2=1.$ where A and B are arbitrary constants.","slide":"Unit II Formation Example 05","steps":["$Ax+Byy_1=0,\\quad A+B(y_1^2+yy_2)=0$","Eliminate with $\\begin{vmatrix}x^2&y^2&-1\\\\x&yy_1&0\\\\1&y_1^2+yy_2&0\\end{vmatrix}=0$","$-1\\,[x(y_1^2+yy_2)-yy_1]=0$"],"ans":"$xy\\dfrac{d^2y}{dx^2}+x\\left(\\dfrac{dy}{dx}\\right)^2-y\\dfrac{dy}{dx}=0$","id":"T4Q7","label":"T4 Q7","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":5,"n":1,"topic":"exact","sub":"Exact","text":"Obtain the general solution of the differential equation $(2xy+e^y)dx+(x^2+xe^y)dy=0.$","pyq":"A3A","slide":"Unit II Exact Example 03","id":"T5Q1","label":"T5 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":5,"n":2,"topic":"exact","sub":"Rearrange then exact","text":"Obtain the general solution of the differential equation $\\dfrac{dy}{dx}=\\dfrac{y+1}{(y+2)e^y-x}$.","slide":"Unit II Exact Exercise 3","steps":["Rewrite: $(y+1)dx+\\left[x-(y+2)e^y\\right]dy=0$","$M_y=1=N_x\\Rightarrow$ exact","$\\int M\\,dx=x(y+1)$; $N$ terms free of $x$: $-(y+2)e^y$, $\\int-(y+2)e^ydy=-(y+1)e^y$","$x(y+1)-(y+1)e^y=c$"],"ans":"$(y+1)(x-e^y)=c$","id":"T5Q2","label":"T5 Q2","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":5,"n":3,"topic":"exact","sub":"Exact (trig)","text":"Solve the differential equation $(1+2xy\\cos x^2-2xy)dx+(\\sin x^2-x^2)dy=0$","steps":["$M_y=2x\\cos x^2-2x=N_x$ ✓","$\\int M\\,dx=x+y\\sin x^2-x^2y$ (using $\\int2x\\cos x^2dx=\\sin x^2$)","All terms of $N$ contain $x$"],"ans":"$x+y\\sin x^2-x^2y=c$","id":"T5Q3","label":"T5 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":5,"n":4,"topic":"exact","sub":"Exact (exponential)","text":"Solve the differential equation $\\left(y^2e^{xy^2}+4x^3\\right)dx+\\left(2xye^{xy^2}-3y^2\\right)dy=0.$","slide":"Unit II Exact Exercise 4","steps":["$M_y=2ye^{xy^2}+2xy^3e^{xy^2}=N_x$ ✓","$\\int M\\,dx=e^{xy^2}+x^4$","$N$ terms free of $x$: $-3y^2\\Rightarrow-y^3$"],"ans":"$e^{xy^2}+x^4-y^3=c$","id":"T5Q4","label":"T5 Q4","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":5,"n":5,"topic":"exact","sub":"Find constants for exactness","text":"For what values of $a$ and $b$, the differential equation $(y+x^3)dx+(ax+by^3)dy=0$ is exact. Also find the solution of the equation.","steps":["$M_y=1,\\;N_x=a\\Rightarrow$ exact iff $a=1$; $b$ can be any value","$\\int M\\,dx=xy+\\frac{x^4}{4}$; $N$ term free of $x$: $by^3\\Rightarrow\\frac{by^4}{4}$"],"ans":"$a=1$, any $b$: $\\;\\frac{x^4}{4}+xy+\\frac{by^4}{4}=c$","id":"T5Q5","label":"T5 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":5,"n":6,"topic":"reduc","sub":"Rule I (homogeneous)","text":"Reduce the differential equation $(xy-2y^2)dx-(x^2-3xy)dy=0$ into exact differential equation and find the general solution.","slide":"Unit II Reducible Exercise 2","steps":["Homogeneous (degree 2); $Mx+Ny=x^2y-2xy^2-x^2y+3xy^2=xy^2$","IF $=\\frac1{xy^2}$: $\\left(\\frac1y-\\frac2x\\right)dx+\\left(-\\frac{x}{y^2}+\\frac3y\\right)dy=0$ (exact)","$\\frac xy-2\\log x+3\\log y=c$"],"ans":"$\\frac xy-2\\log x+3\\log y=c$","id":"T5Q6","label":"T5 Q6","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":5,"n":7,"topic":"reduc","sub":"Rule I (homogeneous)","text":"Solve the differential equation $(x^2y-2xy^2)dx-(x^3-3x^2y)dy=0$.","pyq":"A4B","slide":"Unit II Reducible Example 01","id":"T5Q7","label":"T5 Q7","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":5,"n":8,"topic":"reduc","sub":"Rule II","text":"Find the general solution of the differential equation $(x^2y^2+2)ydx+(2-2x^2y^2)xdy=0$.","slide":"Unit II Reducible Exercise 3","steps":["Form $yf_1(xy)dx+xf_2(xy)dy\\Rightarrow$ Rule II","$Mx-Ny=xy(x^2y^2+2)-xy(2-2x^2y^2)=3x^3y^3\\Rightarrow$ IF $=\\frac{1}{3x^3y^3}$","$\\left(\\frac{1}{3x}+\\frac{2}{3x^3y^2}\\right)dx+\\left(\\frac{2}{3x^2y^3}-\\frac{2}{3y}\\right)dy=0$ (exact)","$\\int M\\,dx=\\frac13\\log x-\\frac{1}{3x^2y^2}$; $N$ terms free of $x$: $-\\frac2{3y}\\Rightarrow-\\frac23\\log y$","Multiply by 3: $\\log x-\\frac{1}{x^2y^2}-2\\log y=C$"],"ans":"$\\log\\dfrac{x}{y^2}-\\dfrac{1}{x^2y^2}=C$","id":"T5Q8","label":"T5 Q8","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":5,"n":9,"topic":"reduc","sub":"Rule II","text":"Obtain the Integrating factor of the differential equation $(1+xy)ydx+(1-xy)xdy=0$ and use it to find the general solution.","pyq":"B4B","slide":"Unit II Reducible Exercise 4","id":"T5Q9","label":"T5 Q9","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":6,"n":1,"topic":"linear","sub":"Linear in y","text":"Solve the differential equation $(1+x^2)\\dfrac{dy}{dx}+y=e^{\\tan^{-1}x}$.","pyq":"A3B","slide":"Unit II Linear Exercise 1","id":"T6Q1","label":"T6 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":6,"n":2,"topic":"linear","sub":"Linear in y","text":"Solve the differential equation $\\dfrac{dy}{dx}+\\dfrac{3y}{x}=\\dfrac{\\sin x}{x^3}$","steps":["$P=\\frac3x\\Rightarrow$ IF $=e^{3\\log x}=x^3$","$yx^3=\\int\\frac{\\sin x}{x^3}x^3dx=\\int\\sin x\\,dx$"],"ans":"$x^3y=-\\cos x+c$","id":"T6Q2","label":"T6 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":6,"n":3,"topic":"linear","sub":"Linear in y","text":"Find the general solution of the linear differential equation $\\dfrac{dy}{dx}+y\\cot x=x\\,\\text{cosec}\\,x$","slide":"Unit II Linear Exercise 5","steps":["IF $=e^{\\int\\cot x\\,dx}=e^{\\log\\sin x}=\\sin x$","$y\\sin x=\\int x\\,\\text{cosec}\\,x\\sin x\\,dx=\\int x\\,dx$"],"ans":"$y\\sin x=\\frac{x^2}{2}+c$","id":"T6Q3","label":"T6 Q3","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":6,"n":4,"topic":"linear","sub":"Rearrange then linear","text":"Solve the differential equation $x^2\\dfrac{dy}{dx}=3x^2-2xy+1$.","pyq":"B3B","slide":"Unit II Linear Exercise 2","id":"T6Q4","label":"T6 Q4","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":6,"n":5,"topic":"linear","sub":"Linear in y","text":"Solve the differential equation $\\dfrac{dy}{dx}+\\dfrac{4x}{1+x^2}y=\\dfrac{1}{(x^2+1)^3}$","slide":"Unit II Linear Exercise 4 (same type)","steps":["IF $=e^{\\int\\frac{4x}{1+x^2}dx}=e^{2\\log(1+x^2)}=(1+x^2)^2$","$y(1+x^2)^2=\\int\\frac{(1+x^2)^2}{(1+x^2)^3}dx=\\int\\frac{dx}{1+x^2}$"],"ans":"$y(1+x^2)^2=\\tan^{-1}x+c$","id":"T6Q5","label":"T6 Q5","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":6,"n":6,"topic":"growth","sub":"Natural growth","text":"A bacterial population B is known to have a rate of growth proportional to B itself. If between noon and 2 PM the population triples, at what time, no controls being exerted, should B become 100 times what it was at noon.","slide":"Unit II Growth Example 01","steps":["$B=B_0e^{kt}$; $3=e^{2k}\\Rightarrow k=\\frac12\\ln3=0.5493$","$100=e^{kt}\\Rightarrow t=\\frac{\\ln100}{0.5493}\\approx8.38$ h"],"ans":"About 8.38 hours after noon, i.e. roughly 8:23 PM","id":"T6Q6","label":"T6 Q6","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":6,"n":7,"topic":"growth","sub":"Natural growth","text":"If the population of a country doubles in 50 years, in how many years will it treble under the assumption that the rate of increase is proportional to the number of inhabitants.","steps":["$P=P_0e^{kt}$; $2=e^{50k}\\Rightarrow k=\\frac{\\ln2}{50}$","$3=e^{kt}\\Rightarrow t=\\frac{50\\ln3}{\\ln2}$"],"ans":"$t\\approx79.25$ years","id":"T6Q7","label":"T6 Q7","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":6,"n":8,"topic":"growth","sub":"Decay / half-life","text":"Radium decomposes at a rate proportional the quantity of radium present. Suppose that it is found that in 25 years approximately 1.1% of a certain quantity of radium has decomposed. Determine approximately how long will it take for one-half of the original amount of radium to decompose.","slide":"Unit II Decay Example 01","steps":["$m=m_0e^{-kt}$; $0.989=e^{-25k}\\Rightarrow k=-\\frac{\\ln0.989}{25}=0.000442$","$\\frac12=e^{-kt}\\Rightarrow t=\\frac{\\ln2}{k}$"],"ans":"≈ 1567 years (the slide rounds k to 0.000443 and gets ≈ 1565 years)","id":"T6Q8","label":"T6 Q8","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":6,"n":9,"topic":"growth","sub":"Natural growth","text":"The number $N$ of bacteria in a culture grew at a rate proportional to N. The value of $N$ was initially 100 and increased to 332 in one hour, what would be the value of $N$ after 1.5 hours.","steps":["$N=100e^{kt}$; $332=100e^{k}\\Rightarrow e^k=3.32$","$N(1.5)=100\\,(3.32)^{1.5}$"],"ans":"$N(1.5)\\approx605$","id":"T6Q9","label":"T6 Q9","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":6,"n":10,"topic":"growth","sub":"Half-life","text":"If half-life of uranium is 1500 years. (a) Find percentage of original amount that will remain after 4500 years, (b) Find in how many years will only $\\frac{1}{10}$ of the original amount remain?","steps":["$k=\\frac{\\ln2}{1500}$","(a) 4500 years = 3 half-lives $\\Rightarrow\\left(\\frac12\\right)^3=\\frac18$","(b) $\\frac1{10}=e^{-kt}\\Rightarrow t=\\frac{1500\\ln10}{\\ln2}$"],"ans":"(a) 12.5% (b) ≈ 4983 years","id":"T6Q10","label":"T6 Q10","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":1,"topic":"pdbasic","sub":"Laplace's equation","text":"If $u=(x^2+y^2+z^2)^{-\\frac12}$ then Show that $\\dfrac{\\partial^2u}{\\partial x^2}+\\dfrac{\\partial^2u}{\\partial y^2}+\\dfrac{\\partial^2u}{\\partial z^2}=0$","steps":["Let $r^2=x^2+y^2+z^2$, $u=r^{-1}$; $\\frac{\\partial r}{\\partial x}=\\frac xr$","$u_x=-xr^{-3}$, $u_{xx}=-r^{-3}+3x^2r^{-5}$","Similarly for $y,z$; add: $-3r^{-3}+3(x^2+y^2+z^2)r^{-5}=-3r^{-3}+3r^{-3}=0$ ∎"],"ans":"= 0","id":"T7Q1","label":"T7 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":2,"topic":"pdbasic","sub":"Laplace's equation","text":"If $u=3(ax+by+cz)^2-(x^2+y^2+z^2)$ and $a^2+b^2+c^2=1$ then show that $\\dfrac{\\partial^2u}{\\partial x^2}+\\dfrac{\\partial^2u}{\\partial y^2}+\\dfrac{\\partial^2u}{\\partial z^2}=0.$","steps":["$u_x=6a(ax+by+cz)-2x\\Rightarrow u_{xx}=6a^2-2$","Similarly $u_{yy}=6b^2-2,\\;u_{zz}=6c^2-2$","Sum $=6(a^2+b^2+c^2)-6=0$ ∎"],"ans":"= 0","id":"T7Q2","label":"T7 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":3,"topic":"composite","sub":"Wave equation","text":"If $z=f(x+ct)+\\varphi(x-ct)$ then show that $\\dfrac{\\partial^2z}{\\partial t^2}=c^2\\dfrac{\\partial^2z}{\\partial x^2}$","pyq":"D1A","id":"T7Q3","label":"T7 Q3","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":7,"n":4,"topic":"pdbasic","sub":"Operator form","text":"If $u=\\log(x^3+y^3-xy^2-x^2y)$ then Prove that $\\left(\\dfrac{\\partial}{\\partial x}+\\dfrac{\\partial}{\\partial y}\\right)^2u=\\dfrac{-4}{(x+y)^2}$.","steps":["$x^3+y^3-xy^2-x^2y=(x+y)(x-y)^2\\Rightarrow u=\\log(x+y)+2\\log(x-y)$","$\\left(\\partial_x+\\partial_y\\right)u=\\frac{2}{x+y}+2\\left(\\frac1{x-y}-\\frac1{x-y}\\right)=\\frac{2}{x+y}$","Apply again: $\\left(\\partial_x+\\partial_y\\right)\\frac{2}{x+y}=-\\frac{2}{(x+y)^2}\\cdot2=\\frac{-4}{(x+y)^2}$ ∎"],"ans":"$\\dfrac{-4}{(x+y)^2}$","id":"T7Q4","label":"T7 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":5,"topic":"pdbasic","sub":"First & second order","text":"Find the first and second-order partial derivatives of $z=x^3+y^3-3axy$","steps":["$z_x=3x^2-3ay,\\quad z_y=3y^2-3ax$","$z_{xx}=6x,\\quad z_{yy}=6y,\\quad z_{xy}=z_{yx}=-3a$"],"ans":"$z_{xx}=6x,\\;z_{xy}=-3a,\\;z_{yy}=6y$","id":"T7Q5","label":"T7 Q5","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":6,"topic":"pdbasic","sub":"Identity","text":"If $u=\\log(\\tan x+\\tan y+\\tan z)$ Show that $\\sin2x\\dfrac{\\partial u}{\\partial x}+\\sin2y\\dfrac{\\partial u}{\\partial y}+\\sin2z\\dfrac{\\partial u}{\\partial z}=2.$","pyq":"C2A","id":"T7Q6","label":"T7 Q6","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":7,"n":7,"topic":"pdbasic","sub":"Mixed derivatives","text":"If $u=\\log(x^2+y^2+z^2)$ then Show that $x\\dfrac{\\partial^2u}{\\partial y\\partial z}=y\\dfrac{\\partial^2u}{\\partial x\\partial z}=z\\dfrac{\\partial^2u}{\\partial x\\partial y}$","steps":["Let $r^2=x^2+y^2+z^2$; $u_z=\\frac{2z}{r^2}$","$u_{yz}=-\\frac{4yz}{r^4}$, $u_{xz}=-\\frac{4xz}{r^4}$, $u_{xy}=-\\frac{4xy}{r^4}$","Each product $=-\\frac{4xyz}{r^4}$ ∎"],"ans":"All equal $-\\frac{4xyz}{(x^2+y^2+z^2)^2}$","id":"T7Q7","label":"T7 Q7","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":8,"n":1,"topic":"euler","sub":"Corollary with cos⁻¹","text":"If $u=\\cos^{-1}(x^2+y^2)$ then find $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}$ and $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}$.","steps":["$f(u)=\\cos u=x^2+y^2$, $n=2$","$g(u)=2\\frac{\\cos u}{-\\sin u}=-2\\cot u$","$g'(u)=2\\,\\text{cosec}^2u$","$g(g'-1)=-2\\cot u\\,(2\\,\\text{cosec}^2u-1)$"],"ans":"$-2\\cot u$ and $-2\\cot u\\,(2\\,\\text{cosec}^2u-1)$","id":"T8Q1","label":"T8 Q1","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":2,"topic":"euler","sub":"Corollary with tan⁻¹","text":"If $u=\\tan^{-1}\\left(\\dfrac{x^3+y^3}{x+y}\\right)$ then Show that $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}=\\sin2u\\,[1-4\\sin^2u]$.","pyq":"C1A","id":"T8Q2","label":"T8 Q2","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":8,"n":3,"topic":"euler","sub":"Three variables, U + W","text":"If $u=\\dfrac{xyz}{2x+y+z}+\\log\\left(\\dfrac{x^2+y^2+z^2}{xy+yz}\\right)$ then find $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}+z\\dfrac{\\partial u}{\\partial z}$.","pyq":"D2B","id":"T8Q3","label":"T8 Q3","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":8,"n":4,"topic":"euler","sub":"Corollary with sec⁻¹","text":"If $u=\\sec^{-1}\\left(\\dfrac{x^3+y^3}{x+y}\\right)$ then Show that $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}=2\\cot u$.","steps":["$f(u)=\\sec u=\\frac{x^3+y^3}{x+y}$, degree $n=2$","$g(u)=2\\frac{\\sec u}{\\sec u\\tan u}=\\frac{2}{\\tan u}=2\\cot u$ ∎"],"ans":"$2\\cot u$","id":"T8Q4","label":"T8 Q4","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":5,"topic":"euler","sub":"Three variables, U + W","text":"If $u=\\dfrac{x^3y^3z^3}{x^2+y^2+z^2}+\\cos\\left(\\dfrac{xy+yz+zx}{x^2+y^2+z^2}\\right)$, then show that $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}+z\\dfrac{\\partial u}{\\partial z}=7\\left[\\dfrac{x^3y^3z^3}{x^2+y^2+z^2}\\right]$.","steps":["$U=\\frac{x^3y^3z^3}{x^2+y^2+z^2}$: degree $9-2=7\\Rightarrow\\sum xU_x=7U$","$W=\\cos(\\cdot)$ of a degree-0 ratio $\\Rightarrow W$ is homogeneous of degree 0 $\\Rightarrow\\sum xW_x=0$","Sum $=7U$ ∎"],"ans":"$7\\dfrac{x^3y^3z^3}{x^2+y^2+z^2}$","id":"T8Q5","label":"T8 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":6,"topic":"euler","sub":"Verify Euler","text":"Verify Euler's theorem $f(x,y,z)=3x^2yz+5xy^2z+4z^4$.","steps":["Every term has degree 4 $\\Rightarrow n=4$","$f_x=6xyz+5y^2z,\\;f_y=3x^2z+10xyz,\\;f_z=3x^2y+5xy^2+16z^3$","$xf_x+yf_y+zf_z=12x^2yz+20xy^2z+16z^4=4f$ ✓"],"ans":"$xf_x+yf_y+zf_z=4f$","id":"T8Q6","label":"T8 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":7,"topic":"euler","sub":"Fractional degree, 2nd order","text":"If $u=\\text{cosec}^{-1}\\sqrt{\\dfrac{x^{\\frac12}+y^{\\frac12}}{x^{\\frac13}+y^{\\frac13}}}$ then prove that $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=\\dfrac{\\tan u}{12}\\left(\\dfrac{13}{12}+\\dfrac{\\tan^2u}{12}\\right)$.","steps":["$f(u)=\\text{cosec}\\,u$ has degree $\\frac12\\left(\\frac12-\\frac13\\right)=\\frac1{12}$","$g(u)=\\frac1{12}\\cdot\\frac{\\text{cosec}\\,u}{-\\text{cosec}\\,u\\cot u}=-\\frac{\\tan u}{12}$","$g'(u)=-\\frac{\\sec^2u}{12}$","$g(g'-1)=\\frac{\\tan u}{12}\\left(\\frac{\\sec^2u}{12}+1\\right)=\\frac{\\tan u}{12}\\left(\\frac{13}{12}+\\frac{\\tan^2u}{12}\\right)$ ∎"],"ans":"As required","id":"T8Q7","label":"T8 Q7","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":8,"topic":"euler","sub":"Fractional (negative) degree","text":"If $u=\\sin^{-1}\\left(\\dfrac{x^{\\frac13}+y^{\\frac13}}{x^{\\frac12}-y^{\\frac12}}\\right)^{\\frac12}$ then prove that (i) $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}=-\\dfrac1{12}\\tan u$ (ii) $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}=\\dfrac{\\tan u}{144}(\\tan^2u+13)$","steps":["$f(u)=\\sin u$ has degree $\\frac12\\left(\\frac13-\\frac12\\right)=-\\frac1{12}$","(i) $g=-\\frac1{12}\\frac{\\sin u}{\\cos u}=-\\frac{\\tan u}{12}$","$g'=-\\frac{\\sec^2u}{12}$","(ii) $g(g'-1)=\\frac{\\tan u}{12}\\left(\\frac{\\sec^2u}{12}+1\\right)=\\frac{\\tan u}{144}(\\sec^2u+12)=\\frac{\\tan u}{144}(\\tan^2u+13)$ ∎"],"ans":"As required","id":"T8Q8","label":"T8 Q8","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":9,"topic":"euler","sub":"u itself homogeneous","text":"If $u=x^3y^2\\sin^{-1}\\left(\\dfrac yx\\right)$ then find $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}$ and $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}$.","steps":["$\\sin^{-1}(y/x)$ has degree 0, so $u$ is homogeneous of degree $n=5$","Euler: $xu_x+yu_y=5u$","Second order: $n(n-1)u=20u$"],"ans":"$5u$ and $20u$","id":"T8Q9","label":"T8 Q9","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":9,"n":1,"topic":"jacob","sub":"Inverse Jacobian","text":"If $u=x^2-y^2$ and $v=2xy$ then find $\\dfrac{\\partial(x,y)}{\\partial(u,v)}$.","steps":["$\\frac{\\partial(u,v)}{\\partial(x,y)}=\\begin{vmatrix}2x&-2y\\\\2y&2x\\end{vmatrix}=4(x^2+y^2)$","$JJ'=1\\Rightarrow\\frac{\\partial(x,y)}{\\partial(u,v)}=\\frac{1}{4(x^2+y^2)}$"],"ans":"$\\dfrac{1}{4(x^2+y^2)}$","id":"T9Q1","label":"T9 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":2,"topic":"jacob","sub":"3x3 Jacobian","text":"If $u=xyz,\\;v=x^2+y^2+z^2$ and $w=x+y+z$. Show that $\\dfrac{\\partial(u,v,w)}{\\partial(x,y,z)}=2(x-y)(y-z)(x-z)$.","steps":["$J=\\begin{vmatrix}yz&zx&xy\\\\2x&2y&2z\\\\1&1&1\\end{vmatrix}=2\\begin{vmatrix}yz&zx&xy\\\\x&y&z\\\\1&1&1\\end{vmatrix}$","$C_1\\to C_1-C_2,\\;C_2\\to C_2-C_3$: $2\\begin{vmatrix}z(y-x)&x(z-y)&xy\\\\x-y&y-z&z\\\\0&0&1\\end{vmatrix}$","$=2(x-y)(y-z)\\begin{vmatrix}-z&-x\\\\1&1\\end{vmatrix}=2(x-y)(y-z)(x-z)$ ∎"],"ans":"$2(x-y)(y-z)(x-z)$","id":"T9Q2","label":"T9 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":3,"topic":"jacob","sub":"3x3 at a point","text":"If $u=x^2+3y^2-z^3,\\;v=4x^2yz$ and $w=2z^2-xy$. then evaluate $\\dfrac{\\partial(x,y,z)}{\\partial(u,v,w)}$ at (1, -1, 0)","pyq":"D2A","note":"PYQ Oct-2025 Q2A uses the point (1, 1, 0); the tutorial uses (1, −1, 0) - the answer changes.","steps":["$J=\\begin{vmatrix}2x&6y&-3z^2\\\\8xyz&4x^2z&4x^2y\\\\-y&-x&4z\\end{vmatrix}$","At $(1,-1,0)$: $\\begin{vmatrix}2&-6&0\\\\0&0&-4\\\\1&-1&0\\end{vmatrix}=2(0-4)+6(0+4)=16$","$\\frac{\\partial(x,y,z)}{\\partial(u,v,w)}=\\frac1{16}$"],"ans":"$\\dfrac1{16}$ (at (1, 1, 0) it is $-\\frac1{16}$)","id":"T9Q3","label":"T9 Q3","rel":"similar","pri":"P2","why":"Same matrix/result as a PYQ with a small change."},{"t":9,"n":4,"topic":"jacob","sub":"Verify JJ' = 1","text":"Calculate $J=\\dfrac{\\partial(u,v)}{\\partial(x,y)}$ and $J^*=\\dfrac{\\partial(x,y)}{\\partial(u,v)}$ verify that $J.J^*=1$ given $u=x+\\dfrac{y^2}{x},\\;v=\\dfrac{y^2}{x}$","pyq":"C1B","id":"T9Q4","label":"T9 Q4","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":9,"n":5,"topic":"funcdep","sub":"Test & find relation","text":"Determine which of the following functions are functionally dependent. Find a functional relation between them in case they are functionally dependent. (i) $u=e^x\\sin y,\\;v=e^x\\cos y$. (ii) $u=\\dfrac xy$ and $v=\\dfrac{x+y}{x-y}$","steps":["(i) $J=\\begin{vmatrix}e^x\\sin y&e^x\\cos y\\\\e^x\\cos y&-e^x\\sin y\\end{vmatrix}=-e^{2x}\\neq0\\Rightarrow$ independent","(ii) $J=\\begin{vmatrix}\\frac1y&-\\frac x{y^2}\\\\\\frac{-2y}{(x-y)^2}&\\frac{2x}{(x-y)^2}\\end{vmatrix}=\\frac{2x}{y(x-y)^2}-\\frac{2x}{y(x-y)^2}=0\\Rightarrow$ dependent","Relation: divide by $y$: $v=\\frac{x/y+1}{x/y-1}=\\frac{u+1}{u-1}$"],"ans":"(i) independent; (ii) dependent, $v=\\dfrac{u+1}{u-1}$","id":"T9Q5","label":"T9 Q5","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":9,"n":6,"topic":"funcdep","sub":"Three functions","text":"If $u=x+y+z,\\;v=x^2+y^2+z^2,\\;w=xy+yz+zx$, examine whether $u,v,w$ are functionally dependent. If so, find the relation between them","steps":["$J=\\begin{vmatrix}1&1&1\\\\2x&2y&2z\\\\y+z&x+z&x+y\\end{vmatrix}$; $R_3\\to R_3+\\tfrac12R_2$ gives $R_3=(x+y+z)(1,1,1)$, proportional to $R_1$","$J=0\\Rightarrow$ functionally dependent","$(x+y+z)^2=x^2+y^2+z^2+2(xy+yz+zx)$"],"ans":"Dependent: $u^2=v+2w$","id":"T9Q6","label":"T9 Q6","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":9,"n":7,"topic":"maxmin","sub":"Minimum value","text":"Show that the minimum value of $f(x,y)=xy+a^3\\left(\\dfrac1x+\\dfrac1y\\right)$ is $3a^2$.","steps":["$f_x=y-\\frac{a^3}{x^2}=0,\\;f_y=x-\\frac{a^3}{y^2}=0\\Rightarrow x=y=a$","$r=\\frac{2a^3}{x^3}=2,\\;s=1,\\;t=\\frac{2a^3}{y^3}=2$ at $(a,a)$","$rt-s^2=3>0,\\;r>0\\Rightarrow$ minimum","$f(a,a)=a^2+a^3\\cdot\\frac2a=3a^2$ ∎"],"ans":"$f_{\\min}=3a^2$ at $(a,a)$ (for $a>0$)","id":"T9Q7","label":"T9 Q7","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":8,"topic":"maxmin","sub":"Single point","text":"Examine the following function for the extreme values $f(x,y)=xy-x^2-y^2-2x-2y+4$","steps":["$f_x=y-2x-2=0,\\;f_y=x-2y-2=0\\Rightarrow(-2,-2)$","$r=-2,\\;s=1,\\;t=-2\\Rightarrow rt-s^2=3>0,\\;r<0$","Maximum; $f(-2,-2)=4-4-4+4+4+4=8$"],"ans":"Maximum value 8 at $(-2,-2)$","id":"T9Q8","label":"T9 Q8","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":9,"topic":"maxmin","sub":"Four points","text":"Discuss the maxima and minima of $f(x,y)=x^3+3xy^2-3x^2-3y^2+7$","steps":["$f_x=3x^2+3y^2-6x=0,\\;f_y=6xy-6y=0\\Rightarrow y=0$ or $x=1$","Points: $(0,0),(2,0),(1,1),(1,-1)$; $r=6x-6,\\;s=6y,\\;t=6x-6$","$(0,0)$: $r=-6,rt-s^2=36>0\\Rightarrow$ max, $f=7$","$(2,0)$: $r=6,rt-s^2=36>0\\Rightarrow$ min, $f=3$","$(1,\\pm1)$: $rt-s^2=-36<0\\Rightarrow$ saddle"],"ans":"Max 7 at (0,0); min 3 at (2,0)","id":"T9Q9","label":"T9 Q9","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":10,"topic":"maxmin","sub":"With parameter a","text":"Find the maxima and minima values of $f(x,y)=x^3+y^3-3axy,\\;a>0$","steps":["$f_x=3x^2-3ay=0,\\;f_y=3y^2-3ax=0\\Rightarrow(0,0),(a,a)$","$r=6x,\\;s=-3a,\\;t=6y$","$(0,0)$: $rt-s^2=-9a^2<0\\Rightarrow$ saddle","$(a,a)$: $rt-s^2=27a^2>0,\\;r=6a>0\\Rightarrow$ minimum $f=-a^3$"],"ans":"Minimum $-a^3$ at $(a,a)$; no maximum","id":"T9Q10","label":"T9 Q10","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":11,"topic":"maxmin","sub":"Two points","text":"Find the Extreme Values of $f(x,y)=3y^2-2y^3-3x^2+6xy$","steps":["$f_x=-6x+6y=0\\Rightarrow x=y$; $f_y=6y-6y^2+6x=0\\Rightarrow12y-6y^2=0\\Rightarrow y=0,2$","Points $(0,0),(2,2)$; $r=-6,\\;s=6,\\;t=6-12y$","$(0,0)$: $t=6$, $rt-s^2=-72<0\\Rightarrow$ saddle","$(2,2)$: $t=-18$, $rt-s^2=72>0,\\;r<0\\Rightarrow$ maximum, $f=12-16-12+24=8$"],"ans":"Maximum value 8 at $(2,2)$","id":"T9Q11","label":"T9 Q11","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":10,"n":1,"topic":"duis1","sub":"Rule I","text":"Evaluate the integral $\\displaystyle\\int_0^\\infty\\frac{e^{-x}}{x}\\left(1-e^{-ax}\\right)dx,\\;(a>-1)$.","steps":["$I(a)=\\int_0^\\infty\\frac{e^{-x}-e^{-(1+a)x}}{x}dx$","$I'(a)=\\int_0^\\infty e^{-(1+a)x}dx=\\frac1{1+a}$","$I=\\log(1+a)+c$; $a=0\\Rightarrow I=0\\Rightarrow c=0$"],"ans":"$\\log(1+a)$","id":"T10Q1","label":"T10 Q1","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":2,"topic":"duis1","sub":"Rule I","text":"Show that, $\\displaystyle\\int_0^1\\frac{x^a-1}{\\log x}dx=\\log(a+1),\\;a\\ge0$.","steps":["$I'(a)=\\int_0^1\\frac{x^a\\log x}{\\log x}dx=\\int_0^1x^adx=\\frac{1}{a+1}$","$I=\\log(a+1)+c$; $a=0\\Rightarrow I=0\\Rightarrow c=0$ ∎"],"ans":"$\\log(a+1)$","id":"T10Q2","label":"T10 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":3,"topic":"duis1","sub":"Rule I","text":"Prove that $\\displaystyle\\int_0^1\\frac{x^a-x^b}{\\log x}dx=\\log\\left(\\frac{a+1}{b+1}\\right),\\;a,b>0$.","steps":["$\\frac{x^a-x^b}{\\log x}=\\frac{x^a-1}{\\log x}-\\frac{x^b-1}{\\log x}$","By Q2: $\\log(a+1)-\\log(b+1)$ (or let $I(a)$, $I'(a)=\\frac1{a+1}$, $I(b)=0$)"],"ans":"$\\log\\frac{a+1}{b+1}$","id":"T10Q3","label":"T10 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":4,"topic":"duis1","sub":"Frullani","text":"Show that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\left(\\frac ba\\right),\\;a,b>0$.","pyq":"C3A","note":"Also asked as TA-II Oct-2025 Q3A (D3A).","id":"T10Q4","label":"T10 Q4","rel":"exact","pyq2":"D3A","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":10,"n":5,"topic":"duis1","sub":"Rule I + deduction","text":"Prove that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}\\sin x}{x}dx=\\cot^{-1}(a)$ and hence deduce that $\\displaystyle\\int_0^\\infty\\left(\\frac{\\sin x}{x}\\right)dx=\\frac\\pi2$.","steps":["$I'(a)=-\\int_0^\\infty e^{-ax}\\sin x\\,dx=-\\frac{1}{1+a^2}$","$I=-\\tan^{-1}a+c$; as $a\\to\\infty$, $I\\to0\\Rightarrow c=\\frac\\pi2$","$I=\\frac\\pi2-\\tan^{-1}a=\\cot^{-1}a$","Put $a=0$: $\\int_0^\\infty\\frac{\\sin x}{x}dx=\\cot^{-1}0=\\frac\\pi2$"],"ans":"$\\cot^{-1}a$; $\\pi/2$","id":"T10Q5","label":"T10 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":6,"topic":"duis1","sub":"Rule I","text":"Evaluate $\\displaystyle\\int_0^\\infty\\frac{\\log(1+bx^2)}{x^2}dx$","steps":["$I'(b)=\\int_0^\\infty\\frac{x^2}{x^2(1+bx^2)}dx=\\int_0^\\infty\\frac{dx}{1+bx^2}=\\frac{\\pi}{2\\sqrt b}$","$I=\\pi\\sqrt b+c$; $b=0\\Rightarrow I=0\\Rightarrow c=0$"],"ans":"$\\pi\\sqrt b\\;(b>0)$","id":"T10Q6","label":"T10 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":7,"topic":"duis2","sub":"Leibnitz rule","text":"If $f(x)=\\displaystyle\\int_0^x(x-t)^2G(t)dt$ then Show that $\\dfrac{d^3f}{dx^3}-2G(x)=0$","pyq":"D4A","id":"T10Q7","label":"T10 Q7","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":10,"n":8,"topic":"duis2","sub":"Leibnitz rule","text":"If $y=\\displaystyle\\int_0^xf(t)\\sin a(x-t)\\,dt$, then show that $\\dfrac{d^2y}{dx^2}+a^2y=af(x)$","pyq":"C4A","id":"T10Q8","label":"T10 Q8","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":10,"n":9,"topic":"duis2","sub":"Variable limits","text":"Show that $\\varphi(a)=\\displaystyle\\int_{\\pi/6a}^{\\pi/2a}\\frac{\\sin ax}{x}dx$ is independent of $a$","steps":["Leibnitz: $\\varphi'(a)=\\int\\cos ax\\,dx+\\frac{\\sin(\\pi/2)}{\\pi/2a}\\left(-\\frac{\\pi}{2a^2}\\right)-\\frac{\\sin(\\pi/6)}{\\pi/6a}\\left(-\\frac{\\pi}{6a^2}\\right)$","$\\int_{\\pi/6a}^{\\pi/2a}\\cos ax\\,dx=\\frac{1-\\frac12}{a}=\\frac1{2a}$; boundary terms $=-\\frac1a+\\frac1{2a}$","$\\varphi'(a)=\\frac1{2a}-\\frac1a+\\frac1{2a}=0\\Rightarrow\\varphi$ independent of $a$ (also: put $t=ax$ to get $\\int_{\\pi/6}^{\\pi/2}\\frac{\\sin t}{t}dt$)"],"ans":"$\\varphi'(a)=0$","id":"T10Q9","label":"T10 Q9","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":11,"n":1,"topic":"erf","sub":"Finite limits","text":"Show that $\\displaystyle\\int_a^be^{-x^2}dx=\\frac{\\sqrt\\pi}{2}\\left[erf(b)-erf(a)\\right]$.","pyq":"C3B","id":"T11Q1","label":"T11 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":11,"n":2,"topic":"erf","sub":"Complete the square","text":"Show that $\\displaystyle\\int_0^\\infty e^{-x^2-2bx}dx=\\frac{\\sqrt\\pi}{2}.e^{b^2}\\left[1-erf(b)\\right]$.","pyq":"D3B","note":"PYQ Oct-2025 Q3B is the same result written with erfc(a) = 1 − erf(a).","steps":["$-x^2-2bx=-(x+b)^2+b^2$","Put $x+b=t$: $e^{b^2}\\int_b^\\infty e^{-t^2}dt=e^{b^2}\\frac{\\sqrt\\pi}{2}\\text{erfc}(b)$","$\\text{erfc}(b)=1-\\text{erf}(b)$ ∎"],"ans":"$\\frac{\\sqrt\\pi}{2}e^{b^2}[1-\\text{erf}(b)]$","id":"T11Q2","label":"T11 Q2","rel":"similar","pri":"P1","why":"Same matrix/result as a PYQ with a small change."},{"t":11,"n":3,"topic":"erf","sub":"Substitution","text":"If $\\alpha(x)=\\sqrt{\\dfrac2\\pi}\\displaystyle\\int_0^xe^{\\left(-\\frac{t^2}{2}\\right)}dt$ then Prove that $erf(x)=\\alpha\\left[x\\sqrt2\\right]$.","steps":["Put $t=\\sqrt2\\,u$, $dt=\\sqrt2\\,du$: $\\alpha(x)=\\sqrt{\\frac2\\pi}\\sqrt2\\int_0^{x/\\sqrt2}e^{-u^2}du=\\frac{2}{\\sqrt\\pi}\\int_0^{x/\\sqrt2}e^{-u^2}du$","$\\alpha(x)=\\text{erf}\\left(\\frac{x}{\\sqrt2}\\right)\\Rightarrow\\alpha(x\\sqrt2)=\\text{erf}(x)$ ∎"],"ans":"As required","id":"T11Q3","label":"T11 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":11,"n":4,"topic":"erf","sub":"Definitions","text":"Define Error function and Complementary Error function and hence, Prove that $\\text{erf}_c(-x)+\\text{erf}_c(x)=2.$","pyq":"D4B","id":"T11Q4","label":"T11 Q4","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":11,"n":5,"topic":"erf","sub":"Derivatives","text":"Prove that $\\dfrac1x\\dfrac{d}{da}\\text{erf}_c(ax)=-\\dfrac1a\\dfrac{d}{dx}\\text{erf}(ax)$","steps":["$\\text{erfc}(ax)=\\frac2{\\sqrt\\pi}\\int_{ax}^\\infty e^{-u^2}du\\Rightarrow\\frac{d}{da}\\text{erfc}(ax)=-\\frac{2}{\\sqrt\\pi}e^{-a^2x^2}\\cdot x$","LHS $=-\\frac2{\\sqrt\\pi}e^{-a^2x^2}$","$\\frac{d}{dx}\\text{erf}(ax)=\\frac{2a}{\\sqrt\\pi}e^{-a^2x^2}\\Rightarrow$ RHS $=-\\frac2{\\sqrt\\pi}e^{-a^2x^2}$ ∎"],"ans":"Both sides = −2e^{−a²x²}/√π","id":"T11Q5","label":"T11 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":11,"n":6,"topic":"erf","sub":"Derivatives","text":"Prove that $\\dfrac{d}{dx}[\\text{erf}(x)]=\\dfrac2{\\sqrt\\pi}e^{-x^2}$ and use it to show $\\dfrac{d}{dx}[\\text{erf}(ax^n)]=\\dfrac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}$","pyq":"C4B","id":"T11Q6","label":"T11 Q6","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":11,"n":7,"topic":"erf","sub":"Odd property","text":"Prove that erf $(x)$ is an odd function and hence, Prove that $\\text{erf}_c(-x)-\\text{erf}(x)=1.$","steps":["$\\text{erf}(-x)=\\frac2{\\sqrt\\pi}\\int_0^{-x}e^{-u^2}du$; put $u=-v$: $=-\\frac2{\\sqrt\\pi}\\int_0^xe^{-v^2}dv=-\\text{erf}(x)$ (odd)","$\\text{erfc}(-x)=1-\\text{erf}(-x)=1+\\text{erf}(x)$","$\\text{erfc}(-x)-\\text{erf}(x)=1$ ∎"],"ans":"= 1","id":"T11Q7","label":"T11 Q7","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":12,"n":1,"topic":"curve","sub":"Cartesian (witch-type)","plot":"agnesi","text":"Trace the curve $xy^2=4a^2(a-x)$ where $a>0$","steps":["<b>Symmetry:<\/b> only even powers of $y$ $\\Rightarrow$ symmetric about the x-axis","<b>Origin:<\/b> not on the curve ($0\\neq4a^3$)","<b>Intercepts:<\/b> $y=0\\Rightarrow x=a$: point $(a,0)$; tangent there is vertical ($x=a$)","<b>Asymptote:<\/b> $y^2=\\frac{4a^2(a-x)}{x}\\to\\infty$ as $x\\to0^+$ $\\Rightarrow$ the y-axis $x=0$ is an asymptote","<b>Region:<\/b> $y^2\\ge0\\Rightarrow0<x\\le a$; no curve for $x>a$ or $x<0$","As $x$ decreases from $a$ to 0, $|y|$ increases from 0 to $\\infty$"],"ans":"Two branches from (a, 0) rising to ±∞ along the y-axis","id":"T12Q1","label":"T12 Q1","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":2,"topic":"curve","sub":"Cartesian (cissoid)","plot":"cissoid","text":"Trace the curve $y^2(2a-x)=x^3$ where $a>0$","steps":["<b>Symmetry:<\/b> about the x-axis (even powers of $y$)","<b>Origin:<\/b> on the curve; lowest-degree terms $2ay^2=0\\Rightarrow y=0$ twice $\\Rightarrow$ cusp at the origin, tangent along the x-axis","<b>Asymptote:<\/b> coefficient of $y^2$: $2a-x=0\\Rightarrow x=2a$","<b>Region:<\/b> $y^2=\\frac{x^3}{2a-x}\\ge0\\Rightarrow0\\le x<2a$","<b>Intercepts:<\/b> only the origin"],"ans":"Cissoid: cusp at O, asymptote x = 2a","id":"T12Q2","label":"T12 Q2","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":3,"topic":"curve","sub":"Polar rose","plot":"r_cos2","text":"Trace the curve $r=a\\cos2\\theta$","steps":["$\\cos2\\theta$ even in $\\theta\\Rightarrow$ symmetric about the initial line; also about $\\theta=\\pi/2$","$n=2$ (even) $\\Rightarrow2n=4$ equal loops (petals), each of length $a$","Petal tips ($r=\\pm a$) at $\\theta=0,\\frac\\pi2,\\pi,\\frac{3\\pi}2$","$r=0$ at $\\theta=\\frac\\pi4,\\frac{3\\pi}4,\\dots$ - the tangents at the pole"],"ans":"Four-leaved rose along the axes","id":"T12Q3","label":"T12 Q3","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":4,"topic":"curve","sub":"Polar rose","plot":"r_cos3","text":"Trace the curve $r=a\\cos3\\theta$","steps":["Symmetric about the initial line ($\\cos$ is even)","$n=3$ (odd) $\\Rightarrow3$ petals of length $a$","Petal tips at $\\theta=0,\\frac{2\\pi}3,\\frac{4\\pi}3$","$r=0$ at $\\theta=\\frac\\pi6,\\frac\\pi2,\\frac{5\\pi}6$ (tangents at the pole)"],"ans":"Three-leaved rose, one petal along the initial line","id":"T12Q4","label":"T12 Q4","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":5,"topic":"curve","sub":"Polar rose","plot":"r_sin3","text":"Trace the curve $r=a\\sin3\\theta$","steps":["Symmetric about $\\theta=\\pi/2$","$n=3$ (odd) $\\Rightarrow3$ petals of length $a$","Petal tips at $\\theta=\\frac\\pi6,\\frac{5\\pi}6,\\frac{3\\pi}2$","$r=0$ at $\\theta=0,\\frac\\pi3,\\frac{2\\pi}3$"],"ans":"Three-leaved rose, one petal pointing down the y-axis","id":"T12Q5","label":"T12 Q5","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":6,"topic":"curve","sub":"Polar rose","plot":"r_sin2","text":"Trace the curve $r=a\\sin2\\theta$","steps":["Symmetric about the pole and the line $\\theta=\\pi/4$","$n=2\\Rightarrow4$ petals of length $a$","Petal tips at $\\theta=\\frac\\pi4,\\frac{3\\pi}4,\\frac{5\\pi}4,\\frac{7\\pi}4$","$r=0$ at $\\theta=0,\\frac\\pi2,\\pi,\\frac{3\\pi}2$"],"ans":"Four-leaved rose between the axes","id":"T12Q6","label":"T12 Q6","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":13,"n":1,"topic":"dint","sub":"Iterated integral","text":"Evaluate $\\displaystyle\\int_0^1\\int_0^{1-x}(x+y)\\,dy\\,dx$","steps":["Inner: $\\left[xy+\\frac{y^2}{2}\\right]_0^{1-x}=x(1-x)+\\frac{(1-x)^2}{2}=\\frac{1-x^2}{2}$","Outer: $\\frac12\\int_0^1(1-x^2)dx=\\frac12\\cdot\\frac23$"],"ans":"$\\frac13$","id":"T13Q1","label":"T13 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":2,"topic":"dint","sub":"Iterated integral","text":"Evaluate $\\displaystyle\\int_0^1\\int_0^{\\sqrt{1+x^2}}\\frac{dy\\,dx}{1+x^2+y^2}$","steps":["Inner, with $p^2=1+x^2$: $\\int_0^{p}\\frac{dy}{p^2+y^2}=\\frac1p\\tan^{-1}1=\\frac{\\pi}{4\\sqrt{1+x^2}}$","Outer: $\\frac\\pi4\\int_0^1\\frac{dx}{\\sqrt{1+x^2}}=\\frac\\pi4\\left[\\log(x+\\sqrt{1+x^2})\\right]_0^1$"],"ans":"$\\frac\\pi4\\log(1+\\sqrt2)\\approx0.692$","id":"T13Q2","label":"T13 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":3,"topic":"dint","sub":"Iterated integral","text":"Evaluate $\\displaystyle\\int_0^5\\int_0^{x^2}x(x^2+y^2)\\,dx\\,dy$","note":"The inner limit $x^2$ depends on $x$, so the inner integration must be in $y$ (i.e. read it as $dy\\,dx$).","steps":["Inner in $y$: $x\\left[x^2y+\\frac{y^3}{3}\\right]_0^{x^2}=x^5+\\frac{x^7}{3}$","Outer: $\\int_0^5\\left(x^5+\\frac{x^7}3\\right)dx=\\frac{5^6}{6}+\\frac{5^8}{24}=\\frac{15625}{6}+\\frac{390625}{24}$"],"ans":"$\\frac{453125}{24}\\approx18880.2$","id":"T13Q3","label":"T13 Q3","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":4,"topic":"dint","sub":"Region between curves","text":"Evaluate $\\iint_Ry\\,dx\\,dy$ over the area bounded by $y=x^2$ and $x+y=2$","steps":["Intersections: $x^2=2-x\\Rightarrow x=-2,1$; for each $x$, $y$ from $x^2$ to $2-x$","$\\int_{-2}^1\\left[\\frac{y^2}{2}\\right]_{x^2}^{2-x}dx=\\frac12\\int_{-2}^1\\left[(2-x)^2-x^4\\right]dx$","$=\\frac12\\left(21-\\frac{33}{5}\\right)$"],"ans":"$\\frac{36}{5}$","id":"T13Q4","label":"T13 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":5,"topic":"dint","sub":"Region between curves","text":"Evaluate $\\iint_Rxy\\,dx\\,dy$ over the area bounded by $x$ axis, ordinate $x=2$ and parabola $x^2=4y$","steps":["Region: $0\\le x\\le2,\\;0\\le y\\le\\frac{x^2}{4}$","$\\int_0^2x\\left[\\frac{y^2}{2}\\right]_0^{x^2/4}dx=\\int_0^2\\frac{x^5}{32}dx=\\frac{64}{192}$"],"ans":"$\\frac13$","id":"T13Q5","label":"T13 Q5","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":6,"topic":"dint","sub":"Infinite region","text":"Evaluate $\\iint_R\\dfrac{dx\\,dy}{x^4+y^2}$ over $x\\ge1,\\;y\\ge x^2$","steps":["Inner: $\\int_{x^2}^\\infty\\frac{dy}{x^4+y^2}=\\frac1{x^2}\\left[\\tan^{-1}\\frac{y}{x^2}\\right]_{x^2}^\\infty=\\frac1{x^2}\\left(\\frac\\pi2-\\frac\\pi4\\right)$","Outer: $\\frac\\pi4\\int_1^\\infty\\frac{dx}{x^2}=\\frac\\pi4$"],"ans":"$\\frac\\pi4$","id":"T13Q6","label":"T13 Q6","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":1,"topic":"tint","sub":"Iterated triple","text":"Evaluate $\\displaystyle\\int_0^2\\int_0^x\\int_0^{2x+2y}e^{x+y+z}\\,dx\\,dy\\,dz$","note":"The limits fix the order: innermost z (0 to 2x+2y), then y (0 to x), then x (0 to 2).","steps":["$\\int_0^{2x+2y}e^{x+y+z}dz=e^{3x+3y}-e^{x+y}$","$\\int_0^x\\left(e^{3x+3y}-e^{x+y}\\right)dy=\\frac{e^{6x}}3-\\frac{e^{3x}}3-e^{2x}+e^x$","$\\int_0^2(\\cdot)\\,dx=\\frac{e^{12}}{18}-\\frac{e^6}{9}-\\frac{e^4}{2}+e^2-\\left(\\frac1{18}-\\frac19-\\frac12+1\\right)$"],"ans":"$\\frac{e^{12}}{18}-\\frac{e^6}{9}-\\frac{e^4}{2}+e^2-\\frac49$","id":"T14Q1","label":"T14 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":2,"topic":"tint","sub":"Tetrahedron","text":"Evaluate $\\displaystyle\\int_0^1\\int_0^{1-x}\\int_0^{1-x-y}dx\\,dy\\,dz$","steps":["Innermost (z): $1-x-y$","$\\int_0^{1-x}(1-x-y)dy=\\frac{(1-x)^2}{2}$","$\\int_0^1\\frac{(1-x)^2}{2}dx=\\frac16$ (volume of the unit tetrahedron)"],"ans":"$\\frac16$","id":"T14Q2","label":"T14 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":3,"topic":"tint","sub":"Iterated triple","text":"Evaluate $\\displaystyle\\int_{-1}^1\\int_0^z\\int_{x-z}^{x+z}(x+y+z)\\,dx\\,dy\\,dz$","note":"Limits fix the order: innermost y (x−z to x+z), then x (0 to z), then z (−1 to 1).","steps":["$\\int_{x-z}^{x+z}(x+y+z)dy=(x+z)(2z)+\\frac{(x+z)^2-(x-z)^2}{2}=4xz+2z^2$","$\\int_0^z(4xz+2z^2)dx=2z^3+2z^3=4z^3$","$\\int_{-1}^14z^3dz=0$ (odd integrand)"],"ans":"0","id":"T14Q3","label":"T14 Q3","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":4,"topic":"tint","sub":"Iterated triple","text":"Evaluate $\\displaystyle\\int_0^2\\int_{y^2}^1\\int_0^{1-x}x\\,dz\\,dx\\,dy$","note":"As printed, the outer limit is 0 to 2, but then $x$ runs from $y^2$ up to 1 only when $y\\le1$. The standard textbook version uses $\\int_0^1$; both values are given.","steps":["$\\int_0^{1-x}x\\,dz=x(1-x)$","$\\int_{y^2}^1(x-x^2)dx=\\frac16-\\frac{y^4}{2}+\\frac{y^6}{3}$","With $y$ from 0 to 1: $\\frac16-\\frac1{10}+\\frac1{21}=\\frac{4}{35}$","With $y$ from 0 to 2 (literal): $\\frac13-\\frac{16}5+\\frac{128}{21}=\\frac{113}{35}$"],"ans":"$\\frac4{35}$ (for $0\\le y\\le1$); literal limits give $\\frac{113}{35}$","id":"T14Q4","label":"T14 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":1,"topic":"areavol","sub":"Area between curves","text":"Find the area bounded by the parabola $y=x^2$ and the line $y=x$","steps":["Intersections $x=0,1$; $A=\\int_0^1\\int_{x^2}^{x}dy\\,dx$","$=\\int_0^1(x-x^2)dx=\\frac12-\\frac13$"],"ans":"$\\frac16$ sq. units","id":"T15Q1","label":"T15 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":2,"topic":"areavol","sub":"Area of half ellipse","text":"Find the area bounded by the ellipse $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1$, above x-axis","steps":["$A=\\int_{-a}^{a}\\int_0^{\\frac ba\\sqrt{a^2-x^2}}dy\\,dx=\\frac ba\\int_{-a}^a\\sqrt{a^2-x^2}\\,dx$","$\\int_{-a}^a\\sqrt{a^2-x^2}dx=\\frac{\\pi a^2}{2}$ (half-circle)"],"ans":"$\\frac{\\pi ab}{2}$ sq. units","id":"T15Q2","label":"T15 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":3,"topic":"areavol","sub":"Area between curves","text":"Find the area bounded by the parabola $y=x^2$ and the line $y=2x+3$","steps":["$x^2=2x+3\\Rightarrow x=-1,3$","$A=\\int_{-1}^3(2x+3-x^2)dx=\\left[x^2+3x-\\frac{x^3}3\\right]_{-1}^3=9-\\left(-\\frac53\\right)$"],"ans":"$\\frac{32}{3}$ sq. units","id":"T15Q3","label":"T15 Q3","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":4,"topic":"areavol","sub":"Volume by triple integral","text":"Prove that the volume bounded by the cylinders $y^2=x,\\;x^2=y$ and the plane $z=0,\\;x+y+z=2$ is $\\frac{11}{30}$","steps":["Base region: $0\\le x\\le1,\\;x^2\\le y\\le\\sqrt x$; height $z$ from 0 to $2-x-y$","$V=\\int_0^1\\int_{x^2}^{\\sqrt x}(2-x-y)\\,dy\\,dx$","$=\\int_0^1\\left[2\\sqrt x-x^{3/2}-\\frac x2-2x^2+x^3+\\frac{x^4}{2}\\right]dx=\\frac43-\\frac25-\\frac14-\\frac23+\\frac14+\\frac1{10}$"],"ans":"$\\frac{11}{30}$ cubic units","id":"T15Q4","label":"T15 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":5,"topic":"areavol","sub":"Volume (polar)","text":"Find the volume of the region enclosed by the cone $z=\\sqrt{x^2+y^2}$ and the paraboloid $z=x^2+y^2$","steps":["Surfaces meet where $r=r^2\\Rightarrow r=1$; for $0\\le r\\le1$, $r^2\\le z\\le r$","$V=\\int_0^{2\\pi}\\int_0^1(r-r^2)\\,r\\,dr\\,d\\theta$","$=2\\pi\\left(\\frac13-\\frac14\\right)$"],"ans":"$\\frac{\\pi}{6}$ cubic units","id":"T15Q5","label":"T15 Q5","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":6,"topic":"areavol","sub":"Volume of tetrahedron","text":"Find the volume of the tetrahedron bounded by the co-ordinate planes and the plane $\\dfrac xa+\\dfrac yb+\\dfrac zc=1$","steps":["$V=\\int_0^a\\int_0^{b(1-x/a)}c\\left(1-\\frac xa-\\frac yb\\right)dy\\,dx$","Inner: $\\frac{bc}{2}\\left(1-\\frac xa\\right)^2$","$\\int_0^a\\frac{bc}{2}\\left(1-\\frac xa\\right)^2dx=\\frac{bc}{2}\\cdot\\frac a3$"],"ans":"$\\frac{abc}{6}$ cubic units","id":"T15Q6","label":"T15 Q6","pri":"P2","why":"Topic priority P2 (Prepare next)."}],"TUT_TITLES":{"1":"Eigen Values and Eigen Vectors","2":"Diagonalization of Matrix","3":"LU Decomposition method / Cholesky's method","4":"Formation of Differential Equation","5":"Exact Differential Equation / Equation Reducible to Exact Differential Equations","6":"Linear Differential Equation / Applications of Differential Equations: Growth and Decay","7":"Direct Partial Differentiation","8":"Euler's Theorem","9":"Jacobian / Maxima and Minima","10":"Differentiation under Integral Sign (Rule-I) / (Rule-II)","11":"Error Function","12":"Curve Tracing","13":"Double Integration","14":"Triple Integration","15":"Applications of Double Integration: Area / Applications of Triple Integration: Volume"},"FILES":[{"path":"PPT/UNIT-I Linear Algebra.pdf","kind":"Slides","pages":20,"status":"Analysed (text layer)","note":"23ASH1109 MFC-III, Unit I Linear Algebra (AY 2024-25): eigenvalues/vectors, diagonalization, LU, Cholesky, PCA. Contains 4 of the 8 TA-I Linear-Algebra PYQs word-for-word."},{"path":"PPT/UNIT-II.pdf","kind":"Slides","pages":20,"status":"Analysed (text layer)","note":"Unit II Differential Equations: order/degree, formation, VS/homogeneous, exact, reducible to exact (IF Rule I & II), linear, growth & decay. Bernoulli is listed in the syllabus slide but no worked content is given. Contains all 8 TA-I DE PYQs (examples or exercises)."},{"path":"PPT/UNIT III.pdf","kind":"Slides","pages":39,"status":"Not Mathematics - excluded","note":"This file is a DBMS deck (23CSE2022 Database Management Systems, Unit III Da pdf","marks":20}],"UNITS":[{"id":"U1","name":"Unit I - Linear Algebra","short":"Linear Algebra","src":"PPT/UNIT-I Linear Algebra.pdf + Tutorials 1-3","exam":"TA-I","tuts":"T1-T3","map":"Confirmed (Unit I slide deck)"},{"id":"U2","name":"Unit II - Differential Equations","short":"Differential Eqns","src":"PPT/UNIT-II.pdf + Tutorials 4-6","exam":"TA-I","tuts":"T4-T6","map":"Confirmed (Unit II slide deck)"},{"id":"PD","name":"Partial Differentiation & Applications (likely Unit III)","short":"Partial Diff.","src":"TA-II papers + Tutorials 7-9 (no slides in ZIP)","exam":"TA-II","tuts":"T7-T9","map":"Uncertain - inferred from the CO3 tag in TA-II 2025"},{"id":"IC","name":"DUIS & Error Function (likely Unit IV)","short":"DUIS & erf","src":"TA-II papers + Tutorials 10-11 (no slides in ZIP)","exam":"TA-II","tuts":"T10-T11","map":"Uncertain - inferred from the CO4 tag in TA-II 2025"},{"id":"MI","name":"Curve Tracing & Multiple Integrals (unit number not stated)","short":"Curves & Integrals","src":"Tutorials 12-15 only (no slides, no PYQs in ZIP)","exam":"not in your TA papers","tuts":"T12-T15","map":"Uncertain - no unit number in any file"}],"TOPICS":[{"id":"exact","unit":"U2","order":1,"pri":"P1","diff":"Easy","time":30,"name":"Exact Differential Equations","sub":"Test M_y = N_x, then the standard rule","explain":"An equation $M\\,dx+N\\,dy=0$ is <b>exact<\/b> when it is the total differential of some $u(x,y)$. The test is $\\dfrac{\\partial M}{\\partial y}=\\dfrac{\\partial N}{\\partial x}$. If it passes, integrate $M$ w.r.t. $x$ treating $y$ as constant, add the integral of only those terms of $N$ that do not contain $x$, and equate to $c$.","why":"Appeared in both TA-I papers (Q3A, 5 marks each). Both questions are copied word-for-word from your Unit II slides (Example 03 and Exercise 1). It is a 3-line method - the fastest 5 marks in the syllabus.","formulas":["F22","F23"],"qtypes":["Obtain the general solution of a given exact DE","Same with an initial condition (e.g. y(1)=0)","Check exactness first, then solve"],"example":{"q":"Solve $(x+y-2)\\,dx+(x-y+4)\\,dy=0$. <span class='src'>[Unit II slides, Exact Example 01]<\/span>","steps":["$M=x+y-2,\\;N=x-y+4$","$M_y=1,\\;N_x=1\\Rightarrow$ exact","$\\int M\\,dx\\;(y\\text{ const}) = \\frac{x^2}{2}+xy-2x$","Terms of $N$ free of $x$: $-y+4\\Rightarrow\\int(-y+4)\\,dy=-\\frac{y^2}{2}+4y$","$\\frac{x^2}{2}+xy-2x-\\frac{y^2}{2}+4y=c\\;\\Rightarrow\\;x^2-y^2+2xy-4x+8y=c_1$"]},"pyqs":["A3A","B3A"],"video":"v_exact"},{"id":"linear","unit":"U2","order":2,"pri":"P1","diff":"Easy","time":35,"name":"Linear Differential Equations (first order)","sub":"dy/dx + Py = Q, IF = e^(∫P dx)","explain":"Put the equation in the form $\\dfrac{dy}{dx}+Py=Q$ ($P,Q$ functions of $x$). Multiply by the integrating factor $\\text{IF}=e^{\\int P\\,dx}$; the left side becomes $\\dfrac{d}{dx}(y\\cdot\\text{IF})$, so $y\\cdot\\text{IF}=\\int Q\\cdot\\text{IF}\\,dx+c$. If $x$ appears only to the first power, treat it as linear in $x$: $\\dfrac{dx}{dy}+Px=Q$.","why":"Both TA-I papers (Q3B). Both are exercises 1 and 2 from your Unit II slides, verbatim. Very mechanical once you can divide to standard form.","formulas":["F26","F27","F32"],"qtypes":["Solve $(1+x^2)y'+y=e^{\\tan^{-1}x}$ type","Rearrange $x^2y'=3x^2-2xy+1$ to standard form","Linear in $x$: $(1+y^2)dx=(\\tan^{-1}y-x)dy$"],"example":{"q":"Solve $(1+y^2)\\,dx=(\\tan^{-1}y-x)\\,dy$. <span class='src'>[Unit II slides, Linear Example 02]<\/span>","steps":["Single term in $x$ $\\Rightarrow$ linear in $x$: $\\dfrac{dx}{dy}+\\dfrac{x}{1+y^2}=\\dfrac{\\tan^{-1}y}{1+y^2}$","$P=\\frac{1}{1+y^2}\\Rightarrow \\text{IF}=e^{\\tan^{-1}y}$","$x\\,e^{\\tan^{-1}y}=\\int e^{\\tan^{-1}y}\\dfrac{\\tan^{-1}y}{1+y^2}dy$; put $t=\\tan^{-1}y$","$=\\int t e^t\\,dt=e^t(t-1)+c$","$x=\\tan^{-1}y-1+c\\,e^{-\\tan^{-1}y}$"]},"pyqs":["A3B","B3B"],"video":"v_linear"},{"id":"form","unit":"U2","order":3,"pri":"P1","diff":"Easy","time":25,"name":"Formation of Differential Equations","sub":"Eliminate n arbitrary constants by differentiating n times","explain":"If a relation has $n$ arbitrary constants, differentiate it $n$ times and eliminate the constants from the $n+1$ equations. The result is a DE of order $n$. Trick: write the derivative so the original $y$ reappears (e.g. multiply by $x$ for $\\log x$ terms), or eliminate with a determinant.","why":"Both TA-I papers (Q4A). Set A is Unit II Example 02 (A, B swapped), Set B is Exercise 1, verbatim. Takes ~5 minutes in the exam.","formulas":["F21"],"qtypes":["$y=Ae^{m_1x}+Be^{m_2x}$ (answer: $y''-(m_1+m_2)y'+m_1m_2y=0$)","$y=A\\sin(\\log x)+B\\cos(\\log x)$","Curves: circles touching an axis, $Ax^2+By^2=1$"],"example":{"q":"Form the DE of $y=a e^{2x}+b e^{3x}$. <span class='src'>[Unit II slides, Example 04]<\/span>","steps":["$y_1=2ae^{2x}+3be^{3x}$","$y_2=4ae^{2x}+9be^{3x}$","$y_2-5y_1+6y=(4-10+6)ae^{2x}+(9-15+6)be^{3x}=0$","$\\dfrac{d^2y}{dx^2}-5\\dfrac{dy}{dx}+6y=0$"]},"pyqs":["A4A","B4A"],"video":"v_form"},{"id":"eig","unit":"U1","order":4,"pri":"P1","diff":"Medium","time":60,"name":"Eigenvalues & Eigenvectors","sub":"Characteristic equation, S1/S2 shortcut, Cramer's rule for vectors","explain":"$\\lambda$ is an eigenvalue of $A$ if $AX=\\lambda X$ for some non-zero $X$. Solve $|A-\\lambda I|=0$. For $3\\times3$ use $\\lambda^3-S_1\\lambda^2+S_2\\lambda-|A|=0$ with $S_1=$ trace and $S_2=$ sum of minors of the diagonal elements. For each $\\lambda$ solve $(A-\\lambda I)X=0$; with two independent rows use the cross-multiplication (Cramer) rule $\\frac{x}{|..|}=\\frac{-y}{|..|}=\\frac{z}{|..|}$.","why":"Q1A in both TA-I papers (5 marks each). Set B's matrix is Unit I Example 2 and Set A's matrix is Unit I Exercise 4 - both verbatim. It is also the prerequisite for Diagonalization (Q2A) and PCA.","formulas":["F1","F2","F3","F4","F5","F6","F7","F8","F9"],"qtypes":["3x3: find eigenvalues + eigenvector for the smallest/largest eigenvalue","2x2: eigenvalues and both eigenvectors","Use properties (trace, determinant, A^-1, A^m)"],"example":{"q":"Find eigenvalues and eigenvectors of $A=\\begin{bmatrix}14&-10\\\\5&-1\\end{bmatrix}$. <span class='src'>[Unit I slides, Example 1]<\/span>","steps":["$S_1=14+(-1)=13,\\;|A|=-14+50=36$","$\\lambda^2-13\\lambda+36=0\\Rightarrow(\\lambda-4)(\\lambda-9)=0\\Rightarrow\\lambda=4,9$","$\\lambda=4$: $\\begin{bmatrix}10&-10\\\\5&-5\\end{bmatrix}X=0\\Rightarrow x_1=x_2\\Rightarrow X_1=\\begin{bmatrix}1\\\\1\\end{bmatrix}$","$\\lambda=9$: $\\begin{bmatrix}5&-10\\\\5&-10\\end{bmatrix}X=0\\Rightarrow x_1=2x_2\\Rightarrow X_2=\\begin{bmatrix}2\\\\1\\end{bmatrix}$","Check: $4+9=13=S_1$, $4\\times9=36=|A|$ ✓"]},"pyqs":["A1A","B1A"],"video":"v_eig"},{"id":"diag","unit":"U1","order":5,"pri":"P1","diff":"Easy","time":30,"name":"Diagonalization of Matrices","sub":"P = [eigenvectors as columns], P⁻¹AP = D","explain":"$A$ ($n\\times n$) is diagonalizable iff it has $n$ linearly independent eigenvectors - guaranteed when the eigenvalues are distinct. Put the eigenvectors as the columns of $P$; then $P^{-1}AP=D=\\text{diag}(\\lambda_1,\\dots,\\lambda_n)$ in the same order.","why":"Q2A in both TA-I papers, always a 2x2 matrix. Set B's matrix is Unit I Diagonalization Exercise 2 verbatim. Short and safe once eigenvectors are done.","formulas":["F10","F11","F12"],"qtypes":["Show A is diagonalizable and find P such that P⁻¹AP is diagonal (2x2)","Decide if a triangular 3x3 matrix is diagonalizable"],"example":{"q":"Diagonalize $A=\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$. <span class='src'>[Unit I slides, Diagonalization Example 1]<\/span>","steps":["$\\lambda^2-2\\lambda-3=0\\Rightarrow\\lambda=3,-1$ (distinct $\\Rightarrow$ diagonalizable)","$\\lambda=3$: $-x_1+x_2=0\\Rightarrow v_1=(1,1)^T$; $\\lambda=-1$: $x_1+x_2=0\\Rightarrow v_2=(-1,1)^T$","$P=\\begin{bmatrix}1&-1\\\\1&1\\end{bmatrix},\\;P^{-1}=\\begin{bmatrix}1/2&1/2\\\\-1/2&1/2\\end{bmatrix}$","$P^{-1}AP=\\begin{bmatrix}3&0\\\\0&-1\\end{bmatrix}=D$"]},"pyqs":["A2A","B2A"],"video":"v_diag"},{"id":"chol","unit":"U1","order":6,"pri":"P1","diff":"Medium","time":35,"name":"Cholesky Method","sub":"A = LLᵀ for symmetric positive-definite A; LZ = B, LᵀX = Z","explain":"If $A$ is symmetric and positive definite, $A=LL^T$ with $L$ lower triangular. Compare entries column by column: $l_{11}=\\sqrt{a_{11}}$, then the first column, then $l_{22}$, $l_{32}$, $l_{33}$. Solve $LZ=B$ (forward substitution), then $L^TX=Z$ (back substitution).","why":"Q2B in both TA-I papers. Set A is Unit I Cholesky Example 2 word-for-word (answer $x=(0.6,1.2,0.4)$). Both papers' matrices give whole-number L - a sign you are on track.","formulas":["F15","F16","F14"],"qtypes":["Solve a 3x3 system by Cholesky","Decompose A = LLᵀ only"],"example":{"q":"Decompose $A=\\begin{bmatrix}2&-1&0\\\\-1&3&1\\\\0&1&2\\end{bmatrix}$ by Cholesky. <span class='src'>[Unit I slides, Cholesky Example 1]<\/span>","steps":["$l_{11}=\\sqrt2,\\;l_{21}=-1/\\sqrt2,\\;l_{31}=0$","$l_{22}=\\sqrt{3-\\tfrac12}=\\sqrt{5/2}$","$l_{32}=\\dfrac{1-l_{21}l_{31}}{l_{22}}=\\dfrac{1}{\\sqrt{5/2}}=\\sqrt{2/5}$","$l_{33}=\\sqrt{2-0-\\tfrac25}=\\sqrt{8/5}$","$L=\\begin{bmatrix}\\sqrt2&0&0\\\\-\\tfrac{1}{\\sqrt2}&\\sqrt{\\tfrac52}&0\\\\0&\\sqrt{\\tfrac25}&\\sqrt{\\tfrac85}\\end{bmatrix}$"]},"pyqs":["A2B","B2B"],"video":"v_chol"},{"id":"duis1","unit":"IC","order":7,"pri":"P1","diff":"Medium","time":30,"name":"DUIS Rule I (constant limits) - Frullani-type integral","sub":"Differentiate w.r.t. the parameter, integrate back, fix the constant","explain":"For constant limits, $\\dfrac{d}{d\\alpha}\\int_a^b f(x,\\alpha)\\,dx=\\int_a^b\\dfrac{\\partial f}{\\partial\\alpha}dx$. Strategy: call the integral $I(\\alpha)$, differentiate under the sign so the awkward $\\tfrac1x$ cancels, integrate the easy result, then find the constant from a special value of $\\alpha$ (where $I$ is known, e.g. $I=0$).","why":"$\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$ was asked as Q3A in <b>both<\/b> TA-II papers (Oct-2024 and Oct-2025) - the only exact repeat across years in your PYQs.","formulas":["F44","F46","F47","F70"],"qtypes":["Show $\\int_0^\\infty \\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\frac ba$","Evaluate integrals with a parameter (e.g. $\\int_0^\\infty e^{-x}\\frac{\\sin\\alpha x}{x}dx$)"],"example":{"q":"Show $\\displaystyle\\int_0^\\infty e^{-x}\\frac{\\sin\\alpha x}{x}\\,dx=\\tan^{-1}\\alpha$. <span class='src'>[Generated practice - standard DUIS example]<\/span>","steps":["Let $I(\\alpha)=\\int_0^\\infty e^{-x}\\frac{\\sin\\alpha x}{x}dx$","$I'(\\alpha)=\\int_0^\\infty e^{-x}\\cos\\alpha x\\,dx=\\dfrac{1}{1+\\alpha^2}$ (standard $\\int_0^\\infty e^{-ax}\\cos bx\\,dx=\\frac{a}{a^2+b^2}$)","$I(\\alpha)=\\tan^{-1}\\alpha+c$","$\\alpha=0\\Rightarrow I=0\\Rightarrow c=0$","$I=\\tan^{-1}\\alpha$"]},"pyqs":["C3A","D3A"],"video":"v_duis"},{"id":"erf","unit":"IC","order":8,"pri":"P1","diff":"Medium","time":45,"name":"Error Function erf & erfc","sub":"Definitions, odd property, derivative, completing the square","explain":"$\\text{erf}(x)=\\frac{2}{\\sqrt\\pi}\\int_0^x e^{-u^2}du$ and $\\text{erfc}(x)=\\frac{2}{\\sqrt\\pi}\\int_x^\\infty e^{-u^2}du$, so $\\text{erf}+\\text{erfc}=1$, $\\text{erf}(0)=0$, $\\text{erf}(\\infty)=1$, and erf is odd. Most questions are: split $\\int_a^b=\\int_0^b-\\int_0^a$; differentiate with Leibnitz (chain rule on the upper limit); or complete the square in the exponent and substitute.","why":"The most-tested idea in TA-II: 4 of the 8 TA-II sub-questions you have (Oct-24 Q3B & Q4B, Oct-25 Q3B & Q4B). Definitions alone earn 2 of 5 marks in the 2025 model solution.","formulas":["F48","F49","F50","F51","F52","F53","F54","F55","F56","F57"],"qtypes":["Define erf and erfc; prove erfc(-x)+erfc(x)=2","Prove d/dx erf(x)=2/√π e^{-x²}; find d/dx erf(axⁿ)","Express ∫ₐᵇ e^{-x²}dx or ∫₀^∞ e^{-x²-2ax}dx using erf/erfc"],"example":{"q":"Find $\\dfrac{d}{dx}\\,\\text{erfc}(ax)$. <span class='src'>[Generated practice]<\/span>","steps":["$\\text{erfc}(ax)=1-\\text{erf}(ax)=1-\\frac{2}{\\sqrt\\pi}\\int_0^{ax}e^{-u^2}du$","Leibnitz on the upper limit: $\\frac{d}{dx}\\int_0^{ax}e^{-u^2}du=e^{-a^2x^2}\\cdot a$","$\\dfrac{d}{dx}\\text{erfc}(ax)=-\\dfrac{2a}{\\sqrt\\pi}e^{-a^2x^2}$"]},"pyqs":["C3B","C4B","D3B","D4B"],"video":"v_erf"},{"id":"pdbasic","unit":"PD","order":9,"pri":"P2","diff":"Easy","time":25,"name":"Partial Derivatives - basics","sub":"Differentiate w.r.t. one variable, others constant","explain":"$\\dfrac{\\partial u}{\\partial x}$ treats every other variable as a constant. Mixed derivatives of smooth functions are equal: $u_{xy}=u_{yx}$. This is the prerequisite for Euler's theorem, Jacobians, maxima-minima and composite functions.","why":"One direct question (Oct-24 Q2A: $u=\\log(\\tan x+\\tan y+\\tan z)$). More importantly every PD question uses these skills.","formulas":["F42","F71"],"qtypes":["Show an identity like $\\sum \\sin 2x\\,u_x = 2$","Verify $u_{xy}=u_{yx}$"],"example":{"q":"If $u=x^2y+y^3$, find $u_x,\\,u_y,\\,u_{xy}$. <span class='src'>[Generated practice]<\/span>","steps":["$u_x=2xy$ ($y$ constant)","$u_y=x^2+3y^2$ ($x$ constant)","$u_{xy}=\\frac{\\partial}{\\partial y}(2xy)=2x=\\frac{\\partial}{\\partial x}(x^2+3y^2)=u_{yx}$ ✓"]},"pyqs":["C2A"],"video":"v_pdbasic"},{"id":"euler","unit":"PD","order":10,"pri":"P1","diff":"Medium","time":50,"name":"Euler's Theorem on Homogeneous Functions","sub":"x u_x + y u_y = nu, the corollary g(u) = n f(u)/f'(u), and the 2nd-order form","explain":"$u(x,y)$ is homogeneous of degree $n$ if $u(tx,ty)=t^n u(x,y)$. Euler: $xu_x+yu_y=nu$ and $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=n(n-1)u$. When $u$ itself is not homogeneous but $f(u)$ is (e.g. $\\tan u$, $\\sin u$, $e^u$), use $xu_x+yu_y=g(u)=n\\frac{f(u)}{f'(u)}$ and $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=g(u)[g'(u)-1]$. For a sum $u=U+W$ apply Euler to each part separately.","why":"3 sub-questions across both TA-II papers (Oct-24 Q1A; Oct-25 Q1B and Q2B) - the most repeated Partial Differentiation idea.","formulas":["F33","F34","F35","F36","F37","F38"],"qtypes":["$u=\\tan^{-1}(\\cdot)$ or $\\sin^{-1}(\\cdot)$: find first- and second-order Euler expressions","Three-variable sum $u=U+\\log(\\cdot)$ with a degree-0 part","Find the degree by $x\\to tx$"],"example":{"q":"If $u=\\sin^{-1}\\dfrac{x^2+y^2}{x+y}$, show $xu_x+yu_y=\\tan u$. <span class='src'>[Generated practice]<\/span>","steps":["$f(u)=\\sin u=\\frac{x^2+y^2}{x+y}$; put $x\\to tx,y\\to ty$: $\\frac{t^2(x^2+y^2)}{t(x+y)}=t\\,f$ $\\Rightarrow n=1$","By the corollary $xu_x+yu_y=n\\dfrac{f(u)}{f'(u)}=\\dfrac{\\sin u}{\\cos u}$","$=\\tan u$ ∎"]},"pyqs":["C1A","D1B","D2B"],"video":"v_euler"},{"id":"reduc","unit":"U2","order":11,"pri":"P2","diff":"Medium","time":40,"name":"Reducible to Exact (Integrating Factor Rules I & II)","sub":"Homogeneous: 1/(Mx+Ny); y f₁(xy)dx + x f₂(xy)dy: 1/(Mx−Ny)","explain":"If $M_y\\neq N_x$, multiply by an integrating factor. <b>Rule I<\/b>: equation homogeneous and $Mx+Ny\\neq0\\Rightarrow$ IF $=\\frac{1}{Mx+Ny}$. <b>Rule II<\/b>: equation of the form $y\\,f_1(xy)\\,dx+x\\,f_2(xy)\\,dy=0$ and $Mx-Ny\\neq0\\Rightarrow$ IF $=\\frac{1}{Mx-Ny}$. After multiplying, check exactness and solve by the exact rule.","why":"Q4B in both TA-I papers. Set A is Unit II Reducible Example 01, Set B is Reducible Exercise 4 - both verbatim. Needs Exact DE first.","formulas":["F24","F25","F23"],"qtypes":["Reduce to exact and find the general solution (homogeneous)","Obtain the IF of $(1+xy)y\\,dx+(1-xy)x\\,dy=0$ and solve"],"example":{"q":"Solve $(x^2y^2+xy+1)y\\,dx+(x^2y^2-xy+1)x\\,dy=0$. <span class='src'>[Unit II slides, Reducible Example 02]<\/span>","steps":["Form $y f_1(xy)dx+xf_2(xy)dy$ $\\Rightarrow$ Rule II","$Mx-Ny=xy(x^2y^2+xy+1)-xy(x^2y^2-xy+1)=2x^2y^2$; IF $=\\frac{1}{2x^2y^2}$","New $M=\\frac y2+\\frac1{2x}+\\frac{1}{2x^2y}$, $N=\\frac x2-\\frac1{2y}+\\frac{1}{2xy^2}$; $M_y=\\tfrac12-\\tfrac{1}{2x^2y^2}=N_x$ ✓","$\\int M\\,dx=\\frac{xy}{2}+\\frac12\\log x-\\frac{1}{2xy}$; $N$ terms free of $x$: $-\\frac1{2y}\\Rightarrow-\\frac12\\log y$","$xy+\\log\\frac xy-\\frac{1}{xy}=c_1$"]},"pyqs":["A4B","B4B"],"video":"v_reduc"},{"id":"lu","unit":"U1","order":12,"pri":"P2","diff":"Medium","time":40,"name":"LU Decomposition (Doolittle)","sub":"A = LU, L has 1s on the diagonal; LZ = B, UX = Z","explain":"Write $A=LU$ with $L$ unit lower triangular and $U$ upper triangular. Compare entries row-by-row: first row of $U$ = first row of $A$; $l_{i1}=a_{i1}/u_{11}$; $u_{22}=a_{22}-l_{21}u_{12}$; $u_{23}=a_{23}-l_{21}u_{13}$; $l_{32}=(a_{32}-l_{31}u_{12})/u_{22}$; $u_{33}=a_{33}-l_{31}u_{13}-l_{32}u_{23}$. To solve $AX=B$: $LZ=B$ forward, $UX=Z$ backward.","why":"Q1B in both TA-I papers. Set B's matrix is Unit I LU Example 2 verbatim. Fractions make it error-prone, hence P2 (choose Q2 = Diagonalization + Cholesky if you prefer).","formulas":["F13","F14"],"qtypes":["Find the LU decomposition of a 3x3 matrix","Solve a system by LU decomposition"],"example":{"q":"Find LU of $A=\\begin{bmatrix}2&3&1\\\\1&2&3\\\\3&1&2\\end{bmatrix}$. <span class='src'>[Unit I slides, LU Example 1]<\/span>","steps":["$u_{11}=2,u_{12}=3,u_{13}=1$; $l_{21}=\\tfrac12,\\;l_{31}=\\tfrac32$","$u_{22}=2-\\tfrac12\\cdot3=\\tfrac12,\\;u_{23}=3-\\tfrac12\\cdot1=\\tfrac52$","$l_{32}=\\dfrac{1-\\tfrac32\\cdot3}{1/2}=-7$","$u_{33}=2-\\tfrac32\\cdot1-(-7)\\tfrac52=18$","$L=\\begin{bmatrix}1&0&0\\\\\\tfrac12&1&0\\\\\\tfrac32&-7&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&3&1\\\\0&\\tfrac12&\\tfrac52\\\\0&0&18\\end{bmatrix}$ (slide prints $l_{31}=1/3$ once - it is $3/2$)"]},"pyqs":["A1B","B1B"],"video":"v_lu"},{"id":"duis2","unit":"IC","order":13,"pri":"P2","diff":"Medium","time":30,"name":"DUIS Rule II (Leibnitz rule - variable limits)","sub":"Extra boundary terms f(ψ)ψ' − f(φ)φ'","explain":"$\\dfrac{d}{dx}\\int_{\\varphi(x)}^{\\psi(x)}f(t,x)\\,dt=\\int_{\\varphi}^{\\psi}\\dfrac{\\partial f}{\\partial x}dt+f(\\psi,x)\\psi'(x)-f(\\varphi,x)\\varphi'(x)$. In the PYQs the lower limit is 0 and the integrand vanishes at $t=x$, so the boundary terms are simple. Differentiate repeatedly until the target expression appears.","why":"Q4A in both TA-II papers - same concept, different integrand: $\\int_0^x f(t)\\sin a(x-t)dt$ (2024) and $\\int_0^x(x-t)^2G(t)dt$ (2025).","formulas":["F45"],"qtypes":["If $y=\\int_0^x f(t)\\sin a(x-t)dt$ show $y''+a^2y=af(x)$","If $f(x)=\\int_0^x(x-t)^2G(t)dt$ show $f'''=2G(x)$"],"example":{"q":"If $y=\\int_0^x(x-t)f(t)\\,dt$, show $\\dfrac{d^2y}{dx^2}=f(x)$. <span class='src'>[Generated practice, same pattern as PYQs]<\/span>","steps":["$y'=\\int_0^x f(t)\\,dt+(x-x)f(x)\\cdot1-0=\\int_0^x f(t)\\,dt$","$y''=0+f(x)\\cdot1-0=f(x)$ ∎"]},"pyqs":["C4A","D4A"],"video":"v_duis"},{"id":"jacob","unit":"PD","order":14,"pri":"P2","diff":"Medium","time":40,"name":"Jacobians","sub":"∂(u,v)/∂(x,y), JJ' = 1, 3x3 at a point","explain":"$J=\\dfrac{\\partial(u,v)}{\\partial(x,y)}=\\begin{vmatrix}u_x&u_y\\\\v_x&v_y\\end{vmatrix}$ (3x3 analogous). Property: $J\\,J'=1$ where $J'=\\frac{\\partial(x,y)}{\\partial(u,v)}$. So the inverse Jacobian is just $1/J$ - no need to solve for $x,y$ unless the question asks you to verify.","why":"Oct-24 Q1B (verify JJ'=1) and Oct-25 Q2A (3x3 inverse Jacobian at a point = −1/16).","formulas":["F39","F40","F41"],"qtypes":["Verify JJ'=1 for given u, v","Evaluate ∂(x,y,z)/∂(u,v,w) at a point using J'=1/J"],"example":{"q":"If $x=r\\cos\\theta,\\;y=r\\sin\\theta$, find $\\dfrac{\\partial(x,y)}{\\partial(r,\\theta)}$. <span class='src'>[Generated practice]<\/span>","steps":["$\\begin{vmatrix}x_r&x_\\theta\\\\y_r&y_\\theta\\end{vmatrix}=\\begin{vmatrix}\\cos\\theta&-r\\sin\\theta\\\\\\sin\\theta&r\\cos\\theta\\end{vmatrix}$","$=r\\cos^2\\theta+r\\sin^2\\theta=r$","Hence $\\frac{\\partial(r,\\theta)}{\\partial(x,y)}=\\frac1r$"]},"pyqs":["C1B","D2A"],"video":"v_jacob"},{"id":"composite","unit":"PD","order":15,"pri":"P2","diff":"Easy","time":15,"name":"Composite Functions & Chain Rule (wave equation)","sub":"z = f(x+ct) + φ(x−ct) ⇒ z_tt = c²z_xx","explain":"If $z=f(s)$ with $s=x+ct$ then $z_x=f'(s)\\,s_x=f'(s)$ and $z_t=f'(s)\\,s_t=c\\,f'(s)$. Differentiate twice and compare. The same chain-rule idea gives results like $u_x+u_y+u_z=0$ for $u=f(x-y,y-z,z-x)$.","why":"Oct-25 Q1A (5 marks, model answer split 2+2+1). Very short - good insurance marks.","formulas":["F42"],"qtypes":["Show $z_{tt}=c^2z_{xx}$","Show $u_x+u_y+u_z=0$ for symmetric differences"],"example":{"q":"If $u=f(x-y,\\,y-z,\\,z-x)$ show $u_x+u_y+u_z=0$. <span class='src'>[Generated practice]<\/span>","steps":["Let $r=x-y,\\;s=y-z,\\;t=z-x$","$u_x=u_r-u_t,\\;u_y=-u_r+u_s,\\;u_z=-u_s+u_t$","Add: $u_x+u_y+u_z=0$ ∎"]},"pyqs":["D1A"],"video":"v_pdbasic2"},{"id":"maxmin","unit":"PD","order":16,"pri":"P2","diff":"Hard","time":40,"name":"Maxima & Minima (two variables)","sub":"f_x = f_y = 0, then r, s, t and rt − s²","explain":"Stationary points: solve $f_x=0,\\;f_y=0$. At each, $r=f_{xx},\\;s=f_{xy},\\;t=f_{yy}$. $rt-s^2>0$ and $r<0\\Rightarrow$ maximum; $rt-s^2>0$ and $r>0\\Rightarrow$ minimum; $rt-s^2<0\\Rightarrow$ saddle (no extremum); $rt-s^2=0\\Rightarrow$ doubtful, investigate further.","why":"Once in the PYQs (Oct-24 Q2B, as the OR option) and 5 tutorial questions (T9 Q7-Q11). Procedural and reliable once practised, but each question takes longer - do it after the P1 topics.","formulas":["F43"],"qtypes":["Examine $f(x,y)$ for extreme values","Find stationary points and classify"],"example":{"q":"Examine $f=x^3+y^3-3axy\\;(a>0)$ for extreme values. <span class='src'>[Generated practice]<\/span>","steps":["$f_x=3x^2-3ay=0,\\;f_y=3y^2-3ax=0\\Rightarrow(0,0),(a,a)$","$r=6x,\\;s=-3a,\\;t=6y$","$(0,0)$: $rt-s^2=-9a^2<0\\Rightarrow$ saddle","$(a,a)$: $rt-s^2=36a^2-9a^2>0,\\;r=6a>0\\Rightarrow$ minimum, $f_{\\min}=-a^3$"]},"pyqs":["C2B"],"video":"v_maxmin"},{"id":"debasic","unit":"U2","order":17,"pri":"P3","diff":"Easy","time":25,"name":"DE basics: order, degree, variable separable, homogeneous","sub":"Definitions + y = vx substitution","explain":"Order = highest derivative; degree = power of that derivative after removing radicals/fractions. Variable separable: $g(y)dy=f(x)dx$. Homogeneous DE ($M,N$ homogeneous of the same degree): put $y=vx$, $\\frac{dy}{dx}=v+x\\frac{dv}{dx}$. Recognising 'homogeneous' is needed for IF Rule I.","why":"No PYQ asks this directly in your papers, but it supports Reducible-to-exact (Rule I) and is quick theory.","formulas":["F31"],"qtypes":["State order and degree","Solve by y = vx"],"example":{"q":"Order and degree of $\\left(\\dfrac{d^2y}{dx^2}\\right)^3+\\left(\\dfrac{dy}{dx}\\right)^4+y=0$? <span class='src'>[Generated practice]<\/span>","steps":["Highest derivative is $\\frac{d^2y}{dx^2}$ $\\Rightarrow$ order 2","Its power is 3 $\\Rightarrow$ degree 3"]},"pyqs":[],"video":"v_debasic"},{"id":"pca","unit":"U1","order":18,"pri":"P3","diff":"Easy","time":20,"name":"Principal Component Analysis (PCA)","sub":"Standardize → covariance → eigen → feature vector → recast","explain":"PCA reduces dimensions while keeping most information. Steps from your slides: (1) standardize $z=\\frac{x-\\bar x}{\\sigma}$; (2) covariance $S=\\frac{1}{n-1}BB^T$; (3) eigenvalues/eigenvectors of $S$ - eigenvectors are the principal directions, eigenvalues the variance carried; (4) feature vector = chosen eigenvectors; (5) recast data along them.","why":"In the Unit I syllabus but not asked in any of your 4 papers. Learn the 5 steps + advantages/disadvantages as theory insurance.","formulas":["F17","F18","F19"],"qtypes":["Explain PCA steps","Advantages / disadvantages / applications"],"example":{"q":"A covariance matrix is $S=\\begin{bmatrix}2&1\\\\1&2\\end{bmatrix}$. Find the first principal component and its share of variance. <span class='src'>[Generated practice]<\/span>","steps":["$\\lambda^2-4\\lambda+3=0\\Rightarrow\\lambda=3,1$","$\\lambda=3$: $x_1=x_2\\Rightarrow$ PC1 direction $\\frac{1}{\\sqrt2}(1,1)$","Variance share $=\\frac{3}{3+1}=75\\%$"]},"pyqs":[],"video":"v_pca"},{"id":"bern","unit":"U2","order":19,"pri":"P3","diff":"Medium","time":25,"name":"Bernoulli's Differential Equation","sub":"dy/dx + Py = Qyⁿ, put v = y¹⁻ⁿ","explain":"Divide by $y^n$ and put $v=y^{1-n}$: the equation becomes linear in $v$: $\\frac{dv}{dx}+(1-n)Pv=(1-n)Q$. Solve as a linear DE.","why":"Listed in your Unit II syllabus slide, but the slides contain no worked Bernoulli content and no PYQ asks it.","formulas":["F28"],"qtypes":["Solve $y'+Py=Qy^n$"],"example":{"q":"Solve $\\dfrac{dy}{dx}+\\dfrac{y}{x}=xy^2$. <span class='src'>[Generated practice]<\/span>","steps":["Divide by $y^2$: $y^{-2}y'+\\frac1x y^{-1}=x$; put $v=y^{-1}$, $v'=-y^{-2}y'$","$-v'+\\frac vx=x\\Rightarrow v'-\\frac vx=-x$","IF $=e^{-\\int dx/x}=\\frac1x$; $\\frac vx=\\int(-1)dx=-x+c$","$\\frac{1}{y}=cx-x^2$"]},"pyqs":[],"video":"v_bern"},{"id":"growth","unit":"U2","order":17.5,"pri":"P2","diff":"Easy","time":20,"name":"Growth & Decay applications","sub":"dx/dt = kx ⇒ x = x₀e^{kt}","explain":"Natural growth $\\frac{dx}{dt}=kx\\Rightarrow x=x_0e^{kt}$ ($k>0$). Decay $\\frac{dm}{dt}=-km\\Rightarrow m=m_0e^{-kt}$. Use the two given conditions to find $x_0$ and $k$; half-life $t_{1/2}=\\frac{\\ln 2}{k}$.","why":"Not in any of your PYQs, but 5 tutorial questions (T6 Q6-Q10) and two slide examples. Only one formula to learn - very quick, so it is worth 20 minutes.","formulas":["F29","F30"],"qtypes":["Population triples in 2 h - when is it 100x?","Half-life of radium"],"example":{"q":"A bacterial population triples between noon and 2 PM. When is it 100 times the noon value? <span class='src'>[Unit II slides, Growth Example 01]<\/span>","steps":["$B=B_0e^{kt}$; $3B_0=B_0e^{2k}\\Rightarrow k=\\tfrac12\\ln3=0.5493$","$100=e^{0.5493t}\\Rightarrow t=\\frac{\\ln100}{0.5493}=8.38$ h","About 8.38 hours after noon (~8:23 PM). (The slide writes '8.383 PM' - read it as 8.38 h after noon.)"]},"pyqs":[],"video":"v_growth"},{"id":"funcdep","unit":"PD","order":14.5,"pri":"P3","diff":"Easy","time":20,"name":"Functional Dependence","sub":"u, v (, w) dependent ⇔ Jacobian = 0; then find the relation","explain":"Functions $u,v$ of $x,y$ are <b>functionally dependent<\/b> (one is a function of the other) iff $\\dfrac{\\partial(u,v)}{\\partial(x,y)}=0$ identically. If dependent, eliminate $x,y$ to find the relation, e.g. by spotting a combination such as $x/y$ or using an identity like $(x+y+z)^2=\\sum x^2+2\\sum xy$.","why":"Not in your PYQs; 2 tutorial questions (T9 Q5, Q6). It reuses the Jacobian method, so it costs little extra time once Jacobians are done.","formulas":["F59","F39","F40"],"qtypes":["Test dependence by J = 0","Find the functional relation"],"example":{"q":"Are $u=x+y,\\;v=x^2+2xy+y^2$ functionally dependent? <span class='src'>[Generated practice]<\/span>","steps":["$J=\\begin{vmatrix}1&1\\\\2x+2y&2x+2y\\end{vmatrix}=0\\Rightarrow$ dependent","Relation: $v=(x+y)^2=u^2$"]},"pyqs":[],"video":"v_funcdep"},{"id":"dint","unit":"MI","order":21,"pri":"P2","diff":"Medium","time":45,"name":"Double Integration","sub":"Iterated integrals, limits from the region, infinite regions","explain":"Evaluate the inner integral first, treating the outer variable as a constant. For a region between curves, sketch it, find intersection points, and write $x$ from $a$ to $b$, $y$ from the lower curve to the upper curve. If an inner limit contains $x$, the inner variable must be $y$.","why":"Not in your 4 TA papers (they only cover Units I-IV topics), but 6 tutorial questions (T13). It is the base skill for area and volume (T15), so learn it first in this group.","formulas":["F60","F61"],"qtypes":["Evaluate a given iterated integral","Integrate over a region bounded by curves","Region extending to infinity"],"example":{"q":"Evaluate $\\int_0^1\\int_0^{x}xy\\,dy\\,dx$. <span class='src'>[Generated practice]<\/span>","steps":["Inner: $x\\left[\\frac{y^2}{2}\\right]_0^x=\\frac{x^3}{2}$","Outer: $\\int_0^1\\frac{x^3}{2}dx=\\frac18$"]},"pyqs":[],"video":"v_dint"},{"id":"areavol","unit":"MI","order":22,"pri":"P2","diff":"Medium","time":40,"name":"Area & Volume by Multiple Integrals","sub":"A = ∬ dx dy, V = ∭ dx dy dz, polar r dr dθ","explain":"Area of a region $R$: $A=\\iint_R dx\\,dy$. Volume of a solid: $V=\\iiint dx\\,dy\\,dz$, or $V=\\iint_R(z_{top}-z_{bottom})\\,dx\\,dy$. Circular symmetry ($x^2+y^2$) $\\Rightarrow$ polar coordinates with $dx\\,dy=r\\,dr\\,d\\theta$.","why":"6 tutorial questions (T15). Areas between a parabola and a line are quick, standard marks; volumes reuse double integration.","formulas":["F62","F63","F61","F64"],"qtypes":["Area between two curves","Area of (part of) an ellipse","Volume under a plane over a region","Volume between two surfaces (polar)"],"example":{"q":"Area between $y=x^2$ and $y=4$. <span class='src'>[Generated practice]<\/span>","steps":["Intersections $x=\\pm2$","$A=\\int_{-2}^{2}(4-x^2)dx=16-\\frac{16}{3}=\\frac{32}{3}$"]},"pyqs":[],"video":"v_areavol"},{"id":"tint","unit":"MI","order":23,"pri":"P2","diff":"Medium","time":35,"name":"Triple Integration","sub":"Innermost first; limits tell you the order","explain":"Integrate the innermost variable first (its limits may involve the other two), then the middle, then the outer variable with constant limits. If the printed $dx\\,dy\\,dz$ order disagrees with the limits, follow the limits.","why":"4 tutorial questions (T14). Pure calculation - reliable marks if you are careful with limits.","formulas":["F65","F64"],"qtypes":["Evaluate a given triple integral","Volume of a tetrahedron"],"example":{"q":"Evaluate $\\int_0^1\\int_0^1\\int_0^1(x+y+z)\\,dx\\,dy\\,dz$. <span class='src'>[Generated practice]<\/span>","steps":["Inner: $\\frac12+y+z$","Middle: $\\frac12+\\frac12+z=1+z$","Outer: $1+\\frac12=\\frac32$"]},"pyqs":[],"video":"v_tint"},{"id":"curve","unit":"MI","order":24,"pri":"P3","diff":"Hard","time":45,"name":"Curve Tracing","sub":"Symmetry, origin, tangents, asymptotes, region; polar roses","explain":"For a Cartesian curve check, in order: (1) symmetry (even powers of $y$ $\\Rightarrow$ about the x-axis, etc.), (2) does it pass through the origin, and the tangents there (lowest-degree terms = 0), (3) intercepts, (4) asymptotes parallel to the axes (equate the coefficient of the highest power of $y$ or $x$ to zero), (5) region where the curve exists. For roses $r=a\\cos n\\theta$ / $a\\sin n\\theta$: $n$ petals if $n$ is odd, $2n$ if even, each of length $a$.","why":"6 tutorial questions (T12) but no PYQ in your ZIP. Takes longer (needs a neat sketch), so it is lowest value per minute here - learn the checklist and the rose rule.","formulas":["F66","F67","F68","F69"],"qtypes":["Trace a Cartesian curve ($xy^2=\\dots$, $y^2(2a-x)=x^3$)","Trace a polar rose $r=a\\cos n\\theta$, $a\\sin n\\theta$"],"example":{"q":"How many petals does $r=a\\sin4\\theta$ have? <span class='src'>[Generated practice]<\/span>","steps":["$n=4$ is even $\\Rightarrow2n=8$ petals, each of length $a$"]},"pyqs":[],"video":"v_curve"}],"PYQS":[{"id":"A1A","paper":"A","q":"Q1 A","page":1,"marks":5,"topic":"eig","or":"Q1 or Q2","text":"Determine the eigen values of the matrix $A=\\begin{bmatrix}4&6&6\\\\1&3&2\\\\-1&-4&-3\\end{bmatrix}$ and also obtain the eigen vector corresponding to the smallest eigen value of $A$.","match":"Exact match: Unit I slides, Eigen Exercise 4 (same matrix).","steps":["$S_1=4+3-3=4$","$S_2=\\begin{vmatrix}3&2\\\\-4&-3\\end{vmatrix}+\\begin{vmatrix}4&6\\\\-1&-3\\end{vmatrix}+\\begin{vmatrix}4&6\\\\1&3\\end{vmatrix}=-1-6+6=-1$","$|A|=4(-9+8)-6(-3+2)+6(-4+3)=-4+6-6=-4$","$\\lambda^3-4\\lambda^2-\\lambda+4=0\\Rightarrow\\lambda^2(\\lambda-4)-(\\lambda-4)=0\\Rightarrow(\\lambda-4)(\\lambda^2-1)=0$","$\\lambda=-1,\\,1,\\,4$ (check: sum $=4=S_1$, product $=-4=|A|$)","Smallest $\\lambda=-1$: $(A+I)X=0$, rows $5x+6y+6z=0$ and $x+4y+2z=0$","Cramer: $\\dfrac{x}{12-24}=\\dfrac{-y}{10-6}=\\dfrac{z}{20-6}\\Rightarrow\\dfrac{x}{-12}=\\dfrac{y}{-4}=\\dfrac{z}{14}$","$X=\\begin{bmatrix}6\\\\2\\\\-7\\end{bmatrix}$ (any non-zero multiple, e.g. $(-6,-2,7)^T$)"],"answer":"$\\lambda=-1,1,4$; eigenvector for $\\lambda=-1$: $(6,2,-7)^T$."},{"id":"A1B","paper":"A","q":"Q1 B","page":1,"marks":5,"topic":"lu","or":"Q1 or Q2","text":"Find the LU decomposition of the matrix $A=\\begin{bmatrix}3&2&7\\\\2&3&1\\\\3&4&1\\end{bmatrix}$.","match":"Not in slides (same method as Unit I LU Example 1).","steps":["$A=LU$, $L=\\begin{bmatrix}1&0&0\\\\l_{21}&1&0\\\\l_{31}&l_{32}&1\\end{bmatrix}$, $U=\\begin{bmatrix}u_{11}&u_{12}&u_{13}\\\\0&u_{22}&u_{23}\\\\0&0&u_{33}\\end{bmatrix}$","Row 1: $u_{11}=3,\\;u_{12}=2,\\;u_{13}=7$","$l_{21}=\\frac23,\\;l_{31}=\\frac33=1$","$u_{22}=3-\\frac23(2)=\\frac53,\\quad u_{23}=1-\\frac23(7)=-\\frac{11}{3}$","$l_{32}=\\dfrac{4-1(2)}{5/3}=\\dfrac65$","$u_{33}=1-1(7)-\\frac65\\left(-\\frac{11}{3}\\right)=-6+\\frac{22}{5}=-\\frac85$","$L=\\begin{bmatrix}1&0&0\\\\\\frac23&1&0\\\\1&\\frac65&1\\end{bmatrix},\\;U=\\begin{bmatrix}3&2&7\\\\0&\\frac53&-\\frac{11}{3}\\\\0&0&-\\frac85\\end{bmatrix}$"],"answer":"$l_{21}=2/3,\\;l_{31}=1,\\;l_{32}=6/5$; $U$ diagonal $3,\\,5/3,\\,-8/5$."},{"id":"A2A","paper":"A","q":"Q2 A","page":1,"marks":5,"topic":"diag","or":"Q1 or Q2","text":"Show that the matrix $A=\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$ is diagonalizable. Then find matrix $P$ such that $P^{-1}AP$ is diagonal.","match":"Not in slides (same method as Diagonalization Example 1).","steps":["$\\lambda^2-7\\lambda+10=0\\Rightarrow\\lambda=2,5$ - distinct, so 2 independent eigenvectors $\\Rightarrow$ diagonalizable","$\\lambda=2$: $\\begin{bmatrix}2&1\\\\2&1\\end{bmatrix}X=0\\Rightarrow 2x+y=0\\Rightarrow X_1=(1,-2)^T$","$\\lambda=5$: $\\begin{bmatrix}-1&1\\\\2&-2\\end{bmatrix}X=0\\Rightarrow x=y\\Rightarrow X_2=(1,1)^T$","$P=\\begin{bmatrix}1&1\\\\-2&1\\end{bmatrix},\\;|P|=3,\\;P^{-1}=\\frac13\\begin{bmatrix}1&-1\\\\2&1\\end{bmatrix}$","$AP=\\begin{bmatrix}2&5\\\\-4&5\\end{bmatrix}$, $P^{-1}AP=\\frac13\\begin{bmatrix}6&0\\\\0&15\\end{bmatrix}=\\begin{bmatrix}2&0\\\\0&5\\end{bmatrix}$"],"answer":"$P=\\begin{bmatrix}1&1\\\\-2&1\\end{bmatrix}$, $D=\\text{diag}(2,5)$."},{"id":"A2B","paper":"A","q":"Q
