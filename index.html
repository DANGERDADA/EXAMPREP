<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MFC-III Exam Prep</title>
<meta name="description" content="Personal mid-term preparation site for Mathematical Foundation for Computing-III (23ASH1109), built from MATHS.zip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#F8FAFC; --border:#E3E8EF; --text:#16202E; --muted:#5B6878;
  --primary:#14305A; --primary-2:#1E4479; --accent:#0E8F8A; --accent-soft:#E2F5F3;
  --p1:#B42318; --p1bg:#FDE8E6; --p2:#A15C07; --p2bg:#FEF3D7; --p3:#475467; --p3bg:#EEF0F3;
  --u1:#2563EB; --u2:#0E8F8A; --pd:#7C3AED; --ic:#C2410C; --mi:#C0267A;
  --ok:#067647; --okbg:#DCFAE6; --bad:#B42318; --badbg:#FEE4E2;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --radius:14px; --side:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131D; --surface:#131D2B; --surface2:#182436; --border:#26354A; --text:#E5ECF4; --muted:#93A3B8;
    --primary:#8DB4F0; --primary-2:#A8C6F5; --accent:#3CC7BF; --accent-soft:#103534;
    --p1:#FDA29B; --p1bg:#4A1A17; --p2:#FEC84B; --p2bg:#43310D; --p3:#C3CCD8; --p3bg:#273445;
    --u1:#7AA7FF; --u2:#3CC7BF; --pd:#B79CFF; --ic:#FF9C66; --mi:#F38BC4;
    --ok:#75E0A7; --okbg:#0E3B26; --bad:#FDA29B; --badbg:#47191A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
    --bg:#0C131D; --surface:#131D2B; --surface2:#182436; --border:#26354A; --text:#E5ECF4; --muted:#93A3B8;
    --primary:#8DB4F0; --primary-2:#A8C6F5; --accent:#3CC7BF; --accent-soft:#103534;
    --p1:#FDA29B; --p1bg:#4A1A17; --p2:#FEC84B; --p2bg:#43310D; --p3:#C3CCD8; --p3bg:#273445;
    --u1:#7AA7FF; --u2:#3CC7BF; --pd:#B79CFF; --ic:#FF9C66; --mi:#F38BC4;
    --ok:#75E0A7; --okbg:#0E3B26; --bad:#FDA29B; --badbg:#47191A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;color:var(--primary);line-height:1.25;margin:0}
h2{font-size:1.55rem;margin-bottom:.35rem}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary);white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--surface);display:grid;place-items:center;font-family:"Source Serif 4",serif;font-size:18px}
:root[data-theme="dark"] .brand .logo{color:#0C131D}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;margin-top:-3px}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);padding:0 12px 0 36px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.results{position:absolute;top:46px;left:0;right:0;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:none;padding:6px}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface2)}
.results .rt{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.results .rs{font-size:.82rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--accent)}
#menuBtn{display:none}
.sidebar{position:fixed;top:60px;left:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:14px 10px;z-index:30}
.sidebar a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;font-size:.93rem}
.sidebar a:hover{background:var(--surface2)}
.sidebar a.active{background:var(--accent-soft);color:var(--accent)}
.sidebar a .k{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.sidebar a.active .k{background:var(--accent);color:var(--surface)}
.side-prog{margin:16px 8px 6px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);font-size:.82rem}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary-2));border-radius:99px;transition:width .3s}
main{margin-left:var(--side);padding:24px 28px 80px;max-width:1240px;overflow-x:clip}
.tab[hidden]{display:none}
.scrim{display:none}
@media (max-width:1023px){
  #menuBtn{display:grid}
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
  main{margin-left:0;padding:18px 16px 80px}
  .brand small{display:none}
}
@media (max-width:560px){ .brand span.t{display:none} h2{font-size:1.3rem} }
/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.sec{margin-top:26px}
.sec>h3{margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.P1{background:var(--p1bg);color:var(--p1)} .P2{background:var(--p2bg);color:var(--p2)} .P3{background:var(--p3bg);color:var(--p3)}
.ub{background:var(--surface2);border-color:var(--border);color:var(--muted)}
.ub.U1{color:var(--u1)} .ub.U2{color:var(--u2)} .ub.PD{color:var(--pd)} .ub.IC{color:var(--ic)} .ub.MI{color:var(--mi)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.84rem;font-weight:500}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--surface)}
:root[data-theme="dark"] .chip.on{color:#0C131D}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0C131D}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
select,input[type=number],input[type=date],input[type=text].f{max-width:100%;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0 10px}
label.ck{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none}
.hero{background:linear-gradient(135deg,#14305A 0%,#1B4D7A 55%,#0E8F8A 100%);color:#fff;border-radius:18px;padding:26px 26px 22px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:clamp(1.5rem,3.4vw,2.25rem)}
.hero p{margin:.4rem 0 0;color:#D6E6F5;max-width:760px}
.hero .chips{margin-top:16px}
.hero .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.hero .chip.on{background:#fff;color:#14305A;border-color:#fff}
.stat .n{font-size:1.9rem;font-weight:700;color:var(--primary);font-family:"Source Serif 4",serif;line-height:1.1}
.stat .l{color:var(--muted);font-size:.84rem}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:.9rem}
.warn{border-left:4px solid var(--p2);background:var(--p2bg);padding:10px 14px;border-radius:8px;font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--surface2)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.hbar{display:flex;align-items:center;gap:8px}
.hbar .b{height:10px;border-radius:99px;background:var(--accent);min-width:3px}
details.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px}
details.item>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted);flex:none;margin-top:3px}
details.item[open]>summary .chev{transform:rotate(90deg)}
details.item .body{padding:0 16px 16px;border-top:1px solid var(--border)}
details.item.done>summary .tname{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.75}
.tname{font-weight:600;font-size:1rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.steps{margin:6px 0 0;padding-left:0;counter-reset:s;list-style:none}
.steps li{position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed var(--border)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:700;display:grid;place-items:center}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:14px 0 4px}
.src{color:var(--muted);font-size:.8rem}
.q{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:8px}
.ans{background:var(--okbg);color:var(--ok);border-radius:8px;padding:8px 12px;margin-top:8px;font-weight:500}
.ans *{color:inherit}
.pyqlink{border:1px solid var(--border);background:var(--surface2);border-radius:7px;padding:1px 7px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--primary)}
.pyqlink:hover{border-color:var(--accent)}
.formula{display:flex;flex-direction:column;gap:6px}
.formula .tex{overflow-x:auto;overflow-y:hidden;padding:6px 2px}
.formula .cover{border:2px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2)}
.formula dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:.86rem}
.formula dt{color:var(--muted);font-weight:600}
.formula dd{margin:0}
.star{border:0;background:none;cursor:pointer;font-size:1.25rem;line-height:1;color:var(--muted);padding:2px}
.star.on{color:#E8A400}
.compact .formula dl,.compact .formula .fx{display:none}
.compact .card.formula{padding:12px 14px}
.unit-h{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.unit-h .dot{width:12px;height:12px;border-radius:4px}
.dot.U1{background:var(--u1)}.dot.U2{background:var(--u2)}.dot.PD{background:var(--pd)}.dot.IC{background:var(--ic)}.dot.MI{background:var(--mi)}
.bp td.c{font-weight:600;font-size:.8rem;border-left:4px solid var(--border);cursor:pointer}
.bp td.c.MI{border-left-color:var(--mi)}.bp td.c.U1{border-left-color:var(--u1)}.bp td.c.U2{border-left-color:var(--u2)}.bp td.c.PD{border-left-color:var(--pd)}.bp td.c.IC{border-left-color:var(--ic)}
.bp td.c:hover{background:var(--surface2)}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-top:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.res{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.92rem}
.res.ok{background:var(--okbg);color:var(--ok)} .res.no{background:var(--badbg);color:var(--bad)}
.res .steps li{color:var(--text)}
.day{margin-bottom:16px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task .ty{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;flex:none;margin-top:2px;width:74px;text-align:center}
.ty.video{background:#FDECEC;color:#C01048}.ty.learn{background:#E8F0FE;color:#1D4ED8}.ty.formula{background:#F3E8FF;color:#7C3AED}.ty.pyq{background:#E2F5F3;color:#0E7C77}.ty.break{background:var(--surface2);color:var(--muted)}.ty.recall{background:#FEF3D7;color:#A15C07}.ty.revise{background:#DCFAE6;color:#067647}.ty.mock{background:#FFE4E8;color:#BE123C}
:root[data-theme="dark"] .ty{filter:brightness(.9) saturate(1.2)}
.task.done .tt{text-decoration:line-through;opacity:.6}
.task .dur{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
.vid{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2);margin-top:10px}
.vframe{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;border-radius:10px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.flash{animation:flash 1.6s ease}
[id]{scroll-margin-top:76px}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.ring{width:110px;height:110px}
.empty{padding:24px;text-align:center;color:var(--muted)}
#mathBanner{display:none;margin-bottom:12px}
.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--surface);padding:8px 16px;border-radius:10px;font-weight:600;font-size:.88rem;opacity:0;transition:opacity .2s;z-index:90;pointer-events:none}
.toast.show{opacity:1}
/* focus / distraction-free */
body.focus .topbar,body.focus .sidebar{display:none}
body.focus main{margin:0 auto;max-width:820px;font-size:1.05rem}
#exitFocus{display:none;position:fixed;top:12px;right:12px;z-index:60}
body.focus #exitFocus{display:inline-flex}
#printSheet{display:none}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:4px}
.ev>div{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface2);font-size:.86rem}
.ev b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.derived{font-size:.78rem;color:var(--p2);background:var(--p2bg);border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:4px}
.plot{width:100%;max-width:340px;height:auto;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-top:8px}
.plot .ax{stroke:var(--muted);stroke-width:.6}.plot .cv{fill:none;stroke:var(--accent);stroke-width:1.6}.plot .as{stroke:var(--p1);stroke-dasharray:3 3;stroke-width:.9}
.plot text{fill:var(--muted);font-size:7px}
.slot{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--border)}
.slot:last-child{border-bottom:0}
.slot .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--primary);width:46px;flex:none;font-size:.85rem;margin-top:1px}
.slot.done .tt{text-decoration:line-through;opacity:.6}
.slot.meal{background:var(--surface2)}
.slot .dur{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
.tsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi>div{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
.kpi .n{font-size:1.35rem;font-weight:700;color:var(--primary)}
.kpi .l{font-size:.78rem;color:var(--muted)}
.vnotice{margin-top:10px;border-radius:10px;padding:12px 14px;background:var(--p2bg);color:var(--text);font-size:.88rem}
.ty.meal{background:#E0F2FE;color:#0369A1}.ty.example{background:#EEF2FF;color:#4338CA}.ty.tut{background:#FCE7F3;color:#BE185D}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .topbar,.sidebar,.scrim,.noprint,#exitFocus,.toast{display:none!important}
  main{margin:0;padding:0;max-width:none}
  .card,details.item{box-shadow:none;break-inside:avoid}
  body.print-formulas main{display:none}
  body.print-formulas #printSheet{display:block}
  #printSheet .pf{break-inside:avoid;border-bottom:1px solid #ccc;padding:4px 0}
  #printSheet h2{margin-top:12px;color:#000}
  details.item>.body{display:block}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Open navigation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand"><div class="logo">&Sigma;</div><div><span class="t">MFC-III Exam Prep</span><small>23ASH1109 &middot; from your MATHS.zip</small></div></div>
  <div class="search" role="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search topics, tutorials, formulas, PYQs..." autocomplete="off" aria-label="Search">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>
<nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
<div class="scrim" id="scrim"></div>
<main id="main">
  <div class="warn" id="mathBanner">Equation renderer (KaTeX) could not load &mdash; you are probably offline. Equations are shown as readable LaTeX text; everything else works normally.</div>
  <section class="tab" id="tab-dashboard"></section>
  <section class="tab" id="tab-topics" hidden></section>
  <section class="tab" id="tab-pyq" hidden></section>
  <section class="tab" id="tab-tutorials" hidden></section>
  <section class="tab" id="tab-formulas" hidden></section>
  <section class="tab" id="tab-memorise" hidden></section>

<script>
const D = {"TUTS":[{"t":1,"n":1,"topic":"eig","sub":"2x2 eigenvalues and eigenvectors","text":"Find the Eigen values and Eigen vectors of the matrix $A=\\begin{bmatrix}-4&-6\\\\3&5\\end{bmatrix}$","slide":"Unit I Eigen Exercise 2 (same matrix also asked as PYQ TA-I Set B Q2A for diagonalization)","pyq":"B2A","steps":["$S_1=1,\\;|A|=-20+18=-2\\Rightarrow\\lambda^2-\\lambda-2=0\\Rightarrow\\lambda=-1,2$","$\\lambda=-1$: $-3x_1-6x_2=0\\Rightarrow X_1=(-2,1)^T$","$\\lambda=2$: $-6x_1-6x_2=0\\Rightarrow X_2=(-1,1)^T$"],"ans":"$\\lambda=-1,(-2,1)^T;\\;\\lambda=2,(-1,1)^T$","id":"T1Q1","label":"T1 Q1","rel":"similar","pri":"P1","why":"Same matrix/result as a PYQ with a small change."},{"t":1,"n":2,"topic":"eig","sub":"Triangular matrix","text":"Find the Eigen values and Eigen vectors of the matrix $A=\\begin{bmatrix}-1&1&2\\\\0&-2&1\\\\0&0&-3\\end{bmatrix}$.","steps":["Upper triangular $\\Rightarrow\\lambda=-1,-2,-3$ (diagonal entries)","$\\lambda=-1$: $(A+I)X=0$: $x_2+2x_3=0,\\;-x_2+x_3=0,\\;-2x_3=0\\Rightarrow x_2=x_3=0\\Rightarrow X_1=(1,0,0)^T$","$\\lambda=-2$: $x_1+x_2+2x_3=0,\\;x_3=0\\Rightarrow X_2=(1,-1,0)^T$","$\\lambda=-3$: $2x_1+x_2+2x_3=0,\\;x_2+x_3=0\\Rightarrow x_3=-x_2,\\;x_1=\\tfrac{x_2}{2}\\Rightarrow X_3=(1,2,-2)^T$","Check: $A(1,2,-2)^T=(-3,-6,6)^T=-3(1,2,-2)^T$ ✓"],"ans":"$-1:(1,0,0)^T,\\;-2:(1,-1,0)^T,\\;-3:(1,2,-2)^T$","id":"T1Q2","label":"T1 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":1,"n":3,"topic":"eig","sub":"Checking a given vector","text":"Let $A=\\begin{bmatrix}2&1&0\\\\0&3&0\\\\0&0&4\\end{bmatrix},\\;u=\\begin{bmatrix}1\\\\0\\\\0\\end{bmatrix}$ and $v=\\begin{bmatrix}0\\\\1\\\\1\\end{bmatrix}$. Are <b>u<\/b> and <b>v<\/b> eigen vectors of A?","steps":["$Au=(2,0,0)^T=2u\\Rightarrow u$ is an eigenvector with $\\lambda=2$","$Av=(1,3,4)^T$, which is not a scalar multiple of $(0,1,1)^T$","So $v$ is not an eigenvector"],"ans":"u: yes (λ = 2); v: no","id":"T1Q3","label":"T1 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":1,"n":4,"topic":"eig","sub":"Repeated eigenvalue","text":"Find the Eigen values and corresponding Eigen vectors of the matrix $A=\\begin{bmatrix}2&1&0\\\\0&2&0\\\\0&0&2\\end{bmatrix}$.","steps":["Triangular $\\Rightarrow\\lambda=2,2,2$","$A-2I=\\begin{bmatrix}0&1&0\\\\0&0&0\\\\0&0&0\\end{bmatrix}\\Rightarrow x_2=0$; $x_1,x_3$ free","Eigenvectors: $X=x_1(1,0,0)^T+x_3(0,0,1)^T$ - only 2 independent ones for a triple root"],"ans":"$\\lambda=2$ (3 times); eigenvectors $(1,0,0)^T,(0,0,1)^T$","id":"T1Q4","label":"T1 Q4","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":1,"n":5,"topic":"eig","sub":"3x3, eigenvector of largest eigenvalue","text":"Determine the eigen values of the matrix $A=\\begin{bmatrix}8&-8&-2\\\\4&-3&-2\\\\3&-4&1\\end{bmatrix}$ and also obtain the Eigen vector corresponding to the largest eigen value of of $A$","pyq":"B1A","slide":"Unit I Eigen Example 2","id":"T1Q5","label":"T1 Q5","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":1,"n":6,"topic":"eig","sub":"3x3, eigenvector of smallest eigenvalue","text":"Determine the eigen values of the matrix $A=\\begin{bmatrix}4&2&-2\\\\-5&3&2\\\\-2&4&1\\end{bmatrix}$. and also obtain the Eigen vector corresponding to the smallest eigen value of of $A$","steps":["$S_1=8$, $S_2=\\begin{vmatrix}3&2\\\\4&1\\end{vmatrix}+\\begin{vmatrix}4&-2\\\\-2&1\\end{vmatrix}+\\begin{vmatrix}4&2\\\\-5&3\\end{vmatrix}=-5+0+22=17$","$|A|=4(3-8)-2(-5+4)-2(-20+6)=-20+2+28=10$","$\\lambda^3-8\\lambda^2+17\\lambda-10=0\\Rightarrow(\\lambda-1)(\\lambda-2)(\\lambda-5)=0$","Smallest $\\lambda=1$: rows $3x_1+2x_2-2x_3=0,\\;-5x_1+2x_2+2x_3=0$","Cramer: $\\frac{x_1}{4+4}=\\frac{-x_2}{6-10}=\\frac{x_3}{6+10}\\Rightarrow\\frac{x_1}{8}=\\frac{x_2}{4}=\\frac{x_3}{16}$","$X=(2,1,4)^T$; check $A(2,1,4)^T=(2,1,4)^T$ ✓"],"ans":"$\\lambda=1,2,5$; for $\\lambda=1$: $(2,1,4)^T$","id":"T1Q6","label":"T1 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":1,"topic":"diag","sub":"Symmetric 2x2","text":"Diagonalize the matrix $A=\\begin{bmatrix}2&3\\\\3&-6\\end{bmatrix}$.","steps":["$\\lambda^2+4\\lambda-21=0\\Rightarrow\\lambda=3,-7$ (distinct)","$\\lambda=3$: $-x_1+3x_2=0\\Rightarrow(3,1)^T$; $\\lambda=-7$: $9x_1+3x_2=0\\Rightarrow(1,-3)^T$","$P=\\begin{bmatrix}3&1\\\\1&-3\\end{bmatrix},\\;P^{-1}=\\frac{1}{10}\\begin{bmatrix}3&1\\\\1&-3\\end{bmatrix}$","$P^{-1}AP=\\text{diag}(3,-7)$. (Eigenvectors are orthogonal since A is symmetric.)"],"ans":"$D=\\text{diag}(3,-7)$","id":"T2Q1","label":"T2 Q1","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":2,"topic":"diag","sub":"Not diagonalizable","text":"Show that the matrix $A=\\begin{bmatrix}1&2\\\\0&1\\end{bmatrix}$ is not diagonalizable","steps":["Triangular $\\Rightarrow\\lambda=1,1$","$A-I=\\begin{bmatrix}0&2\\\\0&0\\end{bmatrix}\\Rightarrow x_2=0$: only $X=(1,0)^T$ (one independent eigenvector)","A 2x2 matrix needs 2 independent eigenvectors $\\Rightarrow$ not diagonalizable"],"ans":"Only one independent eigenvector","id":"T2Q2","label":"T2 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":3,"topic":"diag","sub":"2x2 with P","text":"Show that the matrix A is diagonalizable. $A=\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$ Then find matrix $P$ such that $P^{-1}AP$ is diagonal","slide":"Unit I Diagonalization Example 1 (worked in the Important Topics tab)","steps":["$\\lambda=3,-1$ (distinct)","$v_1=(1,1)^T,\\;v_2=(-1,1)^T$","$P=\\begin{bmatrix}1&-1\\\\1&1\\end{bmatrix}$, $P^{-1}AP=\\text{diag}(3,-1)$"],"ans":"$D=\\text{diag}(3,-1)$","id":"T2Q3","label":"T2 Q3","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":2,"n":4,"topic":"diag","sub":"3x3 test","text":"Determine if the following matrix is diagonalizable. $A=\\begin{bmatrix}4&2&-2\\\\-5&3&2\\\\-2&4&1\\end{bmatrix}$","steps":["Same matrix as Tutorial 1 Q6: $\\lambda=1,2,5$ (distinct)","Distinct eigenvalues $\\Rightarrow$ 3 independent eigenvectors $\\Rightarrow$ diagonalizable","$P=\\begin{bmatrix}2&1&0\\\\1&1&1\\\\4&2&1\\end{bmatrix}$ (columns for $\\lambda=1,2,5$), $D=\\text{diag}(1,2,5)$"],"ans":"Yes, diagonalizable","id":"T2Q4","label":"T2 Q4","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":5,"topic":"diag","sub":"Not diagonalizable (3x3)","text":"Show that the matrix A is not diagonalizable $A=\\begin{bmatrix}2&1&0\\\\0&2&0\\\\0&0&2\\end{bmatrix}$.","steps":["$\\lambda=2$ (three times)","From Tutorial 1 Q4 only 2 independent eigenvectors $(1,0,0)^T,(0,0,1)^T$","Need 3 for a 3x3 $\\Rightarrow$ not diagonalizable"],"ans":"Only 2 independent eigenvectors","id":"T2Q5","label":"T2 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":2,"n":6,"topic":"diag","sub":"2x2 with P","text":"Show that the matrix A is diagonalizable. $A=\\begin{bmatrix}14&-10\\\\5&-1\\end{bmatrix}$ Then find matrix $P$ such that $P^{-1}AP$ is diagonal","slide":"Unit I Eigen Example 1 (eigenvalues 4, 9)","steps":["$\\lambda=4,9$ (distinct) $\\Rightarrow$ diagonalizable","$X_1=(1,1)^T,\\;X_2=(2,1)^T$","$P=\\begin{bmatrix}1&2\\\\1&1\\end{bmatrix},\\;|P|=-1,\\;P^{-1}=\\begin{bmatrix}-1&2\\\\1&-1\\end{bmatrix}$","$P^{-1}AP=\\text{diag}(4,9)$"],"ans":"$P=\\begin{bmatrix}1&2\\\\1&1\\end{bmatrix},\\;D=\\text{diag}(4,9)$","id":"T2Q6","label":"T2 Q6","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":3,"n":1,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $2x_1+3x_2+x_3=9,\\;x_1+2x_2+3x_3=6,\\;3x_1+x_2+2x_3=8$","slide":"Matrix = Unit I LU Example 1","steps":["$L=\\begin{bmatrix}1&0&0\\\\\\frac12&1&0\\\\\\frac32&-7&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&3&1\\\\0&\\frac12&\\frac52\\\\0&0&18\\end{bmatrix}$","$LZ=B$: $z_1=9,\\;z_2=6-\\frac92=\\frac32,\\;z_3=8-\\frac{27}{2}+7\\cdot\\frac32=5$","$UX=Z$: $18x_3=5\\Rightarrow x_3=\\frac5{18}$","$\\frac12x_2+\\frac52\\cdot\\frac5{18}=\\frac32\\Rightarrow x_2=\\frac{29}{18}$","$2x_1+3\\cdot\\frac{29}{18}+\\frac5{18}=9\\Rightarrow x_1=\\frac{35}{18}$"],"ans":"$x_1=\\frac{35}{18},\\;x_2=\\frac{29}{18},\\;x_3=\\frac{5}{18}$","id":"T3Q1","label":"T3 Q1","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":3,"n":2,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $10x_1+x_2+x_3=12,\\;2x_1+10x_2+x_3=13,\\;2x_1+2x_2+10x_3=14$","steps":["$u_{11}=10,u_{12}=1,u_{13}=1$; $l_{21}=\\frac15,\\;l_{31}=\\frac15$","$u_{22}=10-\\frac15=\\frac{49}{5},\\;u_{23}=1-\\frac15=\\frac45$","$l_{32}=\\dfrac{2-\\frac15}{49/5}=\\frac{9}{49},\\;u_{33}=10-\\frac15-\\frac{9}{49}\\cdot\\frac45=\\frac{473}{49}$","$LZ=B$: $z_1=12,\\;z_2=13-\\frac{12}{5}=\\frac{53}{5},\\;z_3=\\frac{473}{49}$","$UX=Z$: $x_3=1,\\;x_2=1,\\;x_1=1$"],"ans":"$x_1=x_2=x_3=1$","id":"T3Q2","label":"T3 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":3,"n":3,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $2x_1+2x_2+3x_3=4,\\;4x_1-2x_2+x_3=9,\\;x_1+5x_2+4x_3=3$","pyq":"B1B","slide":"Unit I LU Example 2","steps":["$L=\\begin{bmatrix}1&0&0\\\\2&1&0\\\\\\frac12&-\\frac23&1\\end{bmatrix},\\;U=\\begin{bmatrix}2&2&3\\\\0&-6&-5\\\\0&0&-\\frac56\\end{bmatrix}$ (see PYQ B1B)","$LZ=B$: $z_1=4,\\;z_2=1,\\;z_3=\\frac53$","$UX=Z$: $x_3=-2,\\;x_2=\\frac32,\\;x_1=\\frac72$"],"ans":"$x_1=\\frac72,\\;x_2=\\frac32,\\;x_3=-2$","id":"T3Q3","label":"T3 Q3","rel":"similar","pri":"P2","why":"Same matrix/result as a PYQ with a small change."},{"t":3,"n":4,"topic":"lu","sub":"Solve by LU","text":"Solve the system of equations by LU Decomposition method $3x+2y+7z=4,\\;2x+3y+z=5,\\;3x+4y+z=7$","pyq":"A1B","note":"Coefficient matrix is the PYQ TA-I Set A Q1B matrix; here the system is also solved.","steps":["$L=\\begin{bmatrix}1&0&0\\\\\\frac23&1&0\\\\1&\\frac65&1\\end{bmatrix},\\;U=\\begin{bmatrix}3&2&7\\\\0&\\frac53&-\\frac{11}{3}\\\\0&0&-\\frac85\\end{bmatrix}$","$LZ=B$: $z_1=4,\\;z_2=5-\\frac83=\\frac73,\\;z_3=7-4-\\frac65\\cdot\\frac73=\\frac15$","$-\\frac85z=\\frac15\\Rightarrow z=-\\frac18$","$\\frac53y-\\frac{11}{3}\\left(-\\frac18\\right)=\\frac73\\Rightarrow y=\\frac98$","$3x+2\\cdot\\frac98+7\\left(-\\frac18\\right)=4\\Rightarrow x=\\frac78$"],"ans":"$x=\\frac78,\\;y=\\frac98,\\;z=-\\frac18$","id":"T3Q4","label":"T3 Q4","rel":"similar","pri":"P2","why":"Same matrix/result as a PYQ with a small change."},{"t":3,"n":5,"topic":"chol","sub":"Solve by Cholesky","text":"Solve the system of equations by Cholesky method $4x_1+6+8x_3=0,\\;6x_1+34x_2+52x_3=-160,\\;8x_1+52x_2+129x_3=-452.$","note":"The PDF prints the first equation as '$4x_1+6+8x_3=0$'. A symmetric matrix (needed for Cholesky) implies $4x_1+6x_2+8x_3=0$; the solution below uses that reading.","steps":["$A=\\begin{bmatrix}4&6&8\\\\6&34&52\\\\8&52&129\\end{bmatrix}$; $l_{11}=2,\\;l_{21}=3,\\;l_{31}=4$","$l_{22}=\\sqrt{34-9}=5,\\;l_{32}=\\frac{52-12}{5}=8,\\;l_{33}=\\sqrt{129-16-64}=7$","$LZ=B$: $z_1=0,\\;z_2=-32,\\;z_3=\\frac{-452+256}{7}=-28$","$L^TX=Z$: $7x_3=-28\\Rightarrow x_3=-4$; $5x_2+8(-4)=-32\\Rightarrow x_2=0$; $2x_1+0+4(-4)=0\\Rightarrow x_1=8$"],"ans":"$x_1=8,\\;x_2=0,\\;x_3=-4$ (with the $x_2$ reading)","id":"T3Q5","label":"T3 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":3,"n":6,"topic":"chol","sub":"Solve by Cholesky","text":"Solve the system of equations by Cholesky method $9x_1+6x_2+12x_3=17.4,\\;6x_1+13x_2+11x_3=23.6,\\;12x_1+11x_2+26x_3=30.8$","pyq":"A2B","slide":"Unit I Cholesky Example 2","id":"T3Q6","label":"T3 Q6","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":3,"n":7,"topic":"chol","sub":"Solve by Cholesky","text":"Solve the system of equations by Cholesky method $4x_1+2x_2+14x_3=14,\\;2x_1+17x_2-5x_3=-101,\\;14x_1-5x_2+83x_3=155$","pyq":"B2B","id":"T3Q7","label":"T3 Q7","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":3,"n":8,"topic":"chol","sub":"Decompose only","text":"Decompose the matrix A using Cholesky's method $A=\\begin{bmatrix}2&-1&0\\\\-1&3&1\\\\0&1&2\\end{bmatrix}$","slide":"Unit I Cholesky Example 1 (worked in the Important Topics tab)","steps":["$l_{11}=\\sqrt2,\\;l_{21}=-\\frac1{\\sqrt2},\\;l_{31}=0$","$l_{22}=\\sqrt{3-\\frac12}=\\sqrt{\\frac52},\\;l_{32}=\\frac{1}{\\sqrt{5/2}}=\\sqrt{\\frac25}$","$l_{33}=\\sqrt{2-\\frac25}=\\sqrt{\\frac85}$"],"ans":"$L=\\begin{bmatrix}\\sqrt2&0&0\\\\-\\frac1{\\sqrt2}&\\sqrt{\\frac52}&0\\\\0&\\sqrt{\\frac25}&\\sqrt{\\frac85}\\end{bmatrix}$","id":"T3Q8","label":"T3 Q8","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":1,"topic":"form","sub":"Two constants, log x","text":"Form the differential equations by eliminating the arbitrary constants from $y=A\\sin(\\log x)+B\\cos(\\log x)$. where A and B are arbitrary constants.","pyq":"A4A","slide":"Unit II Formation Example 02","id":"T4Q1","label":"T4 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":4,"n":2,"topic":"form","sub":"Two constants","text":"Obtain the differential equations whose general solution is $xy=ae^x+be^{-x}+x^2$ where $a$ and $b$ are arbitrary constants.","slide":"Unit II Formation Exercise 4","steps":["Differentiate: $xy_1+y=ae^x-be^{-x}+2x$","Again: $xy_2+2y_1=ae^x+be^{-x}+2=(xy-x^2)+2$","$x\\dfrac{d^2y}{dx^2}+2\\dfrac{dy}{dx}-xy+x^2-2=0$"],"ans":"$xy''+2y'-xy+x^2-2=0$","id":"T4Q2","label":"T4 Q2","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":3,"topic":"form","sub":"Two constants","text":"Obtain the differential equations whose general solution is $y=Ae^{-9t}\\cos(3t+B)$ where A and B are arbitrary constants.","slide":"Unit II Formation Example 03","steps":["$ye^{9t}=A\\cos(3t+B)$","Differentiate: $e^{9t}(y_1+9y)=-3A\\sin(3t+B)$","Again: $e^{9t}(y_2+18y_1+81y)=-9A\\cos(3t+B)=-9ye^{9t}$","$\\dfrac{d^2y}{dt^2}+18\\dfrac{dy}{dt}+90y=0$"],"ans":"$y''+18y'+90y=0$","id":"T4Q3","label":"T4 Q3","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":4,"topic":"form","sub":"Family of curves","text":"Form the differential equation of all circles touching $y$ axis at origin and centers on $x$ axis.","slide":"Unit II Formation Example 06","steps":["Circle: $(x-a)^2+y^2=a^2\\Rightarrow x^2+y^2=2ax$ (one constant)","Differentiate: $2x+2yy'=2a\\Rightarrow a=x+yy'$","Substitute: $x^2+y^2=2x(x+yy')$"],"ans":"$2xy\\dfrac{dy}{dx}=y^2-x^2$","id":"T4Q4","label":"T4 Q4","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":4,"n":5,"topic":"form","sub":"Two exponentials","text":"Form the differential equation whose general solution is $y=ae^{-2x}+be^{-3x}$, where $a$ and $b$ are arbitrary constants","pyq":"B4A","slide":"Unit II Formation Exercise 1","id":"T4Q5","label":"T4 Q5","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":4,"n":6,"topic":"form","sub":"Two constants","text":"Obtain the differential equations whose general solution is $y=e^x(A\\cos x+B\\sin x)$ Where A and B are arbitrary constants.","steps":["Let $w=e^x(-A\\sin x+B\\cos x)$; then $y_1=y+w$","$w'=w-y$ (differentiate $w$)","$y_2=y_1+w'=y_1+(y_1-y)-y$"],"ans":"$\\dfrac{d^2y}{dx^2}-2\\dfrac{dy}{dx}+2y=0$","id":"T4Q6","label":"T4 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":4,"n":7,"topic":"form","sub":"Determinant elimination","text":"Form the differential equations by eliminating the arbitrary constants from $Ax^2+By^2=1.$ where A and B are arbitrary constants.","slide":"Unit II Formation Example 05","steps":["$Ax+Byy_1=0,\\quad A+B(y_1^2+yy_2)=0$","Eliminate with $\\begin{vmatrix}x^2&y^2&-1\\\\x&yy_1&0\\\\1&y_1^2+yy_2&0\\end{vmatrix}=0$","$-1\\,[x(y_1^2+yy_2)-yy_1]=0$"],"ans":"$xy\\dfrac{d^2y}{dx^2}+x\\left(\\dfrac{dy}{dx}\\right)^2-y\\dfrac{dy}{dx}=0$","id":"T4Q7","label":"T4 Q7","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":5,"n":1,"topic":"exact","sub":"Exact","text":"Obtain the general solution of the differential equation $(2xy+e^y)dx+(x^2+xe^y)dy=0.$","pyq":"A3A","slide":"Unit II Exact Example 03","id":"T5Q1","label":"T5 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":5,"n":2,"topic":"exact","sub":"Rearrange then exact","text":"Obtain the general solution of the differential equation $\\dfrac{dy}{dx}=\\dfrac{y+1}{(y+2)e^y-x}$.","slide":"Unit II Exact Exercise 3","steps":["Rewrite: $(y+1)dx+\\left[x-(y+2)e^y\\right]dy=0$","$M_y=1=N_x\\Rightarrow$ exact","$\\int M\\,dx=x(y+1)$; $N$ terms free of $x$: $-(y+2)e^y$, $\\int-(y+2)e^ydy=-(y+1)e^y$","$x(y+1)-(y+1)e^y=c$"],"ans":"$(y+1)(x-e^y)=c$","id":"T5Q2","label":"T5 Q2","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":5,"n":3,"topic":"exact","sub":"Exact (trig)","text":"Solve the differential equation $(1+2xy\\cos x^2-2xy)dx+(\\sin x^2-x^2)dy=0$","steps":["$M_y=2x\\cos x^2-2x=N_x$ ✓","$\\int M\\,dx=x+y\\sin x^2-x^2y$ (using $\\int2x\\cos x^2dx=\\sin x^2$)","All terms of $N$ contain $x$"],"ans":"$x+y\\sin x^2-x^2y=c$","id":"T5Q3","label":"T5 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":5,"n":4,"topic":"exact","sub":"Exact (exponential)","text":"Solve the differential equation $\\left(y^2e^{xy^2}+4x^3\\right)dx+\\left(2xye^{xy^2}-3y^2\\right)dy=0.$","slide":"Unit II Exact Exercise 4","steps":["$M_y=2ye^{xy^2}+2xy^3e^{xy^2}=N_x$ ✓","$\\int M\\,dx=e^{xy^2}+x^4$","$N$ terms free of $x$: $-3y^2\\Rightarrow-y^3$"],"ans":"$e^{xy^2}+x^4-y^3=c$","id":"T5Q4","label":"T5 Q4","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":5,"n":5,"topic":"exact","sub":"Find constants for exactness","text":"For what values of $a$ and $b$, the differential equation $(y+x^3)dx+(ax+by^3)dy=0$ is exact. Also find the solution of the equation.","steps":["$M_y=1,\\;N_x=a\\Rightarrow$ exact iff $a=1$; $b$ can be any value","$\\int M\\,dx=xy+\\frac{x^4}{4}$; $N$ term free of $x$: $by^3\\Rightarrow\\frac{by^4}{4}$"],"ans":"$a=1$, any $b$: $\\;\\frac{x^4}{4}+xy+\\frac{by^4}{4}=c$","id":"T5Q5","label":"T5 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":5,"n":6,"topic":"reduc","sub":"Rule I (homogeneous)","text":"Reduce the differential equation $(xy-2y^2)dx-(x^2-3xy)dy=0$ into exact differential equation and find the general solution.","slide":"Unit II Reducible Exercise 2","steps":["Homogeneous (degree 2); $Mx+Ny=x^2y-2xy^2-x^2y+3xy^2=xy^2$","IF $=\\frac1{xy^2}$: $\\left(\\frac1y-\\frac2x\\right)dx+\\left(-\\frac{x}{y^2}+\\frac3y\\right)dy=0$ (exact)","$\\frac xy-2\\log x+3\\log y=c$"],"ans":"$\\frac xy-2\\log x+3\\log y=c$","id":"T5Q6","label":"T5 Q6","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":5,"n":7,"topic":"reduc","sub":"Rule I (homogeneous)","text":"Solve the differential equation $(x^2y-2xy^2)dx-(x^3-3x^2y)dy=0$.","pyq":"A4B","slide":"Unit II Reducible Example 01","id":"T5Q7","label":"T5 Q7","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":5,"n":8,"topic":"reduc","sub":"Rule II","text":"Find the general solution of the differential equation $(x^2y^2+2)ydx+(2-2x^2y^2)xdy=0$.","slide":"Unit II Reducible Exercise 3","steps":["Form $yf_1(xy)dx+xf_2(xy)dy\\Rightarrow$ Rule II","$Mx-Ny=xy(x^2y^2+2)-xy(2-2x^2y^2)=3x^3y^3\\Rightarrow$ IF $=\\frac{1}{3x^3y^3}$","$\\left(\\frac{1}{3x}+\\frac{2}{3x^3y^2}\\right)dx+\\left(\\frac{2}{3x^2y^3}-\\frac{2}{3y}\\right)dy=0$ (exact)","$\\int M\\,dx=\\frac13\\log x-\\frac{1}{3x^2y^2}$; $N$ terms free of $x$: $-\\frac2{3y}\\Rightarrow-\\frac23\\log y$","Multiply by 3: $\\log x-\\frac{1}{x^2y^2}-2\\log y=C$"],"ans":"$\\log\\dfrac{x}{y^2}-\\dfrac{1}{x^2y^2}=C$","id":"T5Q8","label":"T5 Q8","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":5,"n":9,"topic":"reduc","sub":"Rule II","text":"Obtain the Integrating factor of the differential equation $(1+xy)ydx+(1-xy)xdy=0$ and use it to find the general solution.","pyq":"B4B","slide":"Unit II Reducible Exercise 4","id":"T5Q9","label":"T5 Q9","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":6,"n":1,"topic":"linear","sub":"Linear in y","text":"Solve the differential equation $(1+x^2)\\dfrac{dy}{dx}+y=e^{\\tan^{-1}x}$.","pyq":"A3B","slide":"Unit II Linear Exercise 1","id":"T6Q1","label":"T6 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":6,"n":2,"topic":"linear","sub":"Linear in y","text":"Solve the differential equation $\\dfrac{dy}{dx}+\\dfrac{3y}{x}=\\dfrac{\\sin x}{x^3}$","steps":["$P=\\frac3x\\Rightarrow$ IF $=e^{3\\log x}=x^3$","$yx^3=\\int\\frac{\\sin x}{x^3}x^3dx=\\int\\sin x\\,dx$"],"ans":"$x^3y=-\\cos x+c$","id":"T6Q2","label":"T6 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":6,"n":3,"topic":"linear","sub":"Linear in y","text":"Find the general solution of the linear differential equation $\\dfrac{dy}{dx}+y\\cot x=x\\,\\text{cosec}\\,x$","slide":"Unit II Linear Exercise 5","steps":["IF $=e^{\\int\\cot x\\,dx}=e^{\\log\\sin x}=\\sin x$","$y\\sin x=\\int x\\,\\text{cosec}\\,x\\sin x\\,dx=\\int x\\,dx$"],"ans":"$y\\sin x=\\frac{x^2}{2}+c$","id":"T6Q3","label":"T6 Q3","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":6,"n":4,"topic":"linear","sub":"Rearrange then linear","text":"Solve the differential equation $x^2\\dfrac{dy}{dx}=3x^2-2xy+1$.","pyq":"B3B","slide":"Unit II Linear Exercise 2","id":"T6Q4","label":"T6 Q4","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":6,"n":5,"topic":"linear","sub":"Linear in y","text":"Solve the differential equation $\\dfrac{dy}{dx}+\\dfrac{4x}{1+x^2}y=\\dfrac{1}{(x^2+1)^3}$","slide":"Unit II Linear Exercise 4 (same type)","steps":["IF $=e^{\\int\\frac{4x}{1+x^2}dx}=e^{2\\log(1+x^2)}=(1+x^2)^2$","$y(1+x^2)^2=\\int\\frac{(1+x^2)^2}{(1+x^2)^3}dx=\\int\\frac{dx}{1+x^2}$"],"ans":"$y(1+x^2)^2=\\tan^{-1}x+c$","id":"T6Q5","label":"T6 Q5","pri":"P1","why":"Worked/listed in your slides; topic priority P1 (Prepare first)."},{"t":6,"n":6,"topic":"growth","sub":"Natural growth","text":"A bacterial population B is known to have a rate of growth proportional to B itself. If between noon and 2 PM the population triples, at what time, no controls being exerted, should B become 100 times what it was at noon.","slide":"Unit II Growth Example 01","steps":["$B=B_0e^{kt}$; $3=e^{2k}\\Rightarrow k=\\frac12\\ln3=0.5493$","$100=e^{kt}\\Rightarrow t=\\frac{\\ln100}{0.5493}\\approx8.38$ h"],"ans":"About 8.38 hours after noon, i.e. roughly 8:23 PM","id":"T6Q6","label":"T6 Q6","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":6,"n":7,"topic":"growth","sub":"Natural growth","text":"If the population of a country doubles in 50 years, in how many years will it treble under the assumption that the rate of increase is proportional to the number of inhabitants.","steps":["$P=P_0e^{kt}$; $2=e^{50k}\\Rightarrow k=\\frac{\\ln2}{50}$","$3=e^{kt}\\Rightarrow t=\\frac{50\\ln3}{\\ln2}$"],"ans":"$t\\approx79.25$ years","id":"T6Q7","label":"T6 Q7","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":6,"n":8,"topic":"growth","sub":"Decay / half-life","text":"Radium decomposes at a rate proportional the quantity of radium present. Suppose that it is found that in 25 years approximately 1.1% of a certain quantity of radium has decomposed. Determine approximately how long will it take for one-half of the original amount of radium to decompose.","slide":"Unit II Decay Example 01","steps":["$m=m_0e^{-kt}$; $0.989=e^{-25k}\\Rightarrow k=-\\frac{\\ln0.989}{25}=0.000442$","$\\frac12=e^{-kt}\\Rightarrow t=\\frac{\\ln2}{k}$"],"ans":"≈ 1567 years (the slide rounds k to 0.000443 and gets ≈ 1565 years)","id":"T6Q8","label":"T6 Q8","pri":"P2","why":"Worked/listed in your slides; topic priority P2 (Prepare next)."},{"t":6,"n":9,"topic":"growth","sub":"Natural growth","text":"The number $N$ of bacteria in a culture grew at a rate proportional to N. The value of $N$ was initially 100 and increased to 332 in one hour, what would be the value of $N$ after 1.5 hours.","steps":["$N=100e^{kt}$; $332=100e^{k}\\Rightarrow e^k=3.32$","$N(1.5)=100\\,(3.32)^{1.5}$"],"ans":"$N(1.5)\\approx605$","id":"T6Q9","label":"T6 Q9","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":6,"n":10,"topic":"growth","sub":"Half-life","text":"If half-life of uranium is 1500 years. (a) Find percentage of original amount that will remain after 4500 years, (b) Find in how many years will only $\\frac{1}{10}$ of the original amount remain?","steps":["$k=\\frac{\\ln2}{1500}$","(a) 4500 years = 3 half-lives $\\Rightarrow\\left(\\frac12\\right)^3=\\frac18$","(b) $\\frac1{10}=e^{-kt}\\Rightarrow t=\\frac{1500\\ln10}{\\ln2}$"],"ans":"(a) 12.5% (b) ≈ 4983 years","id":"T6Q10","label":"T6 Q10","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":1,"topic":"pdbasic","sub":"Laplace's equation","text":"If $u=(x^2+y^2+z^2)^{-\\frac12}$ then Show that $\\dfrac{\\partial^2u}{\\partial x^2}+\\dfrac{\\partial^2u}{\\partial y^2}+\\dfrac{\\partial^2u}{\\partial z^2}=0$","steps":["Let $r^2=x^2+y^2+z^2$, $u=r^{-1}$; $\\frac{\\partial r}{\\partial x}=\\frac xr$","$u_x=-xr^{-3}$, $u_{xx}=-r^{-3}+3x^2r^{-5}$","Similarly for $y,z$; add: $-3r^{-3}+3(x^2+y^2+z^2)r^{-5}=-3r^{-3}+3r^{-3}=0$ ∎"],"ans":"= 0","id":"T7Q1","label":"T7 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":2,"topic":"pdbasic","sub":"Laplace's equation","text":"If $u=3(ax+by+cz)^2-(x^2+y^2+z^2)$ and $a^2+b^2+c^2=1$ then show that $\\dfrac{\\partial^2u}{\\partial x^2}+\\dfrac{\\partial^2u}{\\partial y^2}+\\dfrac{\\partial^2u}{\\partial z^2}=0.$","steps":["$u_x=6a(ax+by+cz)-2x\\Rightarrow u_{xx}=6a^2-2$","Similarly $u_{yy}=6b^2-2,\\;u_{zz}=6c^2-2$","Sum $=6(a^2+b^2+c^2)-6=0$ ∎"],"ans":"= 0","id":"T7Q2","label":"T7 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":3,"topic":"composite","sub":"Wave equation","text":"If $z=f(x+ct)+\\varphi(x-ct)$ then show that $\\dfrac{\\partial^2z}{\\partial t^2}=c^2\\dfrac{\\partial^2z}{\\partial x^2}$","pyq":"D1A","id":"T7Q3","label":"T7 Q3","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":7,"n":4,"topic":"pdbasic","sub":"Operator form","text":"If $u=\\log(x^3+y^3-xy^2-x^2y)$ then Prove that $\\left(\\dfrac{\\partial}{\\partial x}+\\dfrac{\\partial}{\\partial y}\\right)^2u=\\dfrac{-4}{(x+y)^2}$.","steps":["$x^3+y^3-xy^2-x^2y=(x+y)(x-y)^2\\Rightarrow u=\\log(x+y)+2\\log(x-y)$","$\\left(\\partial_x+\\partial_y\\right)u=\\frac{2}{x+y}+2\\left(\\frac1{x-y}-\\frac1{x-y}\\right)=\\frac{2}{x+y}$","Apply again: $\\left(\\partial_x+\\partial_y\\right)\\frac{2}{x+y}=-\\frac{2}{(x+y)^2}\\cdot2=\\frac{-4}{(x+y)^2}$ ∎"],"ans":"$\\dfrac{-4}{(x+y)^2}$","id":"T7Q4","label":"T7 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":5,"topic":"pdbasic","sub":"First & second order","text":"Find the first and second-order partial derivatives of $z=x^3+y^3-3axy$","steps":["$z_x=3x^2-3ay,\\quad z_y=3y^2-3ax$","$z_{xx}=6x,\\quad z_{yy}=6y,\\quad z_{xy}=z_{yx}=-3a$"],"ans":"$z_{xx}=6x,\\;z_{xy}=-3a,\\;z_{yy}=6y$","id":"T7Q5","label":"T7 Q5","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":7,"n":6,"topic":"pdbasic","sub":"Identity","text":"If $u=\\log(\\tan x+\\tan y+\\tan z)$ Show that $\\sin2x\\dfrac{\\partial u}{\\partial x}+\\sin2y\\dfrac{\\partial u}{\\partial y}+\\sin2z\\dfrac{\\partial u}{\\partial z}=2.$","pyq":"C2A","id":"T7Q6","label":"T7 Q6","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":7,"n":7,"topic":"pdbasic","sub":"Mixed derivatives","text":"If $u=\\log(x^2+y^2+z^2)$ then Show that $x\\dfrac{\\partial^2u}{\\partial y\\partial z}=y\\dfrac{\\partial^2u}{\\partial x\\partial z}=z\\dfrac{\\partial^2u}{\\partial x\\partial y}$","steps":["Let $r^2=x^2+y^2+z^2$; $u_z=\\frac{2z}{r^2}$","$u_{yz}=-\\frac{4yz}{r^4}$, $u_{xz}=-\\frac{4xz}{r^4}$, $u_{xy}=-\\frac{4xy}{r^4}$","Each product $=-\\frac{4xyz}{r^4}$ ∎"],"ans":"All equal $-\\frac{4xyz}{(x^2+y^2+z^2)^2}$","id":"T7Q7","label":"T7 Q7","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":8,"n":1,"topic":"euler","sub":"Corollary with cos⁻¹","text":"If $u=\\cos^{-1}(x^2+y^2)$ then find $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}$ and $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}$.","steps":["$f(u)=\\cos u=x^2+y^2$, $n=2$","$g(u)=2\\frac{\\cos u}{-\\sin u}=-2\\cot u$","$g'(u)=2\\,\\text{cosec}^2u$","$g(g'-1)=-2\\cot u\\,(2\\,\\text{cosec}^2u-1)$"],"ans":"$-2\\cot u$ and $-2\\cot u\\,(2\\,\\text{cosec}^2u-1)$","id":"T8Q1","label":"T8 Q1","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":2,"topic":"euler","sub":"Corollary with tan⁻¹","text":"If $u=\\tan^{-1}\\left(\\dfrac{x^3+y^3}{x+y}\\right)$ then Show that $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}=\\sin2u\\,[1-4\\sin^2u]$.","pyq":"C1A","id":"T8Q2","label":"T8 Q2","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":8,"n":3,"topic":"euler","sub":"Three variables, U + W","text":"If $u=\\dfrac{xyz}{2x+y+z}+\\log\\left(\\dfrac{x^2+y^2+z^2}{xy+yz}\\right)$ then find $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}+z\\dfrac{\\partial u}{\\partial z}$.","pyq":"D2B","id":"T8Q3","label":"T8 Q3","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":8,"n":4,"topic":"euler","sub":"Corollary with sec⁻¹","text":"If $u=\\sec^{-1}\\left(\\dfrac{x^3+y^3}{x+y}\\right)$ then Show that $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}=2\\cot u$.","steps":["$f(u)=\\sec u=\\frac{x^3+y^3}{x+y}$, degree $n=2$","$g(u)=2\\frac{\\sec u}{\\sec u\\tan u}=\\frac{2}{\\tan u}=2\\cot u$ ∎"],"ans":"$2\\cot u$","id":"T8Q4","label":"T8 Q4","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":5,"topic":"euler","sub":"Three variables, U + W","text":"If $u=\\dfrac{x^3y^3z^3}{x^2+y^2+z^2}+\\cos\\left(\\dfrac{xy+yz+zx}{x^2+y^2+z^2}\\right)$, then show that $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}+z\\dfrac{\\partial u}{\\partial z}=7\\left[\\dfrac{x^3y^3z^3}{x^2+y^2+z^2}\\right]$.","steps":["$U=\\frac{x^3y^3z^3}{x^2+y^2+z^2}$: degree $9-2=7\\Rightarrow\\sum xU_x=7U$","$W=\\cos(\\cdot)$ of a degree-0 ratio $\\Rightarrow W$ is homogeneous of degree 0 $\\Rightarrow\\sum xW_x=0$","Sum $=7U$ ∎"],"ans":"$7\\dfrac{x^3y^3z^3}{x^2+y^2+z^2}$","id":"T8Q5","label":"T8 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":6,"topic":"euler","sub":"Verify Euler","text":"Verify Euler's theorem $f(x,y,z)=3x^2yz+5xy^2z+4z^4$.","steps":["Every term has degree 4 $\\Rightarrow n=4$","$f_x=6xyz+5y^2z,\\;f_y=3x^2z+10xyz,\\;f_z=3x^2y+5xy^2+16z^3$","$xf_x+yf_y+zf_z=12x^2yz+20xy^2z+16z^4=4f$ ✓"],"ans":"$xf_x+yf_y+zf_z=4f$","id":"T8Q6","label":"T8 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":7,"topic":"euler","sub":"Fractional degree, 2nd order","text":"If $u=\\text{cosec}^{-1}\\sqrt{\\dfrac{x^{\\frac12}+y^{\\frac12}}{x^{\\frac13}+y^{\\frac13}}}$ then prove that $x^2u_{xx}+2xyu_{xy}+y^2u_{yy}=\\dfrac{\\tan u}{12}\\left(\\dfrac{13}{12}+\\dfrac{\\tan^2u}{12}\\right)$.","steps":["$f(u)=\\text{cosec}\\,u$ has degree $\\frac12\\left(\\frac12-\\frac13\\right)=\\frac1{12}$","$g(u)=\\frac1{12}\\cdot\\frac{\\text{cosec}\\,u}{-\\text{cosec}\\,u\\cot u}=-\\frac{\\tan u}{12}$","$g'(u)=-\\frac{\\sec^2u}{12}$","$g(g'-1)=\\frac{\\tan u}{12}\\left(\\frac{\\sec^2u}{12}+1\\right)=\\frac{\\tan u}{12}\\left(\\frac{13}{12}+\\frac{\\tan^2u}{12}\\right)$ ∎"],"ans":"As required","id":"T8Q7","label":"T8 Q7","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":8,"topic":"euler","sub":"Fractional (negative) degree","text":"If $u=\\sin^{-1}\\left(\\dfrac{x^{\\frac13}+y^{\\frac13}}{x^{\\frac12}-y^{\\frac12}}\\right)^{\\frac12}$ then prove that (i) $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}=-\\dfrac1{12}\\tan u$ (ii) $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}=\\dfrac{\\tan u}{144}(\\tan^2u+13)$","steps":["$f(u)=\\sin u$ has degree $\\frac12\\left(\\frac13-\\frac12\\right)=-\\frac1{12}$","(i) $g=-\\frac1{12}\\frac{\\sin u}{\\cos u}=-\\frac{\\tan u}{12}$","$g'=-\\frac{\\sec^2u}{12}$","(ii) $g(g'-1)=\\frac{\\tan u}{12}\\left(\\frac{\\sec^2u}{12}+1\\right)=\\frac{\\tan u}{144}(\\sec^2u+12)=\\frac{\\tan u}{144}(\\tan^2u+13)$ ∎"],"ans":"As required","id":"T8Q8","label":"T8 Q8","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":8,"n":9,"topic":"euler","sub":"u itself homogeneous","text":"If $u=x^3y^2\\sin^{-1}\\left(\\dfrac yx\\right)$ then find $x\\dfrac{\\partial u}{\\partial x}+y\\dfrac{\\partial u}{\\partial y}$ and $x^2\\dfrac{\\partial^2u}{\\partial x^2}+2xy\\dfrac{\\partial^2u}{\\partial x\\partial y}+y^2\\dfrac{\\partial^2u}{\\partial y^2}$.","steps":["$\\sin^{-1}(y/x)$ has degree 0, so $u$ is homogeneous of degree $n=5$","Euler: $xu_x+yu_y=5u$","Second order: $n(n-1)u=20u$"],"ans":"$5u$ and $20u$","id":"T8Q9","label":"T8 Q9","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":9,"n":1,"topic":"jacob","sub":"Inverse Jacobian","text":"If $u=x^2-y^2$ and $v=2xy$ then find $\\dfrac{\\partial(x,y)}{\\partial(u,v)}$.","steps":["$\\frac{\\partial(u,v)}{\\partial(x,y)}=\\begin{vmatrix}2x&-2y\\\\2y&2x\\end{vmatrix}=4(x^2+y^2)$","$JJ'=1\\Rightarrow\\frac{\\partial(x,y)}{\\partial(u,v)}=\\frac{1}{4(x^2+y^2)}$"],"ans":"$\\dfrac{1}{4(x^2+y^2)}$","id":"T9Q1","label":"T9 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":2,"topic":"jacob","sub":"3x3 Jacobian","text":"If $u=xyz,\\;v=x^2+y^2+z^2$ and $w=x+y+z$. Show that $\\dfrac{\\partial(u,v,w)}{\\partial(x,y,z)}=2(x-y)(y-z)(x-z)$.","steps":["$J=\\begin{vmatrix}yz&zx&xy\\\\2x&2y&2z\\\\1&1&1\\end{vmatrix}=2\\begin{vmatrix}yz&zx&xy\\\\x&y&z\\\\1&1&1\\end{vmatrix}$","$C_1\\to C_1-C_2,\\;C_2\\to C_2-C_3$: $2\\begin{vmatrix}z(y-x)&x(z-y)&xy\\\\x-y&y-z&z\\\\0&0&1\\end{vmatrix}$","$=2(x-y)(y-z)\\begin{vmatrix}-z&-x\\\\1&1\\end{vmatrix}=2(x-y)(y-z)(x-z)$ ∎"],"ans":"$2(x-y)(y-z)(x-z)$","id":"T9Q2","label":"T9 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":3,"topic":"jacob","sub":"3x3 at a point","text":"If $u=x^2+3y^2-z^3,\\;v=4x^2yz$ and $w=2z^2-xy$. then evaluate $\\dfrac{\\partial(x,y,z)}{\\partial(u,v,w)}$ at (1, -1, 0)","pyq":"D2A","note":"PYQ Oct-2025 Q2A uses the point (1, 1, 0); the tutorial uses (1, −1, 0) - the answer changes.","steps":["$J=\\begin{vmatrix}2x&6y&-3z^2\\\\8xyz&4x^2z&4x^2y\\\\-y&-x&4z\\end{vmatrix}$","At $(1,-1,0)$: $\\begin{vmatrix}2&-6&0\\\\0&0&-4\\\\1&-1&0\\end{vmatrix}=2(0-4)+6(0+4)=16$","$\\frac{\\partial(x,y,z)}{\\partial(u,v,w)}=\\frac1{16}$"],"ans":"$\\dfrac1{16}$ (at (1, 1, 0) it is $-\\frac1{16}$)","id":"T9Q3","label":"T9 Q3","rel":"similar","pri":"P2","why":"Same matrix/result as a PYQ with a small change."},{"t":9,"n":4,"topic":"jacob","sub":"Verify JJ' = 1","text":"Calculate $J=\\dfrac{\\partial(u,v)}{\\partial(x,y)}$ and $J^*=\\dfrac{\\partial(x,y)}{\\partial(u,v)}$ verify that $J.J^*=1$ given $u=x+\\dfrac{y^2}{x},\\;v=\\dfrac{y^2}{x}$","pyq":"C1B","id":"T9Q4","label":"T9 Q4","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":9,"n":5,"topic":"funcdep","sub":"Test & find relation","text":"Determine which of the following functions are functionally dependent. Find a functional relation between them in case they are functionally dependent. (i) $u=e^x\\sin y,\\;v=e^x\\cos y$. (ii) $u=\\dfrac xy$ and $v=\\dfrac{x+y}{x-y}$","steps":["(i) $J=\\begin{vmatrix}e^x\\sin y&e^x\\cos y\\\\e^x\\cos y&-e^x\\sin y\\end{vmatrix}=-e^{2x}\\neq0\\Rightarrow$ independent","(ii) $J=\\begin{vmatrix}\\frac1y&-\\frac x{y^2}\\\\\\frac{-2y}{(x-y)^2}&\\frac{2x}{(x-y)^2}\\end{vmatrix}=\\frac{2x}{y(x-y)^2}-\\frac{2x}{y(x-y)^2}=0\\Rightarrow$ dependent","Relation: divide by $y$: $v=\\frac{x/y+1}{x/y-1}=\\frac{u+1}{u-1}$"],"ans":"(i) independent; (ii) dependent, $v=\\dfrac{u+1}{u-1}$","id":"T9Q5","label":"T9 Q5","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":9,"n":6,"topic":"funcdep","sub":"Three functions","text":"If $u=x+y+z,\\;v=x^2+y^2+z^2,\\;w=xy+yz+zx$, examine whether $u,v,w$ are functionally dependent. If so, find the relation between them","steps":["$J=\\begin{vmatrix}1&1&1\\\\2x&2y&2z\\\\y+z&x+z&x+y\\end{vmatrix}$; $R_3\\to R_3+\\tfrac12R_2$ gives $R_3=(x+y+z)(1,1,1)$, proportional to $R_1$","$J=0\\Rightarrow$ functionally dependent","$(x+y+z)^2=x^2+y^2+z^2+2(xy+yz+zx)$"],"ans":"Dependent: $u^2=v+2w$","id":"T9Q6","label":"T9 Q6","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":9,"n":7,"topic":"maxmin","sub":"Minimum value","text":"Show that the minimum value of $f(x,y)=xy+a^3\\left(\\dfrac1x+\\dfrac1y\\right)$ is $3a^2$.","steps":["$f_x=y-\\frac{a^3}{x^2}=0,\\;f_y=x-\\frac{a^3}{y^2}=0\\Rightarrow x=y=a$","$r=\\frac{2a^3}{x^3}=2,\\;s=1,\\;t=\\frac{2a^3}{y^3}=2$ at $(a,a)$","$rt-s^2=3>0,\\;r>0\\Rightarrow$ minimum","$f(a,a)=a^2+a^3\\cdot\\frac2a=3a^2$ ∎"],"ans":"$f_{\\min}=3a^2$ at $(a,a)$ (for $a>0$)","id":"T9Q7","label":"T9 Q7","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":8,"topic":"maxmin","sub":"Single point","text":"Examine the following function for the extreme values $f(x,y)=xy-x^2-y^2-2x-2y+4$","steps":["$f_x=y-2x-2=0,\\;f_y=x-2y-2=0\\Rightarrow(-2,-2)$","$r=-2,\\;s=1,\\;t=-2\\Rightarrow rt-s^2=3>0,\\;r<0$","Maximum; $f(-2,-2)=4-4-4+4+4+4=8$"],"ans":"Maximum value 8 at $(-2,-2)$","id":"T9Q8","label":"T9 Q8","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":9,"topic":"maxmin","sub":"Four points","text":"Discuss the maxima and minima of $f(x,y)=x^3+3xy^2-3x^2-3y^2+7$","steps":["$f_x=3x^2+3y^2-6x=0,\\;f_y=6xy-6y=0\\Rightarrow y=0$ or $x=1$","Points: $(0,0),(2,0),(1,1),(1,-1)$; $r=6x-6,\\;s=6y,\\;t=6x-6$","$(0,0)$: $r=-6,rt-s^2=36>0\\Rightarrow$ max, $f=7$","$(2,0)$: $r=6,rt-s^2=36>0\\Rightarrow$ min, $f=3$","$(1,\\pm1)$: $rt-s^2=-36<0\\Rightarrow$ saddle"],"ans":"Max 7 at (0,0); min 3 at (2,0)","id":"T9Q9","label":"T9 Q9","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":10,"topic":"maxmin","sub":"With parameter a","text":"Find the maxima and minima values of $f(x,y)=x^3+y^3-3axy,\\;a>0$","steps":["$f_x=3x^2-3ay=0,\\;f_y=3y^2-3ax=0\\Rightarrow(0,0),(a,a)$","$r=6x,\\;s=-3a,\\;t=6y$","$(0,0)$: $rt-s^2=-9a^2<0\\Rightarrow$ saddle","$(a,a)$: $rt-s^2=27a^2>0,\\;r=6a>0\\Rightarrow$ minimum $f=-a^3$"],"ans":"Minimum $-a^3$ at $(a,a)$; no maximum","id":"T9Q10","label":"T9 Q10","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":9,"n":11,"topic":"maxmin","sub":"Two points","text":"Find the Extreme Values of $f(x,y)=3y^2-2y^3-3x^2+6xy$","steps":["$f_x=-6x+6y=0\\Rightarrow x=y$; $f_y=6y-6y^2+6x=0\\Rightarrow12y-6y^2=0\\Rightarrow y=0,2$","Points $(0,0),(2,2)$; $r=-6,\\;s=6,\\;t=6-12y$","$(0,0)$: $t=6$, $rt-s^2=-72<0\\Rightarrow$ saddle","$(2,2)$: $t=-18$, $rt-s^2=72>0,\\;r<0\\Rightarrow$ maximum, $f=12-16-12+24=8$"],"ans":"Maximum value 8 at $(2,2)$","id":"T9Q11","label":"T9 Q11","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":10,"n":1,"topic":"duis1","sub":"Rule I","text":"Evaluate the integral $\\displaystyle\\int_0^\\infty\\frac{e^{-x}}{x}\\left(1-e^{-ax}\\right)dx,\\;(a>-1)$.","steps":["$I(a)=\\int_0^\\infty\\frac{e^{-x}-e^{-(1+a)x}}{x}dx$","$I'(a)=\\int_0^\\infty e^{-(1+a)x}dx=\\frac1{1+a}$","$I=\\log(1+a)+c$; $a=0\\Rightarrow I=0\\Rightarrow c=0$"],"ans":"$\\log(1+a)$","id":"T10Q1","label":"T10 Q1","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":2,"topic":"duis1","sub":"Rule I","text":"Show that, $\\displaystyle\\int_0^1\\frac{x^a-1}{\\log x}dx=\\log(a+1),\\;a\\ge0$.","steps":["$I'(a)=\\int_0^1\\frac{x^a\\log x}{\\log x}dx=\\int_0^1x^adx=\\frac{1}{a+1}$","$I=\\log(a+1)+c$; $a=0\\Rightarrow I=0\\Rightarrow c=0$ ∎"],"ans":"$\\log(a+1)$","id":"T10Q2","label":"T10 Q2","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":3,"topic":"duis1","sub":"Rule I","text":"Prove that $\\displaystyle\\int_0^1\\frac{x^a-x^b}{\\log x}dx=\\log\\left(\\frac{a+1}{b+1}\\right),\\;a,b>0$.","steps":["$\\frac{x^a-x^b}{\\log x}=\\frac{x^a-1}{\\log x}-\\frac{x^b-1}{\\log x}$","By Q2: $\\log(a+1)-\\log(b+1)$ (or let $I(a)$, $I'(a)=\\frac1{a+1}$, $I(b)=0$)"],"ans":"$\\log\\frac{a+1}{b+1}$","id":"T10Q3","label":"T10 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":4,"topic":"duis1","sub":"Frullani","text":"Show that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}-e^{-bx}}{x}dx=\\log\\left(\\frac ba\\right),\\;a,b>0$.","pyq":"C3A","note":"Also asked as TA-II Oct-2025 Q3A (D3A).","id":"T10Q4","label":"T10 Q4","rel":"exact","pyq2":"D3A","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":10,"n":5,"topic":"duis1","sub":"Rule I + deduction","text":"Prove that $\\displaystyle\\int_0^\\infty\\frac{e^{-ax}\\sin x}{x}dx=\\cot^{-1}(a)$ and hence deduce that $\\displaystyle\\int_0^\\infty\\left(\\frac{\\sin x}{x}\\right)dx=\\frac\\pi2$.","steps":["$I'(a)=-\\int_0^\\infty e^{-ax}\\sin x\\,dx=-\\frac{1}{1+a^2}$","$I=-\\tan^{-1}a+c$; as $a\\to\\infty$, $I\\to0\\Rightarrow c=\\frac\\pi2$","$I=\\frac\\pi2-\\tan^{-1}a=\\cot^{-1}a$","Put $a=0$: $\\int_0^\\infty\\frac{\\sin x}{x}dx=\\cot^{-1}0=\\frac\\pi2$"],"ans":"$\\cot^{-1}a$; $\\pi/2$","id":"T10Q5","label":"T10 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":6,"topic":"duis1","sub":"Rule I","text":"Evaluate $\\displaystyle\\int_0^\\infty\\frac{\\log(1+bx^2)}{x^2}dx$","steps":["$I'(b)=\\int_0^\\infty\\frac{x^2}{x^2(1+bx^2)}dx=\\int_0^\\infty\\frac{dx}{1+bx^2}=\\frac{\\pi}{2\\sqrt b}$","$I=\\pi\\sqrt b+c$; $b=0\\Rightarrow I=0\\Rightarrow c=0$"],"ans":"$\\pi\\sqrt b\\;(b>0)$","id":"T10Q6","label":"T10 Q6","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":10,"n":7,"topic":"duis2","sub":"Leibnitz rule","text":"If $f(x)=\\displaystyle\\int_0^x(x-t)^2G(t)dt$ then Show that $\\dfrac{d^3f}{dx^3}-2G(x)=0$","pyq":"D4A","id":"T10Q7","label":"T10 Q7","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":10,"n":8,"topic":"duis2","sub":"Leibnitz rule","text":"If $y=\\displaystyle\\int_0^xf(t)\\sin a(x-t)\\,dt$, then show that $\\dfrac{d^2y}{dx^2}+a^2y=af(x)$","pyq":"C4A","id":"T10Q8","label":"T10 Q8","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":10,"n":9,"topic":"duis2","sub":"Variable limits","text":"Show that $\\varphi(a)=\\displaystyle\\int_{\\pi/6a}^{\\pi/2a}\\frac{\\sin ax}{x}dx$ is independent of $a$","steps":["Leibnitz: $\\varphi'(a)=\\int\\cos ax\\,dx+\\frac{\\sin(\\pi/2)}{\\pi/2a}\\left(-\\frac{\\pi}{2a^2}\\right)-\\frac{\\sin(\\pi/6)}{\\pi/6a}\\left(-\\frac{\\pi}{6a^2}\\right)$","$\\int_{\\pi/6a}^{\\pi/2a}\\cos ax\\,dx=\\frac{1-\\frac12}{a}=\\frac1{2a}$; boundary terms $=-\\frac1a+\\frac1{2a}$","$\\varphi'(a)=\\frac1{2a}-\\frac1a+\\frac1{2a}=0\\Rightarrow\\varphi$ independent of $a$ (also: put $t=ax$ to get $\\int_{\\pi/6}^{\\pi/2}\\frac{\\sin t}{t}dt$)"],"ans":"$\\varphi'(a)=0$","id":"T10Q9","label":"T10 Q9","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":11,"n":1,"topic":"erf","sub":"Finite limits","text":"Show that $\\displaystyle\\int_a^be^{-x^2}dx=\\frac{\\sqrt\\pi}{2}\\left[erf(b)-erf(a)\\right]$.","pyq":"C3B","id":"T11Q1","label":"T11 Q1","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":11,"n":2,"topic":"erf","sub":"Complete the square","text":"Show that $\\displaystyle\\int_0^\\infty e^{-x^2-2bx}dx=\\frac{\\sqrt\\pi}{2}.e^{b^2}\\left[1-erf(b)\\right]$.","pyq":"D3B","note":"PYQ Oct-2025 Q3B is the same result written with erfc(a) = 1 − erf(a).","steps":["$-x^2-2bx=-(x+b)^2+b^2$","Put $x+b=t$: $e^{b^2}\\int_b^\\infty e^{-t^2}dt=e^{b^2}\\frac{\\sqrt\\pi}{2}\\text{erfc}(b)$","$\\text{erfc}(b)=1-\\text{erf}(b)$ ∎"],"ans":"$\\frac{\\sqrt\\pi}{2}e^{b^2}[1-\\text{erf}(b)]$","id":"T11Q2","label":"T11 Q2","rel":"similar","pri":"P1","why":"Same matrix/result as a PYQ with a small change."},{"t":11,"n":3,"topic":"erf","sub":"Substitution","text":"If $\\alpha(x)=\\sqrt{\\dfrac2\\pi}\\displaystyle\\int_0^xe^{\\left(-\\frac{t^2}{2}\\right)}dt$ then Prove that $erf(x)=\\alpha\\left[x\\sqrt2\\right]$.","steps":["Put $t=\\sqrt2\\,u$, $dt=\\sqrt2\\,du$: $\\alpha(x)=\\sqrt{\\frac2\\pi}\\sqrt2\\int_0^{x/\\sqrt2}e^{-u^2}du=\\frac{2}{\\sqrt\\pi}\\int_0^{x/\\sqrt2}e^{-u^2}du$","$\\alpha(x)=\\text{erf}\\left(\\frac{x}{\\sqrt2}\\right)\\Rightarrow\\alpha(x\\sqrt2)=\\text{erf}(x)$ ∎"],"ans":"As required","id":"T11Q3","label":"T11 Q3","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":11,"n":4,"topic":"erf","sub":"Definitions","text":"Define Error function and Complementary Error function and hence, Prove that $\\text{erf}_c(-x)+\\text{erf}_c(x)=2.$","pyq":"D4B","id":"T11Q4","label":"T11 Q4","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":11,"n":5,"topic":"erf","sub":"Derivatives","text":"Prove that $\\dfrac1x\\dfrac{d}{da}\\text{erf}_c(ax)=-\\dfrac1a\\dfrac{d}{dx}\\text{erf}(ax)$","steps":["$\\text{erfc}(ax)=\\frac2{\\sqrt\\pi}\\int_{ax}^\\infty e^{-u^2}du\\Rightarrow\\frac{d}{da}\\text{erfc}(ax)=-\\frac{2}{\\sqrt\\pi}e^{-a^2x^2}\\cdot x$","LHS $=-\\frac2{\\sqrt\\pi}e^{-a^2x^2}$","$\\frac{d}{dx}\\text{erf}(ax)=\\frac{2a}{\\sqrt\\pi}e^{-a^2x^2}\\Rightarrow$ RHS $=-\\frac2{\\sqrt\\pi}e^{-a^2x^2}$ ∎"],"ans":"Both sides = −2e^{−a²x²}/√π","id":"T11Q5","label":"T11 Q5","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":11,"n":6,"topic":"erf","sub":"Derivatives","text":"Prove that $\\dfrac{d}{dx}[\\text{erf}(x)]=\\dfrac2{\\sqrt\\pi}e^{-x^2}$ and use it to show $\\dfrac{d}{dx}[\\text{erf}(ax^n)]=\\dfrac{2an}{\\sqrt\\pi}x^{n-1}e^{-a^2x^{2n}}$","pyq":"C4B","id":"T11Q6","label":"T11 Q6","rel":"exact","pri":"P1","why":"Word-for-word the same as a question in your PYQ papers."},{"t":11,"n":7,"topic":"erf","sub":"Odd property","text":"Prove that erf $(x)$ is an odd function and hence, Prove that $\\text{erf}_c(-x)-\\text{erf}(x)=1.$","steps":["$\\text{erf}(-x)=\\frac2{\\sqrt\\pi}\\int_0^{-x}e^{-u^2}du$; put $u=-v$: $=-\\frac2{\\sqrt\\pi}\\int_0^xe^{-v^2}dv=-\\text{erf}(x)$ (odd)","$\\text{erfc}(-x)=1-\\text{erf}(-x)=1+\\text{erf}(x)$","$\\text{erfc}(-x)-\\text{erf}(x)=1$ ∎"],"ans":"= 1","id":"T11Q7","label":"T11 Q7","pri":"P1","why":"Topic priority P1 (Prepare first)."},{"t":12,"n":1,"topic":"curve","sub":"Cartesian (witch-type)","plot":"agnesi","text":"Trace the curve $xy^2=4a^2(a-x)$ where $a>0$","steps":["<b>Symmetry:<\/b> only even powers of $y$ $\\Rightarrow$ symmetric about the x-axis","<b>Origin:<\/b> not on the curve ($0\\neq4a^3$)","<b>Intercepts:<\/b> $y=0\\Rightarrow x=a$: point $(a,0)$; tangent there is vertical ($x=a$)","<b>Asymptote:<\/b> $y^2=\\frac{4a^2(a-x)}{x}\\to\\infty$ as $x\\to0^+$ $\\Rightarrow$ the y-axis $x=0$ is an asymptote","<b>Region:<\/b> $y^2\\ge0\\Rightarrow0<x\\le a$; no curve for $x>a$ or $x<0$","As $x$ decreases from $a$ to 0, $|y|$ increases from 0 to $\\infty$"],"ans":"Two branches from (a, 0) rising to ±∞ along the y-axis","id":"T12Q1","label":"T12 Q1","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":2,"topic":"curve","sub":"Cartesian (cissoid)","plot":"cissoid","text":"Trace the curve $y^2(2a-x)=x^3$ where $a>0$","steps":["<b>Symmetry:<\/b> about the x-axis (even powers of $y$)","<b>Origin:<\/b> on the curve; lowest-degree terms $2ay^2=0\\Rightarrow y=0$ twice $\\Rightarrow$ cusp at the origin, tangent along the x-axis","<b>Asymptote:<\/b> coefficient of $y^2$: $2a-x=0\\Rightarrow x=2a$","<b>Region:<\/b> $y^2=\\frac{x^3}{2a-x}\\ge0\\Rightarrow0\\le x<2a$","<b>Intercepts:<\/b> only the origin"],"ans":"Cissoid: cusp at O, asymptote x = 2a","id":"T12Q2","label":"T12 Q2","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":3,"topic":"curve","sub":"Polar rose","plot":"r_cos2","text":"Trace the curve $r=a\\cos2\\theta$","steps":["$\\cos2\\theta$ even in $\\theta\\Rightarrow$ symmetric about the initial line; also about $\\theta=\\pi/2$","$n=2$ (even) $\\Rightarrow2n=4$ equal loops (petals), each of length $a$","Petal tips ($r=\\pm a$) at $\\theta=0,\\frac\\pi2,\\pi,\\frac{3\\pi}2$","$r=0$ at $\\theta=\\frac\\pi4,\\frac{3\\pi}4,\\dots$ - the tangents at the pole"],"ans":"Four-leaved rose along the axes","id":"T12Q3","label":"T12 Q3","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":4,"topic":"curve","sub":"Polar rose","plot":"r_cos3","text":"Trace the curve $r=a\\cos3\\theta$","steps":["Symmetric about the initial line ($\\cos$ is even)","$n=3$ (odd) $\\Rightarrow3$ petals of length $a$","Petal tips at $\\theta=0,\\frac{2\\pi}3,\\frac{4\\pi}3$","$r=0$ at $\\theta=\\frac\\pi6,\\frac\\pi2,\\frac{5\\pi}6$ (tangents at the pole)"],"ans":"Three-leaved rose, one petal along the initial line","id":"T12Q4","label":"T12 Q4","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":5,"topic":"curve","sub":"Polar rose","plot":"r_sin3","text":"Trace the curve $r=a\\sin3\\theta$","steps":["Symmetric about $\\theta=\\pi/2$","$n=3$ (odd) $\\Rightarrow3$ petals of length $a$","Petal tips at $\\theta=\\frac\\pi6,\\frac{5\\pi}6,\\frac{3\\pi}2$","$r=0$ at $\\theta=0,\\frac\\pi3,\\frac{2\\pi}3$"],"ans":"Three-leaved rose, one petal pointing down the y-axis","id":"T12Q5","label":"T12 Q5","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":12,"n":6,"topic":"curve","sub":"Polar rose","plot":"r_sin2","text":"Trace the curve $r=a\\sin2\\theta$","steps":["Symmetric about the pole and the line $\\theta=\\pi/4$","$n=2\\Rightarrow4$ petals of length $a$","Petal tips at $\\theta=\\frac\\pi4,\\frac{3\\pi}4,\\frac{5\\pi}4,\\frac{7\\pi}4$","$r=0$ at $\\theta=0,\\frac\\pi2,\\pi,\\frac{3\\pi}2$"],"ans":"Four-leaved rose between the axes","id":"T12Q6","label":"T12 Q6","pri":"P3","why":"Topic priority P3 (If time permits / if your syllabus confirms it)."},{"t":13,"n":1,"topic":"dint","sub":"Iterated integral","text":"Evaluate $\\displaystyle\\int_0^1\\int_0^{1-x}(x+y)\\,dy\\,dx$","steps":["Inner: $\\left[xy+\\frac{y^2}{2}\\right]_0^{1-x}=x(1-x)+\\frac{(1-x)^2}{2}=\\frac{1-x^2}{2}$","Outer: $\\frac12\\int_0^1(1-x^2)dx=\\frac12\\cdot\\frac23$"],"ans":"$\\frac13$","id":"T13Q1","label":"T13 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":2,"topic":"dint","sub":"Iterated integral","text":"Evaluate $\\displaystyle\\int_0^1\\int_0^{\\sqrt{1+x^2}}\\frac{dy\\,dx}{1+x^2+y^2}$","steps":["Inner, with $p^2=1+x^2$: $\\int_0^{p}\\frac{dy}{p^2+y^2}=\\frac1p\\tan^{-1}1=\\frac{\\pi}{4\\sqrt{1+x^2}}$","Outer: $\\frac\\pi4\\int_0^1\\frac{dx}{\\sqrt{1+x^2}}=\\frac\\pi4\\left[\\log(x+\\sqrt{1+x^2})\\right]_0^1$"],"ans":"$\\frac\\pi4\\log(1+\\sqrt2)\\approx0.692$","id":"T13Q2","label":"T13 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":3,"topic":"dint","sub":"Iterated integral","text":"Evaluate $\\displaystyle\\int_0^5\\int_0^{x^2}x(x^2+y^2)\\,dx\\,dy$","note":"The inner limit $x^2$ depends on $x$, so the inner integration must be in $y$ (i.e. read it as $dy\\,dx$).","steps":["Inner in $y$: $x\\left[x^2y+\\frac{y^3}{3}\\right]_0^{x^2}=x^5+\\frac{x^7}{3}$","Outer: $\\int_0^5\\left(x^5+\\frac{x^7}3\\right)dx=\\frac{5^6}{6}+\\frac{5^8}{24}=\\frac{15625}{6}+\\frac{390625}{24}$"],"ans":"$\\frac{453125}{24}\\approx18880.2$","id":"T13Q3","label":"T13 Q3","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":4,"topic":"dint","sub":"Region between curves","text":"Evaluate $\\iint_Ry\\,dx\\,dy$ over the area bounded by $y=x^2$ and $x+y=2$","steps":["Intersections: $x^2=2-x\\Rightarrow x=-2,1$; for each $x$, $y$ from $x^2$ to $2-x$","$\\int_{-2}^1\\left[\\frac{y^2}{2}\\right]_{x^2}^{2-x}dx=\\frac12\\int_{-2}^1\\left[(2-x)^2-x^4\\right]dx$","$=\\frac12\\left(21-\\frac{33}{5}\\right)$"],"ans":"$\\frac{36}{5}$","id":"T13Q4","label":"T13 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":5,"topic":"dint","sub":"Region between curves","text":"Evaluate $\\iint_Rxy\\,dx\\,dy$ over the area bounded by $x$ axis, ordinate $x=2$ and parabola $x^2=4y$","steps":["Region: $0\\le x\\le2,\\;0\\le y\\le\\frac{x^2}{4}$","$\\int_0^2x\\left[\\frac{y^2}{2}\\right]_0^{x^2/4}dx=\\int_0^2\\frac{x^5}{32}dx=\\frac{64}{192}$"],"ans":"$\\frac13$","id":"T13Q5","label":"T13 Q5","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":13,"n":6,"topic":"dint","sub":"Infinite region","text":"Evaluate $\\iint_R\\dfrac{dx\\,dy}{x^4+y^2}$ over $x\\ge1,\\;y\\ge x^2$","steps":["Inner: $\\int_{x^2}^\\infty\\frac{dy}{x^4+y^2}=\\frac1{x^2}\\left[\\tan^{-1}\\frac{y}{x^2}\\right]_{x^2}^\\infty=\\frac1{x^2}\\left(\\frac\\pi2-\\frac\\pi4\\right)$","Outer: $\\frac\\pi4\\int_1^\\infty\\frac{dx}{x^2}=\\frac\\pi4$"],"ans":"$\\frac\\pi4$","id":"T13Q6","label":"T13 Q6","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":1,"topic":"tint","sub":"Iterated triple","text":"Evaluate $\\displaystyle\\int_0^2\\int_0^x\\int_0^{2x+2y}e^{x+y+z}\\,dx\\,dy\\,dz$","note":"The limits fix the order: innermost z (0 to 2x+2y), then y (0 to x), then x (0 to 2).","steps":["$\\int_0^{2x+2y}e^{x+y+z}dz=e^{3x+3y}-e^{x+y}$","$\\int_0^x\\left(e^{3x+3y}-e^{x+y}\\right)dy=\\frac{e^{6x}}3-\\frac{e^{3x}}3-e^{2x}+e^x$","$\\int_0^2(\\cdot)\\,dx=\\frac{e^{12}}{18}-\\frac{e^6}{9}-\\frac{e^4}{2}+e^2-\\left(\\frac1{18}-\\frac19-\\frac12+1\\right)$"],"ans":"$\\frac{e^{12}}{18}-\\frac{e^6}{9}-\\frac{e^4}{2}+e^2-\\frac49$","id":"T14Q1","label":"T14 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":2,"topic":"tint","sub":"Tetrahedron","text":"Evaluate $\\displaystyle\\int_0^1\\int_0^{1-x}\\int_0^{1-x-y}dx\\,dy\\,dz$","steps":["Innermost (z): $1-x-y$","$\\int_0^{1-x}(1-x-y)dy=\\frac{(1-x)^2}{2}$","$\\int_0^1\\frac{(1-x)^2}{2}dx=\\frac16$ (volume of the unit tetrahedron)"],"ans":"$\\frac16$","id":"T14Q2","label":"T14 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":3,"topic":"tint","sub":"Iterated triple","text":"Evaluate $\\displaystyle\\int_{-1}^1\\int_0^z\\int_{x-z}^{x+z}(x+y+z)\\,dx\\,dy\\,dz$","note":"Limits fix the order: innermost y (x−z to x+z), then x (0 to z), then z (−1 to 1).","steps":["$\\int_{x-z}^{x+z}(x+y+z)dy=(x+z)(2z)+\\frac{(x+z)^2-(x-z)^2}{2}=4xz+2z^2$","$\\int_0^z(4xz+2z^2)dx=2z^3+2z^3=4z^3$","$\\int_{-1}^14z^3dz=0$ (odd integrand)"],"ans":"0","id":"T14Q3","label":"T14 Q3","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":14,"n":4,"topic":"tint","sub":"Iterated triple","text":"Evaluate $\\displaystyle\\int_0^2\\int_{y^2}^1\\int_0^{1-x}x\\,dz\\,dx\\,dy$","note":"As printed, the outer limit is 0 to 2, but then $x$ runs from $y^2$ up to 1 only when $y\\le1$. The standard textbook version uses $\\int_0^1$; both values are given.","steps":["$\\int_0^{1-x}x\\,dz=x(1-x)$","$\\int_{y^2}^1(x-x^2)dx=\\frac16-\\frac{y^4}{2}+\\frac{y^6}{3}$","With $y$ from 0 to 1: $\\frac16-\\frac1{10}+\\frac1{21}=\\frac{4}{35}$","With $y$ from 0 to 2 (literal): $\\frac13-\\frac{16}5+\\frac{128}{21}=\\frac{113}{35}$"],"ans":"$\\frac4{35}$ (for $0\\le y\\le1$); literal limits give $\\frac{113}{35}$","id":"T14Q4","label":"T14 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":1,"topic":"areavol","sub":"Area between curves","text":"Find the area bounded by the parabola $y=x^2$ and the line $y=x$","steps":["Intersections $x=0,1$; $A=\\int_0^1\\int_{x^2}^{x}dy\\,dx$","$=\\int_0^1(x-x^2)dx=\\frac12-\\frac13$"],"ans":"$\\frac16$ sq. units","id":"T15Q1","label":"T15 Q1","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":2,"topic":"areavol","sub":"Area of half ellipse","text":"Find the area bounded by the ellipse $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1$, above x-axis","steps":["$A=\\int_{-a}^{a}\\int_0^{\\frac ba\\sqrt{a^2-x^2}}dy\\,dx=\\frac ba\\int_{-a}^a\\sqrt{a^2-x^2}\\,dx$","$\\int_{-a}^a\\sqrt{a^2-x^2}dx=\\frac{\\pi a^2}{2}$ (half-circle)"],"ans":"$\\frac{\\pi ab}{2}$ sq. units","id":"T15Q2","label":"T15 Q2","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":3,"topic":"areavol","sub":"Area between curves","text":"Find the area bounded by the parabola $y=x^2$ and the line $y=2x+3$","steps":["$x^2=2x+3\\Rightarrow x=-1,3$","$A=\\int_{-1}^3(2x+3-x^2)dx=\\left[x^2+3x-\\frac{x^3}3\\right]_{-1}^3=9-\\left(-\\frac53\\right)$"],"ans":"$\\frac{32}{3}$ sq. units","id":"T15Q3","label":"T15 Q3","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":4,"topic":"areavol","sub":"Volume by triple integral","text":"Prove that the volume bounded by the cylinders $y^2=x,\\;x^2=y$ and the plane $z=0,\\;x+y+z=2$ is $\\frac{11}{30}$","steps":["Base region: $0\\le x\\le1,\\;x^2\\le y\\le\\sqrt x$; height $z$ from 0 to $2-x-y$","$V=\\int_0^1\\int_{x^2}^{\\sqrt x}(2-x-y)\\,dy\\,dx$","$=\\int_0^1\\left[2\\sqrt x-x^{3/2}-\\frac x2-2x^2+x^3+\\frac{x^4}{2}\\right]dx=\\frac43-\\frac25-\\frac14-\\frac23+\\frac14+\\frac1{10}$"],"ans":"$\\frac{11}{30}$ cubic units","id":"T15Q4","label":"T15 Q4","pri":"P2","why":"Topic priority P2 (Prepare next)."},{"t":15,"n":5,"topic":"areavol","sub":"Volume (polar)","text":"Find the volume of the region enclosed by the cone $z=\\sqrt{x^2+y^2}$ and the paraboloid $z=x^2+y^2$","steps":["Surfaces meet where $r=r^2\\Rightarrow r=1$; for $0\\le r\\le1$, $r^2\\le z\\le r$","$V=\\int_0^{2\\pi}\\int_0^1(r-r^2)\\,r\\,dr\\,d\\theta$","$=2\\pi\\left(\\frac13-\\frac14\\rig
